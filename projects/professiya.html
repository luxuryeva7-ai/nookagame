<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF8EE">
<title>Профессия будущего — Nooka</title>
<link href="../fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{--bg:#FFF8EE;--card:#FFFFFF;--ink:#2B2118;--ink2:#5C4A38;--ink3:#8A7A68;
 --acc:#E65C00;--accbg:#FFF1E4;--line:rgba(180,110,40,.16);
 --sh:0 1px 2px rgba(120,72,28,.10),0 10px 26px -10px rgba(120,72,28,.20);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.root{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.hdr{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg);position:sticky;top:0;z-index:20}
.hdr-back{width:34px;height:34px;border:none;background:none;cursor:pointer;font-size:20px;color:var(--acc);flex:none}
.hdr-t{flex:1;font-weight:800;font-size:14px;color:var(--ink2);text-align:center}
.hdr-r{width:34px;flex:none}
.prog{flex:none;height:4px;background:rgba(180,110,40,.1);position:sticky;top:52px;z-index:20}
.prog i{display:block;height:4px;background:var(--acc);transition:width .45s cubic-bezier(.4,0,.2,1)}
.body{flex:1;padding:0 12px 8px}
.foot{flex:none;position:sticky;bottom:0;z-index:25;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
 background:linear-gradient(180deg,rgba(255,248,238,0),var(--bg) 38%)}

.say{display:flex;gap:9px;align-items:flex-start;margin-top:12px;animation:up .3s ease both}
.say-av{flex:none;width:50px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.say-b{flex:1;background:var(--card);border-radius:16px;border-top-left-radius:5px;padding:11px 14px;
 box-shadow:var(--sh);font-weight:600;font-size:15px;line-height:1.45;color:var(--ink2);white-space:pre-line}
.say-b b{color:var(--acc);font-weight:800}

.plate{margin-top:8px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:10px 10px 0}
.stage{width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#EFE6D6;position:relative}
.stage svg{width:100%;height:100%;display:block}
.stage::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
 box-shadow:inset 0 0 0 1px rgba(120,72,28,.12),inset 0 2px 10px rgba(120,72,28,.10)}
.stage.wide{aspect-ratio:3/2}
.plate-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 4px 11px;font-size:12px;font-weight:700;color:var(--ink3)}
.reroll{border:none;background:none;color:var(--acc);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;padding:4px 6px}

.pcard{margin-top:12px;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:13px 14px;
 font-weight:600;font-size:16px;line-height:2;color:var(--ink)}
.slot{display:inline-flex;align-items:center;gap:4px;background:var(--accbg);border:1.5px solid var(--acc);
 border-radius:999px;padding:4px 11px;min-height:38px;font-weight:800;font-size:14.5px;color:var(--acc);
 cursor:pointer;vertical-align:middle;font-family:inherit;text-align:left}
.slot.todo{border-style:dashed;color:#B8895F;background:#FFF8F0}
.slot.pulse{animation:pulse 1.2s ease infinite}
.slot em{font-style:normal;font-size:10px;opacity:.75}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,92,0,0)}50%{box-shadow:0 0 0 7px rgba(230,92,0,.15)}}

.btn{width:100%;min-height:54px;border:none;border-radius:27px;font-family:'Unbounded','Nunito',sans-serif;
 font-weight:700;font-size:16px;cursor:pointer;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.28;pointer-events:none}
.btn2{background:var(--card);color:var(--acc);box-shadow:inset 0 0 0 2px var(--line)}
.btn-sm{min-height:46px;font-size:14.5px;border-radius:23px}
.btnrow{display:flex;gap:9px}.btnrow .btn{flex:1}
.txtbtn{display:block;width:100%;text-align:center;border:none;background:none;color:var(--acc);
 font-family:inherit;font-weight:800;font-size:14px;padding:11px;cursor:pointer}

.ovl{position:fixed;inset:0;background:rgba(43,33,24,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.ovl.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;margin:0 auto;max-width:480px;bottom:0;max-height:70dvh;background:var(--bg);
 border-radius:22px 22px 0 0;z-index:41;display:none;flex-direction:column;box-shadow:0 -8px 30px rgba(90,50,10,.18)}
.sheet.on{display:flex;animation:sheetUp .26s cubic-bezier(.3,.9,.4,1) both}
@keyframes sheetUp{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{flex:none;padding:9px 16px 11px;text-align:center;position:relative}
.sheet-h::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 11px}
.sheet-t{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:17px}
.sheet-x{position:absolute;right:12px;top:20px;width:32px;height:32px;border:none;background:none;font-size:19px;color:var(--ink3);cursor:pointer}
.sheet-l{flex:1;overflow-y:auto;padding:0 12px calc(16px + env(safe-area-inset-bottom))}
.opt{display:flex;align-items:center;gap:11px;width:100%;min-height:56px;padding:10px 13px;margin-bottom:7px;
 border:none;border-radius:15px;background:var(--card);box-shadow:var(--sh);font-family:inherit;
 font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;text-align:left;line-height:1.35}
.opt.on{box-shadow:inset 0 0 0 2px var(--acc);background:var(--accbg)}
.opt-ic{flex:none;width:40px;height:40px;border-radius:11px;background:#F7EFE2;display:flex;align-items:center;justify-content:center;font-size:21px}

/* конвейер */
.belt{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.bay{background:var(--card);border-radius:16px;box-shadow:var(--sh);min-height:82px;padding:11px 13px;
 display:flex;align-items:center;gap:11px;position:relative;transition:box-shadow .15s,background .15s}
.bay.empty{background:#FDF6EA;box-shadow:inset 0 0 0 2px var(--line)}
.bay.hot{box-shadow:0 0 0 3px var(--acc);background:var(--accbg)}
.bay.locked{background:#F4F9F2;box-shadow:inset 0 0 0 2px rgba(46,158,91,.35)}
.bay-l{position:absolute;top:-7px;left:13px;background:var(--bg);padding:0 6px;font-size:9.5px;font-weight:900;
 letter-spacing:.09em;color:var(--ink3)}
.bay-ic{flex:none;width:44px;height:44px;border-radius:12px;background:#F7EFE2;display:flex;align-items:center;justify-content:center;font-size:23px}
.bay-n{flex:1;font-size:14px;font-weight:800;line-height:1.3}
.bay-n small{display:block;font-size:11px;font-weight:700;color:var(--ink3);margin-top:3px}
.mods{display:flex;gap:3px;flex:none}
.mod{font-size:13px;background:#F2E9DA;border-radius:6px;padding:2px 5px}
.joint{text-align:center;font-size:19px;line-height:1;color:var(--ink3);height:19px}
.joint.ok{color:#2E9E5B}.joint.bad{color:#D93030}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:11px 2px 4px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:104px;background:var(--card);border-radius:15px;box-shadow:var(--sh);padding:10px 8px;
 cursor:pointer;text-align:center;position:relative;font-family:inherit}
.tile:active{transform:scale(.95)}
.tile.on{box-shadow:inset 0 0 0 2px var(--acc);background:var(--accbg)}
.tile-ic{font-size:26px;line-height:1;margin-bottom:6px}
.tile-n{font-size:11px;font-weight:800;line-height:1.25;color:var(--ink)}
.tile-mod{position:absolute;top:5px;right:6px;font-size:11px}
.tabs{display:flex;gap:7px;margin-top:12px}
.tab{flex:1;padding:9px;border:none;border-radius:13px;background:var(--card);box-shadow:var(--sh);
 font-family:inherit;font-weight:800;font-size:13px;color:var(--ink3);cursor:pointer}
.tab.on{background:var(--acc);color:#fff}
.result{margin-top:12px;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px 15px;
 font-size:14.5px;font-weight:700;line-height:1.5;color:var(--ink2);animation:up .3s ease}
.result.good{background:#F0FAF4;box-shadow:inset 0 0 0 2px rgba(46,158,91,.3)}
.result.bad{background:#FEF3F2;box-shadow:inset 0 0 0 2px rgba(217,48,48,.25)}

/* карточки дел */
.deck{position:relative;height:170px;margin-top:14px}
.dcard{position:absolute;inset:0;background:var(--card);border-radius:20px;box-shadow:var(--sh);
 padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center}
.dcard-ic{font-size:34px}
.dcard-t{font-size:17px;font-weight:800;line-height:1.3}
.tally{display:flex;gap:9px;margin-top:11px}
.tal{flex:1;background:var(--card);border-radius:15px;box-shadow:var(--sh);padding:11px;text-align:center}
.tal-n{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:22px;color:var(--acc)}
.tal-l{font-size:11.5px;font-weight:800;color:var(--ink3);margin-top:2px}

/* карусели внешности */
.carou{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.carou::-webkit-scrollbar{display:none}
.mini{flex:none;width:72px;height:72px;border-radius:15px;background:var(--card);box-shadow:var(--sh);
 border:3px solid transparent;cursor:pointer;overflow:hidden;padding:0}
.mini.on{border-color:var(--acc)}
.mini svg{width:100%;height:100%;display:block}
.mini-w{flex:none;width:82px;text-align:center;cursor:pointer}
.mini-w .mini{width:82px;height:82px}
.mini-c{font-size:10.5px;font-weight:800;color:var(--ink3);margin-top:4px;line-height:1.2}
.grp-t{font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:13px 0 0}

/* сравнение */
.cmp{margin-top:12px;position:relative;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:10px;overflow:hidden}
.cmp-w{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#EFE6D6}
.cmp-w svg{position:absolute;inset:0;width:100%;height:100%}
.cmp-r{clip-path:inset(0 0 0 50%)}
.cmp-h{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(120,72,28,.3);cursor:ew-resize}
.cmp-h::after{content:'⇔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(90,50,10,.3);
 display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--acc)}
.cmp-lbl{display:flex;justify-content:space-between;padding:9px 4px 2px;font-size:12px;font-weight:800;color:var(--ink3)}

/* карточка энциклопедии */
.enc{margin-top:12px;background:var(--card);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.enc-top{position:relative;background:#EFE6D6}
.enc-top .stage{border-radius:0;aspect-ratio:1/1}
.enc-stamp{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);border-radius:9px;
 padding:5px 10px;font-size:10.5px;font-weight:900;color:var(--acc);letter-spacing:.04em;
 transform:rotate(4deg);box-shadow:0 2px 7px rgba(90,50,10,.18)}
.enc-say{position:absolute;left:12px;bottom:12px;max-width:74%;background:#fff;border-radius:14px;
 border-bottom-left-radius:4px;padding:9px 12px;font-size:13px;font-weight:700;line-height:1.35;
 box-shadow:0 3px 12px rgba(90,50,10,.2)}
.enc-b{padding:16px}
.enc-name{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:20px;line-height:1.2;margin-bottom:5px}
.enc-who{font-size:13.5px;color:var(--acc);font-weight:800;margin-bottom:13px}
.enc-row{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.enc-row b{flex:none;width:96px;color:var(--ink3);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.enc-row span{flex:1;font-weight:600;color:var(--ink2)}
.enc-chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--ink2)}
.enc-foot{padding:13px 16px;border-top:1px solid var(--line);background:#FDF8F0}
.enc-author{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:15px;color:var(--ink)}
.enc-note{font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:6px;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:9px 15px;
 font-family:inherit;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.field{width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:15px 16px;
 font-family:'Nunito',sans-serif;font-weight:700;font-size:17px;color:var(--ink);margin-top:12px}
.field:focus{outline:none;border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.gcard{background:var(--card);border:none;border-radius:16px;box-shadow:var(--sh);padding:14px 11px;
 cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;line-height:1.3;color:var(--ink);
 min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.gcard:active{transform:scale(.96)}
.gcard.on{box-shadow:inset 0 0 0 2px var(--acc);background:var(--accbg)}
.gcard-ic{font-size:26px;line-height:1}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58vh;text-align:center;padding:18px 8px}
.h1{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:24px;line-height:1.2;margin-bottom:12px}
.lead{font-size:16px;line-height:1.6;color:var(--ink2);font-weight:600;white-space:pre-line}
.layers{margin-top:12px}
.layer{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:14px;box-shadow:var(--sh);
 padding:11px 14px;margin-bottom:7px;animation:slide .4s ease both}
@keyframes slide{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.layer b{flex:1;font-size:14px;font-weight:800}
.layer span{font-size:12.5px;font-weight:800;color:var(--acc)}
.gen{position:fixed;inset:0;background:rgba(255,248,238,.96);z-index:30;display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:22px;gap:14px}
.gst{display:flex;align-items:center;gap:11px;padding:8px 0;font-weight:700;font-size:14.5px;color:var(--ink3);opacity:.32;transition:opacity .3s}
.gst.on{opacity:1;color:var(--ink)}.gst.done{opacity:.68;color:var(--ink2)}
.gst-b{flex:none;width:26px;height:26px;border-radius:50%;background:#F0E5D6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--ink3)}
.gst.on .gst-b{background:var(--accbg);color:var(--acc);animation:spin 1s linear infinite}
.gst.done .gst-b{background:var(--acc);color:#fff;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.genchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:320px;min-height:30px}
.gchip{background:var(--accbg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;
 font-size:12.5px;font-weight:800;color:var(--acc);animation:up .45s ease both}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;
 padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.022)}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.br{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 78%}
.sw{animation:sway 5s ease-in-out infinite;transform-origin:50% 92%}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="root">
  <div class="hdr">
    <button class="hdr-back" id="back">‹</button>
    <div class="hdr-t" id="htitle">Профессия будущего</div>
    <div class="hdr-r"></div>
  </div>
  <div class="prog"><i id="pbar" style="width:0"></i></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<div class="ovl" id="ovl"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h"><div class="sheet-t" id="sheetT"></div><button class="sheet-x" id="sheetX">✕</button></div>
  <div class="sheet-l" id="sheetL"></div>
</div>

<script>
/* ═════════ ДАННЫЕ ═════════ */
const PROBLEMS=[
 {id:'plastic',n:'пластика в океане больше, чем рыбы',kw:'океан',bg:'ocean'},
 {id:'air',n:'воздухом в городах трудно дышать',kw:'воздух',bg:'city'},
 {id:'fire',n:'леса горят каждое лето',kw:'лес',bg:'forest'},
 {id:'river',n:'реки стали мутными',kw:'река',bg:'river'},
 {id:'orbit',n:'вокруг Земли летает мусор',kw:'орбита',bg:'orbit'},
 {id:'food',n:'еды хватает не всем',kw:'поле',bg:'field'},
 {id:'house',n:'дома не держат тепло',kw:'дом',bg:'block'},
 {id:'animals',n:'животные уходят из своих мест',kw:'тундра',bg:'tundra'},
 {id:'talk',n:'люди перестали понимать друг друга',kw:'площадь',bg:'square'},
 {id:'dream',n:'дети разучились придумывать',kw:'школа',bg:'school'},
 {id:'trash',n:'вещи ломаются и их выбрасывают',kw:'свалка',bg:'dump'},
 {id:'late',n:'болезни замечают слишком поздно',kw:'больница',bg:'clinic'},
];
const ACTIONS=[
 {id:'clean',n:'чистит',inf:'чистить'},{id:'heal',n:'лечит',inf:'лечить'},
 {id:'guard',n:'охраняет',inf:'охранять'},{id:'grow',n:'выращивает',inf:'выращивать'},
 {id:'fix',n:'чинит',inf:'чинить'},{id:'find',n:'находит',inf:'находить'},
 {id:'teach',n:'учит',inf:'учить'},{id:'save',n:'спасает',inf:'спасать'},
 {id:'collect',n:'собирает',inf:'собирать'},{id:'link',n:'соединяет',inf:'соединять'},
];
const OBJECTS=[
 {id:'ocean',n:'океан',a:'океан',g:'океана',gok:1},{id:'air',n:'воздух',a:'воздух',g:'воздуха',gok:1},
 {id:'river',n:'река',a:'реку',g:'реки',gok:1},{id:'forest',n:'лес',a:'лес',g:'леса',gok:1},
 {id:'city',n:'город',a:'город',g:'города',gok:1},{id:'orbit',n:'орбита',a:'орбиту',g:'орбиты',gok:1},
 {id:'food',n:'еда',a:'еду',g:'еды',gok:1},{id:'house',n:'дом',a:'дом',g:'дома',gok:1},
 {id:'animals',n:'животные',a:'животных',g:'животных',gok:1},{id:'memory',n:'память',a:'память',g:'памяти',gok:0},
 {id:'weather',n:'погода',a:'погоду',g:'погоды',gok:1},{id:'ideas',n:'идеи',a:'идеи',g:'идей',gok:0},
 {id:'health',n:'здоровье',a:'здоровье',g:'здоровья',gok:0},{id:'roads',n:'дороги',a:'дороги',g:'дорог',gok:1},
];
/* конвейер: модальности должны сойтись на стыках */
const INPUTS=[
 {id:'sat',n:'фото со спутников',ic:'🛰',mod:'👁',v:'просмотрела',cnt:'40 000 снимков'},

function rng(s){let x=s>>>0;return()=>{x=(x+0x6D2B79F5)>>>0;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function pick(r,a){return a[Math.floor(r()*a.length)]}
function rint(r,a,b){return a+Math.floor(r()*(b-a+1))}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2100)}

     <path d="M14 30 q18 -20 36 0 z" fill="#E4DCCF"${open?' transform="rotate(-26 14 30)"':''}/>

     <rect x="18" y="34" width="28" height="15" rx="7.5" fill="#2B2118"/>
     <ellipse cx="25.5" cy="${41.5+lid}" rx="3.4" ry="${3.4-lid*.7}" fill="${eye}"/>
     <ellipse cx="38.5" cy="${41.5+lid}" rx="3.4" ry="${3.4-lid*.7}" fill="${eye}"/>
     <circle cx="24.3" cy="${40.3+lid}" r="1.05" fill="#fff" opacity=".9"/>
     <circle cx="37.3" cy="${40.3+lid}" r="1.05" fill="#fff" opacity=".9"/>
     ${m==='happy'?'<path d="M27 53 q5 4 10 0" stroke="#C9B49B" stroke-width="1.8" fill="none" stroke-linecap="round"/>':''}

};
function svgBG(bgId,seed){
  const B1=BGS[bgId]||BGS.forest, r=rng(seed*17+3);
  let o=`<defs><linearGradient id="sk${seed}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${B1.sky[0]}"/><stop offset="1" stop-color="${B1.sky[1]}"/></linearGradient></defs>
    <rect width="300" height="400" fill="url(#sk${seed})"/>`;
  if(B1.bits==='star')for(let i=0;i<40;i++)o+=`<circle cx="${rint(r,0,300)}" cy="${rint(r,0,300)}" r="${(r()*1.3+.4).toFixed(1)}" fill="#fff" opacity="${(r()*.7+.3).toFixed(2)}"/>`;
  if(B1.bits==='tree')for(let i=0;i<7;i++){const x=rint(r,-10,300),h=rint(r,70,130),t=300-h;
    o+=`<rect x="${x-3}" y="${t+12}" width="6" height="${h}" fill="#4A3826" opacity=".75"/>`;
    for(let k=0;k<3;k++)o+=`<path d="M${x} ${t+k*h*.26} l${22-k*4} ${h*.3} h-${(22-k*4)*2}z" fill="${k%2?'#3E5A3A':'#4A6B42'}" opacity=".8"/>`}
  if(B1.bits==='tower')for(let i=0;i<8;i++){const x=i*38-6,h=rint(r,60,150);
    o+=`<rect x="${x}" y="${300-h}" width="32" height="${h}" fill="#000" opacity="${(.1+i*.02).toFixed(2)}"/>`;
    for(let w=0;w<5;w++)if(r()>.5)o+=`<rect x="${x+5+(w%2)*14}" y="${308-h+Math.floor(w/2)*22}" width="8" height="10" fill="#FFD98C" opacity=".5"/>`}
  if(B1.bits==='wave')for(let i=0;i<10;i++)o+=`<path d="M${rint(r,-20,280)} ${rint(r,120,290)} q18 -8 36 0" stroke="#fff" stroke-width="2" fill="none" opacity=".22"/>`;
  if(B1.bits==='crop')for(let i=0;i<16;i++){const x=rint(r,0,300);o+=`<path d="M${x} 300 v-${rint(r,16,30)}" stroke="#8A6B34" stroke-width="2.4" opacity=".55"/>`}
  if(B1.bits==='rock')for(let i=0;i<7;i++)o+=`<ellipse cx="${rint(r,0,300)}" cy="${rint(r,250,300)}" rx="${rint(r,16,34)}" ry="${rint(r,8,15)}" fill="#000" opacity=".13"/>`;
  o+=`<rect y="300" width="300" height="100" fill="${B1.ground}"/>`;
  o+=`<rect y="300" width="300" height="100" fill="#000" opacity=".07"/>`;
  return o;
}

    if(hair.id==='buns'){g+=`<path d="M114 148 q0 -44 36 -44 q36 0 36 44 q-6 -22 -36 -22 q-30 0 -36 22z" fill="${hc}"/>`;

    if(hair.id==='curly'){g+=`<path d="M114 150 q0 -46 36 -46 q36 0 36 46z" fill="${hc}"/>`;

    if(hair.id==='mohawk')g+=`<path d="M138 122 q12 -42 24 0 q-12 -12 -24 0z" fill="${hc}"/><path d="M114 150 q4 -30 36 -30 q32 0 36 30 q-14 -14 -36 -14 q-22 0 -36 14z" fill="${hc}"/>`;

  if(pl)g+=`<g transform="translate(66 300)"><circle r="20" fill="#fff" opacity=".7"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="26">${pl.ic}</text></g>`;
  // тень
  return `<ellipse cx="150" cy="372" rx="52" ry="9" fill="rgba(40,26,10,.2)"/><g class="sw">${g}</g>`;
}
function personScene(opt){
  opt=opt||{};
  const bg=opt.gray?'':svgBG(S.problem?S.problem.bg:'forest',S.seed);
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">

/* ═════════ АНИМАЦИЯ СБОРКИ ═════════ */
const STAGES=['Читаю твои слова','Ищу детали в библиотеке','Собираю слой за слоем'];
let genBusy=false;
function assemble(words,after){
  if(genBusy)return; genBusy=true;
  clearTimeout(window.__gg); window.__gg=setTimeout(()=>{genBusy=false},7000);
  const g=document.createElement('div'); g.className='gen';
  g.innerHTML=`<div class="genchips" id="gch"></div>
   <div style="width:100%;max-width:300px">${STAGES.map((s,i)=>
    `<div class="gst" id="gs${i}"><div class="gst-b">${i+1}</div>${s}</div>`).join('')}</div>`;
  document.body.appendChild(g);
  (words||[]).forEach((w,i)=>setTimeout(()=>{const c=$('gch');
    if(c){const e=document.createElement('span');e.className='gchip';e.textContent=w;c.appendChild(e)}},i*110));
  let i=0;
  const run=()=>{
    if(i>0)$('gs'+(i-1)).className='gst done';
    if(i>=STAGES.length){setTimeout(()=>{g.remove();genBusy=false;clearTimeout(window.__gg);after&&after()},170);return}
    $('gs'+i).className='gst on'; i++; setTimeout(run,730);
  };
  setTimeout(run,110);
}

function renderBelt(withGoal){
  $('htitle').textContent=withGoal?'Заказ':'Конвейер';
  if(withGoal&&!S.goalOut)S.goalOut=OUTPUTS[S.seed%3];
  const out=withGoal?S.goalOut:S.out;
  const j1=S.inp&&S.mdl?(S.inp.mod===S.mdl.takes?'ok':'bad'):'';
  const j2=S.mdl&&out?(S.mdl.emits===out.mod?'ok':'bad'):'';
  const ready=S.inp&&S.mdl&&out;
  const list={in:INPUTS,mdl:MODELS,out:OUTPUTS}[S.tab];
  B().innerHTML=say(withGoal
      ? `Теперь заказ. Мне нужна <b>${S.goalOut.n}</b>.\nСобери цепочку, которая её выдаст.`
      : 'Твой человек работает не один. Ему помогает модель.\nСобери её из деталей.')
    +`<div class="belt">
      <div class="bay ${S.inp?'':'empty'}" onclick="S.tab='in';render()"><div class="bay-l">ВХОД</div>
        ${S.inp?`<div class="bay-ic">${S.inp.ic}</div><div class="bay-n">${S.inp.n}<small>что модель получает</small></div><div class="mods"><span class="mod">${S.inp.mod}</span></div>`
              :'<div class="bay-n" style="color:var(--ink3);font-weight:700">Выбери, что подать на вход</div>'}</div>
      <div class="joint ${j1}">${j1==='ok'?'✓':j1==='bad'?'✕':'↓'}</div>
      <div class="bay ${S.mdl?'':'empty'}" onclick="S.tab='mdl';render()"><div class="bay-l">МОДЕЛЬ</div>
        ${S.mdl?`<div class="bay-ic">${S.mdl.ic}</div><div class="bay-n">${S.mdl.n}<small>принимает ${S.mdl.takes} · выдаёт ${S.mdl.emits}</small></div>`
              :'<div class="bay-n" style="color:var(--ink3);font-weight:700">Выбери модель</div>'}</div>
      <div class="joint ${j2}">${j2==='ok'?'✓':j2==='bad'?'✕':'↓'}</div>
      <div class="bay ${out?(withGoal?'locked':''):'empty'}" onclick="${withGoal?'':`S.tab='out';render()`}"><div class="bay-l">ВЫХОД${withGoal?' 🎯':''}</div>
        ${out?`<div class="bay-ic">${out.ic}</div><div class="bay-n">${out.n}<small>${withGoal?'это заказ — менять нельзя':'что получится'}</small></div><div class="mods"><span class="mod">${out.mod}</span></div>`
             :'<div class="bay-n" style="color:var(--ink3);font-weight:700">Выбери, что получить</div>'}</div>
    </div>
    <div class="tabs">
      <button class="tab${S.tab==='in'?' on':''}" onclick="S.tab='in';render()">Вход</button>
      <button class="tab${S.tab==='mdl'?' on':''}" onclick="S.tab='mdl';render()">Модель</button>
      ${withGoal?'':`<button class="tab${S.tab==='out'?' on':''}" onclick="S.tab='out';render()">Выход</button>`}
    </div>
    <div class="tiles">${list.map((t,i)=>{
      const sel=(S.tab==='in'&&S.inp&&S.inp.id===t.id)||(S.tab==='mdl'&&S.mdl&&S.mdl.id===t.id)||(S.tab==='out'&&S.out&&S.out.id===t.id);
      const badge=S.tab==='mdl'?`${t.takes}→${t.emits}`:t.mod;
      return `<button class="tile${sel?' on':''}" onclick="putTile(${i})">
        <span class="tile-mod">${badge}</span><div class="tile-ic">${t.ic}</div><div class="tile-n">${t.n}</div></button>`}).join('')}
    </div>
    <div id="beltres"></div>`;
  F().innerHTML=`<button class="btn" ${ready?'':'disabled'} onclick="runBelt(${withGoal})">Запустить</button>`;
}
function putTile(i){
  const t={in:INPUTS,mdl:MODELS,out:OUTPUTS}[S.tab][i];
  if(S.tab==='in')S.inp=t; else if(S.tab==='mdl')S.mdl=t; else S.out=t;
  render();
}
function runBelt(withGoal){
  const out=withGoal?S.goalOut:S.out;
  const ok1=S.inp.mod===S.mdl.takes, ok2=S.mdl.emits===out.mod;
  let txt,cls;
  if(ok1&&ok2){txt=`Модель ${S.inp.v} ${S.inp.cnt} — и выдала: <b>${out.n}</b>.`;cls='good'}
  else if(!ok1){txt=`Модель честно ${S.mdl.past} то, что ты дал. Получилось не то.<br><br>Ты дал ей <b>${S.inp.mod}</b>, а она умеет только <b>${S.mdl.takes}</b>.`;cls='bad'}
  else {txt=`Модель выдала <b>${S.mdl.emitsName}</b>, а ты просил <b>${out.n}</b>. Не совпало.`;cls='bad'}
  const box=$('beltres');
  box.innerHTML=`<div class="result ${cls}">${txt}</div>`
    +say(ok1&&ok2?(withGoal?'Есть. Ты собрал работающую машину.':'Работает. Запомни эту цепочку.')
        :'Мусор на входе — мусор на выходе.\nЭто правило без исключений.', ok1&&ok2?'happy':'oops');
  if(ok1&&ok2){
    if(withGoal){S.chainDone=1;S.chain={i:S.inp,m:S.mdl,o:out};
      F().innerHTML=`<button class="btn" onclick="go('deeds')">Дальше →</button>`}
    else F().innerHTML=`<button class="btn" onclick="go('goal')">Дальше — заказ →</button>`;
  }else{
    F().innerHTML=`<div class="btnrow"><button class="btn btn2 btn-sm" onclick="render()">Переставить</button>
      <button class="btn btn-sm" onclick="go('${withGoal?'deeds':'goal'}')">Всё равно дальше</button></div>`;
  }
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

/* ═════════ РАБОЧЕЕ МЕСТО ═════════ */

/* ═════════ МИНИАТЮРЫ ═════════ */

  const save=S.hair;S.hair=i;
  const p=`<svg viewBox="105 100 90 90"><ellipse cx="150" cy="152" rx="36" ry="40" fill="${SKIN[S.skin]}"/>`
    +(h.id==='bald'?'':{
      short:`<path d="M114 148 q0 -44 36 -44 q36 0 36 44 q-6 -22 -36 -22 q-30 0 -36 22z" fill="${c}"/>`,
      bob:`<path d="M112 156 q0 -52 38 -52 q38 0 38 52 q-8 -8 -14 -6 l0 -22 q-24 8 -48 0 l0 22 q-6 -2 -14 6z" fill="${c}"/>`,
      long:`<path d="M112 150 q0 -46 38 -46 q38 0 38 46 l6 40 q-14 6 -18 -4 l-4 -30 q-22 8 -44 0 l-4 30 q-4 10 -18 4z" fill="${c}"/>`,
      buns:`<path d="M114 148 q0 -44 36 -44 q36 0 36 44 q-6 -22 -36 -22 q-30 0 -36 22z" fill="${c}"/><circle cx="112" cy="126" r="14" fill="${c}"/><circle cx="188" cy="126" r="14" fill="${c}"/>`,
      curly:`<path d="M114 150 q0 -46 36 -46 q36 0 36 46z" fill="${c}"/>`+[0,1,2,3,4,5,6].map(k=>`<circle cx="${116+k*11}" cy="${114+(k%2)*7}" r="11" fill="${c}"/>`).join(''),
      tail:`<path d="M114 148 q0 -44 36 -44 q36 0 36 44 q-6 -22 -36 -22 q-30 0 -36 22z" fill="${c}"/><path d="M186 140 q26 10 20 44 q-4 12 -14 5 q6 -28 -12 -44z" fill="${c}"/>`,
      mohawk:`<path d="M138 122 q12 -42 24 0 q-12 -12 -24 0z" fill="${c}"/><path d="M114 150 q4 -30 36 -30 q32 0 36 30 q-14 -14 -36 -14 q-22 0 -36 14z" fill="${c}"/>`,
    }[h.id]||'')
    +`</svg>`;
  S.hair=save;return p;
}
function miniFace(i){const f=FACES[i];
  const M={calm:'M142 172 q8 4 16 0',smile:'M140 170 q10 9 20 0',serious:'M141 173 h18',
    happy:'M138 168 q12 12 24 0',focus:'M143 173 q7 -3 14 0',kind:'M141 170 q9 7 18 0'}[f.id];

   +(closed?`<path d="M130 152 q7 -7 14 0" stroke="#2B2118" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M156 152 q7 -7 14 0" stroke="#2B2118" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
     :`<ellipse cx="137" cy="152" rx="5.4" ry="6" fill="#fff"/><ellipse cx="163" cy="152" rx="5.4" ry="6" fill="#fff"/>
       <circle cx="137" cy="153" r="3" fill="#2B2118"/><circle cx="163" cy="153" r="3" fill="#2B2118"/>`)
   +`<path d="${M}" stroke="#2B2118" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>`;

function miniHead(i){const h=HEADS[i];

    helm:'<path d="M110 152 q0 -48 40 -48 q40 0 40 48 z" fill="#DCE2EC"/><rect x="112" y="146" width="76" height="10" rx="5" fill="#9AA8BC"/>',

    lamp:'<rect x="114" y="132" width="72" height="11" rx="5" fill="#4A4A55"/><circle cx="150" cy="137" r="8" fill="#FFE47A"/>',

/* ═════════ ДЕЙСТВИЯ ═════════ */
function startIt(){
  const v=$('nm').value.trim();
  if(!v){toast('Впиши имя — оно попадёт на карточку');return}
  if(!S.age){toast('Выбери, сколько тебе лет');return}
  S.child=v; try{localStorage.setItem('nooka.child',v)}catch(e){}
  go('s1');
}
function buildPerson(){
  S.seed=1000+Math.floor(Math.random()*9000);
  randomGear();
  assemble([S.problem.kw,S.action.n,S.object.n],()=>{S.step='met';render()});
}
function rerollGear(){
  S.seed=1000+Math.floor(Math.random()*9000);
  randomGear();
  const p=document.querySelector('.stage');
  if(p){p.innerHTML=personScene();const f=document.querySelector('.plate-foot span');if(f)f.textContent='Кадр #'+S.seed}
}
function rebuild(){
  S.tool=S.tool||TOOLS[0]; S.wear=S.wear||WEAR[0];
  assemble(promptWords(),()=>go('cmp'));
}
function assign(toRobot){
  const c=$('dc');
  if(c){c.style.transition='transform .28s ease, opacity .28s ease';
    c.style.transform='translateX('+(toRobot?-120:120)+'%) rotate('+(toRobot?-8:8)+'deg)';c.style.opacity='0'}
  S.deeds.push(toRobot?'r':'m');
  if(toRobot)S.robot++; else S.me++;
  setTimeout(()=>{S.deed++;if(S.deed>=6)go('desk');else render()},280);
}
function giveBack(){S.deed=5;S.robot--;S.deeds.pop();go('deeds')}
function pickDay(k,i){
  S[k]=({morning:MORNING,main:MAINDEED,evening:EVENING})[k][i];
  render();
  if(S.evening)window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function hintTitle(){
  const r=rng(S.seed+S.title.length);
  const v=[`${cap(S.object.n)}-${S.action.inf.slice(0,-2)}тель`,
    `Мастер ${S.object.g}`,`${cap(S.problem.kw)}-инженер`,
    `Хранитель ${S.object.g}`,`${cap(S.action.n)} будущего`];
  $('ft').value=pick(r,v);
}
function hintHero(){const r=rng(Date.now()&0xffff);$('fh').value=pick(r,NAMES)}
function setStart(s){const f=$('fl');f.value=s+' ';f.focus()}
function saveNames(){
  S.title=($('ft').value||('Мастер '+S.object.g)).trim();
  S.hero=($('fh').value||NAMES[S.seed%NAMES.length]).trim();
  S.line=$('fl').value.trim();
  go('day');
}
function initSlider(){
  const w=$('cw'),h=$('ch'),r=$('cr');
  if(!w||!h||!r)return;
  let drag=false;
  const set=(x)=>{const b=w.getBoundingClientRect();
    let p=Math.max(6,Math.min(94,(x-b.left)/b.width*100));
    h.style.left=p+'%'; r.style.clipPath='inset(0 0 0 '+p+'%)'};
  const down=e=>{drag=true;e.preventDefault();set((e.touches?e.touches[0]:e).clientX)};
  const move=e=>{if(drag)set((e.touches?e.touches[0]:e).clientX)};
  const up=()=>{drag=false};
  w.addEventListener('pointerdown',down); w.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}
function doShake(){
  const p=$('palm'),m=$('shakeMsg');
  if(!p)return;
  p.animate([{transform:'scale(1)'},{transform:'scale(1.16) rotate(-8deg)'},{transform:'scale(1)'}],{duration:420});
  m.textContent='До встречи, коллега.';
  try{localStorage.setItem('nooka.m3.done','1');navigator.vibrate&&navigator.vibrate(18)}catch(e){}
}

/* ═════════ КАРТОЧКА ═════════ */
function renderCard(){
  $('htitle').textContent='Энциклопедия';
  const ch=S.chain;
  B().innerHTML=`<div class="enc">
    <div class="enc-top">
      <div class="stage">${personScene()}</div>
      <div class="enc-stamp">Статья № ${S.seed}-Б</div>
      ${S.line?`<div class="enc-say">${S.line}</div>`:''}
    </div>
    <div class="enc-b">
      <div class="enc-name">${S.title}</div>
      <div class="enc-who">${S.hero} · профессия будущего</div>
      <div class="enc-row"><b>Зачем</b><span>В мире, где ${S.problem.n}, ${S.action.n} ${S.object.a}.</span></div>
      ${ch?`<div class="enc-row"><b>Помощник</b><span class="enc-chain">
        <span>${ch.i.mod} ${ch.i.n}</span><span style="color:var(--acc)">→</span>
        <span>${ch.m.n}</span><span style="color:var(--acc)">→</span>
        <span>${ch.o.mod} ${ch.o.n}</span></span></div>`:''}
      <div class="enc-row"><b>Снаряжение</b><span>${[S.wear&&S.wear.n,S.tool&&S.tool.n,S.head&&S.head.id!=='none'&&S.head.n,S.pal&&S.pal.n].filter(Boolean).join(', ')}</span></div>
      ${S.morning?`<div class="enc-row"><b>День</b><span>${S.morning.n}. ${S.main?S.main.n+'. ':''}${S.evening?'Оставляет: '+S.evening.n.toLowerCase()+'.':''}</span></div>`:''}
      <div class="enc-row"><b>Делает сам</b><span>${S.me} ${plural(S.me,'дело','дела','дел')} из шести — остальное считает робот</span></div>
    </div>
    <div class="enc-foot">
      <div class="enc-author">Автор: ${S.child.toUpperCase()}, ${S.age} лет</div>
      <div class="enc-note">До сегодняшнего дня этой профессии в энциклопедии не было.</div>
    </div>
  </div>`;
  F().innerHTML=`<div class="btnrow">
      <button class="btn btn2 btn-sm" onclick="shareCard()">Показать</button>
      <button class="btn btn-sm" onclick="go('shake')">Дальше →</button></div>`;
}
function plural(n,a,b,c){const m=n%10,h=n%100;return h>=11&&h<=14?c:m===1?a:m>=2&&m<=4?b:c}
function shareCard(){
  const u=location.origin+location.pathname+'?t='+encodeURIComponent(S.title)+'&by='+encodeURIComponent(S.child);
  if(navigator.share)navigator.share({title:S.title,url:u}).catch(()=>{});
  else if(navigator.clipboard){navigator.clipboard.writeText(u);toast('Ссылка скопирована')}
  else toast('Скопируй адрес из строки браузера');
}

/* ═════════ НАВИГАЦИЯ ═════════ */
$('back').onclick=()=>{
  const map={s1:'s0',met:'s1',belt:'met',goal:'belt',deeds:'goal',desk:'deeds',look:'desk',
    gear:'look',cmp:'gear',names:'cmp',day:'names',reveal:'day',card:'reveal',shake:'card'};
  S.step=map[S.step]||'s0'; render();
};
try{const c=localStorage.getItem('nooka.child'); if(c)S.child=c}catch(e){}
render();
</script>
