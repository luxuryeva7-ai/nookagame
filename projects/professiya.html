<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Профессия будущего — Nooka</title>
<link href="../fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#2B2118; --ink2:#5C4A38; --ink3:#8A7A68;
  --acc:#E65C00; --accbg:#FFF1E4; --line:rgba(180,110,40,.16);
  --ok:#2E9E5B; --okbg:#DFF5EA; --bad:#D93030;
  --pic:#4A90D9; --snd:#9B59C7; --num:#2E9E5B; --txt:#E0A020;
  --sh:0 2px 14px rgba(170,100,40,.11);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow-x:hidden}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.root{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
button,.btn,.st,.chip,.tool,.chair,.f5{touch-action:manipulation;user-select:none;-webkit-user-select:none}

.hdr{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg);z-index:20;position:sticky;top:0}
.hdr-back{width:34px;height:34px;border:none;background:none;cursor:pointer;font-size:20px;color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.hdr-t{flex:1;font-weight:800;font-size:16.5px;color:var(--ink2);text-align:center}
.hdr-r{width:34px;flex:none;text-align:right;font-size:14px;font-weight:800;color:var(--ink3)}
.prog{flex:none;height:4px;background:rgba(180,110,40,.1);position:sticky;top:52px;z-index:20}
.prog i{display:block;height:4px;background:var(--acc);border-radius:0 2px 2px 0;transition:width .45s cubic-bezier(.4,0,.2,1)}
.body{flex:1;padding:0 12px 8px}
.foot{flex:none;position:sticky;bottom:0;z-index:25;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,248,238,0),var(--bg) 38%)}

.say{display:flex;gap:9px;align-items:flex-start;margin-top:12px;animation:up .32s ease both}
.say-av{flex:none;width:50px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.say-b{flex:1;background:var(--card);border-radius:16px;border-top-left-radius:5px;padding:11px 14px;box-shadow:var(--sh);font-weight:600;font-size:17.5px;line-height:1.45;color:var(--ink2);white-space:pre-line}
.say-b b{color:var(--acc);font-weight:800}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn{width:100%;min-height:54px;border:none;border-radius:27px;font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:17px;cursor:pointer;background:var(--acc);color:#fff;transition:opacity .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.28;pointer-events:none}
.btn2{background:var(--card);color:var(--acc);box-shadow:inset 0 0 0 2px var(--line)}
.btn-sm{min-height:46px;font-size:16px;border-radius:23px}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}
.txtbtn{display:block;width:100%;text-align:center;border:none;background:none;color:var(--acc);font-family:inherit;font-weight:800;font-size:16.5px;padding:11px;cursor:pointer}
.field{width:100%;min-height:54px;margin-top:10px;border:2px solid var(--line);border-radius:16px;background:var(--card);padding:0 16px;font-family:inherit;font-size:19px;font-weight:700;color:var(--ink)}
.field:focus{outline:none;border-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--line);background:var(--card);font-family:inherit;font-weight:800;font-size:16.5px;color:var(--ink2);cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.h1{font-family:'Unbounded','Nunito',sans-serif;font-weight:800;font-size:27px;line-height:1.15;color:var(--ink);margin-top:18px}
.lead{margin-top:10px;font-size:17px;font-weight:600;color:var(--ink2);line-height:1.5}
.hintbar{text-align:center;font-size:15px;font-weight:800;color:var(--ink3);padding:14px}
.mini{font-size:14.5px;font-weight:700;color:var(--ink3);line-height:1.45}
.note{font-size:15.5px;font-weight:700;color:var(--ink2);text-align:center;padding:10px 6px 2px;min-height:22px;line-height:1.4}

/* ── ЦЕХ ── */
.floor{margin-top:10px;background:#EAD9BF;border-radius:18px;box-shadow:var(--sh);padding:10px 10px 12px;position:relative;overflow:hidden;
 background-image:repeating-linear-gradient(0deg,rgba(90,60,25,.05) 0 1px,transparent 1px 22px)}
.floor-t{font-family:'Unbounded','Nunito',sans-serif;font-weight:800;font-size:16.5px;color:#3A2A18;letter-spacing:.02em;padding:2px 4px 6px;display:flex;align-items:baseline;gap:8px}
.floor-t span{font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:800;color:#6E5233;letter-spacing:.06em;text-transform:uppercase}
.chaincv{display:block;width:100%;border-radius:12px;background:#F6ECDA;box-shadow:inset 0 0 0 1.5px rgba(90,60,25,.25)}
.need{margin-top:10px;background:rgba(255,248,238,.96);border-radius:14px;padding:10px 11px 11px;box-shadow:0 2px 8px rgba(90,60,25,.18)}
.need-t{font-size:13.5px;font-weight:800;color:var(--ink3);margin-bottom:8px;text-align:center}
.need-t b{color:var(--acc)}
.need-r{display:flex;flex-wrap:wrap;gap:5px}
.nd{flex:1 1 30%;min-width:96px;display:grid;grid-template-columns:auto 1fr;gap:1px 6px;background:#F2E8D8;border-radius:10px;padding:6px 8px;opacity:.55;align-items:center}
.nd.has{opacity:1;background:var(--okbg)}
.nd-e{width:16px;height:16px;grid-row:span 2}
.nd-n{font-size:12.5px;font-weight:800;color:var(--ink2);line-height:1.15}
.nd-v{font-size:12px;font-weight:800;color:var(--acc);line-height:1.2;overflow-wrap:break-word}
.nd:not(.has) .nd-v{color:var(--ink3)}
.stations{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.st{position:relative;border:none;border-radius:16px;cursor:pointer;font-family:inherit;text-align:left;padding:11px 14px 11px 62px;display:flex;flex-direction:column;gap:1px;
 background:linear-gradient(165deg,#FFF8EE,#F2E4CC);box-shadow:0 1px 0 rgba(43,33,24,.28),0 10px 18px -8px rgba(43,33,24,.4);animation:float 4.2s ease-in-out infinite}
.st:nth-child(2){animation-duration:5.1s;animation-delay:.4s}
.st:nth-child(3){animation-duration:3.7s;animation-delay:.9s}
.st:nth-child(4){animation-duration:4.8s;animation-delay:.2s}
.st:nth-child(5){animation-duration:4.4s;animation-delay:.6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.st:active{transform:scale(.985)}
.st.done{filter:saturate(.5) brightness(.97);animation:none}
.st.next{box-shadow:0 0 0 2.5px var(--acc),0 1px 0 rgba(43,33,24,.28),0 10px 18px -8px rgba(43,33,24,.4)}
.st-num{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;font-family:'Unbounded','Nunito',sans-serif;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(120,50,0,.35)}
.st.done .st-num{background:var(--ok);box-shadow:0 2px 0 rgba(20,80,40,.35)}
.st-n{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:15px;color:#2B2118}
.st-s{font-size:14px;font-weight:700;color:#8A7A68}
.st-gives{font-size:13.5px;font-weight:800;color:var(--acc);margin-top:1px}
.st.done .st-gives{color:var(--ok)}
.st-h{position:absolute;right:13px;top:11px;font-size:12px;font-weight:800;color:var(--ok);background:var(--okbg);padding:3px 9px;border-radius:999px}
.st-h:empty{display:none}
.st-badge{position:absolute;right:13px;bottom:10px;font-size:12px;font-weight:900;background:var(--acc);color:#fff;padding:3px 9px;border-radius:999px}
.st.next{padding-bottom:30px}

/* ── уровень ── */
.pzgoal{background:var(--accbg);border-radius:14px;padding:10px 12px;margin-top:10px}
.pzgoal-t{font-size:12.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.pzgoal-r{margin-top:4px;font-size:15px;font-weight:800;color:var(--ink)}
.pz{margin-top:10px;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px}
.pz canvas{display:block;max-width:100%;touch-action:none;border-radius:12px}
.rowlbl{font-size:12.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:10px 0 6px}

/* глаз */
.pixwrap{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:start}
.numgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;font-family:ui-monospace,Menlo,monospace;font-size:8.5px;line-height:1;color:var(--ink3);background:#F6EEE2;border-radius:8px;padding:5px}
.numgrid i{font-style:normal;text-align:center;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:2px}
.numgrid i.on{background:#2B2118;color:#FFF8EE}
.feat{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.feat span{background:var(--accbg);color:var(--acc);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:900}
.pixbtns{display:flex;gap:8px;margin-top:10px}
.pixbtns .btn{flex:1}

/* ухо */
.drum{position:relative;height:190px;border-radius:16px;background:radial-gradient(circle at 50% 42%,#F7E6C8,#D9BE94 70%);box-shadow:inset 0 0 0 3px rgba(90,60,25,.25);cursor:pointer;touch-action:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.drum-l{font-family:'Unbounded','Nunito',sans-serif;font-weight:800;font-size:15px;color:#6E5233;pointer-events:none;text-align:center;line-height:1.3}
.rip{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid var(--acc);transform:translate(-50%,-50%) scale(.3);opacity:.9;animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:translate(-50%,-50%) scale(4.2);opacity:0}}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:10px;padding:0 4px}
.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:4px;opacity:.85}

/* память — карточки */
.stack{position:relative;height:250px;margin-top:4px}
.card{position:absolute;left:50%;top:0;width:200px;margin-left:-100px;background:var(--card);border-radius:18px;box-shadow:0 6px 18px rgba(90,50,10,.22);padding:12px;touch-action:none;cursor:grab;transition:transform .18s ease,opacity .18s ease}
.card.back{transform:scale(.94) translateY(12px);opacity:.6}
.card.back2{transform:scale(.88) translateY(24px);opacity:.3}
.card.fly{transition:transform .32s cubic-bezier(.3,.7,.4,1),opacity .32s}
.card canvas{display:block;width:100%;height:auto;border-radius:10px}
.card-n{margin-top:8px;text-align:center;font-size:13px;font-weight:800;color:var(--ink3)}
.card-tag{position:absolute;top:14px;padding:5px 11px;border-radius:999px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:13px;opacity:0;transition:opacity .12s}
.card-tag.yes{right:12px;background:var(--okbg);color:var(--ok)}
.card-tag.no{left:12px;background:#FDE4E4;color:var(--bad)}
.bins{display:flex;justify-content:space-between;margin-top:8px;padding:0 4px}
.bin{flex:1;text-align:center;border-radius:12px;padding:8px 4px;font-weight:900;font-size:14px}
.bin.no{background:#FDE4E4;color:var(--bad);margin-right:6px}
.bin.yes{background:var(--okbg);color:var(--ok);margin-left:6px}
.bin b{display:block;font-family:'Unbounded',sans-serif;font-size:20px}

/* решатель */
.decwrap{display:grid;grid-template-columns:1fr;gap:8px}
.dial{position:relative;width:176px;height:176px;margin:4px auto 0;border-radius:50%;background:radial-gradient(circle at 50% 40%,#FFF8EE,#E8D5B6);box-shadow:inset 0 0 0 4px rgba(90,60,25,.25),0 4px 12px rgba(90,50,10,.18);touch-action:none;cursor:grab}
.dial-n{position:absolute;left:50%;top:50%;width:6px;height:78px;margin:-78px 0 0 -3px;background:var(--acc);border-radius:3px;transform-origin:50% 100%;pointer-events:none}
.dial-c{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:#3A2A18;pointer-events:none}
.dial-l{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:'Unbounded',sans-serif;font-weight:800;font-size:13px;color:#6E5233;pointer-events:none}
.tally{display:flex;gap:6px;margin-top:6px}
.tl{flex:1;border-radius:12px;padding:8px 6px;text-align:center;font-size:12.5px;font-weight:900;line-height:1.25}
.tl b{display:block;font-family:'Unbounded',sans-serif;font-size:19px}
.tl.ok{background:var(--okbg);color:var(--ok)}
.tl.miss{background:#FFF1E4;color:#B8601A}
.tl.fa{background:#FDE4E4;color:var(--bad)}

/* рука и стул */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tool{width:70px;height:76px;border-radius:14px;background:#F6EEE2;box-shadow:inset 0 0 0 1.5px rgba(150,110,60,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:grab;touch-action:none;font-size:12px;font-weight:800;color:var(--ink2)}
.tool.on{box-shadow:inset 0 0 0 2.5px var(--acc);background:var(--accbg)}
.tool.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);opacity:.92}
.tool svg{width:32px;height:32px;display:block;pointer-events:none}
.handbox{margin-top:10px;height:92px;border-radius:14px;border:2px dashed rgba(150,110,60,.45);background:#FBF5EA;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;color:var(--ink3);font-size:14px}
.handbox.on{border-style:solid;border-color:var(--acc);background:var(--accbg);color:var(--ink)}
.handbox svg{width:44px;height:44px}
.charrow{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.charrow::-webkit-scrollbar{display:none}
.sw{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--acc)}
.charstage{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start;margin-top:6px}
.charpv{border-radius:14px;overflow:hidden;background:#F3EADC;aspect-ratio:3/4}
.charpv svg{width:100%;height:100%;display:block}
.chairs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.chair{position:relative;border-radius:14px;background:#F6EEE2;box-shadow:inset 0 0 0 1.5px rgba(150,110,60,.28);padding:10px 4px 8px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);min-height:96px;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-start}
.chair svg{width:30px;height:30px;display:block}
.chair.hot{box-shadow:inset 0 0 0 2.5px var(--acc);background:var(--accbg)}
.chair.me{background:var(--okbg);box-shadow:inset 0 0 0 2.5px var(--ok)}
.chair .seat{margin-top:auto;width:100%;height:22px;border-radius:6px 6px 2px 2px;background:#C9A26E;box-shadow:inset 0 -4px 0 rgba(90,50,10,.25)}
.chair.me .seat{background:var(--ok)}
.meDrag{position:fixed;z-index:99;pointer-events:none;width:64px;height:84px;transform:translate(-50%,-60%);filter:drop-shadow(0 6px 10px rgba(60,40,10,.35))}
.meDrag svg{width:100%;height:100%;display:block}
.mesrc{margin-top:10px;display:flex;align-items:center;gap:10px;background:var(--accbg);border-radius:14px;padding:8px 12px;touch-action:none;cursor:grab}
.mesrc svg{width:48px;height:64px;display:block;flex:none}
.mesrc span{font-weight:800;font-size:15px;color:var(--ink)}

/* финал */
.filmwrap{margin-top:10px;background:#2B2118;border-radius:18px;box-shadow:var(--sh);padding:10px;display:flex;flex-direction:column;gap:8px}
.filmwrap canvas{width:100%;height:auto;display:block;border-radius:11px;background:#FFF8EE}
.film-bar{width:100%;height:6px;border-radius:3px;background:rgba(255,248,238,.18);overflow:hidden}
.film-bar i{display:block;height:6px;width:0;background:var(--acc);transition:width .12s linear}
.film-st{font-size:13.5px;font-weight:800;color:#C4B4A2;text-align:center;min-height:16px}
.passwrap{margin-top:10px;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:10px}
.passwrap canvas{width:100%;height:auto;display:block;border-radius:12px}

/* подсказка-рука */
.demohand{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transition:opacity .3s}
.demohand.off{opacity:0}
.dh-f{font-size:34px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));animation:handtap 1.4s ease-in-out infinite}
.dh-t{background:rgba(43,33,24,.9);color:#FFF8EE;font-size:13.5px;font-weight:800;padding:7px 12px;border-radius:12px;white-space:nowrap}
@keyframes handtap{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(.92)}}
.demohand.swipe .dh-f{animation:handswipe 1.6s ease-in-out infinite}
@keyframes handswipe{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
.demohand.turn .dh-f{animation:handturn 1.8s ease-in-out infinite}
@keyframes handturn{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
.pulse{animation:pulse 1.1s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,92,0,0)}50%{box-shadow:0 0 0 7px rgba(230,92,0,.16)}}

/* память — полки */
.shelves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shelf{border-radius:14px;padding:8px 8px 10px;min-height:88px;background:#F6EEE2;box-shadow:inset 0 0 0 1.5px rgba(150,110,60,.28);transition:box-shadow .12s,background .12s}
.shelf.yes{background:#EEF8F1}.shelf.no{background:#F1ECE4}
.shelf.hot{box-shadow:inset 0 0 0 3px var(--acc);background:var(--accbg)}
.shelf-t{display:flex;align-items:center;gap:6px;font-family:'Unbounded','Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--ink2)}
.shelf.no .shelf-t{color:var(--ink3)}
.shelf-th canvas{display:block;border-radius:5px;border:1.5px solid var(--ink)}
.shelf-r{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:30px}
.shelf-r canvas{display:block;border-radius:4px;box-shadow:0 1px 0 rgba(90,50,10,.25)}
.mini-chip{min-height:36px;padding:0 11px;font-size:13.5px}
/* тумблер «А без тебя?» */
.switchrow{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
.switch{position:relative;width:54px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:15px;background:#D9BE94;transition:background .2s;cursor:pointer}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--bad)}
.switch input:checked+span::after{transform:translateX(24px)}
.switch-l{font-family:'Unbounded','Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--ink)}
.switch-c{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink3);text-align:right}

/* ═══ единый детский скин: как в лабиринте — одна карточка, воздух, крупно ═══ */
.floor{margin-top:12px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:12px;position:relative;overflow:hidden;background-image:none}
.floor-t{font-family:'Unbounded','Nunito',sans-serif;font-weight:800;font-size:17px;color:var(--ink);padding:2px 4px 8px;display:flex;align-items:baseline;gap:8px;letter-spacing:0}
.floor-t span{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:0;text-transform:none}
.chaincv{display:block;width:100%;border-radius:14px;background:#F6ECDA;box-shadow:none}
.progline{margin-top:10px;text-align:center;font-size:15.5px;font-weight:800;color:var(--ink2)}
.progline b{color:var(--acc)}

<script>
/* ═══════════════ ДАННЫЕ ═══════════════ */
function rng(s){let x=s>>>0;return()=>{x=(x+0x6D2B79F5)>>>0;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function pick(r,a){return a[Math.floor(r()*a.length)]}
function rint(r,a,b){return a+Math.floor(r()*(b-a+1))}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}

/* смысл уровней: одна фраза до, реплики по событиям, одно «ага» после */

 eye:    {n:1,title:'Что ИИ видит',       act:'Закрась клетки',

function svgNeuro(size,mood){
  const sz=size||50,m=mood||'idle';
  const eye={idle:'#4FD1C5',think:'#FFC94D',happy:'#7BE495',oops:'#FF9A76'}[m]||'#4FD1C5';

  return `<svg viewBox="0 0 64 64" width="${sz}" height="${sz}" style="display:block;overflow:visible">

     <ellipse cx="38.5" cy="${41.5+lid}" rx="3.4" ry="${3.4-lid*.7}" fill="${eye}"/>

     <circle cx="37.3" cy="${40.3+lid}" r="1.05" fill="#fff" opacity=".9"/>

     ${m==='oops'?'<path d="M28 54 q4 -3 8 0" stroke="#C9B49B" stroke-width="1.8" fill="none" stroke-linecap="round"/>':''}
     <rect x="8" y="38" width="5" height="12" rx="2.5" fill="#DCD2C2"/>
     <rect x="51" y="38" width="5" height="12" rx="2.5" fill="#DCD2C2"/>

}

const BGS={forest:{sky:['#A8C48A','#6B8C52'],ground:'#4A5C34',bits:'tree'},city:{sky:['#C4B79A','#8A7F6B'],ground:'#6B6455',bits:'tower'},field:{sky:['#F0D9A0','#D9B366'],ground:'#B08A4A',bits:'crop'}};
function svgBG(bgId,seed){
  const B1=BGS[bgId]||BGS.forest, r=rng(seed*17+3);
  let o=`<defs><linearGradient id="sk${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${B1.sky[0]}"/><stop offset="1" stop-color="${B1.sky[1]}"/></linearGradient></defs><rect width="300" height="400" fill="url(#sk${seed})"/>`;
  if(B1.bits==='tree')for(let i=0;i<7;i++){const x=rint(r,-10,300),h=rint(r,70,130),t=300-h;o+=`<rect x="${x-3}" y="${t+12}" width="6" height="${h}" fill="#4A3826" opacity=".75"/>`;for(let k=0;k<3;k++)o+=`<path d="M${x} ${t+k*h*.26} l${22-k*4} ${h*.3} h-${(22-k*4)*2}z" fill="${k%2?'#3E5A3A':'#4A6B42'}" opacity=".8"/>`}
  if(B1.bits==='tower')for(let i=0;i<8;i++){const x=i*38-6,h=rint(r,60,150);o+=`<rect x="${x}" y="${300-h}" width="32" height="${h}" fill="#000" opacity="${(.1+i*.02).toFixed(2)}"/>`}
  if(B1.bits==='crop')for(let i=0;i<16;i++){const x=rint(r,0,300);o+=`<path d="M${x} 300 v-${rint(r,16,30)}" stroke="#8A6B34" stroke-width="2.4" opacity=".55"/>`}
  o+=`<rect y="300" width="300" height="100" fill="${B1.ground}"/><rect y="300" width="300" height="100" fill="#000" opacity=".07"/>`;
  return o;
}

    eye:`<path d="M6 20 q14 -16 28 0 q-14 16 -28 0z" fill="${W1}" stroke="${INK}" stroke-width="2.4"/><circle cx="20" cy="20" r="5" fill="${INK}"/>`,

function needList(){
  return STATIONS.map(x=>{
    let have=false,val=null;
    if(x.id==='eye'){have=!!S.thing;val=S.thingName||null}
    if(x.id==='memory'){have=S.memDone>0;val=have?(S.mem.pos.length+S.mem.neg.length)+' примеров':null}
    if(x.id==='decider'){have=S.decDone>0;val=have?Math.round(S.thr*100)+'%':null}
    if(x.id==='hand'){have=!!S.gest;val=S.actionPhrase||(S.gest&&S.gest.n)||null}
    if(x.id==='chair'){have=!!S.human;val=have?NODEN[S.human]:null}
    return {...x,have,val};
  });
}
function needHTML(){

}

/* ═══════════════ КОНВЕЙЕР В ЦЕХУ — цепь растёт на глазах ═══════════════ */
const CH={run:0,raf:0,balls:[],t:0,last:0,puddles:[],gen:0};
function stopChain(){CH.run=0;CH.gen++;if(CH.raf)cancelAnimationFrame(CH.raf);CH.raf=0}
function startChain(){
  const cv=$('chaincv'); if(!cv)return;
  const w=fitW(cv,460), h=Math.round(w*0.6), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  CH.ctx=ctx;CH.w=w;CH.h=h;CH.balls=[];CH.puddles=[];CH.t=0;CH.last=performance.now();CH.spawn=0;CH.delivered=0;
  if(!CH.thing&&S.thing){CH.thing=document.createElement('canvas');drawVec(CH.thing,S.thing,40)}
  CH.run=1; const my=++CH.gen;
  const loop=(now)=>{ if(!CH.run||my!==CH.gen)return;
    const dt=Math.min(50,now-CH.last); CH.last=now; chainStep(dt); chainDraw();
    CH.raf=requestAnimationFrame(loop) };
  CH.raf=requestAnimationFrame(loop);
}
const CHAIN_IDS=['eye','memory','decider','hand'];
function chainSlots(){const w=CH.w,x0=34,x1=w-34;const xs=[];for(let i=0;i<4;i++)xs.push(x0+(x1-x0)*(i+1)/5);return {hatch:x0,win:x1,xs,y:Math.round(CH.h*0.46)}}
function chainStep(dt){
  CH.t+=dt;
  const P=chainSlots(), beat=S.beat?Math.max(700,Math.min(2200,S.beat.mean)):1400;
  if(CH.t>CH.spawn){CH.balls.push({x:P.hatch,y:P.y,k:CH.balls.length%3,dead:0,fall:0});CH.spawn=CH.t+beat}
  CH.balls.forEach(b=>{
    if(b.fall){b.vy+=dt*0.004;b.y+=b.vy*dt;b.x+=b.vx*dt;if(b.y>CH.h-14){b.dead=1;if(CH.puddles.length<24)CH.puddles.push({x:b.x,y:CH.h-12,r:0,k:b.k})}return}
    b.x+=0.05*dt;
    for(let i=0;i<4;i++){const sx=P.xs[i]; if(b.x>=sx-2&&!b['p'+i]){b['p'+i]=1;
      if(!S.done[CHAIN_IDS[i]]){b.fall=1;b.vy=-0.14;b.vx=0.02;return}
      if(i===2&&b.k===2){b.fall=1;b.vy=-0.05;b.vx=0.03;return}
    }}
    if(b.x>P.win-6){b.dead=1;CH.delivered++}
  });
  CH.balls=CH.balls.filter(b=>!b.dead);
  CH.puddles.forEach(p=>{if(p.r<9)p.r+=dt*0.02});
}
function chainDraw(){
  const {ctx,w,h}=CH; if(!ctx)return; const P=chainSlots(), nx=nextStation();
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#F6ECDA';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#D9BE94';ctx.fillRect(0,h-16,w,16);
  ctx.fillStyle='#8A6D46';ctx.fillRect(P.hatch,P.y+14,P.win-P.hatch,12);
  ctx.fillStyle='rgba(0,0,0,.09)';for(let i=0;i<18;i++)ctx.fillRect(P.hatch+((i*34+CH.t*0.05)%(P.win-P.hatch)),P.y+14,16,12);
  ctx.fillStyle='#6E5233';ctx.fillRect(P.hatch-18,10,36,P.y-10);ctx.fillStyle='#3A2A18';ctx.fillRect(P.hatch-12,P.y-8,24,7);
  ctx.fillStyle='#FFF8EE';ctx.font='800 12px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText('люк',P.hatch,26);
  // выход с печатью «готово»
  ctx.fillStyle='#6E5233';ctx.fillRect(P.win-20,P.y-42,40,72);ctx.fillStyle='#FFF8EE';ctx.fillRect(P.win-14,P.y-36,28,40);
  ctx.fillStyle='#2B2118';ctx.font='800 16px Unbounded, sans-serif';ctx.textAlign='center';ctx.fillText(String(CH.delivered||0),P.win,P.y-10);
  ctx.fillStyle='#2E9E5B';ctx.font='800 11px Nunito, sans-serif';ctx.fillText('готово',P.win,P.y+44);
  const names=['глаз','память','решатель','рука'];
  const pulse=0.5+0.5*Math.sin(CH.t/260);
  CHAIN_IDS.forEach((id,i)=>{
    const x=P.xs[i], on=S.done[id], isNext=nx===id;
    const bw=56,bh=48;
    if(on){ctx.fillStyle='#F2E4CC';ctx.strokeStyle='#3A2A18';ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(x-bw/2,P.y-bh+12,bw,bh,12);ctx.fill();ctx.stroke();
      if(CH.icons&&CH.icons[id])ctx.drawImage(CH.icons[id],x-17,P.y-bh+18,34,34)}
    else{ // заслонка; следующая — светится
      ctx.fillStyle=isNext?`rgba(230,92,0,${0.10+pulse*0.18})`:'rgba(120,90,60,.12)';ctx.beginPath();ctx.roundRect(x-bw/2,P.y-bh+12,bw,bh,12);ctx.fill();
      ctx.setLineDash(isNext?[]:[5,4]);ctx.strokeStyle=isNext?'#E65C00':'rgba(58,42,24,.4)';ctx.lineWidth=isNext?3:1.5;ctx.beginPath();ctx.roundRect(x-bw/2,P.y-bh+12,bw,bh,12);ctx.stroke();ctx.setLineDash([]);
      if(!isNext){ctx.fillStyle='rgba(90,60,25,.35)';for(let k=0;k<3;k++)ctx.fillRect(x-20,P.y-bh+22+k*11,40,5)}}
    ctx.fillStyle=on?'#3A2A18':'rgba(58,42,24,.55)';ctx.font='800 13px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText(names[i],x,P.y+34);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-bw/2+2,P.y-bh+12,11,0,7);ctx.fill();ctx.fillStyle='#E65C00';ctx.beginPath();ctx.arc(x-bw/2+2,P.y-bh+12,9.5,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='800 11px Unbounded, sans-serif';ctx.fillText(String(i+1),x-bw/2+2,P.y-bh+16);
    if(S.human===id){ctx.fillStyle='#2E9E5B';ctx.fillRect(x-16,P.y+40,32,6);ctx.fillStyle='#2B2118';ctx.font='800 12px Nunito, sans-serif';ctx.fillText('ты',x,P.y+58)}
  });
  if(S.done.chair&&!S.human){}
  CH.puddles.forEach(p=>{ctx.fillStyle=['rgba(74,144,217,.45)','rgba(224,160,32,.45)','rgba(155,89,199,.45)'][p.k];ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.6,p.r*.6,0,0,7);ctx.fill()});
  CH.balls.forEach(b=>{if(CH.thing&&b.k!==2){ctx.drawImage(CH.thing,b.x-11,b.y-11,22,22);ctx.strokeStyle='#2B2118';ctx.lineWidth=1.5;ctx.strokeRect(b.x-11,b.y-11,22,22)}
    else{ctx.fillStyle=['#4A90D9','#E0A020','#9B59C7'][b.k];ctx.beginPath();ctx.arc(b.x,b.y,9,0,7);ctx.fill();ctx.strokeStyle='#2B2118';ctx.lineWidth=1.8;ctx.stroke()}});
}

const PIX={n:10,cells:null,down:false,mode:1};
function eyeHTML(){
  return say(MEANING.eye.before,'think')
   +`<div class="pz"><div class="pixcenter"><canvas id="pixcv"></canvas></div>
      <div class="feat" id="feat"></div>
      <div class="rowlbl">Что вижу я — сто чисел</div><div class="numgrid" id="numgrid"></div>
      <div class="pixbtns"><button class="btn btn2 btn-sm" onclick="pixMirror()">Зеркало</button><button class="btn btn2 btn-sm" onclick="pixClear()">Стереть</button></div>
      <input class="field" id="thingname" maxlength="18" placeholder="Что это? Одним словом" value="${S.thingName}" oninput="S.thingName=this.value.trim();eyeCheck()"></div>`;
}
function eyeBind(){
  const cv=$('pixcv'); if(!cv)return;
  const n=PIX.n, dpr=Math.min(2,devicePixelRatio||1);
  const size=Math.max(200,Math.min(300,fitW(cv,340))); cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  PIX.ctx=ctx;PIX.size=size;PIX.cells=S.thing?Array.from(S.thing):new Array(n*n).fill(0);
  const cellAt=e=>{const r=cv.getBoundingClientRect();const c=Math.floor((e.clientX-r.left)/size*n),rr=Math.floor((e.clientY-r.top)/size*n);return (c<0||rr<0||c>=n||rr>=n)?-1:rr*n+c};
  const paint=i=>{if(i<0)return;if(PIX.cells[i]!==PIX.mode){PIX.cells[i]=PIX.mode;pixDraw();eyeUpdate()}};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}PIX.down=true;const i=cellAt(e);PIX.mode=(i>=0&&PIX.cells[i])?0:1;paint(i)};
  cv.onpointermove=e=>{if(!PIX.down)return;e.preventDefault();let pts=[e];if(e.getCoalescedEvents){const c=e.getCoalescedEvents();if(c&&c.length)pts=c}pts.forEach(p=>paint(cellAt(p)))};
  const end=()=>{PIX.down=false}; cv.onpointerup=end;cv.onpointercancel=end;cv.onlostpointercapture=end;
  pixDraw();eyeUpdate();
}
function pixDraw(){const {ctx,size,n,cells}=PIX;if(!ctx)return;const c=size/n;ctx.fillStyle='#F6EEE2';ctx.fillRect(0,0,size,size);
  for(let i=0;i<n*n;i++){ctx.fillStyle=cells[i]?'#2B2118':'#FFF8EE';ctx.fillRect((i%n)*c+1,Math.floor(i/n)*c+1,c-2,c-2)}
  ctx.strokeStyle='rgba(90,60,25,.25)';ctx.lineWidth=1;ctx.strokeRect(.5,.5,size-1,size-1)}
function pixClear(){PIX.cells.fill(0);pixDraw();eyeUpdate()}
function pixMirror(){const n=PIX.n;for(let y=0;y<n;y++)for(let x=0;x<n/2;x++)PIX.cells[y*n+(n-1-x)]=PIX.cells[y*n+x];pixDraw();eyeUpdate()}
function pixFeats(cells){const n=10;let cnt=0,sym=0,top=0,bot=0,minx=n,maxx=-1,miny=n,maxy=-1;
  for(let i=0;i<n*n;i++)if(cells[i]){cnt++;const x=i%n,y=Math.floor(i/n);if(y<n/2)top++;else bot++;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;if(cells[y*n+(n-1-x)])sym++}
  return {cnt,sym:cnt?Math.round(sym/cnt*100):0,top,bot,w:cnt?maxx-minx+1:0,h:cnt?maxy-miny+1:0}}
function eyeUpdate(){
  const g=$('numgrid'); if(g)g.innerHTML=PIX.cells.map(v=>`<i class="${v?'on':''}">${v}</i>`).join('');

/* ── 3. РЕШАТЕЛЬ — сравнение с полками и черта; ошибки падают в корзины ── */
const DEC={run:0,raf:0,items:[],t:0,last:0,seen:0,gen:0,bins:{yes:[],no:[]}};
function decHTML(){
  if(!S.thing||!S.memDone)return say('Сначала заполни память на уровне 2 — решателю не с чем сравнивать.','oops');
  return say(MEANING.decider.before,'think')
   +`<div class="pz"><canvas id="deccv"></canvas>
      <div class="dial" id="dial"><div class="dial-w"><span>мягче</span><span>строже</span></div><div class="dial-n" id="dialn"></div><div class="dial-c"></div><div class="dial-l" id="diall">черта</div></div>
      <div class="tally"><div class="tl ok"><b id="tok">0</b>угадал</div><div class="tl miss"><b id="tmiss">0</b>не узнал своё</div><div class="tl fa"><b id="tfa">0</b>пустил чужое</div></div></div>`;
}
function decMakeItems(){
  const r=rng(S.seed*13+5), items=[];
  for(let i=0;i<8;i++)items.push({v:variantOf(S.thing,r),truth:1});
  for(let i=0;i<3;i++)items.push({v:decoy(i,r),truth:0});
  for(let i=0;i<3;i++)items.push({v:hardDecoy(S.thing,r),truth:0});
  items.forEach(it=>it.score=decScore(it.v));
  // «нуля нет» должно быть правдой: если какая-то черта даёт 0 ошибок — подмешиваем трудную пару
  const errsAt=t=>items.reduce((a,it)=>a+((it.score>=t)!==!!it.truth?1:0),0);
  let guard=0; while(guard++<6){let minE=99;for(let t=0.25;t<=0.9;t+=0.02)minE=Math.min(minE,errsAt(t));if(minE>=1)break;
    const hv=hardDecoy(S.thing,r);items.push({v:hv,truth:0,score:decScore(hv)});const sv=noiseVec(S.thing,12,r);items.push({v:sv,truth:1,score:decScore(sv)})}
  for(let i=items.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  return items;
}
function decBind(){
  if(!S.thing||!S.memDone)return;
  const cv=$('deccv'); if(!cv)return;
  const w=fitW(cv,460), h=150, dpr=Math.min(2,devicePixelRatio||1);
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  DEC.ctx=ctx;DEC.w=w;DEC.h=h;DEC.pool=decMakeItems();DEC.pi=0;DEC.items=[];DEC.t=0;DEC.spawn=600;DEC.seen=0;S.tally={ok:0,miss:0,fa:0};DEC.bins={yes:[],no:[]};DEC.start=performance.now();
  DEC.th=thumb(28);
  const d=$('dial'); let down=false;
  const setThr=e=>{const r=d.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let a=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI+90;a=((a%360)+360)%360;if(a>180)a-=360;a=Math.max(-135,Math.min(135,a));
    S.thr=0.25+(a+135)/270*0.65;decDial();decRejudge()};
  d.onpointerdown=e=>{e.preventDefault();try{d.setPointerCapture(e.pointerId)}catch(_){}down=true;setThr(e)};
  d.onpointermove=e=>{if(down){e.preventDefault();setThr(e)}};
  const end=()=>{down=false};d.onpointerup=end;d.onpointercancel=end;d.onlostpointercapture=end;
  decDial();
  DEC.run=1;DEC.last=performance.now();const my=++DEC.gen;
  const loop=now=>{if(!DEC.run||my!==DEC.gen)return;const dt=Math.min(50,now-DEC.last);DEC.last=now;decStep(dt);decDraw();DEC.raf=requestAnimationFrame(loop)};
  DEC.raf=requestAnimationFrame(loop);
}
function decStop(){DEC.run=0;DEC.gen++;if(DEC.raf)cancelAnimationFrame(DEC.raf);DEC.raf=0}
function decDial(){const a=(S.thr-0.25)/0.65*270-135;const n=$('dialn');if(n)n.style.transform='rotate('+a+'deg)';const l=$('diall');if(l)l.textContent=S.thr<0.45?'мягко':S.thr>0.72?'строго':'посередине'}

function decRejudge(){
  const all=DEC.bins.yes.concat(DEC.bins.no); DEC.bins={yes:[],no:[]}; S.tally={ok:0,miss:0,fa:0};
  all.forEach(it=>{it.pass=it.score>=S.thr;(it.pass?DEC.bins.yes:DEC.bins.no).push(it);decCount(it)});
  decTally();
}
function decCount(it){if(it.pass===!!it.truth)S.tally.ok++;else if(it.truth)S.tally.miss++;else S.tally.fa++}
function decStep(dt){
  DEC.t+=dt; const w=DEC.w;
  if(DEC.t>DEC.spawn&&DEC.pi<DEC.pool.length){const it=Object.assign({x:-20,y:0,judged:0,img:null},DEC.pool[DEC.pi++]);DEC.items.push(it);DEC.spawn=DEC.t+1400}
  DEC.items.forEach(it=>{
    it.x+=dt*0.07;
    if(!it.judged&&it.x>=w*0.5){it.judged=1;it.pass=it.score>=S.thr;DEC.seen++;(it.pass?DEC.bins.yes:DEC.bins.no).push(it);decCount(it);decTally();
      if(DEC.seen===1)setNote(MEANING.decider.dur[0]);
      if(DEC.seen===4)setNote(MEANING.decider.dur[2]);

    if(it.judged){it.y+=dt*0.16}

}
function decTally(){const t=S.tally;['ok','miss','fa'].forEach(k=>{const e=$('t'+k);if(e)e.textContent=t[k]})}
function decDraw(){
  const {ctx,w,h}=DEC; if(!ctx)return;
  ctx.clearRect(0,0,w,h);ctx.fillStyle='#F6EEE2';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#8A6D46';ctx.fillRect(0,44,w,8);

  ctx.fillStyle='#DFF5EA';ctx.beginPath();ctx.roundRect(w/2-150,by,116,40,8);ctx.fill();ctx.strokeStyle='#2E9E5B';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#EDE3D2';ctx.beginPath();ctx.roundRect(w/2+34,by,116,40,8);ctx.fill();ctx.strokeStyle='#8A7A68';ctx.stroke();
  if(DEC.th)ctx.drawImage(DEC.th,w/2-146,by+6,28,28);
  ctx.fillStyle='#2E9E5B';ctx.font='800 12px Nunito, sans-serif';ctx.textAlign='left';ctx.fillText('моё '+DEC.bins.yes.length,w/2-112,by+25);
  ctx.fillStyle='#8A7A68';ctx.fillText('чужое '+DEC.bins.no.length,w/2+44,by+25);
  // содержимое корзин: неверные — рыжей рамкой
  const dr=(list,x0)=>list.slice(-7).forEach((it,k)=>{if(!it.img){it.img=document.createElement('canvas');drawVec(it.img,it.v,40)}ctx.drawImage(it.img,x0+k*15,by-18,16,16);if(it.pass!==!!it.truth){ctx.strokeStyle='#E65C00';ctx.lineWidth=2;ctx.strokeRect(x0+k*15,by-18,16,16)}});
  dr(DEC.bins.yes,w/2-150);dr(DEC.bins.no,w/2+34);
  // решатель
  ctx.fillStyle='#F2E4CC';ctx.strokeStyle='#3A2A18';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(w/2-24,8,48,44,10);ctx.fill();ctx.stroke();
  if(CH.icons&&CH.icons.decider)ctx.drawImage(CH.icons.decider,w/2-13,12,26,26);
  ctx.fillStyle='#2B2118';ctx.font='800 11px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText('черта',w/2,48);
  DEC.items.forEach(it=>{
    if(!it.img){it.img=document.createElement('canvas');drawVec(it.img,it.v,40)}
    let x=it.x-14,y=16;
    if(it.judged){const f=Math.min(1,it.y/70);x=w/2-14+(it.pass?-92:92)*f;y=16+(by-34-16)*f}

}

}
function handBind(){
  const cv=$('hgcv'); if(!cv)return;

  cv.onpointermove=e=>{if(!HG.down)return;e.preventDefault();let pts=[e];if(e.getCoalescedEvents){const c=e.getCoalescedEvents();if(c&&c.length)pts=c}pts.forEach(p=>HG.pts.push(pos(p)));hgDraw()};

    else{ctx.fillStyle='#FFF8EE';ctx.fillRect(0,0,FW,FH);ctx.textAlign='center';ctx.fillStyle='#2B2118';ctx.font='800 32px Unbounded, sans-serif';ctx.fillText('Считает машина.',FW/2,FH*0.34);ctx.fillStyle='#E65C00';ctx.fillText('Решает — '+(S.child||'человек')+'.',FW/2,FH*0.48);
      ctx.fillStyle='#8A7A68';ctx.font='700 19px Nunito, sans-serif';ctx.fillText('Придумал профессию, собрал цепь и решал — '+(S.child||'ты'),FW/2,FH*0.63);ctx.fillText('Считал, штамповал и крутил конвейер — Нейро',FW/2,FH*0.69);
      ctx.fillStyle='#C4B4A2';ctx.font='700 16px Nunito, sans-serif';ctx.fillText('Мастерская Nooka · nookagame.ru',FW/2,FH*0.87)}
    const b=$('fbar');if(b)b.style.width=Math.round(t/(total+3200)*100)+'%';
    if(t>=total+3200){FILM.on=0;RUN.items=saveItems;RUN.seated=saveSeated;RUN.waiting=saveWait;RUN.phase='fin';
      const fin=blob=>{if(blob&&blob.size)filmDeliver(blob).then(how=>{if(st)st.textContent=how==='share'?'Отправил — выбери «Сохранить видео».':how==='download'?'Ролик скачан.':'Сохранить не вышло.';runFinish()});else{if(st)st.textContent='';runFinish()}};
      if(rec&&rec.state!=='inactive'){rec.onstop=()=>fin(new Blob(chunks,{type:filmMime()}));rec.stop()}else fin(null);return}
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
}
async function filmDeliver(blob){
  const ext=(blob.type||'').indexOf('mp4')>=0?'mp4':'webm',fname=((S.title||'moy-ceh').replace(/[^\wа-яА-ЯёЁ -]/g,'').trim()||'ceh')+'.'+ext;
  try{if(navigator.canShare&&window.File){const f=new File([blob],fname,{type:blob.type||'video/mp4'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:S.title});return 'share'}}}catch(e){}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},2000);return 'download'}catch(e){return 'fail'}
}

/* ═══ НАПАРНИК: рождение робота из деталей и три правила ═══ */
const BOTNAMES=['Тыр-Тыр','Бип','Кубик','Зум','Пиксель','Шурум','Тик','Болт','Искра','Чип','Гайка','Луч'];
function botMood(){return S.thr<0.45?'добрый':S.thr>0.72?'строгий':'спокойный'}
function botName(){return S.botName||'напарник'}
/* робот собран из того, что сделал ребёнок: глаз — его рисунок, грудь — полки, живот — черта, рука — инструмент, слева — стул человека */

   <rect x="16" y="150" width="8" height="34" rx="4" fill="#C9A26E" ${ln}/><rect x="14" y="178" width="62" height="12" rx="6" fill="#C9A26E" ${ln}/><rect x="22" y="190" width="8" height="30" fill="#8A6D46"/><rect x="60" y="190" width="8" height="30" fill="#8A6D46"/>
   ${kid}
   <path d="M222 190 L262 226" stroke="${K}" stroke-width="30" stroke-linecap="round"/><path d="M222 190 L262 226" stroke="#F2E4CC" stroke-width="22" stroke-linecap="round"/>
   <rect x="80" y="152" width="140" height="140" rx="26" fill="#F2E4CC" ${ln}/>

   <rect x="108" y="176" width="84" height="13" rx="4" fill="#DFF5EA" stroke="${K}" stroke-width="2"/><rect x="108" y="195" width="84" height="13" rx="4" fill="#EDE3D2" stroke="${K}" stroke-width="2"/>
   <text x="150" y="186.5" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="9.5" fill="${K}">моё ${S.mem.pos.length}</text><text x="150" y="205.5" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="9.5" fill="${K}">чужое ${S.mem.neg.length}</text>
   <circle cx="150" cy="254" r="25" fill="#F6EEE2" ${ln}/><g transform="rotate(${a.toFixed(1)} 150 254)"><path d="M150 254 v-18" stroke="#E65C00" stroke-width="4" stroke-linecap="round"/></g><circle cx="150" cy="254" r="4" fill="${K}"/>
   <line x1="150" y1="44" x2="150" y2="66" stroke="${K}" stroke-width="4"/><circle cx="150" cy="40" r="7" fill="#E65C00" ${ln}/>
   <rect x="94" y="66" width="112" height="86" rx="24" fill="#F2E4CC" ${ln}/>
   <circle cx="150" cy="110" r="30" fill="#FFF8EE" ${ln}/><g clip-path="url(#${cid})">${eye}</g>
   <path d="M136 141 q14 8 28 0" stroke="${K}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
   <circle cx="268" cy="232" r="22" fill="#fff" ${ln}/><g transform="translate(252 216) scale(.8)">${tool}</g>
  </svg>`;
}
function sayBot(t){return `<div class="say"><div class="say-av">${svgBot({nokid:1,id:'a',attrs:'width="50" height="56"'})}</div><div class="say-b">${t}</div></div>`}
/* ── рождение: детали слетаются в робота, он говорит первые слова из выборов ребёнка ── */

function botSpeak(){

/* ── три правила: робот спрашивает «зачем», ответы ребёнка становятся его правилами ── */
const RQ=[
 {q:'Приехало то, чего я никогда не видел. Что мне делать?',opts:['Остановись и спроси меня','Отложи в сторону — разберём вместе','Штампуй по черте, как умеешь']},

 {q:'Что важнее: быстро или точно?',opts:['Точно. Пусть медленно','Быстро, но спорное — мне','Быстро. Ошибки поправим']},

const RULE={i:0,pick:''};

  $('htitle').textContent='Три правила';
  if(!S.rules)S.rules=[];

  const q=RQ[RULE.i];RULE.pick='';
  B().innerHTML=sayBot((RULE.i===0?'Смена кончилась. У меня остались вопросы — без тебя на них не ответить.\n':'')+q.q)
    +`<div class="pz"><div class="rowlbl" style="margin-top:0">Правило ${RULE.i+1} из 3</div>
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" onclick="rulePick(this,${k})">${o}</button>`).join('')}</div>
      <input class="field" id="ruleown" maxlength="60" placeholder="Или своими словами" oninput="ruleOwn(this.value)" autocomplete="off"></div>

  F().innerHTML=`<button class="btn" id="ruleBtn" onclick="ruleSave()" disabled>Так и запиши</button>`;

function rulePick(el,k){[...document.querySelectorAll('.opt')].forEach(o=>o.classList.remove('on'));el.classList.add('on');RULE.pick=RQ[RULE.i].opts[k];const f=$('ruleown');if(f)f.value='';const b=$('ruleBtn');if(b)b.disabled=false}

function rulesHTML(){return (S.rules&&S.rules.length)?`<div class="rowlbl">Правила для напарника${S.botName?' · '+S.botName:''}</div>${S.rules.map((r,i)=>`<div class="rulerow"><span class="rulen">${i+1}</span><span>${r}</span></div>`).join('')}`:''}
function renderRulesDone(){
  B().innerHTML=sayBot('Запомнил. Теперь у меня есть то, чего не было: зачем.')
    +`<div class="pz">${rulesHTML()}<button class="txtbtn" onclick="S.rules=[];save();renderRules()">Переписать</button></div>
    <div class="note">Ты написал правила для ИИ. Это и есть профессия будущего.</div>`;

  ctx.textAlign='left';ctx.fillStyle='#8A7A68';ctx.font='800 22px Nunito, sans-serif';ctx.fillText('ПАСПОРТ ПРОФЕССИИ БУДУЩЕГО · МАСТЕРСКАЯ NOOKA',60,70);
  ctx.fillStyle='#2B2118';ctx.font='800 54px Unbounded, sans-serif';
  wrapLines(ctx,S.title||'Профессия будущего',W-430).slice(0,2).forEach((l,i)=>ctx.fillText(l,60,146+i*62));
  ctx.fillStyle='#5C4A38';ctx.font='700 30px Nunito, sans-serif';ctx.fillText((S.name||'')+' · '+(S.child||'')+(S.age?', '+S.age+' лет':''),60,290);
  try{const im=await rasterize(personScene({vb:'36 58 228 311'}),330,450);ctx.drawImage(im,W-390,60,330,450)}catch(e){}
  ctx.fillStyle='#8A7A68';ctx.font='800 20px Nunito, sans-serif';ctx.fillText('С ЧЕМ РАБОТАЕТ',60,370);
  const th=document.createElement('canvas');drawVec(th,S.thing,200);ctx.drawImage(th,60,386,200,200);ctx.strokeStyle='#2B2118';ctx.lineWidth=3;ctx.strokeRect(60,386,200,200);
  ctx.fillStyle='#2B2118';ctx.font='800 34px Nunito, sans-serif';ctx.fillText(cap(S.thingName||''),290,430);
  ctx.fillStyle='#8A7A68';ctx.font='700 22px Nunito, sans-serif';const f=pixFeats(Array.from(S.thing));
  ['глаз видит: '+f.cnt+' единиц из 100','память: '+(S.mem.pos.length+S.mem.neg.length)+' примеров, ответы — '+(S.child||'мои'),'черта решателя: '+thrWord()+' · роль: '+(ROLE[S.human]||'—'),'рука: '+(S.actionPhrase||S.gest.n)+' · темп: '+(S.beatKind||'—'),'мир смены: '+WORLDS[worldOf()].n+' (выбрал костюм)'].forEach((l,i)=>ctx.fillText(l,290,470+i*34));
  ctx.fillStyle='#8A7A68';ctx.font='800 20px Nunito, sans-serif';ctx.fillText('ЦЕПЬ',60,660);
  const xs=[0,1,2,3].map(i=>110+i*270);ctx.fillStyle='#8A6D46';ctx.fillRect(100,740,W-200,10);
  for(const [i,id] of CHAIN_IDS.entries()){const x=xs[i],me=S.human===id;
    ctx.fillStyle=me?'#DFF5EA':'#F2E4CC';ctx.strokeStyle=me?'#2E9E5B':'#3A2A18';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(x-70,690,200,110,18);ctx.fill();ctx.stroke();
    try{const im=await rasterize(toolGlyph(id,40),80,80);ctx.drawImage(im,x-50,705,60,60)}catch(e){}
    ctx.fillStyle='#2B2118';ctx.font='800 24px Nunito, sans-serif';ctx.fillText(NODEN[id],x+20,740);
    ctx.fillStyle='#E65C00';ctx.font='800 18px Unbounded, sans-serif';ctx.fillText(String(i+1),x-62,678);
    ctx.fillStyle=me?'#2E9E5B':'#8A7A68';ctx.font='700 19px Nunito, sans-serif';ctx.fillText(me?'здесь — '+(S.child||'человек'):'машина',x+20,772)}
  ctx.fillStyle='#2B2118';ctx.font='700 25px Nunito, sans-serif';let yy=850;
  wrapLines(ctx,chainLine(),W-120).forEach(l=>{ctx.fillText(l,60,yy);yy+=34});
  if(S.mine){ctx.fillStyle='#8A7A68';ctx.font='800 18px Nunito, sans-serif';ctx.fillText('ЧТО ДЕЛАЮ Я, ЧЕГО МАШИНА НЕ УМЕЕТ',60,yy+22);ctx.fillStyle='#2B2118';ctx.font='800 28px Nunito, sans-serif';wrapLines(ctx,S.mine,W-120).slice(0,2).forEach((l,i)=>ctx.fillText(l,60,yy+62+i*36));yy+=100}
  if(S.line){ctx.fillStyle='#E65C00';ctx.font='800 28px Nunito, sans-serif';ctx.fillText('«'+S.line+'»',60,yy+40);yy+=60}
  if(S.shiftErr){ctx.fillStyle='#8A7A68';ctx.font='700 20px Nunito, sans-serif';ctx.fillText('смена: ошибок без тебя '+S.shiftErr.no+', с тобой '+S.shiftErr.yes,60,yy+24);yy+=36}

    S.rules.forEach((r,i)=>{ctx.fillStyle='#E65C00';ctx.beginPath();ctx.arc(76,yy-9,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 17px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText(String(i+1),76,yy-3);ctx.textAlign='left';ctx.fillStyle='#2B2118';ctx.font='700 26px Nunito, sans-serif';const ls=wrapLines(ctx,r,600).slice(0,2);ls.forEach((l,j)=>ctx.fillText(l,104,yy+j*30));yy+=40+(ls.length>1?30:0)});
    try{const bim=await rasterize(svgBot({id:'p'}),240,272);ctx.drawImage(bim,W-320,y0-50,240,272)}catch(e){}}
  ctx.fillStyle='#2B2118';ctx.font='800 38px Unbounded, sans-serif';ctx.textAlign='center';ctx.fillText('Считает машина. Решает — '+(S.child||'человек')+'.',W/2,1372);

function renderPass(){

/* ═══════════════ НАВИГАЦИЯ И СТАРТ ═══════════════ */
$('back').onclick=()=>{
  stopChain();stopFilm();stopRun();if(CUR)stopLevel(CUR);

if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
if(load()){S.step='intro';render();const f=$('fn');if(f){f.value=S.child}
  F().innerHTML=`<div class="btnrow"><button class="btn btn2 btn-sm" onclick="wipe();location.reload()">Заново</button><button class="btn btn-sm" onclick="go('floor')">Продолжить смену</button></div>`}
else render();
