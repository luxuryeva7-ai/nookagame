<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FDF7EC">
<title>Мастерская — Nooka</title>
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{--ink:#181228;--ink2:#5B5470;--ink3:#8A82A0;--purple:#7B2FFF;--sun:#FFC53D;--bg:#FDF7EC;--line:#E9E1F5;--ok:#12A47A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.hdr{padding:16px 24px;display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--line)}
.logo{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:16px;color:var(--purple);text-decoration:none}
.sep{color:var(--line);font-size:18px}
.hdr-title{font-size:14px;font-weight:900;color:var(--ink2)}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 48px}
.hero{text-align:center;margin-bottom:40px}
.hero-emoji{font-size:52px;display:block;margin-bottom:14px}
.hero-title{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:clamp(24px,6vw,34px);line-height:1.2;margin:0 0 12px;letter-spacing:-.5px}
.hero-title em{font-style:normal;color:var(--purple)}
.hero-sub{font-size:16px;color:var(--ink2);margin:0;line-height:1.65;max-width:440px;margin:0 auto}
.projects{display:flex;flex-direction:column;gap:16px;margin-bottom:32px}
.project-card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px 24px;
  display:flex;gap:18px;align-items:flex-start;text-decoration:none;color:inherit;
  transition:border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.project-card:hover{border-color:var(--purple);box-shadow:0 4px 24px rgba(123,47,255,.08)}
.project-card.done{border-color:var(--ok)}
.project-icon{font-size:40px;flex:none;line-height:1}
.project-body{flex:1;min-width:0}
.project-game{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:4px}
.project-name{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:18px;
  line-height:1.25;margin-bottom:6px}
.project-desc{font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
.project-steps{display:flex;gap:4px;margin-bottom:10px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.step-dot.done{background:var(--ok)}
.step-dot.cur{background:var(--purple)}
.project-cta{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px;
  color:var(--purple);transition:gap .15s}
.project-card:hover .project-cta{gap:10px}
.project-card.done .project-cta{color:var(--ok)}
.badge-done{position:absolute;top:16px;right:16px;background:var(--ok);color:#fff;
  font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
.badge-lock{position:absolute;top:16px;right:16px;background:var(--line);color:var(--ink3);
  font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px}
.tip{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 20px;
  display:flex;gap:12px;align-items:flex-start}
.tip-icon{font-size:22px;flex:none}
.tip-text{font-size:14px;color:var(--ink2);line-height:1.5}
.tip-text strong{color:var(--ink)}
</style>
</head>
<body>
<div class="hdr">
  <a class="logo" href="https://nookagame.ru">Nooka</a>
  <span class="sep">/</span>
  <span class="hdr-title">Мастерская проектов</span>
</div>
<div class="wrap">
  <div class="hero">
    <span class="hero-emoji">🛠️</span>
    <h1 class="hero-title">Применяй то, что узнал — <em>создай что‑то своё</em></h1>
    <p class="hero-sub">После каждого блока игр — твой проект. Не тест, не задание. Настоящее исследование.</p>
  </div>
  <div class="projects" id="projectList"></div>
  <div class="tip">
    <span class="tip-icon">💡</span>
    <div class="tip-text"><strong>Совет:</strong> проходи проекты по порядку — каждый строится на знаниях предыдущего блока.</div>
  </div>
</div>
<script>
const PROJECTS = [
  {
    id:'trainer', icon:'🧪', game:'После Игры 1 — Данные',
    name:'Стань тренером ИИ', steps:5,
    desc:'Выбери профессию, придумай задачу для ИИ, собери данные и проверь разметку. В конце получи карточку тренера.',
    href:'trainer.html'
  },
  {
    id:'assistant', icon:'🤖', game:'После Игры 2 — Промпты',
    name:'Создай ИИ‑ассистента', steps:5,
    desc:'Задай имя, характер и правила своему ИИ. Протестируй его на реальных ситуациях и получи паспорт.',
    href:'assistant.html'
  },
  {
    id:'startup', icon:'🚀', game:'После Игры 3 — Устройство',
    name:'Запусти ИИ‑стартап', steps:5,
    desc:'Выбери проблему, спроектируй решение, собери команду и сделай питч своего продукта.',
    href:'startup.html'
  }
];

function getProgress(id){
  try{return JSON.parse(localStorage.getItem('nooka_proj_'+id)||'{"step":0}')}catch(e){return{step:0}}
}

function render(){
  const list = document.getElementById('projectList');
  list.innerHTML = PROJECTS.map((p,i)=>{
    const prog = getProgress(p.id);
    const done = prog.step >= p.steps;
    const started = prog.step > 0 && !done;
    const locked = i > 0 && getProgress(PROJECTS[i-1].id).step < PROJECTS[i-1].steps;

    const dots = Array.from({length:p.steps},(_,j)=>{
      const cls = j < prog.step ? 'done' : j === prog.step ? 'cur' : '';
      return `<div class="step-dot ${cls}"></div>`;
    }).join('');

    const cta = done ? '✓ Готово — посмотреть' : started ? 'Продолжить →' : 'Начать →';
    const badge = done ? `<span class="badge-done">Готово</span>` : locked ? `<span class="badge-lock">🔒 Скоро</span>` : '';

    return `<a class="project-card${done?' done':''}" href="${locked?'#':p.href}">
      <span class="project-icon">${p.icon}</span>
      <div class="project-body">
        <div class="project-game">${p.game}</div>
        <div class="project-name">${p.name}</div>
        <div class="project-desc">${p.desc}</div>
        <div class="project-steps">${dots}</div>
        <span class="project-cta">${cta}</span>
      </div>
      ${badge}
    </a>`;
  }).join('');
}
render();
</script>
</body>
</html>
