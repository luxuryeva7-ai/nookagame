<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF8EE">
<title>Твоя история — Nooka</title>
<link href="../fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#2B2118; --ink2:#5C4A38; --ink3:#8A7A68;
  --acc:#E65C00; --accbg:#FFF1E4; --line:rgba(180,110,40,.16);
  --sh:0 2px 14px rgba(170,100,40,.11);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.root{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* ── шапка ── */
.hdr{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg);z-index:20;position:sticky;top:0}
.hdr-back{width:34px;height:34px;border:none;background:none;cursor:pointer;font-size:20px;color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.hdr-t{flex:1;font-weight:800;font-size:14px;color:var(--ink2);text-align:center}
.hdr-r{width:34px;flex:none;text-align:right;font-size:12px;font-weight:800;color:var(--ink3)}
.prog{flex:none;height:4px;background:rgba(180,110,40,.1);position:sticky;top:52px;z-index:20}
.prog i{display:block;height:4px;background:var(--acc);border-radius:0 2px 2px 0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ── тело ── */
.body{flex:1;padding:0 12px 8px}
.foot{flex:none;position:sticky;bottom:0;z-index:25;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,248,238,0),var(--bg) 38%)}

/* ── сцена ── */
/* кадр как вклеенная иллюстрация: паспарту, тень внутрь, широкое нижнее поле */
.plate{margin-top:8px;background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(120,72,28,.10),0 10px 26px -10px rgba(120,72,28,.20);padding:10px 10px 0}
.scene{width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#F3EADC;position:relative}
.scene::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(120,72,28,.12),inset 0 2px 10px rgba(120,72,28,.10)}
.scene svg{width:100%;height:100%;display:block}
.scene.empty{background:repeating-linear-gradient(45deg,#F6EEE2,#F6EEE2 8px,#F1E6D6 8px,#F1E6D6 16px)}
.seedrow{display:flex;align-items:center;justify-content:space-between;padding:9px 4px 11px;font-size:12px;font-weight:700;color:var(--ink3)}
.reroll{border:none;background:none;color:var(--acc);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;padding:5px 8px;display:flex;align-items:center;gap:5px}
.reroll:active{opacity:.55}
.reroll-note{font-size:10.5px;color:var(--ink3);text-align:right;padding:1px 8px 0;font-weight:600}

/* ── Нейро ── */
.say{display:flex;gap:9px;align-items:flex-start;margin-top:12px;animation:up .32s ease both}
.say-av{flex:none;width:50px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.say-b{flex:1;background:var(--card);border-radius:16px;border-top-left-radius:5px;padding:11px 14px;box-shadow:var(--sh);font-weight:600;font-size:15px;line-height:1.45;color:var(--ink2);white-space:pre-line}
.say-b b{color:var(--acc);font-weight:800}

/* ── карточка промпта ── */
.pcard{margin-top:12px;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:13px 14px;font-family:'Nunito',sans-serif;font-weight:600;font-size:16.5px;line-height:2.05;color:var(--ink)}
.slot{display:inline-flex;align-items:center;gap:4px;background:var(--accbg);border:1.5px solid var(--acc);border-radius:999px;padding:4px 11px;min-height:38px;font-weight:800;font-size:15px;color:var(--acc);cursor:pointer;vertical-align:middle;font-family:inherit}
.slot.todo{border-style:dashed;color:#B8895F;background:#FFF8F0}
.slot.pulse{animation:pulse 1.1s ease 2}
.slot:active{transform:scale(.96)}
.slot em{font-style:normal;font-size:10px;opacity:.75;margin-left:1px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,92,0,0)}50%{box-shadow:0 0 0 7px rgba(230,92,0,.16)}}
.harder{display:block;width:100%;text-align:center;border:none;background:none;color:var(--ink3);font-family:inherit;font-weight:800;font-size:12.5px;padding:9px;cursor:pointer;margin-top:2px}

/* ── кнопки ── */
.btn{width:100%;min-height:54px;border:none;border-radius:27px;font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:16px;cursor:pointer;background:var(--acc);color:#fff;transition:opacity .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.28;pointer-events:none}
.btn2{background:var(--card);color:var(--acc);box-shadow:inset 0 0 0 2px var(--line)}
.btn-sm{min-height:46px;font-size:14.5px;border-radius:23px}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}
.txtbtn{display:block;width:100%;text-align:center;border:none;background:none;color:var(--acc);font-family:inherit;font-weight:800;font-size:14px;padding:11px;cursor:pointer}

/* ── bottom sheet ── */
.ovl{position:fixed;inset:0;background:rgba(43,33,24,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.ovl.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;margin:0 auto;max-width:480px;bottom:0;max-height:66%;background:var(--bg);border-radius:24px 24px 0 0;z-index:41;display:none;flex-direction:column;box-shadow:0 -8px 30px rgba(90,50,10,.18)}
.sheet.on{display:flex;animation:sheetUp .26s cubic-bezier(.3,.9,.4,1) both}
@keyframes sheetUp{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}

.sheet-h{flex:none;padding:9px 16px 11px;text-align:center;position:relative}
.sheet-h::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 11px}
.sheet-t{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:17px;color:var(--ink)}
.sheet-x{position:absolute;right:12px;top:20px;width:32px;height:32px;border:none;background:none;font-size:19px;color:var(--ink3);cursor:pointer}
.sheet-l{flex:1;overflow-y:auto;padding:0 12px calc(16px + env(safe-area-inset-bottom))}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;margin-bottom:7px;border:none;border-radius:15px;background:var(--card);box-shadow:var(--sh);font-family:inherit;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;text-align:left}
.opt:active{transform:scale(.985)}
.opt.on{box-shadow:inset 0 0 0 2px var(--acc);background:var(--accbg)}
.opt.rare{box-shadow:inset 0 0 0 2px #D9A521;background:#FFFAEC}
.opt-ic{flex:none;width:42px;height:42px;border-radius:11px;background:#F7EFE2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.opt-ic svg{width:100%;height:100%}
.opt-n{flex:1}
.opt-tag{font-size:10px;font-weight:900;color:#B8860B;background:#FFF0C4;padding:3px 8px;border-radius:999px}
.opt-ck{color:var(--acc);font-size:17px;font-weight:900}

/* ── генерация ── */
.gen{position:fixed;inset:0;background:rgba(255,248,238,.96);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;gap:16px}
.gen-stage{width:100%;max-width:310px}
.gst{display:flex;align-items:center;gap:11px;padding:9px 0;font-weight:700;font-size:14.5px;color:var(--ink3);opacity:.32;transition:opacity .3s,color .3s}
.gst.on{opacity:1;color:var(--ink)}
.gst.done{opacity:.68;color:var(--ink2)}
.gst-b{flex:none;width:26px;height:26px;border-radius:50%;background:#F0E5D6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--ink3);transition:all .3s}
.gst.on .gst-b{background:var(--accbg);color:var(--acc);animation:spin 1s linear infinite}
.gst.done .gst-b{background:var(--acc);color:#fff;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-toks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:32px;max-width:330px}
.tok{background:var(--accbg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:800;color:var(--acc);animation:tokup .5s ease both}
@keyframes tokup{0%{opacity:0;transform:translateY(9px) scale(.85)}60%{opacity:1;transform:translateY(-4px) scale(1.04)}100%{opacity:1;transform:none}}
.gen-pool{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:300px}
.pdot{aspect-ratio:1;border-radius:4px;background:var(--acc);opacity:.75;transition:opacity .45s,background .45s}
.pdot.off{opacity:.13;background:var(--ink3)}

/* ── сравнение ── */
.cmp{margin-top:10px}
.cmp-i{margin-bottom:14px}
.cmp-i .scene{margin-top:0;aspect-ratio:16/9}
.cmp-cap{font-size:13.5px;font-weight:700;color:var(--ink2);padding:8px 4px 0;line-height:1.4}
.cmp-cap b{color:var(--ink3);font-weight:800;font-size:11px;display:block;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.cmp-ar{text-align:center;font-size:20px;color:var(--acc);padding:2px}

/* ── ввод ── */
.field{width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:15px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:17px;color:var(--ink);margin-top:12px}
.field:focus{outline:none;border-color:var(--acc)}
.field::placeholder{color:#C4B4A2}
.fcount{text-align:right;font-size:11.5px;font-weight:700;color:var(--ink3);padding:5px 6px 0}

/* ── карточки развилок ── */
.forks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.fork{background:var(--card);border:none;border-radius:16px;box-shadow:var(--sh);padding:14px 11px;font-family:inherit;font-weight:700;font-size:13.5px;line-height:1.35;color:var(--ink);cursor:pointer;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.fork:active{transform:scale(.96)}
.fork.on{box-shadow:inset 0 0 0 2px var(--acc);background:var(--accbg)}
.fork-ic{font-size:26px;line-height:1}

/* ── книжка ── */
.bookwrap{margin-top:8px}
.pages{display:flex;align-items:stretch;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:6px;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;scroll-snap-align:center;background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.page .scene{flex:none;aspect-ratio:3/2;margin:0;border-radius:0;box-shadow:none}
.page-txt{flex:none;padding:15px 16px 17px;font-size:16px;line-height:1.55;color:var(--ink2);font-weight:500}
.dots{display:flex;gap:6px;justify-content:center;padding:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .25s}
.dot.on{background:var(--acc);width:19px;border-radius:4px}

/* обложка */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,#FFF3E2,#FFE9D2);border-radius:20px;overflow:hidden}
.cover .scene{margin:0;border-radius:0;box-shadow:none;aspect-ratio:1/1}
.cover-b{padding:17px 18px 20px;text-align:center}
.cover-t{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:23px;line-height:1.22;color:var(--ink);margin-bottom:9px;word-break:break-word}
.cover-a{font-size:13px;font-weight:700;color:var(--ink3)}

/* финальная страница */
.lastp{flex:1;background:var(--card);border-radius:20px;padding:22px 18px;text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.uniq{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:17px;color:var(--acc);line-height:1.35}
.uniq-f{font-size:11px;color:var(--ink3);font-weight:600;line-height:1.5}
.forwho{font-size:16px;font-weight:800;color:var(--ink)}
.honest{font-size:11px;color:var(--ink3);font-weight:600;line-height:1.5;border-top:1px solid var(--line);padding-top:13px}

/* разворот «как придумал» */
.howp{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--card);border-radius:20px;padding:20px 17px}
.howp-h{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:center;margin-bottom:15px}
.pquote{background:var(--accbg);border-radius:13px;padding:12px 14px;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.45}
.pquote small{display:block;font-size:10.5px;font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.pdown{text-align:center;font-size:22px;color:var(--acc);padding:9px}

/* ── разбор на слои ── */
.rev-l{display:flex;align-items:center;gap:11px;padding:9px 13px;background:var(--card);border-radius:13px;box-shadow:var(--sh);margin-bottom:7px;animation:up .35s ease both}
.rev-l b{flex:1;font-size:14px;font-weight:800;color:var(--ink)}
.rev-l span{font-size:12px;font-weight:700;color:var(--ink3)}
.rev-n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}

/* ── прочее ── */
.memwrap{margin-top:10px;background:var(--card);border-radius:20px;box-shadow:var(--sh);
 padding:10px;display:flex;flex-direction:column;align-items:center;gap:9px}
.memwrap canvas{border-radius:14px;touch-action:none;display:block;background:#F3EADC;cursor:pointer}
.memsay{font-size:12.5px;font-weight:800;color:var(--ink3);min-height:17px;text-align:center}
.paws{display:flex;gap:7px}
.paw{width:64px;height:34px;border-radius:11px;border:2px dashed var(--line);
 display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;
 color:var(--ink3);background:#FFFAF3;padding:0 4px;text-align:center;line-height:1.1}
.paw.full{border-style:solid;border-color:var(--acc);background:var(--accbg);color:var(--acc)}
/* ── стол ── */
.table{position:relative;margin-top:10px;border-radius:20px;overflow:hidden;
 background:linear-gradient(160deg,#C9A97E,#B08F62 55%,#9E7E52);
 box-shadow:inset 0 0 0 2px rgba(90,60,25,.25), 0 6px 22px -8px rgba(90,60,25,.5);
 padding:12px 12px 20px;min-height:760px}
.table::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;
 background:repeating-linear-gradient(96deg,transparent 0 6px,rgba(90,55,20,.5) 6px 7px)}
.lampglow{position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse 300px 340px at 220px 90px,rgba(255,217,168,.55),transparent 70%)}
.tbl-head{position:relative;display:flex;align-items:center;gap:10px;z-index:6;min-height:66px}
.tbl-neuro{flex:none}
.tbl-title{flex:1;font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:15px;
 color:#3A2A14;transform:rotate(-3deg);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.tbl-title span{display:block;font-family:'Nunito';font-weight:700;font-size:11px;
 color:#6B5030;transform:rotate(1deg);margin-top:2px}
.lamp{position:absolute;top:-2px;font-size:26px;cursor:grab;touch-action:none;z-index:6;
 filter:drop-shadow(0 3px 5px rgba(60,40,10,.45))}
/* рельса времени */
.rail{position:relative;height:56px;margin:8px 0 4px;touch-action:none;z-index:6}
.rail-arc{position:absolute;left:6px;right:6px;top:26px;height:3px;border-radius:2px;
 background:linear-gradient(90deg,#8C6A3A,#D8B57A,#8C6A3A);box-shadow:0 1px 0 rgba(255,255,255,.25)}
.rail-cart{position:absolute;font-size:24px;transform:translate(-50%,-50%);top:20px;left:50%;
 filter:drop-shadow(0 2px 4px rgba(60,40,10,.4));pointer-events:none}
.rail-lbl{position:absolute;right:8px;bottom:0;font-size:11px;font-weight:900;color:#4A3418;
 background:rgba(255,248,238,.75);padding:2px 8px;border-radius:999px}
/* планка кадров */
.filmwrap{position:relative;z-index:6;margin:8px 0 12px;background:#6E5233;
 border-radius:12px;padding:8px 9px 9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.film-t{font-size:10.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;
 color:rgba(255,248,238,.8);margin-bottom:6px}
.strip5{display:flex;gap:6px;position:relative;z-index:6}
.sl{flex:1;aspect-ratio:3/2;border-radius:7px;overflow:hidden;background:#8A6D46;
 box-shadow:inset 0 0 0 1.5px rgba(40,26,10,.35);position:relative}
.sl::after{content:attr(data-i);position:absolute;left:4px;top:2px;font-size:9.5px;font-weight:900;
 color:rgba(255,248,238,.6)}
.sl.on::after{color:rgba(255,248,238,.85);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.sl.on{background:none}
.sl svg{width:100%;height:100%;display:block}
/* станции-входы */
.stations{display:flex;flex-direction:column;gap:10px;position:relative;z-index:6}
.st{position:relative;z-index:6;border:none;border-radius:16px;cursor:pointer;font-family:inherit;text-align:left;
 padding:11px 14px 11px 62px;display:flex;flex-direction:column;gap:1px;min-height:0;
 background:linear-gradient(165deg,#FFF8EE,#F2E4CC);
 box-shadow:0 1px 0 rgba(43,33,24,.28), 0 10px 18px -8px rgba(43,33,24,.4);
 animation:float 4.2s ease-in-out infinite}
.st:nth-child(2){animation-duration:5.1s;animation-delay:.4s}
.st:nth-child(3){animation-duration:3.7s;animation-delay:.9s}
.st:nth-child(4){animation-duration:4.8s;animation-delay:.2s}
.st:active{transform:scale(.985)}
.st.done{filter:saturate(.45) brightness(.96);animation:none}
.st-e{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:30px;line-height:1}
.st-n{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:15px;color:#2B2118}
.st-s{font-size:12.5px;font-weight:700;color:#8A7A68}
.st-h{position:absolute;right:13px;top:11px;font-size:10.5px;font-weight:800;color:var(--acc);
 background:var(--accbg);padding:3px 9px;border-radius:999px}
.st.done .st-h{background:#DFF5EA;color:#2E9E5B}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
/* мелочь на столе */
.clutter{position:absolute;inset:0;pointer-events:none;z-index:3}
.cl{position:absolute;cursor:grab;touch-action:none;pointer-events:auto;
 text-shadow:0 3px 5px rgba(43,33,24,.32);transition:transform .12s;user-select:none}
.junk{position:absolute;inset:0;pointer-events:none;z-index:4}
.jk{position:absolute;font-size:17px;opacity:0;animation:fall .5s ease forwards}
@keyframes fall{0%{opacity:0;transform:translateY(-24px) rotate(0)}
 70%{opacity:1;transform:translateY(4px) rotate(12deg)}100%{opacity:.9;transform:translateY(0) rotate(8deg)}}
.hintbar{text-align:center;font-size:13px;font-weight:800;color:var(--ink3);padding:14px}
/* пазлы */
/* рука-подсказка */
/* чек-лист «что нужно собрать» */
.need{background:rgba(255,248,238,.96);border-radius:14px;padding:10px 11px 11px;margin-bottom:10px;
 position:relative;z-index:6;box-shadow:0 2px 8px rgba(90,60,25,.2)}
.need-t{font-size:11.5px;font-weight:800;color:var(--ink3);margin-bottom:8px;text-align:center}
.need-t b{color:var(--acc)}
.need-r{display:flex;flex-wrap:wrap;gap:5px}
.nd{flex:1 1 30%;min-width:96px;display:grid;grid-template-columns:auto 1fr;gap:1px 6px;
 background:#F2E8D8;border-radius:10px;padding:6px 8px;opacity:.55;align-items:center}
.nd.has{opacity:1;background:#DFF5EA}
.nd-e{font-size:15px;line-height:1;grid-row:span 2}
.nd-n{font-size:10.5px;font-weight:800;color:var(--ink2);line-height:1.15}
.nd-v{font-size:10px;font-weight:800;color:var(--acc);line-height:1.2;
 overflow-wrap:break-word;hyphens:none}
.nd:not(.has) .nd-v{color:var(--ink3)}

/* детерминированный PRNG — одно зерно даёт одну и ту же картинку */
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function pick(r,arr){return arr[Math.floor(r()*arr.length)]}
function rint(r,a,b){return a+Math.floor(r()*(b-a+1))}

   feath:`<g transform="translate(${x} ${y}) rotate(${rint(r,-24,24)})"><path d="M0 14 q-8 -12 0 -26 q8 14 0 26z" fill="#E8EDF5" stroke="#9AA6BA" stroke-width="1.2"/><line y1="14" y2="-10" stroke="#9AA6BA" stroke-width="1.2"/></g>`,

/* ── SVG: лицо на объекте фона (шутка «испуганная луна») ── */
function svgFace(x,y,s,mood){
  const M=MOODS.find(m=>m.id===mood)||MOODS[1];
  const w=M.eye==='wide'?4.2:3;
  let o=`<g transform="translate(${x} ${y}) scale(${s})">`;
  o+=`<circle cx="-7" cy="0" r="${w+1.6}" fill="#fff"/><circle cx="7" cy="0" r="${w+1.6}" fill="#fff"/>`;
  o+=`<circle cx="-7" cy="0" r="${w-1}" fill="#22201E"/><circle cx="7" cy="0" r="${w-1}" fill="#22201E"/>`;
  if(M.mouth==='o')o+=`<ellipse cy="10" rx="4" ry="5.4" fill="#5A3428"/>`;
  else if(M.mouth==='frown')o+=`<path d="M-6 12 q6 -6 12 0" stroke="#22201E" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  else o+=`<path d="M-6 9 q6 6 12 0" stroke="#22201E" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  if(M.eye==='wide')o+=`<path d="M-13 -8 q6 -4 12 -1 M13 -8 q-6 -4 -12 -1" stroke="#22201E" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  return o+'</g>';
}

/* ── SVG: фон ── */
/* смешение цветов — чтобы закрытые миры реагировали на время суток */
function mixHex(a,b,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  const c=v=>Math.round(v).toString(16).padStart(2,'0');
  return '#'+c(r1+(r2-r1)*t)+c(g1+(g2-g1)*t)+c(b1+(b2-b1)*t);
}
function svgBG(place,time,seed,living,mood){
  const r=rng(seed*31+5);const T=time||TIMES[1];const K=place?place.kind:'forest';

  if(T.star)for(let i=0;i<26;i++)o+=`<circle cx="${rint(r,0,300)}" cy="${rint(r,0,110)}" r="${(r()*1.3+.5).toFixed(1)}" fill="#fff" opacity="${(r()*.6+.35).toFixed(2)}"/>`;

  const faces=[];  // куда сажать лица, если living
  if(K==='forest'){
    if(T.star){o+=`<circle cx="238" cy="42" r="21" fill="#FFF3C4"/>`;faces.push([238,42,1]);}
    else {o+=`<circle cx="242" cy="38" r="18" fill="#FFEFA8" opacity=".85"/>`;}
    /* ели: узкий ствол + три яруса лап, сужающихся кверху */
    for(let i=0;i<8;i++){const x=rint(r,-6,300),h=rint(r,76,138),w=rint(r,20,30);
      const op=(.52+i*.055).toFixed(2), top=200-h;
      o+=`<rect x="${x-3.5}" y="${top+14}" width="7" height="${h-14}" fill="#4A3826" opacity="${op}"/>`;
      for(let t=0;t<3;t++){const ty=top+t*(h*.27), tw=w*(1-t*0.22);
        o+=`<path d="M${x} ${ty} l${tw} ${h*.34} h-${tw*2}z" fill="${t%2?'#3E5A3A':'#4A6B42'}" opacity="${op}"/>`;}
      if(i===2)faces.push([x,top+h*.42,.8]);}
    o+=`<rect y="168" width="300" height="32" fill="#5A4A34"/>`;
    o+=`<ellipse cx="52" cy="176" rx="26" ry="11" fill="#6B6459"/>`;faces.push([52,174,.8]);
  }
  if(K==='libr'){
    o+=`<rect width="300" height="200" fill="${mixHex('#4A3826',T.amb,.24)}"/>`;
    for(let s=0;s<4;s++){o+=`<rect y="${18+s*44}" width="300" height="7" fill="#33251A"/>`;
      for(let b=0;b<19;b++){const bh=rint(r,20,34);o+=`<rect x="${4+b*16}" y="${25+s*44-bh+34}" width="${rint(r,7,13)}" height="${bh}" fill="${['#8C4A3A','#6B7A4A','#4A6B7A','#7A6B4A','#5A4A6B'][rint(r,0,4)]}" opacity=".9"/>`;}}
    faces.push([60,60,.9]);faces.push([220,148,.9]);
  }
  if(K==='roofs'){
    if(T.star){o+=`<circle cx="252" cy="34" r="17" fill="#FFF3C4"/>`;faces.push([252,34,.9]);}
    for(let i=0;i<9;i++){const x=i*36-8,h=rint(r,48,110);
      o+=`<rect x="${x}" y="${200-h}" width="34" height="${h}" fill="#39415A" opacity="${(.6+i*.04).toFixed(2)}"/>`;
      for(let w=0;w<4;w++)if(r()>.45)o+=`<rect x="${x+5+(w%2)*15}" y="${208-h+Math.floor(w/2)*20}" width="9" height="11" fill="#FFD98C" opacity=".82"/>`;
      if(i===3)faces.push([x+17,200-h+26,.8]);}
  }
  if(K==='sea'){
    o+=`<rect width="300" height="200" fill="${mixHex('#1E5A78',T.amb,.24)}"/>`;
    for(let i=0;i<16;i++)o+=`<circle cx="${rint(r,0,300)}" cy="${rint(r,0,180)}" r="${rint(r,2,6)}" fill="#8FD4E8" opacity=".3"/>`;
    for(let i=0;i<6;i++){const x=rint(r,0,300);o+=`<path d="M${x} 200 q${rint(r,-16,16)} -50 ${rint(r,-8,8)} -86" stroke="#3E8C6A" stroke-width="${rint(r,5,10)}" fill="none" stroke-linecap="round" opacity=".8"/>`;}
    o+=`<ellipse cx="150" cy="196" rx="180" ry="18" fill="#C4A87A"/>`;
    o+=`<path d="M226 150 q14 -12 26 0 q-6 16 -26 0z" fill="#E8A03C"/>`;faces.push([238,150,.7]);
  }
  if(K==='space'){
    o+=`<rect width="300" height="200" fill="${mixHex('#0E1330',T.amb,.24)}"/>`;
    for(let i=0;i<52;i++)o+=`<circle cx="${rint(r,0,300)}" cy="${rint(r,0,200)}" r="${(r()*1.2+.4).toFixed(1)}" fill="#fff" opacity="${(r()*.7+.3).toFixed(2)}"/>`;
    o+=`<circle cx="252" cy="48" r="30" fill="#5C7BC4" opacity=".9"/><ellipse cx="252" cy="48" rx="46" ry="9" fill="none" stroke="#9AAFE0" stroke-width="3" opacity=".65"/>`;
    faces.push([252,48,1]);
    o+=`<rect y="150" width="300" height="50" fill="#2A3050"/>`;
    for(let i=0;i<5;i++)o+=`<circle cx="${28+i*62}" cy="172" r="15" fill="#0E1330" stroke="#5A6890" stroke-width="3"/>`;
    faces.push([90,172,.65]);
  }
  if(K==='snow'){
    o+=`<path d="M0 200 l70 -104 l52 66 l46 -52 l132 90z" fill="#E8EEF5"/>`;
    o+=`<path d="M0 200 l70 -104 l30 40z" fill="#CDD8E5"/>`;
    for(let i=0;i<34;i++)o+=`<circle cx="${rint(r,0,300)}" cy="${rint(r,0,190)}" r="${(r()*1.8+.8).toFixed(1)}" fill="#fff" opacity=".85"/>`;

    for(let i=0;i<4;i++){const x=30+i*72,h=rint(r,46,86);
      o+=`<rect x="${x}" y="${172-h}" width="19" height="${h}" fill="#B8A582"/><rect x="${x-4}" y="${168-h}" width="27" height="8" fill="#A8946E"/>`;
      if(i===1)faces.push([x+10,180-h,.75]);}
    o+=`<circle cx="248" cy="40" r="22" fill="${T.star?'#FFF3C4':'#FFE08C'}"/>`;faces.push([248,40,.9]);
  }
  if(K==='metro'){
    o+=`<rect width="300" height="200" fill="${mixHex('#2A2A33',T.amb,.24)}"/>`;
    o+=`<path d="M150 96 m-96 104 q0 -104 96 -104 q96 0 96 104z" fill="#3A3A47"/>`;
    for(let i=0;i<5;i++)o+=`<circle cx="${34+i*58}" cy="${52+Math.abs(i-2)*10}" r="6" fill="#FFE08C" opacity=".9"/>`;
    o+=`<rect y="176" width="300" height="24" fill="#22222A"/>`;
    o+=`<rect y="180" width="300" height="4" fill="#5A5A6A"/><rect y="192" width="300" height="4" fill="#5A5A6A"/>`;
    faces.push([92,62,.7]);faces.push([208,62,.7]);
  }

  // затемнение по времени
  if(T.dark>0)o+=`<rect width="300" height="200" fill="#0A1030" opacity="${T.dark}"/>`;
  if(place&&place.kind==='forest'&&time&&time.id==='fog')o+=`<rect width="300" height="200" fill="#E4E2DC" opacity=".34"/>`;

  // ЛИЦА — шутка «весь мир чувствует то же»
  if(living&&mood)faces.slice(0,3).forEach(f=>{o+=svgFace(f[0],f[1],f[2],mood)});
  return o;
}

/* ── СЦЕНА ── */
function scene(st,opt){
  opt=opt||{};
  const CMP=opt.compose||null;   // ребёнок сам поставил героя и предмет
  if(opt.forceState){/* рисуем переданное состояние как есть */}
  const seed=opt.seed!==undefined?opt.seed:st.seed;
  const ang=opt.angle||(st.angle?st.angle.id:'full');
  const vb=ang==='cover'?'36 22 128 128':ang==='close'?'52 26 196 147':ang==='far'?'-40 -14 380 250':'0 0 300 200';
  const stl=st.style;
  let inner='';
  inner+=svgBG(st.place,st.time,seed,st.living,st.mood?st.mood.id:null);
  if(st.hero){
    const hx=CMP?(CMP.hx-50)*3:0, hy=CMP?(CMP.hy-64)*2:0, hs=CMP?CMP.hs:1;
    inner+=`<g transform="translate(${hx} ${hy}) translate(100 130) scale(${hs}) translate(-100 -130)">`
      +svgHero(st.hero,st.mood?st.mood.id:'brave',seed,stl,st.acc)+`</g>`;
    // последствие выбранного поворота сюжета видно прямо в кадре
    const fk=opt.fork;
    if(st.prop&&fk!=='stolen'){
      const fade=fk==='fade'?' opacity=".38"':'';
      const px=CMP?(CMP.px-50)*3:0, py=CMP?(CMP.py-78)*2:0;
      inner+=`<g${fade} transform="translate(${px} ${py})">`+svgProp(st.prop,seed)+`</g>`;
      if(fk==='alive')inner+=svgFace(100,163,.42,'amazed');
      if(fk==='door')inner+=`<rect x="236" y="120" width="34" height="56" rx="4" fill="#3A2A18" opacity=".85"/><circle cx="262" cy="150" r="2.6" fill="#F2C337"/>`;
    }
    if(st.prop&&fk==='stolen')inner+=`<path d="M262 176 q-6 -22 4 -34 q8 10 6 34z" fill="rgba(30,20,12,.5)"/>`;
  }
  // стиль-оверлей
  if(stl){
    if(stl.tex==='aqua')inner+=`<rect width="300" height="200" fill="#FFF4E0" opacity=".16"/>`;
    if(stl.tex==='pencil')inner+=`<rect width="300" height="200" fill="#F2EFE8" opacity=".42"/>`;
    if(stl.tex==='paper')inner+=`<rect width="300" height="200" fill="#FFF8EC" opacity=".14"/>`;
    if(stl.tex==='chalk')inner+=`<rect width="300" height="200" fill="#4A4A52" opacity=".1"/>`;
    if(stl.tex==='pixel'){const r2=rng(seed);for(let i=0;i<70;i++)inner+=`<rect x="${rint(r2,0,290)}" y="${rint(r2,0,190)}" width="6" height="6" fill="#000" opacity=".045"/>`;}
  }
  const filt=stl&&stl.sat!==1?`filter:saturate(${stl.sat})`:'';
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" style="${filt}">${inner}</svg>`;
}

/* ═══════════════ ТЕКСТ ═══════════════ */

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function polish(s){
  return s.replace(/\bв ([взсшжщ][бвгджзклмнпрстфхцчшщ])/g,'во $1')
   .replace(/\bс ([сшзжщ][бвгджзклмнпрстфхцчшщ])/g,'со $1')
   .replace(/ {2,}/g,' ').replace(/ ([,.!?…])/g,'$1')
   .replace(/([.!?…]) ([а-яё])/g,(m,p,c)=>p+' '+c.toUpperCase())
   .trim().replace(/([^.!?…])$/,'$1.');
}
/* родовые окончания глаголов */
function vb(sex,stem){return stem+(sex==='f'?'а':'')}
/* возвратные: взялся / взялась — «ся» и «а» не складываются, а замещаются */
function rf(sex,stem){return stem+(sex==='f'?'ась':'ся')}

/* подписи ребёнка из студии идут в книжку вместо машинного текста */
function shotNotes(){
  return (S.shots||[]).map(x=>x&&x.note?x.note.trim():'');
}
function makeStory(st){
  if(!(st.hero&&st.place&&st.time&&st.mood&&st.prop&&st.style))fillGaps();
  const r=rng(st.seed*97+st.textSeed*13);
  const H=st.hero,P=st.place,T=st.time,M=st.mood,PR=st.prop;
  const nm=st.name||cap(H.n);
  const sx=H.sex;
  const he=sx==='f'?'она':'он';
  const moodW=sx==='f'?M.f:M.n;
  const V=(stem)=>vb(sx,stem);
  const R=(stem)=>rf(sx,stem);

  // Бит 1 — обычный день
  const b1=[
    `${nm} жил${V('')} ${P.p}. ${cap(T.n)} здесь было тихо, и ${he===  'она'?'её':'его'} это устраивало.`,
    `${cap(P.p)} никто не удивлялся ${H.d}. ${nm} был${V('')} тут сво${sx==='f'?'ей':'им'}.`,
    `Каждое утро ${nm} делал${V('')} одно и то же. В это утро — не стал${V('')}.`,
    `Никто ${P.p} не знал, откуда ${R('взял')} ${H.n} по имени ${nm}.`,
    `${cap(P.n)} умел${P.n.endsWith('а')?'а':''} молчать. ${nm} умел${V('')} слушать. Они ладили.`,
  ];
  // Бит 2 — находка
  const b2=[
    `${T.id==='night'||T.id==='dusk'?'В темноте':'Среди камней'} что-то блеснуло. ${cap(PR.n)} — холодн${PR.sex==='f'?'ая':PR.sex==='n'?'ое':PR.sex==='p'?'ые':'ый'}, настоящ${PR.sex==='f'?'ая':PR.sex==='n'?'ее':PR.sex==='p'?'ие':'ий'}.`,
    `${nm} споткнул${V('ся')} обо что-то. Это был${PR.sex==='f'?'а':PR.sex==='n'?'о':PR.sex==='p'?'и':''} ${PR.n}.`,
    `${cap(PR.n)} лежал${PR.sex==='f'?'а':PR.sex==='n'?'о':PR.sex==='p'?'и':''} так, будто ждал${PR.sex==='f'?'а':PR.sex==='n'?'о':PR.sex==='p'?'и':''} именно ${H.a}.`,
    `Сначала ${nm} решил${V('')}, что показалось. Но ${PR.n} никуда не делся.`,
  ];
  // Бит 3 — проблема (по развилке A)
  const A=st.fA;
  const b3map={
    alive:[`Но ${PR.n} шевельнул${PR.sex==='f'?'ась':'ся'}. Сам${PR.sex==='f'?'а':''}.`,`И тут стало понятно: ${PR.n} — живой.`],
    stolen:[`Но кто-то выхватил ${PR.a} и исчез между теней.`,`Только вот ${PR.g} больше не было. Ни в лапах, ни рядом.`],
    door:[`Но там, где ничего не было, появилась дверь.`,`И тут стена разошлась. За ней стояла дверь, которой здесь не было ни вчера, ни сто лет назад.`],
    call:[`Но издалека кто-то позвал. Тихо и очень далеко.`,`И тут ${nm} услышал${V('')}: кто-то звал на помощь.`],
    fade:[`Но ${PR.n} начал${PR.sex==='f'?'а':PR.sex==='n'?'о':''} таять прямо в лапах.`,`Только вот края ${PR.g} становились всё прозрачнее.`],
    owner:[`Но за ${PR.i} пришли. И это были не друзья.`,`И тут выяснилось: ${PR.n} — чуж${PR.sex==='f'?'ая':'ой'}.`],
  };
  const b3=b3map[A?A.id:'alive'];
  // Бит 4 — решение (по развилке B)
  const B=st.fB;
  const b4map={
    trick:[`Ломиться напрямую ${nm} не стал${V('')}. Придумал${V('')} хитрее — и это сработало.`],
    help:[`${nm} не стал${V('')} справляться в одиночку. Позвал${V('')} — и пришли.`],
    brave:[`${nm} не стал${V('')} ждать. Пошёл${sx==='f'?'ла':''} прямо, как есть.`],
    give:[`${nm} отдал${V('')} ${PR.a}. И стало легче — всем.`],
    fix:[`${nm} сел${V('')} и починил${V('')} то, что сломалось. Медленно, но до конца.`],
    talk:[`${nm} не стал${V('')} драться. ${cap(R('Договорил'))} — оказалось, можно.`],
  };
  const b4=b4map[B?B.id:'trick'];
  // Бит 5 — финал (по развилке C) + ОБЯЗАТЕЛЬНЫЙ callback предмета
  const C=st.fC;
  const b5map={
    home:[`${nm} ${R('вернул')} домой друг${sx==='f'?'ой':'им'}. ${cap(PR.n)} остал${PR.sex==='f'?'ась':PR.sex==='n'?'ось':PR.sex==='p'?'ись':'ся'} с ${he==='она'?'ней':'ним'} — на память.`],
    stay:[`${nm} ${R('остал')} там навсегда. А ${PR.n} так и лежит рядом.`],
    friend:[`Теперь ${nm} не ${sx==='f'?'одна':'один'}. И ${PR.n} — общ${PR.sex==='f'?'ая':'ий'}.`],
    road:[`Дорога открыта для всех. А ${PR.n} держит её открытой.`],
    secret:[`${nm} никому не рассказал${V('')}. Только ${PR.n} знает, как было на самом деле.`],
    again:[`С тех пор всё началось заново. И снова с ${PR.i}.`],
  };
  const b5=b5map[C?C.id:'home'];

  const P4=[pick(r,b1),pick(r,b2),pick(r,b3),pick(r,b4),pick(r,b5)];
  const mine=shotNotes();
  // где ребёнок подписал сам — оставляем его слова, они важнее моих
  return P4.map((t,i)=>mine[i]?polish(mine[i]):polish(t));
}

const $=id=>document.getElementById(id);
const B=()=>$('body'), F=()=>$('foot');

const STEPS=['intro','table','pz','name','build','title','line','author','art','reveal','end'];
function pct(){const i=STEPS.indexOf(S.step);return Math.max(0,Math.round(i/(STEPS.length-1)*100))}

/* Нейро — собственный персонаж, а не эмодзи из системного шрифта.
   mood: idle | think | happy | oops. open=1 — макушка откинута, «принимает» слово. */
function svgNeuro(size,mood,open){
  const s=size||56, m=mood||'idle';
  const eye={idle:'#4FD1C5',think:'#FFC94D',happy:'#7BE495',oops:'#FF9A76'}[m]||'#4FD1C5';
  const tilt={idle:0,think:-6,happy:3,oops:-3}[m]||0;
  const lidY={idle:0,think:2.4,happy:1.6,oops:0}[m]||0;
  return `<svg viewBox="0 0 64 64" width="${s}" height="${s}" style="display:block;overflow:visible">
   <ellipse cx="32" cy="59" rx="15" ry="3" fill="rgba(120,72,28,.16)"/>
   <g transform="rotate(${tilt} 32 34)">
     <line x1="32" y1="12" x2="32" y2="19" stroke="#C9B49B" stroke-width="2.4" stroke-linecap="round"/>

function promptCard(level){

  let p=`Нарисуй `+sl('hero','кого?',S.hero&&S.hero.a);
  if(level>=2)p+=` в `+sl('place','где?',S.place&&S.place.p.replace(/^(в|на) /,''));
  if(level>=3)p+=`, `+sl('time','когда?',S.time&&S.time.n)+`, герой `+sl('mood','какой?',S.mood&&(S.hero&&S.hero.sex==='f'?S.mood.f:S.mood.n));
  if(level>=4)p+=`, у него `+sl('prop','что?',S.prop&&S.prop.a)+`, рисуй в стиле `+sl('style','какой?',S.style&&S.style.n);
  if(level>=4&&S.master)p+=`, на нём `+sl('acc','аксессуар?',S.acc&&S.acc.n)+`, покажи `+sl('angle','ракурс?',S.angle&&S.angle.n);

const GEN_STAGES=[
  {n:'Читаю твой запрос',k:'tok'},
  {n:'Отбираю детали из библиотеки',k:'pool'},
  {n:'Собираю слой за слоем',k:'build'},

function slotsCount(){let c=0;['hero','place','time','mood','prop','style','acc','angle'].forEach(k=>{if(S[k])c++});return c}
let genBusy=false;
function generate(after){
  if(genBusy)return;              // защита от двойного тапа по «Собрать»
  genBusy=true;
  const slots=slotsCount();
  const per=Math.min(380+80*slots,1130);
  const toks=[];
  if(S.hero)toks.push(S.hero.a);
  if(S.place)toks.push(S.place.p);
  if(S.time)toks.push(S.time.n);
  if(S.mood)toks.push(S.hero.sex==='f'?S.mood.f:S.mood.n);
  if(S.prop)toks.push(S.prop.a);
  if(S.style)toks.push(S.style.n);
  if(S.acc)toks.push(S.acc.n);

  const g=document.createElement('div');g.className='gen';
  g.innerHTML=`<div class="gen-toks" id="gtok"></div>
    <div class="gen-pool" id="gpool" style="display:none">${Array.from({length:40},()=>'<div class="pdot"></div>').join('')}</div>
    <div class="gen-stage">${GEN_STAGES.map((s,i)=>`<div class="gst" id="gst${i}"><div class="gst-b">${i+1}</div>${s.n}</div>`).join('')}</div>`;
  document.body.appendChild(g);

  let i=0;
  const run=()=>{
    if(i>0)$('gst'+(i-1)).className='gst done';
    if(i>=GEN_STAGES.length){setTimeout(()=>{g.remove();genBusy=false;after&&after()},180);return}
    $('gst'+i).className='gst on';
    if(i===0){$('gtok').innerHTML='';toks.forEach((t,j)=>setTimeout(()=>{const e=document.createElement('span');e.className='tok';e.textContent=t;$('gtok')&&$('gtok').appendChild(e)},j*70))}
    if(i===1){$('gtok').style.display='none';$('gpool').style.display='grid';
      const d=g.querySelectorAll('.pdot');const r=rng(S.seed);
      d.forEach((el,j)=>setTimeout(()=>{if(r()>.42)el.classList.add('off')},j*11))}
    if(i===2){$('gpool').style.display='none'}
    i++;setTimeout(run,per);
  };
  setTimeout(run,110);
}

const POKE={brave:['Ха!','Не боюсь.','Ну давай.'],scared:['Ой!','Ты кто?','А?!'],
  sly:['Хе-хе.','Смотри-смотри.','Ага.'],sleepy:['Мм?','Ещё пять минуточек…','Зевс…'],

let pokeCount=0;
function pokeScene(ev){
  const sc=$('sc'); if(!sc||!S.hero)return;
  const r=sc.getBoundingClientRect();
  const x=(ev.clientX-r.left)/r.width, y=(ev.clientY-r.top)/r.height;
  const onHero=x>0.28&&x<0.72&&y>0.18&&y<0.95;
  pokeCount++;
  if(onHero){
    const list=POKE[S.mood?S.mood.id:'brave']||POKE.brave;
    bubble(sc,list[pokeCount%list.length],ev.clientX-r.left,ev.clientY-r.top);
    sc.animate([{transform:'scale(1)'},{transform:'scale(1.014)'},{transform:'scale(1)'}],{duration:220,easing:'ease-out'});
  }else{
    sc.animate([{transform:'translateX(0)'},{transform:'translateX(-2.5px)'},
                {transform:'translateX(2.5px)'},{transform:'translateX(0)'}],{duration:240});
  }
}
function bubble(host,text,x,y){
  const b=document.createElement('div');
  b.textContent=text;
  b.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;transform:translate(-50%,-130%);'
   +'background:#fff;color:#2B2118;font-weight:800;font-size:13px;padding:6px 11px;border-radius:13px;'
   +'box-shadow:0 3px 10px rgba(90,50,10,.22);pointer-events:none;white-space:nowrap;z-index:5';
  host.appendChild(b);
  b.animate([{opacity:0,transform:'translate(-50%,-100%) scale(.8)'},
             {opacity:1,transform:'translate(-50%,-140%) scale(1)'},
             {opacity:1,transform:'translate(-50%,-145%) scale(1)'},
             {opacity:0,transform:'translate(-50%,-175%) scale(.95)'}],
            {duration:1500,easing:'ease-out'}).onfinish=()=>b.remove();
}

/* постер в PNG — то, что ребёнок реально уносит и показывает */
function savePoster(){
  const W=1080,H=1080,IMGH=720;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d');
  cx.fillStyle='#FFF8EE'; cx.fillRect(0,0,W,H);
  // кадр целиком — герой не обрезается
  const svg=scene(S,{angle:'full',compose:(S.shots||[])[0]||null})
    .replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720"');
  const img=new Image();
  img.onload=()=>{
    cx.drawImage(img,0,0,W,IMGH);
    const g=cx.createLinearGradient(0,IMGH-150,0,IMGH);
    g.addColorStop(0,'rgba(255,248,238,0)'); g.addColorStop(1,'#FFF8EE');
    cx.fillStyle=g; cx.fillRect(0,IMGH-150,W,150);
    cx.fillStyle='#FFF8EE'; cx.fillRect(0,IMGH-2,W,H-IMGH+2);
    cx.textAlign='center';
    cx.fillStyle='#2B2118'; cx.font='800 68px Unbounded, system-ui, sans-serif';
    let t=(S.title||'Моя история'); if(t.length>24)t=t.slice(0,23)+'…';
    cx.fillText(t,W/2,IMGH+96);
    cx.fillStyle='#8A7A68'; cx.font='700 33px Nunito, system-ui, sans-serif';
    cx.fillText('Автор: '+(S.author||'я')+(S.age?', '+S.age+' лет':''),W/2,IMGH+150);
    if(S.line){cx.fillStyle='#E65C00'; cx.font='800 38px Nunito, system-ui, sans-serif';
      let l=S.line; if(l.length>32)l=l.slice(0,31)+'…'; cx.fillText('« '+l+' »',W/2,IMGH+218)}
    cx.fillStyle='#C4B4A2'; cx.font='700 26px Nunito, system-ui, sans-serif';
    cx.fillText('Мастерская Nooka · nookagame.ru',W/2,IMGH+308);
    cv.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=(S.title||'moya-istoriya').replace(/[^\wа-яА-ЯёЁ -]/g,'')+'.png';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},1500);
    },'image/png');
  };
  img.onerror=()=>alert('Не получилось сохранить картинку');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function initLamp(){

/* ── рельса времени: ведёшь солнце — перекрашивается весь стол ── */
function initRail(){
  const rail=$('rail'), cart=$('cart'); if(!rail||!cart)return;
  const set=(px)=>{
    const r=rail.getBoundingClientRect();
    let u=Math.max(0,Math.min(1,(px-r.left)/r.width));
    // дуга: края — погода, середина — время суток
    const order=['fog','dawn','day','dusk','night','storm'];
    const i=Math.min(order.length-1,Math.floor(u*order.length));
    S.time=TIMES.find(t=>t.id===order[i])||TIMES[1];
    const ang=(u-0.5)*Math.PI*0.92;
    cart.style.left=(u*r.width)+'px';
    cart.style.top=(28-Math.cos(ang)*22)+'px';
    const lbl=$('raillbl'); if(lbl)lbl.textContent=cap(S.time.n);
    // весь стол реагирует
    const tb=$('tbl');
    if(tb){
      tb.style.setProperty('--sky',S.time.sky[0]);
      tb.style.filter=S.time.dark>.25?'brightness(.93) saturate(.95)':'none';
    }
    // кадры в планке перерисовываются под новое время
    if(S.hero)[0,1,2,3,4].forEach(i2=>{
      const sl=$('sl'+i2);
      if(sl&&S.frames&&S.frames[i2])sl.innerHTML=scene(S,{seed:S.seed+i2*17,angle:'cover'});
    });
  };
  let drag=false;
  const down=e=>{drag=true;rail.setPointerCapture(e.pointerId);set(e.clientX);e.preventDefault()};
  rail.onpointerdown=down;
  rail.onpointermove=e=>{if(drag)set(e.clientX)};
  rail.onpointerup=()=>{drag=false};
  rail.onpointercancel=()=>{drag=false};
  if(S.time){
    const order=['fog','dawn','day','dusk','night','storm'];
    const i=order.indexOf(S.time.id);
    if(i>=0){const r=rail.getBoundingClientRect();set(r.left+r.width*(i+0.5)/order.length)}
  }
}

function benchBind(){
  let drag=null,ghost=null;
  document.querySelectorAll('.bi').forEach(el=>{
    el.onpointerdown=e=>{
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      drag={el,id:el.dataset.id,x:e.clientX,y:e.clientY};
      ghost=el.cloneNode(true); ghost.className='bi ghost';
      document.body.appendChild(ghost); moveGhost(e.clientX,e.clientY);
      el.style.opacity='.3';
    };
    el.onpointermove=e=>{
      if(!drag)return;
      moveGhost(e.clientX,e.clientY);
      document.querySelectorAll('.bi').forEach(o=>o.classList.remove('hot'));
      const t=targetUnder(e.clientX,e.clientY,drag.el);
      if(t)t.classList.add('hot');
    };
    // как только взял деталь — те, с чем она сложится, начинают светиться
    el.addEventListener('pointerdown',()=>{
      const id=el.dataset.id;
      document.querySelectorAll('.bi').forEach(o=>{
        if(o===el)return;
        if(benchFits(id,o.dataset.id))o.classList.add('canfit');
      });
    });
    el.addEventListener('pointerup',()=>{
      document.querySelectorAll('.bi').forEach(o=>o.classList.remove('canfit'));
    });
    el.onpointerup=e=>{
      if(!drag)return;
      const t=targetUnder(e.clientX,e.clientY,drag.el);
      if(ghost)ghost.remove(); ghost=null;
      drag.el.style.opacity='';
      document.querySelectorAll('.bi').forEach(o=>o.classList.remove('hot'));
      if(t)benchMerge(drag.id,t.dataset.id);
      drag=null;
    };
  });
  function moveGhost(x,y){if(ghost){ghost.style.left=x+'px';ghost.style.top=(y-40)+'px'}}
  function targetUnder(x,y,self){
    y-=40;              // целимся тем, что ВИДНО — призраком, а он поднят на 40px
    let best=null,bd=40;
    document.querySelectorAll('.bi').forEach(o=>{
      if(o===self)return;
      const r=o.getBoundingClientRect();
      const d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));
      if(d<bd){bd=d;best=o}
    });
    return best;
  }
}
/* сложится ли пара — нужно, чтобы подсветить подходящие детали заранее */
function benchFits(idA,idB){
  if(RECIPES.some(r=>(r.a===idA&&r.b===idB)||(r.a===idB&&r.b===idA)))return true;
  if(MAGIC.some(r=>(r.a===idA&&r.b===idB)||(r.a===idB&&r.b===idA)))return true;
  const tr=TRAITS.some(t=>t.id===idA||t.id===idB);
  if(tr&&BENCH.hero)return true;
  return false;
}
function benchMerge(idA,idB){
  const A=BENCH.items.find(i=>i.id===idA), B=BENCH.items.find(i=>i.id===idB);
  if(!A||!B)return;
  let result=null,msg='';
  // часть + часть → герой
  const rec=RECIPES.find(r=>(r.a===idA&&r.b===idB)||(r.a===idB&&r.b===idA));
  if(rec){
    const h=HEROES.find(x=>x.id===rec.hero);
    S.hero=h; BENCH.hero=h;
    result={e:'🐾',n:h.n}; msg='Получился '+h.n+'. Хвост я помню словом «пушистый» — само слово, не картинку.';
  }
  // вещь + вещь → волшебный предмет
  const mg=MAGIC.find(r=>(r.a===idA&&r.b===idB)||(r.a===idB&&r.b===idA));
  if(!result&&mg){
    S.prop=PROPS.find(x=>x.id===mg.a)||PROPS[0];
    S.propMagic=mg.n; S.fA=FORK_A.find(f=>f.id===mg.fA)||FORK_A[0];
    result={e:'🌟',n:mg.n}; msg='«'+cap(mg.n)+'». Такого у меня не было — я склеил из двух.';
  }
  // герой + признак → настроение
  const tr=TRAITS.find(t=>t.id===idA||t.id===idB);
  if(!result&&tr&&BENCH.hero){
    S.mood=MOODS.find(m=>m.id===tr.mood)||MOODS[0];
    result={e:'💫',n:tr.n}; msg='Теперь он '+(S.hero.sex==='f'?S.mood.f:S.mood.n)+'.';
  }
  const box=$('bench');
  if(!result){
    // не сложилось — ничего не тратится
    const el=document.querySelector(`.bi[data-id="${idA}"]`);
    if(el){el.animate([{transform:'translateX(0)'},{transform:'translateX(-9px)'},
      {transform:'translateX(9px)'},{transform:'translateX(0)'}],{duration:260})}
    setNote('Не склеилось. Ничего не потрачено.');
    return;
  }
  // тратим ОБА исходника
  BENCH.items=BENCH.items.filter(i=>i.id!==idA&&i.id!==idB);
  BENCH.bowl.push(result); BENCH.merges++;
  setNote(msg);
  refreshPuzzle();
  syncStrip();
}
function setNote(t){const n=$('pznote'); if(n){n.textContent=t; n.animate([{opacity:0},{opacity:1}],{duration:220})}}

/* ── общие помощники для походки и мультика ── */
function rasterize(svgStr,w,h){
  return new Promise((res,rej)=>{
    // без явных width/height Safari растрирует SVG как 300×150 — грабли уже ловили
    const withSize=svgStr.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"');
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error('svg не растеризовался'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(withSize);
  });
}
function smoothPath(pts){
  if(!pts||pts.length<4)return pts||[];
  const out=[];
  for(let i=0;i<pts.length;i++){
    let sx=0,sy=0,n=0;
    for(let j=Math.max(0,i-2);j<=Math.min(pts.length-1,i+2);j++){sx+=pts[j].hx;sy+=pts[j].hy;n++}
    out.push({hx:sx/n,hy:sy/n,t:pts[i].t});
  }
  return out;
}
function thinPath(pts,maxN){
  if(!pts||pts.length<=maxN)return pts||[];
  const step=pts.length/maxN, out=[];
  for(let i=0;i<maxN;i++)out.push(pts[Math.floor(i*step)]);
  out.push(pts[pts.length-1]);
  return out;
}
function pathAt(pts,t){
  if(!pts||!pts.length)return null;
  if(pts.length===1)return pts[0];
  const dur=pts[pts.length-1].t-pts[0].t||1;
  const target=pts[0].t+dur*Math.max(0,Math.min(1,t));
  for(let i=1;i<pts.length;i++){
    if(pts[i].t>=target){
      const a=pts[i-1],b=pts[i],sp=(b.t-a.t)||1,k=(target-a.t)/sp;
      return {hx:a.hx+(b.hx-a.hx)*k, hy:a.hy+(b.hy-a.hy)*k};
    }
  }
  return pts[pts.length-1];
}
function wrapLines(ctx,text,maxW){
  const words=String(text||'').split(/\s+/).filter(Boolean), lines=[]; let line='';
  words.forEach(wd=>{const t=line?line+' '+wd:wd;
    if(ctx.measureText(t).width<=maxW||!line)line=t; else{lines.push(line);line=wd}});
  if(line)lines.push(line);
  return lines;
}
/* ═══════ ПАЗЛ 2: ПОХОДКА — покажи пальцем, КАК он ходит ═══════
   Здесь ребёнок впервые видит, что машина считывает признаки не из предмета,
   а из его собственных данных: он ведёт палец, а Нейро вслух называет,
   что измерил — быстро/медленно, рывками/ровно, петляет/по прямой — и только
   потом делает вывод о характере. С выводом можно не согласиться и переписать. */
const GAIT={run:0,pts:[],raf:0,hero:null,drag:0,read:null,w:0,h:0,ctx:null,tries:0};

function gaitHTML(){
  return say('Я знаю, как он выглядит. Не знаю, как он ходит.\nПроведи пальцем по земле — покажи, как он идёт.','think')
   +`<div class="gaitwrap">
      <canvas id="gtc"></canvas>
      <div class="gait-hint" id="gthint">веди пальцем слева направо</div>
      <div class="gait-read" id="gtread"></div>
    </div>`;
}

function gaitStart(){
  const cv=$('gtc'); if(!cv)return;
  const w=fitW(cv,360), h=176;
  const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  GAIT.ctx=ctx; GAIT.w=w; GAIT.h=h; GAIT.pts=[]; GAIT.read=null; GAIT.drag=0;
  // герой печётся в растр один раз — иначе SVG перерисовывается каждый кадр
  const hs=`<svg viewBox="58 74 92 104" preserveAspectRatio="xMidYMid meet">`
    +svgHero(S.hero||HEROES[0],(S.mood&&S.mood.id)||'brave',S.seed,S.style,S.acc)+`</svg>`;
  rasterize(hs,132,150).then(im=>{
    const oc=document.createElement('canvas'); oc.width=132; oc.height=150;
    oc.getContext('2d').drawImage(im,0,0,132,150);
    GAIT.hero=oc; gaitDraw();
  }).catch(()=>{});
  const pos=e=>{const r=cv.getBoundingClientRect();
    return {x:Math.max(0,Math.min(w,e.clientX-r.left)), y:Math.max(0,Math.min(h,e.clientY-r.top)), t:performance.now()}};
  const end=()=>{ if(!GAIT.drag)return; GAIT.drag=0;
    if(GAIT.pts.length>6 && gaitSpan()>60){ GAIT.read=gaitJudge(GAIT.pts); gaitShow(); }
    else { GAIT.pts=[]; setNote('Слишком коротко. Проведи через всю землю.'); }
    gaitDraw(); };
  cv.onpointerdown=e=>{ e.preventDefault();
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    GAIT.drag=1; GAIT.pts=[pos(e)]; GAIT.read=null;
    const hn=$('gthint'); if(hn)hn.style.opacity='0';
    const rd=$('gtread'); if(rd)rd.innerHTML='';
    gaitDraw(); };
  cv.onpointermove=e=>{ if(!GAIT.drag)return;
    let list=[e];
    if(e.getCoalescedEvents){const c=e.getCoalescedEvents(); if(c&&c.length)list=c}
    list.forEach(q=>GAIT.pts.push(pos(q)));
    if(GAIT.pts.length>900)GAIT.pts=GAIT.pts.slice(-900);
    gaitDraw(); };
  cv.onpointerup=end;
  cv.onpointercancel=end;
  cv.onlostpointercapture=end;
  GAIT.run=1; gaitDraw();
}
function gaitStop(){ GAIT.run=0; if(GAIT.raf)cancelAnimationFrame(GAIT.raf); GAIT.raf=0; }
function gaitSpan(){
  if(GAIT.pts.length<2)return 0;
  let mn=1e9,mx=-1e9; GAIT.pts.forEach(p=>{if(p.x<mn)mn=p.x;if(p.x>mx)mx=p.x});
  return mx-mn;
}

/* ── чтение признаков: ровно то, что делает модель, только вслух ── */
function gaitJudge(pts){
  const n=pts.length;
  let dist=0, speeds=[], rev=0, minY=1e9, maxY=-1e9, dir=0;
  for(let i=1;i<n;i++){
    const a=pts[i-1], b=pts[i];
    const d=Math.hypot(b.x-a.x,b.y-a.y);
    const dt=Math.max(8,b.t-a.t);
    dist+=d; speeds.push(d/dt*1000);
    const dx=b.x-a.x;
    if(Math.abs(dx)>2){ const nd=dx>0?1:-1; if(dir&&nd!==dir)rev++; dir=nd; }
  }
  pts.forEach(q=>{if(q.y<minY)minY=q.y;if(q.y>maxY)maxY=q.y});
  const dur=(pts[n-1].t-pts[0].t)/1000 || 0.5;
  const avg=dist/dur;
  const mean=speeds.reduce((a,b)=>a+b,0)/(speeds.length||1);
  const varc=speeds.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(speeds.length||1);
  const jerk=Math.sqrt(varc)/(mean||1);
  const bounce=maxY-minY;
  const drop=pts[n-1].y-pts[0].y;

  // пороги выставлены по реальному темпу детского пальца:
  // неспешно провести экран ~3 c = 100 px/c, обычно ~200, резкий свайп ~500
  const SLOW=130, FAST=300, JERK=1.1, BOUNCE=24;
  const feats=[];
  feats.push(avg>FAST?'быстро':avg<SLOW?'медленно':'спокойно');
  feats.push(jerk>JERK?'рывками':'ровно');
  feats.push(rev>=2?'петляет':'по прямой');
  if(bounce>BOUNCE)feats.push('вприпрыжку');

  let id;
  if(rev>=2) id='sly';
  else if(bounce>BOUNCE) id='amazed';
  else if(jerk>JERK && avg>200) id='scared';
  else if(avg<SLOW && drop>16) id='sad';
  else if(avg<SLOW) id='sleepy';
  else id='brave';
  return {id, feats, avg:Math.round(avg), jerk:+jerk.toFixed(2), bounce:Math.round(bounce), rev};
}

function gaitShow(){
  const r=GAIT.read; if(!r)return;
  const m=MOODS.find(x=>x.id===r.id)||MOODS[0];
  const fem=S.hero&&S.hero.sex==='f';
  GAIT.tries++;
  const box=$('gtread'); if(!box)return;
  box.innerHTML=`<div class="gr-t">Вот что я измерил:</div>
    <div class="gr-f">${r.feats.map(f=>`<span class="grf">${f}</span>`).join('')}</div>
    <div class="gr-v">Значит — <b>${fem?m.f:m.n}</b></div>
    <div class="gr-b">
      <button class="btn btn-sm" onclick="gaitAccept()">Да, такой</button>
      <button class="btn btn2 btn-sm" onclick="gaitAgain()">Не, ещё раз</button>
    </div>`;
}
function gaitAccept(){
  const r=GAIT.read; if(!r)return;
  S.mood=MOODS.find(x=>x.id===r.id)||MOODS[0];
  // походку забираем в мультик: та же система координат, что у композиции кадра
  S.gait=thinPath(smoothPath(GAIT.pts.map(q=>({
    hx:50+((q.x/GAIT.w)-0.5)*66, hy:64+((q.y/GAIT.h)-0.5)*26, t:q.t}))),40);
  syncStrip();
  const box=$('gtread');
  if(box)box.innerHTML=`<div class="gr-ok">✓ Характер: ${S.hero&&S.hero.sex==='f'?S.mood.f:S.mood.n}.<br>Походку я забрал в мультик — он пойдёт именно так.</div>`;
}
function gaitAgain(){
  GAIT.pts=[]; GAIT.read=null;
  const box=$('gtread'); if(box)box.innerHTML='';
  const hn=$('gthint'); if(hn){hn.style.opacity='1';
    hn.textContent=GAIT.tries===1?'а теперь по-другому — быстрее или вразвалочку'
      :GAIT.tries===2?'попетляй — или иди строго по прямой':'веди как хочешь, я подстроюсь'}
  gaitDraw();
}

function gaitDraw(){
  const ctx=GAIT.ctx, w=GAIT.w, h=GAIT.h; if(!ctx)return;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#EFE4D2'; ctx.fillRect(0,0,w,h);
  const gy=h-34;
  ctx.fillStyle='#D9BE94'; ctx.fillRect(0,gy,w,h-gy);
  ctx.strokeStyle='rgba(58,42,24,.22)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
  if(GAIT.pts.length>1){
    let acc=0;
    ctx.fillStyle='rgba(58,42,24,.30)';
    for(let i=1;i<GAIT.pts.length;i++){
      const a=GAIT.pts[i-1], b=GAIT.pts[i];
      acc+=Math.hypot(b.x-a.x,b.y-a.y);
      if(acc>27){ acc=0;
        ctx.save(); ctx.translate(b.x,gy+9+((i%2)?5:-5));
        ctx.beginPath(); ctx.ellipse(0,0,6,4,0,0,7); ctx.fill(); ctx.restore(); }
    }
    ctx.strokeStyle='rgba(230,92,0,.45)'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(GAIT.pts[0].x,GAIT.pts[0].y);
    GAIT.pts.forEach(q=>ctx.lineTo(q.x,q.y)); ctx.stroke();
  }
  if(GAIT.hero){
    const last=GAIT.pts.length?GAIT.pts[GAIT.pts.length-1]:null;
    const hx=last?last.x:46;
    const hy=last?Math.min(gy-4,last.y):gy-26;
    ctx.drawImage(GAIT.hero,hx-33,hy-112,66,75);
  }
}

/* ═══════ ПАЗЛ 3: СТЁКЛА — три пальцем ═══════ */
const GLASS={run:0,masks:[],places:[],budget:1,raf:0};
/* ширина контента родителя: clientWidth считает padding, а канвас должен влезть в контент */
function fitW(cv,max){
  const par=cv.parentElement;
  if(!par)return Math.min(max,window.innerWidth-48);
  const cs=getComputedStyle(par);
  const inner=par.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
  return Math.max(200,Math.min(max,Math.floor(inner)));
}
function glassHTML(){
  return say('Подо мной четыре места сразу. Протри — увидишь, какое тебе нужно.\nЧто не протрёшь — придумаю сам.','think')
   +`<div class="glasswrap"><canvas id="gcv"></canvas>
      <div class="breath"><i id="breath"></i></div>
      <div class="bench-res" id="glassres">Протёрто: 0%</div></div>`;
}
function glassStart(){
  const cv=$('gcv'); if(!cv)return;
  const w=fitW(cv,360), h=Math.round(w*2/3);
  const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  GLASS.ctx=ctx; GLASS.w=w; GLASS.h=h; GLASS.budget=1; GLASS.used=0; GLASS.toldDry=0;
  const r=rng(S.seed*41+9);
  const sh=PLACES.slice(); for(let i=sh.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]}
  GLASS.places=sh.slice(0,4);
  GLASS.imgs=[]; GLASS.masks=[];
  GLASS.places.forEach((pl,i)=>{
    const im=new Image();
    // печём растр один раз: WebKit ненадёжно кэширует растр SVG-картинки,
    // и повторный drawImage перерисовывал вектор заново каждый кадр
    im.onload=()=>{
      const oc=document.createElement('canvas'); oc.width=w*dpr; oc.height=h*dpr;
      oc.getContext('2d').drawImage(im,0,0,oc.width,oc.height);
      GLASS.imgs[i]=oc; glassDraw();
    };
    let svg=`<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">${svgBG(pl,S.time||TIMES[1],S.seed+i*7,false,null)}</svg>`;
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    const mc=document.createElement('canvas'); mc.width=w; mc.height=h;
    const mx=mc.getContext('2d',{willReadFrequently:true}); mx.fillStyle='#fff'; mx.fillRect(0,0,w,h);
    GLASS.masks.push({cv:mc,ctx:mx});
  });
  // один переиспользуемый буфер вместо четырёх новых на каждый кадр
  GLASS.tmp=document.createElement('canvas'); GLASS.tmp.width=w*dpr; GLASS.tmp.height=h*dpr;
  GLASS.tctx=GLASS.tmp.getContext('2d'); GLASS.tctx.setTransform(dpr,0,0,dpr,0,0);
  GLASS.dpr=dpr;
  GLASS.dirty=true; GLASS.last={x:0,y:0,on:false};

  let drag=false;
  const R=26, LIMIT=1.15;   // ~3 штриха во всю ширину: потереть в удовольствие, но не открыть всё
  const rub=(cx,cy)=>{
    if(GLASS.used>=LIMIT){
      if(!GLASS.toldDry){GLASS.toldDry=1;setNote('Всё, тряпка сухая. Что успел открыть — то и пойдёт в книжку.')}
      return;
    }
    // выбираем верхний непротёртый слой один раз за штрих, а не на каждую точку
    let layer=GLASS.strokeLayer;
    if(layer===undefined||layer===null){
      layer=2;   // если все три уже сняты — трём нижнее стекло, а не верхнее заново
      for(let i=0;i<3;i++){
        const mx=GLASS.masks[i].ctx;
        const px=mx.getImageData(Math.max(0,Math.min(w-1,cx|0)),Math.max(0,Math.min(h-1,cy|0)),1,1).data;
        if(px[3]>10){layer=i;break}
      }
      GLASS.strokeLayer=layer;
    }
    const mx=GLASS.masks[layer].ctx;
    mx.globalCompositeOperation='destination-out';
    mx.lineCap='round'; mx.lineJoin='round'; mx.lineWidth=52;
    mx.beginPath();
    if(GLASS.last.on){mx.moveTo(GLASS.last.x,GLASS.last.y);mx.lineTo(cx,cy);mx.stroke()}
    mx.beginPath(); mx.arc(cx,cy,26,0,7); mx.fill();
    mx.globalCompositeOperation='source-over';
    // площадь считаем честно: круг — один раз за штрих, дальше только заметённая полоса 2R*длина.
    // старая формула клала полный круг на КАЖДУЮ коалесед-точку и сжигала бюджет за полсекунды.
    const d=GLASS.last.on?Math.hypot(cx-GLASS.last.x,cy-GLASS.last.y):0;
    GLASS.used+=(GLASS.last.on?(2*R*d):(Math.PI*R*R))/(w*h);
    GLASS.last={x:cx,y:cy,on:true};
    const b=$('breath'); if(b)b.style.width=Math.min(100,GLASS.used/LIMIT*100)+'%';
    GLASS.dirty=true;
    glassLive();
  };
  cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);
    GLASS.strokeLayer=null; GLASS.last={x:0,y:0,on:false};
    const r2=cv.getBoundingClientRect(); rub(e.clientX-r2.left,e.clientY-r2.top); e.preventDefault()};
  cv.onpointermove=e=>{if(!drag)return;
    const r2=cv.getBoundingClientRect();
    // берём все промежуточные точки — иначе на быстром движении остаются пропуски
    // ВАЖНО: getCoalescedEvents() существует, но отдаёт ПУСТОЙ массив для синтетических событий —
    // без проверки на длину rub() не вызовется ни разу, и любой тест будет ложно-зелёным.
    let pts=[e];
    if(e.getCoalescedEvents){const c=e.getCoalescedEvents(); if(c&&c.length)pts=c}
    pts.forEach(p=>rub(p.clientX-r2.left,p.clientY-r2.top));};
  cv.onpointerup=()=>{drag=false;GLASS.strokeLayer=null;GLASS.last.on=false;
    clearTimeout(GLASS.pickT); GLASS.pickT=setTimeout(glassPick,420)};
  cv.onpointercancel=()=>{drag=false;GLASS.strokeLayer=null;GLASS.last.on=false;
    clearTimeout(GLASS.pickT); glassPick()};   // иначе станция могла не отдать место вообще
  // рисуем раз в кадр, а не на каждое касание
  GLASS.run=1; const myGen=(GLASS.gen=(GLASS.gen||0)+1);
  const loop=()=>{ if(!GLASS.run||myGen!==GLASS.gen)return;   // старые копии цикла умирают гарантированно
    if(GLASS.dirty){GLASS.dirty=false;glassDraw()}
    GLASS.raf=requestAnimationFrame(loop); };
  loop();
}
function glassDraw(){
  const {ctx,w,h,tctx,tmp}=GLASS; if(!ctx)return;
  ctx.clearRect(0,0,w,h);
  for(let i=3;i>=0;i--){
    const im=GLASS.imgs[i]; if(!im)continue;
    if(i===3){ctx.drawImage(im,0,0,w,h);continue}   // im здесь уже растр, не SVG
    if(!tctx)continue;
    tctx.clearRect(0,0,w,h);
    tctx.globalCompositeOperation='source-over';
    tctx.drawImage(im,0,0,w,h);
    tctx.globalCompositeOperation='destination-in';
    tctx.drawImage(GLASS.masks[i].cv,0,0);
    ctx.drawImage(tmp,0,0);
  }
}
/* Что РЕАЛЬНО видно на экране: для каждой точки — самое верхнее непротёртое стекло.
   Раньше считался самый СТЁРТЫЙ слой, то есть место, которое ребёнок как раз убрал из кадра. */
function glassVisible(){
  const w=GLASS.w,h=GLASS.h;
  if(!GLASS.masks.length)return {best:0,counts:[0,0,0,0]};
  const md=GLASS.masks.slice(0,3).map(m=>m.ctx.getImageData(0,0,w,h).data);
  const counts=[0,0,0,0];
  const step=6;
  for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){
    const o=(y*w+x)*4+3;
    let top=3;
    for(let i=0;i<3;i++){if(md[i][o]>10){top=i;break}}
    counts[top]++;
  }
  // побеждает то, что ребёнок ОТКРЫЛ; если ещё ничего не открыл — верхнее стекло
  let best=-1,bv=0;
  for(let i=1;i<4;i++)if(counts[i]>bv){bv=counts[i];best=i}
  if(best<0)best=0;
  return {best,counts};
}
let glassLiveT=0;
function glassLive(){
  const now=performance.now();
  if(now-glassLiveT<200)return; glassLiveT=now;
  const v=glassVisible();
  const pl=GLASS.places[v.best]; if(!pl)return;
  const g=$('glassres'); if(g)g.textContent='Видно: '+pl.n;
}
function glassPick(){
  const v=glassVisible();
  S.place=GLASS.places[v.best]||PLACES[0];
  const g=$('glassres');
  if(g)g.textContent='Видно: '+S.place.n;
  syncStrip();
}

/* ═══════ ПАЗЛ 4: ФРЕСКА — крути заплатки ═══════
   Единственный жест «уничтожить»: свайп вниз рвёт заплатку насовсем. */
const FRESCO={patches:[],holes:[],picked:null,torn:0};
function frescoInit(){
  if(FRESCO.patches.length)return;
  const r=rng(S.seed*53+7);
  // стартовый угол — заведомо кривой, иначе заплатка «сошлась» сама и крутить нечего
  const skew=()=>{const k=2+Math.floor(r()*20); return k*15;};
  const st=STYLES.slice(); for(let i=st.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[st[i],st[j]]=[st[j],st[i]]}
  const turnsB=FORK_B.slice(0,3), turnsC=FORK_C.slice(0,3);
  // 6 заплаток на 5 дыр — право ровно на одну ошибку
  FRESCO.patches=[
    {i:0,style:st[0],ang:skew(),need:0,turn:null,e:styleIcon(st[0].id)},
    {i:1,style:st[1],ang:skew(),need:0,turn:null,e:styleIcon(st[1].id)},
    {i:2,style:st[2],ang:skew(),need:0,turn:null,e:styleIcon(st[2].id)},
    {i:3,style:st[3],ang:skew(),need:0,turn:turnsB[0],e:styleIcon(st[3].id)},
    {i:4,style:st[4],ang:skew(),need:0,turn:turnsC[0],e:styleIcon(st[4].id)},
    {i:5,style:st[5],ang:skew(),need:0,turn:turnsB[1],e:styleIcon(st[5].id)},
  ];
  FRESCO.holes=[null,null,null,null,null];
}
function frescoHTML(){
  frescoInit();
  return say('Фреска треснула. Заплаток шесть, дыр пять — одну можно испортить.\nКрути, пока линии не сойдутся. Свайп вниз — порвать насовсем.','oops')
   +`<div class="fresco">
      <div class="holes">${FRESCO.holes.map((h,i)=>`
        <div class="hole${h?' filled':''}" id="hole${i}" onclick="frescoPut(${i})">
          ${h?`<span class="hp" style="transform:rotate(${h.ang}deg)">${h.e}</span>`
             :`<span class="hn">${i+1}</span><i class="hmark"></i>`}
        </div>`).join('')}</div>
      <div class="patch-t">Тапни заплатку, потом крути</div>
      <div class="patches">${FRESCO.patches.filter(p=>!p.used&&!p.torn).map(p=>`
        <div class="patch${FRESCO.picked===p.i?' pick':''}${frescoAligned(p)?' ok':''}" id="pt${p.i}" data-i="${p.i}">
          <span style="transform:rotate(${p.ang}deg)">${p.e}</span>
          <i class="pmark" style="transform:rotate(${p.ang}deg)"></i>
          <small>${p.style.n}</small>
          ${frescoAligned(p)?'<b class="pok">линия сошлась</b>':''}
        </div>`).join('')}</div>
      <div class="bench-res" id="frres">Заплаток: ${FRESCO.patches.filter(p=>!p.used&&!p.torn).length} · порвано: ${FRESCO.torn}</div>
    </div>`;
}
/* заплатка «сошлась», когда её метка смотрит вверх */
function frescoAligned(p){
  const a=((p.ang%360)+360)%360;
  return Math.min(a,360-a)<=15;
}
function frescoBind(){
  document.querySelectorAll('.patch').forEach(el=>{
    const i=+el.dataset.i;
    let sy=0,st=0,rot=false,cx=0,cy=0,base=0;
    el.onpointerdown=e=>{
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      sy=e.clientY; st=performance.now();
      const r=el.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2;
      const p=FRESCO.patches.find(x=>x.i===i); base=p?p.ang:0;
      FRESCO.picked=i; rot=false;
      document.querySelectorAll('.patch').forEach(o=>o.classList.remove('pick'));
      el.classList.add('pick');
    };
    el.onpointermove=e=>{
      const dy=e.clientY-sy;
      const dist=Math.hypot(e.clientX-cx,e.clientY-cy);
      if(dist>26){ // крутим
        rot=true;
        const a=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI;
        const p=FRESCO.patches.find(x=>x.i===i);
        if(p){p.ang=Math.round((a+90)/15)*15;   // atan2 даёт 0° справа, а метка смотрит вверх
          const sp=el.querySelector('span'); if(sp)sp.style.transform='rotate('+p.ang+'deg)';
          const pm=el.querySelector('.pmark'); if(pm)pm.style.transform='rotate('+p.ang+'deg)';
          const ok=frescoAligned(p);
          el.classList.toggle('ok',ok);
          let bd=el.querySelector('.pok');
          if(ok&&!bd){bd=document.createElement('b');bd.className='pok';bd.textContent='линия сошлась';el.appendChild(bd)}
          if(!ok&&bd)bd.remove()}
      }
    };
    el.onpointerup=e=>{
      const dy=e.clientY-sy, dt=performance.now()-st;
      if(!rot&&dy>70&&dt<400){ // рвём
        const p=FRESCO.patches.find(x=>x.i===i);
        if(p){p.torn=1;FRESCO.torn++;
          el.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.6) rotate(28deg)',opacity:0}],{duration:380})
            .onfinish=()=>{setNote('Всё, этой больше нет. Дырку закрою сам — своим обычным.');refreshPuzzle()}}
      }
    };
  });
}
function frescoPut(hi){
  if(FRESCO.picked===null){setNote('Сначала выбери заплатку внизу.');return}
  const p=FRESCO.patches.find(x=>x.i===FRESCO.picked);
  if(!p||p.used||p.torn)return;
  if(FRESCO.holes[hi]){setNote('Тут уже стоит.');return}
  p.used=1; FRESCO.holes[hi]={...p};
  // угол близко к нулю — линии сошлись
  const ok=Math.min(Math.abs(p.ang%360),360-Math.abs(p.ang%360))<=15;
  if(hi===0)S.style=p.style;
  if(p.turn&&hi===3)S.fB=p.turn;
  if(p.turn&&hi===4)S.fC=p.turn;
  setNote(ok?'Линии сошлись. Такого куска у меня не было — я его выдумал по краям.'
            :'Линия обрывается уступом. Но так тоже бывает — оставим.');
  FRESCO.picked=null;
  refreshPuzzle(); syncStrip();
  if(FRESCO.holes.filter(Boolean).length>=4)setTimeout(()=>finishPuzzle('fresco'),800);
}

/* Показ жеста: призрачная рука проходит нужное движение.
   Уходит по первому касанию — не мешает тем, кто уже понял. */
function demoHand(kind){
  const box=$('pzbody'); if(!box)return;
  const old=$('demohand'); if(old)old.remove();
  const h=document.createElement('div');
  h.id='demohand'; h.className='demohand '+kind;
  h.innerHTML='<span class="dh-f">👆</span><span class="dh-t">'+
    {bench:'тащи одну деталь на другую',
     belt:'веди пальцем — покажи, как он ходит',
     glass:'веди пальцем — увидишь, что под стеклом',
     fresco:'выбери заплатку, потом крути её',
     studio:'двигай героя — ставь кадр как хочешь'}[kind]+'</span>';
  box.appendChild(h);
  const kill=()=>{h.classList.add('off');setTimeout(()=>h.remove(),300)};
  box.addEventListener('pointerdown',kill,{once:true});
  setTimeout(kill,5200);
}
let CUR=null;
/* ═══════ СТУДИЯ — здесь ребёнок не находит, а СОЗДАЁТ ═══════ */
const STUDIO={frame:0};
function shotOf(i){
  S.shots=S.shots||[];
  S.shots[i]=S.shots[i]||{hx:50,hy:64,hs:1,px:74,py:78,note:'',done:false};
  return S.shots[i];
}
function studioHTML(){
  const i=STUDIO.frame, sh=shotOf(i);
  if(!(S.hero&&S.place))return say('Сначала найди героя и место — потом поставим кадр.','oops')
    +'<div class="pznote">Загляни в Верстак и Стёкла.</div>';
  return say(i===0?'Теперь твоя работа. Двигай героя пальцем — где поставишь, там и будет.\nЭто уже не я придумал, а ты.'
                  :'Кадр '+(i+1)+' из 5. Ставь как хочешь.','happy')
   +`<div class="studio">
      <div class="stage-wrap">
        <div class="stg" id="stg">${scene(S,{seed:S.seed+i*17,compose:sh})}</div>
        <div class="drag-h" id="dragh" style="left:${sh.hx}%;top:${sh.hy}%">✋</div>
        <div class="drag-p" id="dragp" style="left:${sh.px}%;top:${sh.py}%">✋</div>
      </div>
      <div class="sizerow">
        <span class="szl">Размер героя</span>
        <button class="szb" onclick="studioSize(-1)">−</button>
        <span class="szv" id="szv">${Math.round(sh.hs*100)}%</span>
        <button class="szb" onclick="studioSize(1)">+</button>
      </div>
      <div class="frames5">${[0,1,2,3,4].map(k=>
        `<button class="f5${k===i?' on':''}${S.shots&&S.shots[k]&&S.shots[k].done?' has':''}" onclick="studioGo(${k})">${k+1}</button>`).join('')}</div>
      <input class="field" id="shotnote" maxlength="60" placeholder="Что здесь происходит? Твоими словами"
        value="${(sh.note||'').replace(/"/g,'&quot;')}" oninput="shotOf(${i}).note=this.value;shotOf(${i}).done=true">
      <div class="bench-res">Твоих кадров: ${(S.shots||[]).filter(x=>x&&x.done).length} из 5</div>
    </div>`;
}
function studioGo(k){STUDIO.frame=k;refreshPuzzle()}
function studioSize(d){
  const sh=shotOf(STUDIO.frame);
  sh.hs=Math.max(.55,Math.min(1.8,sh.hs+d*.15)); sh.done=true;
  const v=$('szv'); if(v)v.textContent=Math.round(sh.hs*100)+'%';
  studioRedraw();
}
function studioRedraw(){
  const st=$('stg'); if(st)st.innerHTML=scene(S,{seed:S.seed+STUDIO.frame*17,compose:shotOf(STUDIO.frame)});
}
function studioBind(){
  const wrap=document.querySelector('.stage-wrap'); if(!wrap)return;
  [['dragh','h'],['dragp','p']].forEach(([id,kind])=>{
    const el=$(id); if(!el)return;
    let drag=false;
    el.onpointerdown=e=>{drag=true;el.setPointerCapture(e.pointerId);el.classList.add('grab');e.preventDefault()};
    el.onpointermove=e=>{
      if(!drag)return;
      const r=wrap.getBoundingClientRect();
      const x=Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100));
      const y=Math.max(22,Math.min(94,(e.clientY-r.top)/r.height*100));
      el.style.left=x+'%'; el.style.top=y+'%';
      const sh=shotOf(STUDIO.frame);
      if(kind==='h'){sh.hx=x;sh.hy=y}else{sh.px=x;sh.py=y}
      sh.done=true; studioRedraw();
    };
    el.onpointerup=()=>{drag=false;el.classList.remove('grab');syncStrip()};
  });
}
function openPuzzle(id){
  CUR=id; S.step='pz'; render();
}
function refreshPuzzle(){
  const box=$('pzbody'); if(!box||!CUR)return;
  box.innerHTML=puzzleHTML(CUR);
  bindPuzzle(CUR);
}
function puzzleHTML(id){
  return {bench:benchHTML,belt:gaitHTML,glass:glassHTML,fresco:frescoHTML,studio:studioHTML}[id]();
}
function bindPuzzle(id){
  if(id==='bench')benchBind();
  if(id==='belt')gaitStart();
  if(id==='glass')glassStart();
  if(id==='fresco')frescoBind();
  if(id==='studio')studioBind();
  if(!T.shown){T.shown={}}
  if(!T.shown[id]){T.shown[id]=1; setTimeout(()=>demoHand(id),350)}
}
function stopPuzzle(){
  gaitStop();
  if(GLASS.run&&GLASS.masks&&GLASS.masks.length){clearTimeout(GLASS.pickT); glassPick()}
  GLASS.run=0; GLASS.gen=(GLASS.gen||0)+1;
  if(GLASS.raf)cancelAnimationFrame(GLASS.raf); GLASS.raf=0;
}
function finishPuzzle(id){
  T.done[id]=1;
  stopPuzzle(); CUR=null;
  dropJunkQueued=id;
  S.step='table'; render();
}
let dropJunkQueued=null;
/* планка кадров обновляется прямо во время пазла */
function syncStrip(){
  S.frames=S.frames||[];
  for(let i=0;i<5;i++)if(!S.frames[i])S.frames[i]={};
  const st=$('strip5'); if(!st)return;
  [0,1,2,3,4].forEach(i=>{
    const sl=$('sl'+i);
    if(sl&&S.hero){sl.classList.add('on'); sl.innerHTML=scene(S,{seed:S.seed+i*17,compose:(S.shots||[])[i]||null,angle:'cover'})}
  });
}

/* ── навигация назад ── */
$('back').onclick=()=>{
  stopPuzzle(); CUR=null;          // иначе rAF-циклы пазлов копятся при каждом заходе
  const i=STEPS.indexOf(S.step);
  if(i<=0){location.href='index.html';return}
  S.step=STEPS[Math.max(0,i-1)];render();
};

/* чужая книжка, открытая по ссылке */
function openShared(){
  try{
    const q=new URLSearchParams(location.search);
    const a=q.get('a'); if(!a)return false;
    const P=a.split('.'); if(P.length<10)return false;
    const f=(arr,id)=>arr.find(x=>x.id===id);
    const h=f(HEROES,P[0]),pl=f(PLACES,P[1]),t=f(TIMES,P[2]),m=f(MOODS,P[3]),
          pr=f(PROPS,P[4]),stl=f(STYLES,P[5]),a1=f(FORK_A,P[6]),b1=f(FORK_B,P[7]),c1=f(FORK_C,P[8]);
    if(!h||!pl||!t||!m||!pr||!stl||!a1||!b1||!c1)return false;
    S.hero=h;S.place=pl;S.time=t;S.mood=m;S.prop=pr;S.style=stl;
    S.fA=a1;S.fB=b1;S.fC=c1;
    S.seed=parseInt(P[9],10)||4821;
    S.living=P[10]==='1';
    S.name=q.get('n')||cap(h.n);
    S.title=q.get('t')||'История';
    S.author=q.get('by')||'';
    S.shared=true;
    S.pages=makeStory(S);
    S.step='art';
    return true;
  }catch(e){return false}
}
openShared();
render();
</script>
