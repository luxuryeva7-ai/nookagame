<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF3E0">
<title>Тренировочный лагерь — Nooka</title>
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{--bg:#FFF8EE;--card:#FFFFFF;--ink:#1C1108;--ink2:#6B4F2A;--ink3:#B8956A;--line:rgba(180,100,0,.12);--acc:#E65C00;--ok:#2E9E5B;--bad:#D93030}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
.root{height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#FFFAF2 0%,#FFF3E0 100%)}
.topbar{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:#FFFAF5}
.back{color:var(--acc);font-size:14px;font-weight:800;text-decoration:none}
.tb-title{flex:1;font-weight:900;font-size:13px;color:var(--ink2);text-align:center}
.tb-steps{font-size:12px;font-weight:900;color:var(--ink3)}
.pbar{flex:none;height:4px;background:rgba(180,100,0,.08)}
.pbar-fill{height:4px;background:linear-gradient(90deg,#E65C00,#FFB300);transition:width .4s ease}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.foot{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,248,238,0),#FFF3E0 50%)}
.say{display:flex;gap:10px;align-items:flex-start;margin:14px 14px 0;padding:13px 15px;border-radius:20px;background:#FFF0D6;box-shadow:inset 0 0 0 1.5px var(--line);animation:up .3s ease}
.say-ico{flex:none;font-size:26px}
.say-txt{font-weight:700;font-size:13.5px;line-height:1.5;color:#4A3010}
.say-txt b{color:var(--acc)}
.stage{margin:14px 14px 0;border-radius:24px;background:var(--card);box-shadow:0 2px 14px rgba(180,100,0,.12);padding:20px 14px 18px;display:flex;flex-direction:column;align-items:center;position:relative;min-height:200px;justify-content:center;overflow:hidden}
.stage-tag{position:absolute;top:12px;left:14px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.beast-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .38s ease,opacity .38s ease}
.beast-ico{font-size:88px;line-height:1;animation:pop .35s cubic-bezier(.2,.8,.3,1)}
.beast-name{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:16px;color:var(--ink)}
.beast-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btag{background:#FFF0D6;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:800;color:var(--ink2)}
@keyframes pop{from{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}to{transform:scale(1);opacity:1}}
.fly-l .beast-wrap{transform:translateX(-150%) rotate(-20deg);opacity:0}
.fly-r .beast-wrap{transform:translateX(150%) rotate(20deg);opacity:0}
.sort-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 14px 0}
.sbtn{padding:16px 10px;border:none;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .1s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sbtn:active{transform:scale(.93)}
.sbtn-ico{font-size:28px}
.sbtn--cat{background:#DFF5EA;color:var(--ok)}
.sbtn--nocat{background:#FDEAEA;color:var(--bad)}
.piles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 14px 0}
.pile{border-radius:20px;background:var(--card);box-shadow:0 2px 10px rgba(180,100,0,.1);padding:12px 10px;min-height:80px}
.pile-title{font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:center;margin-bottom:8px}
.pile-icons{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.pi{font-size:22px;line-height:1;animation:pop .28s cubic-bezier(.2,.8,.3,1)}
.train-box{margin:14px 14px 0;background:var(--card);border-radius:20px;box-shadow:0 2px 14px rgba(180,100,0,.1);padding:16px}
.train-bar{height:12px;background:#F5E6CC;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.train-fill{height:12px;border-radius:6px;background:linear-gradient(90deg,#E65C00,#FFB300);transition:width .4s ease}
.dataset{margin:12px 14px 0;background:var(--card);border-radius:20px;box-shadow:0 2px 10px rgba(180,100,0,.1);padding:12px 14px}
.ds-title{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.ds-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:#FFF8EE;margin-bottom:5px}
.ds-ico{font-size:20px;flex:none;width:28px;text-align:center}
.ds-name{flex:1;font-size:13px;font-weight:800;color:var(--ink2)}
.ds-lbl{font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px}
.lbl-cat{background:#DFF5EA;color:var(--ok)}
.lbl-nocat{background:#FDEAEA;color:var(--bad)}
.test-card{margin:14px 14px 0;background:var(--card);border-radius:20px;box-shadow:0 2px 14px rgba(180,100,0,.1);padding:16px}
.test-label{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
.test-beast{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px;border-radius:14px;background:#FFF8EE}
.test-opts{display:flex;gap:8px}
.topt{flex:1;padding:13px;border:2px solid var(--line);border-radius:14px;cursor:pointer;font-family:inherit;font-weight:900;font-size:13px;background:var(--card);color:var(--ink);transition:all .12s}
.topt.ok{background:#DFF5EA;border-color:var(--ok);color:var(--ok)}
.topt.bad{background:#FDEAEA;border-color:var(--bad);color:var(--bad)}
.test-res{margin-top:10px;padding:10px 13px;border-radius:12px;font-size:13px;font-weight:800;animation:up .25s ease}
.test-res.ok{background:#DFF5EA;color:var(--ok)}
.test-res.bad{background:#FDEAEA;color:var(--bad)}
.diploma{margin:14px;background:linear-gradient(135deg,#FFF0D6,#DFF5EA);border:2px solid rgba(230,92,0,.2);border-radius:24px;padding:26px 20px;text-align:center;animation:up .4s ease}
.dip-star{font-size:54px;display:block;margin-bottom:10px}
.dip-badge{display:inline-block;background:var(--acc);color:#fff;border-radius:999px;padding:5px 16px;font-size:10px;font-weight:900;letter-spacing:.07em;margin-bottom:10px}
.dip-name{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:19px;color:var(--ink);margin-bottom:4px}
.dip-lvl{font-size:14px;color:var(--acc);font-weight:900;margin-bottom:16px}
.dip-stats{background:rgba(255,255,255,.7);border-radius:16px;padding:12px 14px;text-align:left;margin-bottom:14px}
.dr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.dr:last-child{border:none}
.dr-k{font-size:12px;color:var(--ink3);font-weight:700}
.dr-v{font-size:13px;font-weight:900;color:var(--ink)}
.dip-law{font-size:13px;color:var(--ink2);line-height:1.6}
.intro-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:28px 20px;text-align:center;animation:up .4s ease}
.btn-pri{width:100%;padding:16px;border:none;border-radius:20px;font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:15px;cursor:pointer;background:var(--acc);color:#fff}
.btn-pri:disabled{opacity:.3}
.btn-sec{width:100%;padding:15px;border:2px solid var(--line);border-radius:20px;font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;color:var(--acc);background:#FFF0D6;margin-bottom:8px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="root">
  <div class="topbar">
    <a class="back" href="index.html">← Мастерская</a>
    <div class="tb-title">Тренировочный лагерь</div>
    <div class="tb-steps" id="tbSteps"></div>
  </div>
  <div class="pbar"><div class="pbar-fill" id="pbar" style="width:0%"></div></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const A=[
  {id:0,ico:'🐱',name:'Кот Пирог',tags:['острые уши','усы'],cat:true},
  {id:1,ico:'🐶',name:'Пёс Буран',tags:['висячие уши','хвост'],cat:false},
  {id:2,ico:'😸',name:'Кошка Люси',tags:['острые уши','пушистая'],cat:true},
  {id:3,ico:'🐕',name:'Пёс Крот',tags:['длинные уши','коренастый'],cat:false},
  {id:4,ico:'🐈',name:'Кот Рафаэль',tags:['острые уши','полосатый'],cat:true},
  {id:5,ico:'🦮',name:'Пёс Шеф',tags:['стоячие уши','рыжий'],cat:false},
  {id:6,ico:'🐈‍⬛',name:'Кот Лимон',tags:['острые уши','чёрный'],cat:true},
  {id:7,ico:'🐩',name:'Пёс Зефир',tags:['кудрявый','висячие уши'],cat:false},
];
const N=6,TN=3;
let ph='intro',ds=[],q=shuf([...A]),fly=false,tq=[],ti=0,tr=[],pct=0;
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const SAYS=['Ты показываешь мне зверей и говоришь — <b>кот</b> или нет. Я запоминаю каждый пример.',
  'Записываю. Каждая метка — кусочек знания.','Уже вижу кое-какой <b>паттерн</b>. Продолжай!',
  'Половина готова! Смотри — кучки уже наполняются.','Ещё чуть-чуть и я смогу сам.','Последний пример!'];
function getPct(){if(ph==='intro')return 0;if(ph==='sort')return(ds.length/N)*40;if(ph==='train')return 40+(pct/100)*20;if(ph==='test')return 60+(ti/TN)*30;if(ph==='done')return 100;return 0}
function $id(id){return document.getElementById(id)}
function render(){
  $id('pbar').style.width=getPct()+'%';
  const body=$id('body'),foot=$id('foot'),steps=$id('tbSteps');
  if(ph==='intro'){steps.textContent='';
    body.innerHTML=`<div class="intro-wrap"><span style="font-size:68px;margin-bottom:16px;display:block">🧪</span><h1 style="font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:23px;line-height:1.25;margin-bottom:12px">Тренировочный лагерь</h1><p style="font-size:15px;color:var(--ink2);line-height:1.65;margin-bottom:10px">Я не умею различать котов и собак.<br>Покажи мне примеры — и я научусь!</p><p style="font-size:13px;color:var(--ink3);padding:12px;background:rgba(255,255,255,.7);border-radius:14px;line-height:1.5;margin-bottom:24px">Ты будешь показывать зверей и отправлять их в нужную кучку. Это и есть <b>разметка данных</b> — главная работа тренера ИИ.</p></div>`;
    foot.innerHTML=`<button class="btn-pri" onclick="goSort()">Начать обучать →</button>`;return;}
  if(ph==='sort'){
    const cur=q[ds.length];if(!cur){goTrain();return;}
    const n=ds.length;steps.textContent=(n+1)+'/'+N;
    body.innerHTML=`<div class="say"><span class="say-ico">🤖</span><div class="say-txt">${SAYS[n]||'Отмечай внимательно!'}</div></div>
<div class="stage" id="stg">
  <div class="stage-tag">Пример ${n+1} из ${N}</div>
  <div class="beast-wrap" id="bw">
    <div class="beast-ico">${cur.ico}</div>
    <div class="beast-name">${cur.name}</div>
    <div class="beast-tags">${cur.tags.map(t=>`<span class="btag">${t}</span>`).join('')}</div>
  </div>
</div>
${n>0?`<div class="piles"><div class="pile"><div class="pile-title">😸 Коты · ${ds.filter(d=>d.cat).length}</div><div class="pile-icons">${ds.filter(d=>d.cat).map(d=>`<span class="pi">${d.ico}</span>`).join('')}</div></div><div class="pile"><div class="pile-title">🐕 Не коты · ${ds.filter(d=>!d.cat).length}</div><div class="pile-icons">${ds.filter(d=>!d.cat).map(d=>`<span class="pi">${d.ico}</span>`).join('')}</div></div></div>`:''}`;
    foot.innerHTML=`<div class="sort-btns"><button class="sbtn sbtn--cat" onclick="mark(true)"><span class="sbtn-ico">😸</span>Это кот!</button><button class="sbtn sbtn--nocat" onclick="mark(false)"><span class="sbtn-ico">🐕</span>Не кот</button></div>`;return;}
  if(ph==='train'){steps.textContent='';
    body.innerHTML=`<div class="say"><span class="say-ico">🤖</span><div class="say-txt">${pct<40?'Загружаю примеры...':pct<80?'Ищу <b>паттерн</b>. Острые уши... висячие уши... вижу!':'Почти обучен!'}</div></div>
<div class="train-box"><div style="font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">Обучение</div><div class="train-bar"><div class="train-fill" id="tf" style="width:${Math.round(pct)}%"></div></div><div style="font-size:13px;font-weight:900;color:var(--acc);text-align:center">${Math.round(pct)}%</div></div>
<div class="dataset"><div class="ds-title">Мой датасет · ${ds.length} примеров</div>${ds.map(d=>`<div class="ds-row"><span class="ds-ico">${d.ico}</span><span class="ds-name">${d.name}</span><span class="ds-lbl ${d.cat?'lbl-cat':'lbl-nocat'}">${d.cat?'КОТ':'НЕ КОТ'}</span></div>`).join('')}</div>`;
    foot.innerHTML=pct>=100?`<button class="btn-pri" onclick="goTest()">Протестировать меня →</button>`:'';return;}
  if(ph==='test'){
    const cur=tq[ti],ans=tr.length>ti;const ai=guess(cur);
    steps.textContent=(ti+1)+'/'+TN;
    body.innerHTML=`<div class="say"><span class="say-ico">🤖</span><div class="say-txt">${!ans?(ti===0?'Теперь я сам! Проверим что выучил.':'Смотрю на признаки... думаю...'):(tr[ti]?'✓ <b>Угадал!</b> Спасибо за хорошие примеры.':'✗ Ошибся. Чем больше данных — тем точнее буду.')}</div></div>
<div class="test-card"><div class="test-label">Тест ${ti+1} из ${TN}</div><div class="test-beast"><span style="font-size:46px">${cur.ico}</span><div><div style="font-weight:900;font-size:15px">${cur.name}</div><div style="font-size:12px;color:var(--ink3);margin-top:3px">${cur.tags.join(' · ')}</div></div></div>
<div class="test-opts"><button class="topt${ans&&ai?' ok':''}" ${ans?'disabled':''} onclick="doTest()">😸 Кот</button><button class="topt${ans&&!ai?' bad':''}" ${ans?'disabled':''} onclick="doTest()">🐕 Не кот</button></div>
${ans?`<div class="test-res ${tr[ti]?'ok':'bad'}">${tr[ti]?'✓ Правильно! Это '+(cur.cat?'кот':'не кот'):'✗ Ошибся. На самом деле '+(cur.cat?'кот':'не кот')}</div>`:''}</div>`;
    foot.innerHTML=ans?`<button class="btn-pri" onclick="nextT()">${ti>=TN-1?'Результат →':'Следующий →'}</button>`:'';return;}
  if(ph==='done'){steps.textContent='';
    const c=tr.filter(Boolean).length,p=Math.round(c/TN*100);
    const lvl=p===100?'Мастер-тренер':p>=67?'Старший тренер':'Тренер-стажёр';
    body.innerHTML=`<div class="diploma"><span class="dip-star">${p===100?'🥇':p>=67?'🥈':'🎓'}</span><span class="dip-badge">КАРТОЧКА ТРЕНЕРА ИИ</span><div class="dip-name">Нейро обучен!</div><div class="dip-lvl">Уровень: ${lvl}</div><div class="dip-stats"><div class="dr"><span class="dr-k">Примеров показано</span><span class="dr-v">${ds.length}</span></div><div class="dr"><span class="dr-k">Тест ИИ</span><span class="dr-v">${c} из ${TN}</span></div><div class="dr"><span class="dr-k">Точность</span><span class="dr-v">${p}%</span></div></div><p class="dip-law">Настоящий ИИ учится так же — ты показываешь примеры с метками, он ищет паттерн. Чем больше и чище данные — тем умнее модель.</p></div>`;
    foot.innerHTML=`<button class="btn-sec" onclick="restart()">🔄 Попробовать снова</button><a href="index.html" style="display:block;text-align:center;font-weight:900;font-size:14px;color:var(--acc);padding:10px">← В Мастерскую</a>`;
    try{localStorage.setItem('nooka_proj_trainer',JSON.stringify({step:5}))}catch(e){}}}
function goSort(){ph='sort';ds=[];q=shuf([...A]);render()}
function mark(cat){
  if(fly)return;fly=true;
  const stg=$id('stg');if(!stg){fly=false;return;}
  stg.classList.add(cat?'fly-l':'fly-r');
  ds.push({...q[ds.length],userCat:cat});
  setTimeout(()=>{fly=false;if(ds.length>=N){goTrain();return;}render();},400);}
function goTrain(){
  ph='train';pct=0;
  const used=new Set(ds.map(d=>d.id));
  const fr=A.filter(a=>!used.has(a.id));
  tq=shuf([...fr,...A.filter(a=>used.has(a.id))]).slice(0,TN);
  ti=0;tr=[];render();
  const step=()=>{pct+=Math.random()*9+4;if(pct>=100){pct=100;render();return;}const tf=$id('tf');if(tf)tf.style.width=Math.round(pct)+'%';setTimeout(step,90+Math.random()*60);};
  setTimeout(step,300);}
function goTest(){ph='test';ti=0;tr=[];render()}
function guess(an){return ds.filter(d=>d.cat).some(c=>c.tags.some(t=>an.tags.includes(t)))}
function doTest(){tr.push(guess(tq[ti])===tq[ti].cat);render();$id('body').scrollTo({top:999,behavior:'smooth'})}
function nextT(){if(ti>=TN-1){ph='done';render();return;}ti++;render();$id('body').scrollTo({top:0,behavior:'smooth'})}
function restart(){ph='intro';ds=[];q=shuf([...A]);tq=[];ti=0;tr=[];pct=0;render()}
render();
</script>
</body>
</html>
