<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>ИИ-лаборатория — Nooka</title>
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{--ink:#F4EEFF;--ink2:#C0B0E0;--ink3:#8B7BAE;--bg:#0E0719;--line:rgba(255,255,255,.09);--ok:#4ED99B;--acc:#FFD84D;--purple:#A98BFF;--bad:#FF6B6B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);overflow:hidden}
.root{height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#111C2E 0%,#0B1322 50%,#080D18 100%)}
.topbar{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.back{color:var(--ok);font-size:14px;font-weight:800;text-decoration:none;flex:none}
.tb-title{flex:1;font-weight:900;font-size:13px;color:var(--ink2);text-align:center}
.tb-steps{flex:none;font-size:12px;font-weight:800;color:var(--ink3)}
.pbar-wrap{flex:none;height:3px;background:rgba(255,255,255,.07)}
.pbar-fill{height:3px;background:linear-gradient(90deg,#4ED99B,#A98BFF);transition:width .4s cubic-bezier(.4,0,.2,1)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.foot{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(8,13,24,0),#080D18 42%)}

.say{display:flex;gap:10px;align-items:flex-start;margin:14px 14px 0;padding:13px 15px;border-radius:18px;background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px var(--line);animation:fadeUp .3s ease both}
.say-icon{flex:none;font-size:28px;line-height:1}
.say-text{font-weight:700;font-size:13.5px;line-height:1.5;color:#DDD2F2}
.say-text b{color:var(--acc)}

/* Схема ИИ-системы */
.schema{margin:14px 14px 0;border-radius:20px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1.5px var(--line);padding:14px;overflow:hidden}
.schema-title{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
.schema-svg{width:100%;overflow:visible}

/* Выбор-карточки */
.picks4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 14px 0}
.pk{padding:15px 12px;border:2px solid var(--line);border-radius:18px;cursor:pointer;transition:all .18s;background:rgba(255,255,255,.03);position:relative}
.pk:active{transform:scale(.95)}
.pk.sel{border-color:var(--ok);background:rgba(78,217,155,.1)}
.pk.sel2{border-color:var(--purple);background:rgba(169,139,255,.1)}
.pk-ico{font-size:30px;margin-bottom:8px;display:block;text-align:center}
.pk-name{font-weight:900;font-size:13px;color:var(--ink);text-align:center}
.pk-sub{font-size:11px;color:var(--ink3);text-align:center;margin-top:3px}
.pk-badge{position:absolute;top:8px;right:8px;background:var(--ok);color:#081A10;font-size:9px;font-weight:900;padding:2px 7px;border-radius:999px}

/* Мультивыбор данных */
.picks3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 14px 0}
.pk3{padding:14px 10px;border:2px solid var(--line);border-radius:16px;cursor:pointer;transition:all .18s;background:rgba(255,255,255,.03);text-align:center}
.pk3:active{transform:scale(.94)}
.pk3.sel{border-color:var(--acc);background:rgba(255,216,77,.1)}
.pk3-ico{font-size:26px;margin-bottom:6px;display:block}
.pk3-name{font-weight:900;font-size:12px;color:var(--ink)}
.pk3-note{font-size:10px;color:var(--ink3);margin-top:2px}

/* Модели */
.models{display:flex;flex-direction:column;gap:10px;margin:14px 14px 0}
.mdl{padding:14px 15px;border:2px solid var(--line);border-radius:18px;cursor:pointer;transition:all .18s;background:rgba(255,255,255,.03);display:flex;align-items:center;gap:12px}
.mdl:active{transform:scale(.98)}
.mdl.sel{border-color:var(--purple);background:rgba(169,139,255,.1)}
.mdl-ico{font-size:28px;flex:none}
.mdl-info{flex:1}
.mdl-name{font-weight:900;font-size:14px;color:var(--ink)}
.mdl-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.mdl-bars{display:flex;gap:3px;margin-top:6px}
.mdl-bar{height:5px;border-radius:3px;flex:1;background:rgba(255,255,255,.1)}
.mdl-bar.on{background:var(--purple)}

/* Карточка запуска */
.launch-card{margin:14px;background:linear-gradient(135deg,rgba(78,217,155,.12),rgba(169,139,255,.1));border:2px solid rgba(78,217,155,.3);border-radius:24px;padding:22px 18px;animation:fadeUp .4s ease}
.lc-emoji{font-size:52px;text-align:center;display:block;margin-bottom:12px}
.lc-badge{display:inline-block;background:var(--ok);color:#081A10;border-radius:999px;padding:5px 14px;font-size:10px;font-weight:900;letter-spacing:.07em;margin-bottom:10px}
.lc-title{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:19px;color:var(--ink);margin-bottom:4px}
.lc-sub{font-size:13px;color:var(--ok);font-weight:700;margin-bottom:16px}
.lc-stats{background:rgba(255,255,255,.06);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.lc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.lc-row:last-child{border:none}
.lc-k{font-size:12px;color:var(--ink3);font-weight:700}
.lc-v{font-size:13px;font-weight:900;color:var(--ink)}
.lc-law{font-size:13px;color:var(--ink2);line-height:1.6}

/* SVG схема */
.schema-block{cursor:default}

.intro-modal{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:28px 20px;text-align:center;animation:fadeUp .4s ease}
.intro-emoji{font-size:64px;margin-bottom:20px;display:block}
.intro-title{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:24px;line-height:1.25;margin-bottom:12px;color:var(--ink)}
.intro-law{font-size:15px;color:var(--ink2);line-height:1.65;margin-bottom:24px;white-space:pre-line}

.btn-pri{width:100%;padding:16px;border:none;border-radius:18px;font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:15px;cursor:pointer;color:#0D0A18;background:var(--ok);transition:opacity .15s}
.btn-pri:disabled{opacity:.3}
.btn-sec{width:100%;padding:15px;border:2px solid var(--line);border-radius:18px;font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;color:var(--ink2);background:transparent;margin-bottom:8px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="root">
  <div class="topbar">
    <a class="back" href="index.html">← Мастерская</a>
    <div class="tb-title">ИИ-лаборатория</div>
    <div class="tb-steps" id="tbSteps"></div>
  </div>
  <div class="pbar-wrap"><div class="pbar-fill" id="pbar" style="width:0%"></div></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const TASKS=[
  {id:'translate',ico:'🌍',name:'Переводчик',sub:'переводит тексты и речь'},
  {id:'coach',ico:'💪',name:'ИИ-тренер',sub:'составляет планы тренировок'},
  {id:'tutor',ico:'📖',name:'Репетитор',sub:'объясняет темы школьникам'},
  {id:'filter',ico:'🛡',name:'Фильтр',sub:'отличает спам от не-спама'},
];
const DATA_TYPES=[
  {id:'text',ico:'📝',name:'Текст',note:'письма, посты, новости'},
  {id:'photo',ico:'📷',name:'Фото',note:'изображения, скрины'},
  {id:'audio',ico:'🎙',name:'Голос',note:'речь, подкасты'},
  {id:'nums',ico:'📊',name:'Цифры',note:'таблицы, метрики'},
];
const MODELS=[
  {id:'fast',ico:'⚡',name:'Быстрая модель',sub:'отвечает за миллисекунды, но проще',bars:3,acc:1},
  {id:'smart',ico:'🧠',name:'Умная модель',sub:'точнее, понимает контекст, но медленней',bars:1,acc:3},
  {id:'tiny',ico:'📱',name:'Мини-модель',sub:'работает прямо на телефоне офлайн',bars:2,acc:2},
];
const DEPLOYS=[
  {id:'app',ico:'📱',name:'Мобильное приложение',sub:'всегда под рукой'},
  {id:'web',ico:'🌐',name:'Веб-сайт',sub:'открывается в браузере'},
  {id:'bot',ico:'🤖',name:'Telegram-бот',sub:'прямо в мессенджере'},
  {id:'speaker',ico:'🔊',name:'Умная колонка',sub:'управление голосом'},
];

let phase='intro';
let task=null,dataSet=new Set(),model=null,deploy=null;

function schemaSVG(){
  const w=320,h=80;
  const taskObj=TASKS.find(t=>t.id===task);
  const modelObj=MODELS.find(m=>m.id===model);
  const deployObj=DEPLOYS.find(d=>d.id===deploy);
  const dArr=[...dataSet];

  const blocks=[
    {label:dArr.length?dArr.map(d=>DATA_TYPES.find(x=>x.id===d)?.ico||'').join(''):'?',title:'Данные',x:20,w:70,color:'#FFD84D'},
    {label:taskObj?.ico||'?',title:taskObj?.name||'Задача',x:115,w:70,color:'#A98BFF'},
    {label:modelObj?.ico||'?',title:modelObj?.id==='fast'?'Быстрая':modelObj?.id==='smart'?'Умная':'Мини',x:210,w:70,color:'#4ED99B'},
    {label:deployObj?.ico||'?',title:deployObj?.id==='app'?'App':deployObj?.id==='web'?'Web':deployObj?.id==='bot'?'Bot':'Колонка',x:305,w:70,color:'#FF9ECF'},
  ];

  let svg=`<svg class="schema-svg" viewBox="0 0 ${w+70} ${h+20}" xmlns="http://www.w3.org/2000/svg">`;
  // линии
  for(let i=0;i<blocks.length-1;i++){
    const a=blocks[i],b=blocks[i+1];
    const done=i===0?dataSet.size>0:i===1?!!task:i===2?!!model:!!deploy;
    svg+=`<line x1="${a.x+a.w}" y1="${h/2+10}" x2="${b.x}" y2="${h/2+10}" stroke="${done?blocks[i+1].color:'rgba(255,255,255,.12)'}" stroke-width="${done?2:1}" stroke-dasharray="${done?'none':'5,4'}"/>`;
    if(done)svg+=`<polygon points="${b.x-2},${h/2+7} ${b.x+7},${h/2+10} ${b.x-2},${h/2+13}" fill="${b.color}"/>`;
  }
  // блоки
  blocks.forEach((b,i)=>{
    const filled=i===0?dataSet.size>0:i===1?!!task:i===2?!!model:!!deploy;
    const alpha=filled?.9:.25;
    svg+=`<rect x="${b.x}" y="4" width="${b.w}" height="${h}" rx="12" fill="${b.color}" fill-opacity="${alpha*.15}" stroke="${b.color}" stroke-opacity="${alpha}" stroke-width="1.5"/>`;
    svg+=`<text x="${b.x+b.w/2}" y="${h/2-4}" text-anchor="middle" font-size="20" dominant-baseline="middle">${b.label}</text>`;
    svg+=`<text x="${b.x+b.w/2}" y="${h/2+22}" text-anchor="middle" font-size="9" fill="${b.color}" fill-opacity="${alpha}" font-weight="900" font-family="Nunito,sans-serif" dominant-baseline="middle">${b.title}</text>`;
  });
  svg+=`</svg>`;
  return svg;
}

function render(){
  const pcts={intro:0,task:20,data:40,model:60,deploy:80,done:100};
  document.getElementById('pbar').style.width=(pcts[phase]||0)+'%';
  const body=document.getElementById('body');
  const foot=document.getElementById('foot');
  const steps=document.getElementById('tbSteps');

  if(phase==='intro'){
    steps.textContent='';
    body.innerHTML=`<div class="intro-modal">
      <span class="intro-emoji">🧪</span>
      <h1 class="intro-title">ИИ-лаборатория</h1>
      <p class="intro-law">Собери свою ИИ-систему\nиз реальных компонентов.\nКак это работает — увидишь сам.</p>
    </div>`;
    foot.innerHTML=`<button class="btn-pri" onclick="go('task')">Открыть лабораторию →</button>`;
    return;
  }

  if(phase==='task'){
    steps.textContent='1/4';
    body.innerHTML=`
      <div class="say"><span class="say-icon">🤖</span><span class="say-text">Шаг 1. Что будет <b>делать</b> твой ИИ?</span></div>
      <div class="schema" style="margin-top:12px">${schemaSVG()}</div>
      <div class="picks4">${TASKS.map(t=>`
        <div class="pk${task===t.id?' sel':''}" onclick="selTask('${t.id}')">
          <span class="pk-ico">${t.ico}</span>
          <div class="pk-name">${t.name}</div>
          <div class="pk-sub">${t.sub}</div>
        </div>`).join('')}</div>`;
    foot.innerHTML=`<button class="btn-pri" onclick="go('data')" ${task?'':'disabled'}>Дальше →</button>`;
    return;
  }

  if(phase==='data'){
    steps.textContent='2/4';
    body.innerHTML=`
      <div class="say"><span class="say-icon">🤖</span><span class="say-text">Шаг 2. Какие <b>данные</b> будет изучать твой ИИ? Выбери до 2.</span></div>
      <div class="schema" style="margin-top:12px">${schemaSVG()}</div>
      <div class="picks3">${DATA_TYPES.map(d=>`
        <div class="pk3${dataSet.has(d.id)?' sel':''}" onclick="selData('${d.id}')">
          <span class="pk3-ico">${d.ico}</span>
          <div class="pk3-name">${d.name}</div>
          <div class="pk3-note">${d.note}</div>
        </div>`).join('')}</div>`;
    foot.innerHTML=`<button class="btn-pri" onclick="go('model')" ${dataSet.size?'':'disabled'}>Дальше →</button>`;
    return;
  }

  if(phase==='model'){
    steps.textContent='3/4';
    body.innerHTML=`
      <div class="say"><span class="say-icon">🤖</span><span class="say-text">Шаг 3. Какую <b>модель</b> выберешь? У каждой свои плюсы.</span></div>
      <div class="schema" style="margin-top:12px">${schemaSVG()}</div>
      <div class="models">${MODELS.map(m=>{
        const bars=[...Array(3)].map((_,i)=>`<div class="mdl-bar${i<m.acc?' on':''}"></div>`).join('');
        const spd=[...Array(3)].map((_,i)=>`<div class="mdl-bar${i<m.bars?' on':''}"></div>`).join('');
        return `<div class="mdl${model===m.id?' sel':''}" onclick="selModel('${m.id}')">
          <span class="mdl-ico">${m.ico}</span>
          <div class="mdl-info">
            <div class="mdl-name">${m.name}</div>
            <div class="mdl-sub">${m.sub}</div>
            <div style="display:flex;gap:12px;margin-top:6px">
              <div><div style="font-size:9px;color:var(--ink3);font-weight:900;margin-bottom:3px">СКОРОСТЬ</div><div class="mdl-bars">${spd}</div></div>
              <div><div style="font-size:9px;color:var(--ink3);font-weight:900;margin-bottom:3px">ТОЧНОСТЬ</div><div class="mdl-bars">${bars}</div></div>
            </div>
          </div>
        </div>`;}).join('')}</div>`;
    foot.innerHTML=`<button class="btn-pri" onclick="go('deploy')" ${model?'':'disabled'}>Дальше →</button>`;
    return;
  }

  if(phase==='deploy'){
    steps.textContent='4/4';
    body.innerHTML=`
      <div class="say"><span class="say-icon">🤖</span><span class="say-text">Шаг 4. Куда <b>выдаёт результат</b> твой ИИ?</span></div>
      <div class="schema" style="margin-top:12px">${schemaSVG()}</div>
      <div class="picks4">${DEPLOYS.map(d=>`
        <div class="pk${deploy===d.id?' sel2':''}" onclick="selDeploy('${d.id}')">
          <span class="pk-ico">${d.ico}</span>
          <div class="pk-name">${d.name}</div>
          <div class="pk-sub">${d.sub}</div>
        </div>`).join('')}</div>`;
    foot.innerHTML=`<button class="btn-pri" onclick="go('done')" ${deploy?'':'disabled'}>Запустить! 🚀</button>`;
    return;
  }

  if(phase==='done'){
    steps.textContent='';
    const t=TASKS.find(x=>x.id===task);
    const m=MODELS.find(x=>x.id===model);
    const d=DEPLOYS.find(x=>x.id===deploy);
    const dArr=[...dataSet].map(id=>DATA_TYPES.find(x=>x.id===id));
    body.innerHTML=`
      <div class="launch-card">
        <span class="lc-emoji">🚀</span>
        <div style="text-align:center;margin-bottom:14px">
          <span class="lc-badge">ИИ-СТАРТАП ЗАПУЩЕН</span>
          <div class="lc-title">${t?.ico} ${t?.name}</div>
          <div class="lc-sub">через ${d?.ico} ${d?.name}</div>
        </div>
        <div class="schema">${schemaSVG()}</div>
        <div class="lc-stats" style="margin-top:14px">
          <div class="lc-row"><span class="lc-k">Задача ИИ</span><span class="lc-v">${t?.name}</span></div>
          <div class="lc-row"><span class="lc-k">Данные</span><span class="lc-v">${dArr.map(x=>x?.ico+' '+x?.name).join(', ')}</span></div>
          <div class="lc-row"><span class="lc-k">Модель</span><span class="lc-v">${m?.ico} ${m?.name}</span></div>
          <div class="lc-row"><span class="lc-k">Платформа</span><span class="lc-v">${d?.name}</span></div>
        </div>
        <p class="lc-law">Настоящие ИИ-продукты строятся именно так — из компонентов: <b>данные → задача → модель → интерфейс</b>. Ты только что прошёл путь настоящего ML-инженера.</p>
      </div>`;
    foot.innerHTML=`<button class="btn-sec" onclick="restart()">🔄 Собрать другой</button>
      <a href="index.html" style="display:block;text-align:center;font-weight:900;font-size:14px;color:var(--ok);padding:10px">← В Мастерскую</a>`;
    try{localStorage.setItem('nooka_proj_startup',JSON.stringify({step:5}))}catch(e){}
    return;
  }
}

function go(p){phase=p;render();document.getElementById('body').scrollTo({top:0,behavior:'smooth'})}
function selTask(id){task=id;render()}
function selData(id){if(dataSet.has(id)){dataSet.delete(id)}else if(dataSet.size<2){dataSet.add(id)}render()}
function selModel(id){model=id;render()}
function selDeploy(id){deploy=id;render()}
function restart(){phase='intro';task=null;dataSet=new Set();model=null;deploy=null;render()}
render();
</script>
</body>
</html>
