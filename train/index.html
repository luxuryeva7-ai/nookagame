<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FDF7EC">
<title>Обучи своего ИИ — Nooka</title>
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{--ink:#181228;--ink2:#5B5470;--ink3:#8A82A0;--purple:#7B2FFF;--sun:#FFC53D;
  --bg:#FDF7EC;--line:#E9E1F5;--ok:#12A47A;--err:#E53E3E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;user-select:none}

.hdr{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1.5px solid var(--line);background:var(--bg)}
.logo{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:17px;
  color:var(--purple);text-decoration:none}
.phase-label{font-size:12px;font-weight:900;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}

.progress-bar{height:4px;background:var(--line)}
.progress-fill{height:100%;background:var(--purple);border-radius:0 2px 2px 0;transition:width .5s ease}

.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 16px}
.screen{width:100%;max-width:520px}
.screen-inner{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.badge{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:11px;
  padding:4px 12px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.badge-a{background:#EDE9FF;color:var(--purple)}
.badge-b{background:#FFF8DC;color:#A06000}
.badge-test{background:#E8F8F3;color:var(--ok)}

.screen-title{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;
  font-size:clamp(20px,5vw,28px);line-height:1.25;margin:0 0 8px;letter-spacing:-.3px}
.screen-title em{font-style:normal;color:var(--purple)}
.screen-sub{font-size:15px;color:var(--ink2);margin:0 0 20px;line-height:1.6}

/* Name field */
.name-wrap{display:flex;gap:10px;margin-bottom:18px;align-items:center}
.name-field{flex:1;padding:12px 16px;border:2px solid var(--line);border-radius:14px;
  font-family:'Nunito',inherit;font-size:17px;color:var(--ink);background:#fff;
  outline:none;transition:border-color .15s}
.name-field:focus{border-color:var(--purple)}
.name-badge{padding:6px 14px;border-radius:12px;font-weight:900;font-size:14px;white-space:nowrap}
.name-badge-a{background:#EDE9FF;color:var(--purple)}
.name-badge-b{background:#FFF8DC;color:#A06000}

/* Canvas */
.canvas-wrap{position:relative;margin-bottom:14px}
.draw-canvas{display:block;width:100%;aspect-ratio:1;border-radius:20px;
  background:#fff;border:2.5px solid var(--line);cursor:crosshair;touch-action:none}
.canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;transition:opacity .2s}
.canvas-hint-icon{font-size:36px;display:block;margin-bottom:6px}
.canvas-hint-text{font-size:14px;color:var(--ink3);font-weight:700}

/* Examples strip */
.examples-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;min-height:60px}
.example-thumb{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);
  background:#fff;overflow:hidden}
.example-thumb canvas{width:100%;height:100%}
.examples-count{font-size:13px;color:var(--ink3);font-weight:700;padding-top:16px}

/* Toolbar */
.toolbar{display:flex;gap:8px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 22px;border-radius:14px;font-weight:900;font-size:15px;
  border:none;cursor:pointer;font-family:inherit;text-decoration:none;
  transition:transform .1s,opacity .12s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:default}
.btn--pri{background:var(--purple);color:#fff;flex:1}
.btn--soft{background:#fff;color:var(--purple);border:2px solid var(--line)}
.btn--sun{background:var(--sun);color:var(--ink)}
.btn--clear{background:transparent;color:var(--ink3);border:none;padding:10px;font-size:13px}
.btn--ok{background:var(--ok);color:#fff;flex:1}

/* Training animation */
.training-box{text-align:center;padding:32px 20px}
.train-icon{font-size:64px;display:block;margin-bottom:16px;animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.train-title{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:22px;margin-bottom:8px}
.train-bar-wrap{background:var(--line);border-radius:999px;height:8px;margin:16px 0;overflow:hidden}
.train-bar{height:100%;background:var(--purple);border-radius:999px;transition:width .1s}
.train-status{font-size:14px;color:var(--ink3);font-weight:700}

/* Result */
.result-box{padding:20px;border-radius:20px;margin-top:16px;text-align:center;
  border:3px solid transparent;transition:all .3s}
.result-box.show-a{background:#F0ECFF;border-color:#C4B5FD}
.result-box.show-b{background:#FFFBEB;border-color:#FDE68A}
.result-emoji{font-size:48px;display:block;margin-bottom:8px}
.result-label{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:20px}
.result-conf{font-size:13px;color:var(--ink3);margin-top:4px;font-weight:700}
.conf-bar-wrap{background:var(--line);border-radius:999px;height:6px;margin:10px 0 0;overflow:hidden}
.conf-bar{height:100%;border-radius:999px;transition:width .4s ease}
.conf-bar-a{background:var(--purple)}
.conf-bar-b{background:var(--sun)}

/* Summary */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.summary-card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.summary-card-icon{font-size:28px;margin-bottom:6px}
.summary-card-name{font-weight:900;font-size:15px;color:var(--ink);margin-bottom:2px}
.summary-card-count{font-size:13px;color:var(--ink3)}

@media(max-width:400px){
  .hdr{padding:10px 14px}
  .btn{padding:12px 16px;font-size:14px}
}
</style>
</head>
<body>

<div class="hdr">
  <a class="logo" href="https://nookagame.ru">Nooka</a>
  <span class="phase-label" id="phaseLabel">Шаг 1 из 4</span>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:25%"></div></div>

<div class="main">
  <div class="screen" id="screenWrap"></div>
</div>

<script>
// ─── KNN Classifier (простой, без TF.js) ───────────────────────────────────
const CANVAS_SIZE = 28;
const K = 3;
const MIN_EXAMPLES = 3;

class KNN {
  constructor() { this.data = [] }
  
  addExample(pixels, label) {
    this.data.push({ pixels: [...pixels], label });
  }
  
  predict(pixels) {
    if (!this.data.length) return null;
    const dists = this.data.map(d => ({
      label: d.label,
      dist: euclidean(pixels, d.pixels)
    })).sort((a,b) => a.dist - b.dist).slice(0, K);
    
    const votes = {};
    dists.forEach(d => votes[d.label] = (votes[d.label]||0) + 1);
    let best = null, bestV = 0;
    for (const [l,v] of Object.entries(votes)) if (v>bestV){best=l;bestV=v}
    
    const conf = bestV / K;
    return { label: best, confidence: conf };
  }
  
  countByLabel(label) { return this.data.filter(d => d.label === label).length }
}

function euclidean(a, b) {
  let s = 0;
  for (let i=0;i<a.length;i++) s += (a[i]-b[i])**2;
  return Math.sqrt(s);
}

function getPixels(canvas) {
  const tmp = document.createElement('canvas');
  tmp.width = tmp.height = CANVAS_SIZE;
  const ctx = tmp.getContext('2d');
  ctx.drawImage(canvas, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
  const d = ctx.getImageData(0,0,CANVAS_SIZE,CANVAS_SIZE).data;
  const px = [];
  for (let i=0;i<d.length;i+=4) px.push(d[i]/255); // grayscale R channel
  return px;
}

// ─── Drawing Canvas ────────────────────────────────────────────────────────
function makeDrawCanvas(id, onDraw) {
  const cv = document.getElementById(id);
  const ctx = cv.getContext('2d');
  const hint = document.getElementById(id + '_hint');
  let drawing = false;
  let cx = cv.clientWidth, cy = cv.clientHeight;
  cv.width = cx; cv.height = cy;
  let hasDrawn = false;

  function getPos(e) {
    const r = cv.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }

  function startDraw(e) {
    drawing = true;
    if (!hasDrawn) { hasDrawn = true; if(hint) hint.style.opacity='0' }
    ctx.lineWidth = Math.max(cx * 0.05, 12);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#181228';
    const [x,y] = getPos(e);
    ctx.beginPath(); ctx.moveTo(x,y);
    e.preventDefault();
  }
  function doDraw(e) {
    if (!drawing) return;
    const [x,y] = getPos(e);
    ctx.lineTo(x,y); ctx.stroke();
    e.preventDefault();
  }
  function endDraw() { drawing = false; if(onDraw) onDraw(cv); }

  cv.addEventListener('mousedown', startDraw);
  cv.addEventListener('mousemove', doDraw);
  cv.addEventListener('mouseup', endDraw);
  cv.addEventListener('mouseleave', endDraw);
  cv.addEventListener('touchstart', startDraw, {passive:false});
  cv.addEventListener('touchmove', doDraw, {passive:false});
  cv.addEventListener('touchend', endDraw);

  return {
    clear() {
      ctx.clearRect(0,0,cx,cy);
      hasDrawn = false;
      if(hint) hint.style.opacity='1';
    },
    isEmpty() { return !hasDrawn },
    canvas: cv
  };
}

// ─── State ─────────────────────────────────────────────────────────────────
const state = {
  phase: 1,
  classA: { name:'', examples:[] },
  classB: { name:'', examples:[] },
  knn: new KNN()
};

let drawer = null;

function phaseName(p) {
  if(p===1) return 'Класс А';
  if(p===2) return 'Класс Б';
  if(p===3) return 'Обучение';
  return 'Тест';
}

function setProgress(p) {
  document.getElementById('progressFill').style.width = (p*25)+'%';
  document.getElementById('phaseLabel').textContent = `Шаг ${p} из 4`;
}

function render() {
  setProgress(state.phase);
  const wrap = document.getElementById('screenWrap');
  wrap.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'screen-inner';
  if (state.phase===1) div.innerHTML = drawPhase('a');
  else if (state.phase===2) div.innerHTML = drawPhase('b');
  else if (state.phase===3) div.innerHTML = phaseTraining();
  else div.innerHTML = phaseTest();
  wrap.appendChild(div);

  if (state.phase===1||state.phase===2) {
    const cls = state.phase===1 ? state.classA : state.classB;
    const addBtn = document.getElementById('addBtn');
    
    drawer = makeDrawCanvas('drawCanvas', () => {
      if (addBtn) addBtn.disabled = false;
    });

    document.getElementById('nameField').addEventListener('input', e => {
      cls.name = e.target.value.trim();
      updateAddBtn();
    });

    if (addBtn) {
      addBtn.addEventListener('click', () => {
        if (drawer.isEmpty()) return;
        saveExample(cls);
        drawer.clear();
        addBtn.disabled = true;
        renderThumbs(cls);
        updateNextBtn();
      });
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      drawer.clear();
      if(addBtn) addBtn.disabled = true;
    });

    document.getElementById('nextBtn').addEventListener('click', goNext);
    updateAddBtn();
    updateNextBtn();

  } else if (state.phase===3) {
    startTraining();
  } else if (state.phase===4) {
    setupTestPhase();
  }
}

function drawPhase(which) {
  const isA = which==='a';
  const cls = isA ? state.classA : state.classB;
  const badgeClass = isA ? 'badge-a' : 'badge-b';
  const badgeText = isA ? 'Класс А — первая категория' : 'Класс Б — вторая категория';
  const nameClass = isA ? 'name-badge-a' : 'name-badge-b';
  const placeholder = isA ? 'например: кот' : 'например: собака';
  const emoji = isA ? '✏️' : '🎨';

  return `
    <span class="badge ${badgeClass}">${badgeText}</span>
    <h1 class="screen-title">Нарисуй примеры для <em>${cls.name || (isA?'первой':'второй')} категории</em></h1>
    <p class="screen-sub">Назови класс и нарисуй ${MIN_EXAMPLES}+ примеров — ИИ запомнит как они выглядят.</p>
    
    <div class="name-wrap">
      <span class="name-badge ${nameClass}">${isA?'А':'Б'}</span>
      <input class="name-field" id="nameField" type="text" maxlength="20"
        placeholder="${placeholder}" value="${cls.name}">
    </div>
    
    <div class="canvas-wrap">
      <canvas class="draw-canvas" id="drawCanvas"></canvas>
      <div class="canvas-hint" id="drawCanvas_hint">
        <span class="canvas-hint-icon">${emoji}</span>
        <span class="canvas-hint-text">Рисуй здесь пальцем</span>
      </div>
    </div>
    
    <div class="toolbar">
      <button class="btn btn--soft btn--clear" id="clearBtn">Стереть</button>
      <button class="btn btn--pri" id="addBtn" disabled>+ Добавить пример</button>
    </div>
    
    <div class="examples-strip" id="thumbsStrip">
      ${renderThumbsHTML(cls)}
      ${cls.examples.length===0 ? '<span class="examples-count">Нет примеров</span>' : ''}
    </div>
    
    <button class="btn btn--pri" id="nextBtn" disabled style="width:100%">
      ${state.phase===1 ? 'Дальше: класс Б →' : 'Обучить ИИ →'}
    </button>
  `;
}

function renderThumbsHTML(cls) {
  return cls.examples.map((ex, i) => {
    const thumbId = `thumb_${i}_${Date.now()}`;
    setTimeout(() => {
      const el = document.getElementById(thumbId);
      if (el) {
        const tc = el.querySelector('canvas');
        if (tc) {
          const ctx = tc.getContext('2d');
          tc.width = 52; tc.height = 52;
          ctx.drawImage(ex.canvas, 0, 0, 52, 52);
        }
      }
    }, 0);
    return `<div class="example-thumb" id="${thumbId}"><canvas width="52" height="52"></canvas></div>`;
  }).join('');
}

function renderThumbs(cls) {
  const strip = document.getElementById('thumbsStrip');
  if (!strip) return;
  strip.innerHTML = renderThumbsHTML(cls);
  if (cls.examples.length===0) strip.innerHTML += '<span class="examples-count">Нет примеров</span>';
}

function saveExample(cls) {
  const canvas = drawer.canvas;
  const offscreen = document.createElement('canvas');
  offscreen.width = canvas.width; offscreen.height = canvas.height;
  offscreen.getContext('2d').drawImage(canvas, 0, 0);
  cls.examples.push({ canvas: offscreen, pixels: getPixels(canvas) });
}

function updateAddBtn() {
  const cls = state.phase===1 ? state.classA : state.classB;
  const btn = document.getElementById('addBtn');
  if (!btn) return;
  const hasName = cls.name.length >= 1;
  const hasDrawn = drawer && !drawer.isEmpty();
  btn.disabled = !(hasName && hasDrawn);
}

function updateNextBtn() {
  const cls = state.phase===1 ? state.classA : state.classB;
  const btn = document.getElementById('nextBtn');
  if (!btn) return;
  btn.disabled = cls.examples.length < MIN_EXAMPLES || !cls.name;
}

function goNext() {
  state.phase++;
  render();
}

function phaseTraining() {
  return `
    <div class="training-box">
      <span class="train-icon">🧠</span>
      <div class="train-title">ИИ учится...</div>
      <div class="train-bar-wrap"><div class="train-bar" id="trainBar" style="width:0%"></div></div>
      <div class="train-status" id="trainStatus">Читаю твои рисунки...</div>
    </div>
  `;
}

function startTraining() {
  const bar = document.getElementById('trainBar');
  const status = document.getElementById('trainStatus');
  const steps = [
    [10, 'Изучаю класс «' + state.classA.name + '»...'],
    [30, 'Считаю пиксели...'],
    [50, 'Изучаю класс «' + state.classB.name + '»...'],
    [70, 'Строю модель...'],
    [90, 'Проверяю...'],
    [100, 'Готово!'],
  ];

  let i = 0;
  state.knn = new KNN();

  state.classA.examples.forEach(ex => state.knn.addExample(ex.pixels, 'a'));
  state.classB.examples.forEach(ex => state.knn.addExample(ex.pixels, 'b'));

  function step() {
    if (i >= steps.length) { setTimeout(() => { state.phase=4; render(); }, 400); return; }
    const [pct, txt] = steps[i++];
    if(bar) bar.style.width = pct+'%';
    if(status) status.textContent = txt;
    setTimeout(step, 280);
  }
  setTimeout(step, 100);
}

function phaseTest() {
  return `
    <span class="badge badge-test">✅ ИИ обучен!</span>
    <h1 class="screen-title">Теперь проверь — <em>угадает ли ИИ?</em></h1>
    <p class="screen-sub">Нарисуй что-нибудь — ИИ сам решит к какой категории это относится.</p>
    
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-card-icon">🟣</div>
        <div class="summary-card-name">${state.classA.name}</div>
        <div class="summary-card-count">${state.classA.examples.length} примеров</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-icon">🟡</div>
        <div class="summary-card-name">${state.classB.name}</div>
        <div class="summary-card-count">${state.classB.examples.length} примеров</div>
      </div>
    </div>
    
    <div class="canvas-wrap">
      <canvas class="draw-canvas" id="drawCanvas"></canvas>
      <div class="canvas-hint" id="drawCanvas_hint">
        <span class="canvas-hint-icon">🖊️</span>
        <span class="canvas-hint-text">Нарисуй — и ИИ ответит</span>
      </div>
    </div>
    
    <div class="toolbar">
      <button class="btn btn--soft btn--clear" id="clearBtnTest">Стереть</button>
      <button class="btn btn--sun" id="predictBtn" disabled>Что это? →</button>
    </div>
    
    <div id="resultBox"></div>
    
    <button class="btn btn--soft" onclick="restart()" style="width:100%;margin-top:12px">
      ↩ Обучить заново
    </button>
  `;
}

function setupTestPhase() {
  drawer = makeDrawCanvas('drawCanvas', () => {
    const btn = document.getElementById('predictBtn');
    if (btn) btn.disabled = false;
    document.getElementById('resultBox').innerHTML = '';
  });

  document.getElementById('clearBtnTest').addEventListener('click', () => {
    drawer.clear();
    document.getElementById('predictBtn').disabled = true;
    document.getElementById('resultBox').innerHTML = '';
  });

  document.getElementById('predictBtn').addEventListener('click', () => {
    if (drawer.isEmpty()) return;
    const pixels = getPixels(drawer.canvas);
    const result = state.knn.predict(pixels);
    showResult(result);
  });
}

function showResult(result) {
  const isA = result.label === 'a';
  const name = isA ? state.classA.name : state.classB.name;
  const cls = isA ? 'show-a' : 'show-b';
  const confPct = Math.round(result.confidence * 100);
  const confBarCls = isA ? 'conf-bar-a' : 'conf-bar-b';
  const emoji = isA ? '🟣' : '🟡';

  document.getElementById('resultBox').innerHTML = `
    <div class="result-box ${cls}">
      <span class="result-emoji">${emoji}</span>
      <div class="result-label">Это — «${name}»!</div>
      <div class="result-conf">Уверенность: ${confPct}%</div>
      <div class="conf-bar-wrap">
        <div class="conf-bar ${confBarCls}" style="width:${confPct}%"></div>
      </div>
    </div>
  `;
}

function restart() {
  state.phase = 1;
  state.classA = { name:'', examples:[] };
  state.classB = { name:'', examples:[] };
  state.knn = new KNN();
  render();
}

render();
</script>
</body>
</html>
