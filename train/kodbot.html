<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E0C18">
<title>КодБот — Обучи ИИ</title>
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{
  --ink:#181228;--ink2:#5B5470;--ink3:#8A82A0;
  --purple:#7B2FFF;--sun:#FFC53D;--bg:#FDF7EC;--line:#E9E1F5;--ok:#12A47A;
  /* КодБот dark theme */
  --kb-bg:#0E0C18;--kb-card:#1A1630;--kb-border:#2D2850;
  --kb-green:#00E5A0;--kb-blue:#4D9FFF;--kb-purple:#A259FF;
  --kb-text:#E8E4FF;--kb-sub:#9B96C0
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--kb-bg);color:var(--kb-text);
  font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;user-select:none}

/* HEADER */
.hdr{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--kb-border);background:var(--kb-bg)}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:16px;
  color:var(--kb-green);text-decoration:none}
.logo-tag{font-size:11px;font-weight:900;color:var(--kb-sub);letter-spacing:.08em;
  text-transform:uppercase;background:var(--kb-card);padding:3px 8px;border-radius:6px;
  border:1px solid var(--kb-border)}
.score-bar{display:flex;align-items:center;gap:8px}
.score-chip{font-weight:900;font-size:13px;padding:4px 12px;border-radius:999px;
  background:var(--kb-card);border:1px solid var(--kb-border);color:var(--kb-sub)}
.score-chip.ok{color:var(--kb-green);border-color:var(--kb-green)}

/* PROGRESS */
.progress-bar{height:3px;background:var(--kb-border)}
.progress-fill{height:100%;background:var(--kb-green);transition:width .5s ease}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px 16px}
.screen{width:100%;max-width:560px}
.screen-inner{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* TYPOGRAPHY */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;color:var(--kb-green);margin-bottom:12px}
.eyebrow::before{content:'';display:block;width:18px;height:2px;background:var(--kb-green)}
h1{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;
  font-size:clamp(20px,5vw,28px);line-height:1.2;margin:0 0 10px;letter-spacing:-.3px}
h1 em{font-style:normal;color:var(--kb-green)}
.sub{font-size:15px;color:var(--kb-sub);margin:0 0 22px;line-height:1.65}

/* CLASS SELECTOR (intro) */
.class-count-row{display:flex;gap:8px;margin-bottom:20px}
.count-btn{flex:1;padding:14px 8px;border-radius:14px;background:var(--kb-card);
  border:1.5px solid var(--kb-border);color:var(--kb-sub);font-weight:900;font-size:18px;
  cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.count-btn:hover,.count-btn.sel{border-color:var(--kb-green);color:var(--kb-green);background:#0E2D22}
.count-btn small{display:block;font-size:11px;font-weight:700;margin-top:2px;letter-spacing:.03em}

.class-names-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.class-name-input-wrap{display:flex;flex-direction:column;gap:6px}
.cn-label{font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
.cn-label-0{color:#A259FF}.cn-label-1{color:#4D9FFF}.cn-label-2{color:var(--kb-green)}.cn-label-3{color:var(--sun)}
.cn-field{padding:11px 14px;border-radius:12px;background:var(--kb-card);
  border:1.5px solid var(--kb-border);color:var(--kb-text);font-family:'Nunito',inherit;
  font-size:15px;outline:none;transition:border-color .15s;width:100%}
.cn-field:focus{border-color:var(--kb-green)}

/* DRAW */
.draw-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.class-tag{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:13px;
  padding:5px 14px;border-radius:999px;letter-spacing:.02em}
.ct-0{background:#2D1660;color:#A259FF}.ct-1{background:#0F2650;color:#4D9FFF}
.ct-2{background:#0E2D22;color:var(--kb-green)}.ct-3{background:#2D2200;color:var(--sun)}
.ex-counter{font-size:12px;color:var(--kb-sub);font-weight:900}
.ex-counter strong{color:var(--kb-green)}

.canvas-wrap{position:relative;margin-bottom:12px}
.draw-canvas{display:block;width:100%;aspect-ratio:1;border-radius:20px;
  background:#1A1630;border:2px solid var(--kb-border);cursor:crosshair;touch-action:none}
.canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;transition:opacity .2s}
.canvas-hint-icon{font-size:40px;display:block;margin-bottom:6px}
.canvas-hint-text{font-size:14px;color:var(--kb-sub);font-weight:700}

/* THUMBS */
.thumbs-row{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;margin-bottom:14px}
.thumb{width:50px;height:50px;border-radius:10px;border:1.5px solid var(--kb-border);
  background:var(--kb-card);overflow:hidden;flex:none}
.thumb canvas{width:100%;height:100%;filter:invert(1) brightness(1.5)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 22px;border-radius:14px;font-weight:900;font-size:15px;
  border:none;cursor:pointer;font-family:inherit;text-decoration:none;
  transition:transform .1s,opacity .12s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:default}
.btn--green{background:var(--kb-green);color:#0E0C18;flex:1}
.btn--ghost{background:transparent;color:var(--kb-sub);border:1.5px solid var(--kb-border)}
.btn--sun{background:var(--sun);color:var(--ink);flex:1}
.btn--purple{background:var(--kb-purple);color:#fff;flex:1}
.toolbar{display:flex;gap:8px;margin-bottom:12px}

/* TRAINING */
.train-screen{text-align:center;padding:32px 0}
.neurons{font-size:60px;display:block;margin-bottom:16px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.train-title{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:22px;margin-bottom:6px}
.train-bar-wrap{background:var(--kb-border);border-radius:999px;height:8px;margin:14px 0;overflow:hidden}
.train-bar{height:100%;background:linear-gradient(90deg,var(--kb-purple),var(--kb-green));
  border-radius:999px;transition:width .15s}
.train-log{font-size:13px;color:var(--kb-green);font-weight:900;font-family:'Courier New',monospace;
  min-height:40px;line-height:2}
.train-log span{display:block;animation:fadein .2s ease}

/* RESULT */
.result-card{padding:20px;border-radius:18px;margin-top:14px;text-align:center;border:2px solid}
.rc-0{background:#2D1660;border-color:#A259FF}.rc-1{background:#0F2650;border-color:#4D9FFF}
.rc-2{background:#0E2D22;border-color:var(--kb-green)}.rc-3{background:#2D2200;border-color:var(--sun)}
.result-label{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:22px;margin-bottom:4px}
.rc-0 .result-label{color:#A259FF}.rc-1 .result-label{color:#4D9FFF}
.rc-2 .result-label{color:var(--kb-green)}.rc-3 .result-label{color:var(--sun)}
.conf-text{font-size:13px;color:var(--kb-sub);font-weight:700;margin-bottom:10px}
.conf-bar-wrap{background:var(--kb-border);border-radius:999px;height:6px;overflow:hidden}
.conf-bar{height:100%;border-radius:999px;transition:width .5s ease}
.cb-0{background:#A259FF}.cb-1{background:#4D9FFF}.cb-2{background:var(--kb-green)}.cb-3{background:var(--sun)}

/* VERDICT */
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:13px;
  padding:6px 14px;border-radius:999px;margin-top:10px}
.verdict-right{background:#0E2D22;color:var(--kb-green)}
.verdict-wrong{background:#2D0E0E;color:#FF6B6B}
.verdict-trick{background:#2D2200;color:var(--sun)}

/* SCORE panel */
.score-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.sc-card{background:var(--kb-card);border:1.5px solid var(--kb-border);
  border-radius:16px;padding:14px;text-align:center}
.sc-num{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:26px}
.sc-num-ok{color:var(--kb-green)}.sc-num-fail{color:#FF6B6B}.sc-num-trick{color:var(--sun)}
.sc-lbl{font-size:11px;color:var(--kb-sub);font-weight:900;letter-spacing:.04em;text-transform:uppercase}

/* TRICK mode */
.trick-banner{background:#2D2200;border:1.5px solid var(--sun);border-radius:14px;
  padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.trick-icon{font-size:22px;flex:none}
.trick-text{font-size:13px;color:var(--sun);font-weight:900;line-height:1.4}

/* DIPLOMA */
.diploma{background:var(--kb-card);border:2px solid var(--kb-green);border-radius:24px;
  overflow:hidden;margin-bottom:20px}
.diploma-top{background:linear-gradient(135deg,#1A1630,#0E2D22);padding:28px 24px;
  text-align:center;border-bottom:1.5px solid var(--kb-green)}
.diploma-icon{font-size:52px;margin-bottom:10px;display:block}
.diploma-title{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--kb-green);margin-bottom:8px}
.diploma-name{font-family:'Unbounded','Nunito',sans-serif;font-weight:700;font-size:22px;color:var(--kb-text)}
.diploma-body{padding:20px 24px}
.dip-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--kb-border)}
.dip-row:last-child{border-bottom:none}
.dip-key{font-size:12px;color:var(--kb-sub);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.dip-val{font-size:14px;color:var(--kb-text);font-weight:700;text-align:right}
.dip-classes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dip-tag{font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px}
.dip-tag-0{background:#2D1660;color:#A259FF}.dip-tag-1{background:#0F2650;color:#4D9FFF}
.dip-tag-2{background:#0E2D22;color:var(--kb-green)}.dip-tag-3{background:#2D2200;color:var(--sun)}

/* trick-mode toggle */
.trick-toggle{display:flex;align-items:center;gap:10px;background:var(--kb-card);
  border:1.5px solid var(--kb-border);border-radius:12px;padding:10px 14px;margin-bottom:12px;
  cursor:pointer;transition:border-color .15s}
.trick-toggle:hover{border-color:var(--sun)}
.trick-toggle-icon{font-size:20px}
.trick-toggle-label{flex:1;font-weight:900;font-size:13px;color:var(--kb-sub)}
.trick-switch{width:36px;height:20px;background:var(--kb-border);border-radius:999px;
  position:relative;transition:background .2s;flex:none}
.trick-switch.on{background:var(--sun)}
.trick-switch::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:left .2s}
.trick-switch.on::after{left:19px}

@media(max-width:420px){
  .class-names-grid{grid-template-columns:1fr}
  .score-panel{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo-wrap">
    <a class="logo" href="https://nookagame.ru">Nooka</a>
    <span class="logo-tag">КодБот</span>
  </div>
  <div class="score-bar">
    <span class="score-chip" id="scoreChip" hidden>✓ 0 / ✗ 0</span>
  </div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="main"><div class="screen" id="screenWrap"></div></div>

<script>
// ─── KNN ─────────────────────────────────────────────────────────────────────
const CANVAS_SIZE = 32, K = 5;
const MIN_EX = 4;

class KNN {
  constructor(){ this.data=[] }
  add(pixels, label){ this.data.push({pixels:[...pixels], label}) }
  predict(pixels){
    if(!this.data.length) return null;
    const dists = this.data.map(d=>({label:d.label,dist:euclidean(pixels,d.pixels)}))
      .sort((a,b)=>a.dist-b.dist).slice(0,K);
    const votes={};
    dists.forEach(d=>votes[d.label]=(votes[d.label]||0)+1);
    let best=null,bestV=0;
    for(const [l,v] of Object.entries(votes)) if(v>bestV){best=l;bestV=v}
    return {label:best, confidence:bestV/K,
      allVotes: Object.fromEntries(Object.entries(votes).map(([l,v])=>[l,v/K]))};
  }
}
function euclidean(a,b){let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-b[i])**2;return Math.sqrt(s)}
function getPixels(canvas){
  const tmp=document.createElement('canvas'); tmp.width=tmp.height=CANVAS_SIZE;
  const ctx=tmp.getContext('2d'); ctx.drawImage(canvas,0,0,CANVAS_SIZE,CANVAS_SIZE);
  const d=ctx.getImageData(0,0,CANVAS_SIZE,CANVAS_SIZE).data;
  return Array.from({length:d.length/4},(_,i)=>d[i*4]/255);
}

// ─── Drawing ──────────────────────────────────────────────────────────────────
function makeDrawCanvas(id, onDraw, opts={}) {
  const cv=document.getElementById(id);
  const ctx=cv.getContext('2d');
  const hint=document.getElementById(id+'_hint');
  let drawing=false, hasDrawn=false;
  cv.width=cv.clientWidth; cv.height=cv.clientHeight;
  function pos(e){const r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
    return[s.clientX-r.left,s.clientY-r.top]}
  function start(e){
    drawing=true;
    if(!hasDrawn){hasDrawn=true;if(hint)hint.style.opacity='0'}
    ctx.lineWidth=Math.max(cv.clientWidth*0.055,14);
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=opts.color||'#00E5A0';
    const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault();
  }
  function move(e){if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()}
  function end(){drawing=false;if(onDraw)onDraw(cv)}
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);
  cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
  cv.addEventListener('touchstart',start,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
  return{
    clear(){ctx.clearRect(0,0,cv.width,cv.height);hasDrawn=false;if(hint)hint.style.opacity='1'},
    isEmpty(){return!hasDrawn}, canvas:cv
  }
}

// ─── State ────────────────────────────────────────────────────────────────────
const COLORS=['#A259FF','#4D9FFF','#00E5A0','#FFC53D'];
const state={
  phase:'intro', classCount:2,
  classes:[], currentClass:0,
  knn:new KNN(), creator:'',
  score:{right:0,wrong:0,tricks:0},
  trickMode:false
};
let drawer=null;

const phaseOrder=['intro','collect','train','test','diploma'];
function phaseIdx(p){return phaseOrder.indexOf(p)}

function setProgress(){
  const steps={intro:0,collect:0.4,train:0.65,test:0.85,diploma:1};
  document.getElementById('progressFill').style.width=(steps[state.phase]*100)+'%';
}

function render(){
  setProgress();
  const wrap=document.getElementById('screenWrap');
  wrap.innerHTML='';
  const div=document.createElement('div');
  div.className='screen-inner';
  if(state.phase==='intro') div.innerHTML=phaseIntro();
  else if(state.phase==='collect') div.innerHTML=phaseCollect();
  else if(state.phase==='train') div.innerHTML=phaseTrain();
  else if(state.phase==='test') div.innerHTML=phaseTest();
  else div.innerHTML=phaseDiploma();
  wrap.appendChild(div);
  bindPhase();
}

// ─── INTRO ────────────────────────────────────────────────────────────────────
function phaseIntro(){
  return`
    <div class="eyebrow">КодБот · Лаборатория</div>
    <h1>Обучи ИИ <em>читать твои рисунки</em></h1>
    <p class="sub">Выбери сколько категорий ты хочешь научить ИИ различать — и дай им имена.</p>
    <div class="class-count-row">
      ${[2,3,4].map(n=>`<button class="count-btn${state.classCount===n?' sel':''}" data-n="${n}">
        ${n}<small>${n===2?'легко':n===3?'средне':'сложно'}</small></button>`).join('')}
    </div>
    <div class="class-names-grid" id="namesGrid">${namesGrid()}</div>
    <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center">
      <div style="font-size:12px;color:var(--kb-sub);font-weight:900;text-transform:uppercase;letter-spacing:.05em">Твоё имя:</div>
      <input class="cn-field" id="creatorField" placeholder="Имя или никнейм" maxlength="20"
        value="${state.creator}" style="flex:1">
    </div>
    <button class="btn btn--green" id="startBtn" style="width:100%" disabled>
      Начать обучение →
    </button>
  `;
}

function namesGrid(){
  return Array.from({length:state.classCount},(_,i)=>`
    <div class="class-name-input-wrap">
      <label class="cn-label cn-label-${i}">Класс ${String.fromCharCode(65+i)}</label>
      <input class="cn-field" id="cn_${i}" type="text" maxlength="15"
        placeholder="${['буква А','буква Б','цифра 1','цифра 2'][i]||'своя идея'}"
        value="${state.classes[i]?.name||''}">
    </div>
  `).join('');
}

// ─── COLLECT ─────────────────────────────────────────────────────────────────
function phaseCollect(){
  const ci=state.currentClass;
  const cls=state.classes[ci];
  const done=cls.examples.length;
  const pct=Math.round((ci/state.classCount)*100+(done/MIN_EX/state.classCount)*100);

  return`
    <div class="eyebrow">Собираю данные · ${ci+1}/${state.classCount}</div>
    <h1>Рисуй «<em>${cls.name}</em>»</h1>
    <p class="sub">Нарисуй ${MIN_EX}+ разных вариантов. ИИ запомнит как они выглядят.</p>
    <div class="draw-hdr">
      <span class="class-tag ct-${ci}">${cls.name}</span>
      <span class="ex-counter"><strong id="exCount">${done}</strong> / ${MIN_EX} примеров</span>
    </div>
    <div class="canvas-wrap">
      <canvas class="draw-canvas" id="drawCanvas"></canvas>
      <div class="canvas-hint" id="drawCanvas_hint">
        <span class="canvas-hint-icon">✏️</span>
        <span class="canvas-hint-text">Рисуй здесь пальцем или мышью</span>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn btn--ghost" id="clearBtn" style="padding:13px 16px">Стереть</button>
      <button class="btn btn--green" id="addBtn" disabled>+ Запомнить</button>
    </div>
    <div class="thumbs-row" id="thumbsRow">${thumbsHTML(cls)}</div>
    <div style="display:flex;gap:8px">
      ${ci>0?`<button class="btn btn--ghost" onclick="prevClass()">← Назад</button>`:''}
      <button class="btn ${done>=MIN_EX?'btn--green':'btn--ghost'}" id="nextClassBtn"
        ${done<MIN_EX?'disabled':''} style="flex:1">
        ${ci<state.classCount-1?'Следующий класс →':'Обучить ИИ →'}
      </button>
    </div>
  `;
}

function thumbsHTML(cls){
  if(!cls.examples.length) return '';
  return cls.examples.map((_,i)=>{
    const id=`th_${state.currentClass}_${i}`;
    setTimeout(()=>{
      const el=document.getElementById(id);
      if(!el) return;
      const tc=el.querySelector('canvas');
      if(tc){tc.width=50;tc.height=50;tc.getContext('2d').drawImage(cls.examples[i].canvas,0,0,50,50)}
    },0);
    return`<div class="thumb" id="${id}"><canvas width="50" height="50"></canvas></div>`;
  }).join('');
}

// ─── TRAIN ───────────────────────────────────────────────────────────────────
function phaseTrain(){
  return`
    <div class="train-screen">
      <span class="neurons">🧠</span>
      <div class="train-title">ИИ учится...</div>
      <div class="train-bar-wrap"><div class="train-bar" id="trainBar" style="width:0%"></div></div>
      <div class="train-log" id="trainLog"></div>
    </div>
  `;
}

// ─── TEST ─────────────────────────────────────────────────────────────────────
function phaseTest(){
  const sc=state.score;
  const total=sc.right+sc.wrong;
  const acc=total>0?Math.round(sc.right/total*100):0;

  return`
    <div class="eyebrow">Тест · Угадай что это</div>
    <h1>Нарисуй — и посмотрим <em>что скажет ИИ</em></h1>
    
    <div class="score-panel">
      <div class="sc-card">
        <div class="sc-num sc-num-ok">${sc.right}</div>
        <div class="sc-lbl">Угадал</div>
      </div>
      <div class="sc-card">
        <div class="sc-num sc-num-fail">${sc.wrong}</div>
        <div class="sc-lbl">Ошибся</div>
      </div>
      <div class="sc-card">
        <div class="sc-num sc-num-trick">${sc.tricks}</div>
        <div class="sc-lbl">Обманут</div>
      </div>
    </div>

    <div class="trick-toggle" id="trickToggle">
      <span class="trick-toggle-icon">🎭</span>
      <span class="trick-toggle-label">Режим «Обмани ИИ»</span>
      <div class="trick-switch${state.trickMode?' on':''}" id="trickSwitch"></div>
    </div>

    ${state.trickMode?`<div class="trick-banner">
      <span class="trick-icon">⚡</span>
      <div class="trick-text">Рисуй что-то необычное или смешанное — попробуй запутать ИИ!</div>
    </div>`:''}

    <div class="canvas-wrap">
      <canvas class="draw-canvas" id="drawCanvas"></canvas>
      <div class="canvas-hint" id="drawCanvas_hint">
        <span class="canvas-hint-icon">${state.trickMode?'🎭':'🖊️'}</span>
        <span class="canvas-hint-text">${state.trickMode?'Обмани ИИ!':'Нарисуй что-нибудь'}</span>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn btn--ghost" id="clearBtn" style="padding:13px 16px">Стереть</button>
      <button class="btn${state.trickMode?' btn--sun':' btn--green'}" id="predictBtn" disabled>
        ${state.trickMode?'🎭 Обмануть!':'Что это? →'}
      </button>
    </div>

    <div id="resultBox"></div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn--ghost" onclick="trainAgain()" style="flex:1">↩ Обучить заново</button>
      <button class="btn btn--purple" onclick="goState('diploma')" style="flex:none;padding:13px 18px">
        Получить диплом 🎓
      </button>
    </div>
  `;
}

// ─── DIPLOMA ─────────────────────────────────────────────────────────────────
function phaseDiploma(){
  const sc=state.score;
  const total=sc.right+sc.wrong;
  const acc=total>0?Math.round(sc.right/total*100):0;
  const today=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  const totalEx=state.classes.reduce((s,c)=>s+c.examples.length,0);
  const rank=acc>=90?'🥇 Гений ИИ':acc>=70?'🥈 ИИ-Инженер':acc>=50?'🥉 ИИ-Студент':'🎓 Начинающий';

  return`
    <div class="eyebrow">Диплом выдан</div>
    <div class="diploma">
      <div class="diploma-top">
        <span class="diploma-icon">🤖</span>
        <div class="diploma-title">Сертификат разработчика ИИ · Nooka КодБот</div>
        <div class="diploma-name">${state.creator||'Юный учёный'}</div>
      </div>
      <div class="diploma-body">
        <div class="dip-row">
          <div class="dip-key">Обучил ИИ различать</div>
          <div class="dip-val">
            <div class="dip-classes">
              ${state.classes.map((c,i)=>`<span class="dip-tag dip-tag-${i}">${c.name}</span>`).join('')}
            </div>
          </div>
        </div>
        <div class="dip-row">
          <div class="dip-key">Обучающих примеров</div>
          <div class="dip-val">${totalEx} рисунков</div>
        </div>
        <div class="dip-row">
          <div class="dip-key">Точность ИИ</div>
          <div class="dip-val">${total>0?acc+'%':'не тестировался'}</div>
        </div>
        <div class="dip-row">
          <div class="dip-key">Обманул ИИ</div>
          <div class="dip-val">${sc.tricks} раз</div>
        </div>
        <div class="dip-row">
          <div class="dip-key">Ранг</div>
          <div class="dip-val">${rank}</div>
        </div>
        <div class="dip-row">
          <div class="dip-key">Дата</div>
          <div class="dip-val">${today}</div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn--ghost" onclick="goState('test')" style="flex:1">← Ещё потестить</button>
      <button class="btn btn--green" onclick="trainAgain()" style="flex:1">Обучить новый ИИ</button>
    </div>
  `;
}

// ─── BIND ─────────────────────────────────────────────────────────────────────
function bindPhase(){
  if(state.phase==='intro') bindIntro();
  else if(state.phase==='collect') bindCollect();
  else if(state.phase==='train') runTraining();
  else if(state.phase==='test') bindTest();
}

function bindIntro(){
  document.querySelectorAll('.count-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.classCount=+btn.dataset.n;
      document.querySelectorAll('.count-btn').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      document.getElementById('namesGrid').innerHTML=namesGrid();
      checkIntroReady();
    });
  });
  document.querySelectorAll('.cn-field[id^="cn_"]').forEach(f=>f.addEventListener('input',checkIntroReady));
  document.getElementById('creatorField')?.addEventListener('input',e=>{state.creator=e.target.value;checkIntroReady()});
  document.getElementById('startBtn')?.addEventListener('click',startCollect);
  checkIntroReady();
}

function checkIntroReady(){
  const names=Array.from(document.querySelectorAll('.cn-field[id^="cn_"]')).map(f=>f.value.trim());
  const allNamed=names.slice(0,state.classCount).every(n=>n.length>0);
  const creator=(document.getElementById('creatorField')?.value||'').trim();
  const btn=document.getElementById('startBtn');
  if(btn) btn.disabled=!(allNamed && creator.length>0);
}

function startCollect(){
  const names=Array.from(document.querySelectorAll('.cn-field[id^="cn_"]')).map(f=>f.value.trim());
  state.creator=(document.getElementById('creatorField')?.value||'').trim();
  state.classes=Array.from({length:state.classCount},(_,i)=>({name:names[i],examples:[]}));
  state.currentClass=0;
  goState('collect');
}

function bindCollect(){
  const cls=state.classes[state.currentClass];
  const addBtn=document.getElementById('addBtn');

  drawer=makeDrawCanvas('drawCanvas',()=>{
    if(addBtn) addBtn.disabled=false;
  },{color:COLORS[state.currentClass]});

  document.getElementById('clearBtn')?.addEventListener('click',()=>{
    drawer.clear(); if(addBtn) addBtn.disabled=true;
  });

  addBtn?.addEventListener('click',()=>{
    if(drawer.isEmpty()) return;
    const cv=document.createElement('canvas');
    cv.width=drawer.canvas.width; cv.height=drawer.canvas.height;
    cv.getContext('2d').drawImage(drawer.canvas,0,0);
    cls.examples.push({canvas:cv,pixels:getPixels(drawer.canvas)});
    drawer.clear(); addBtn.disabled=true;
    document.getElementById('exCount').textContent=cls.examples.length;
    document.getElementById('thumbsRow').innerHTML=thumbsHTML(cls);
    const nb=document.getElementById('nextClassBtn');
    if(nb) nb.disabled=cls.examples.length<MIN_EX;
  });

  document.getElementById('nextClassBtn')?.addEventListener('click',()=>{
    if(state.currentClass<state.classCount-1){
      state.currentClass++; render();
    } else goState('train');
  });
}

function prevClass(){state.currentClass=Math.max(0,state.currentClass-1);render()}

function runTraining(){
  const bar=document.getElementById('trainBar');
  const log=document.getElementById('trainLog');
  state.knn=new KNN();
  state.classes.forEach(c=>c.examples.forEach(ex=>state.knn.add(ex.pixels,c.name)));

  const steps=[
    [15,`> Загружаю ${state.classes[0].name} (${state.classes[0].examples.length} примеров)...`],
    [35,state.classes.length>1?`> Загружаю ${state.classes[1].name} (${state.classes[1].examples.length} примеров)...`:'> Обрабатываю...'],
    [55,state.classes.length>2?`> Загружаю ${state.classes[2].name}...`:'> Строю векторы...'],
    [75,'> Строю модель KNN...'],
    [90,'> Верифицирую данные...'],
    [100,'> Готово! Модель обучена ✓'],
  ];
  let i=0;
  function step(){
    if(i>=steps.length){setTimeout(()=>{state.phase='test';document.getElementById('scoreChip').hidden=false;render()},500);return}
    const[pct,txt]=steps[i++];
    if(bar) bar.style.width=pct+'%';
    if(log){const s=document.createElement('span');s.textContent=txt;log.appendChild(s);if(log.children.length>4)log.removeChild(log.firstChild)}
    setTimeout(step,300);
  }
  setTimeout(step,100);
}

function bindTest(){
  drawer=makeDrawCanvas('drawCanvas',()=>{
    const pb=document.getElementById('predictBtn');
    if(pb) pb.disabled=false;
    document.getElementById('resultBox').innerHTML='';
  },{color:state.trickMode?'#FFC53D':'#00E5A0'});

  document.getElementById('clearBtn')?.addEventListener('click',()=>{
    drawer.clear();
    document.getElementById('predictBtn').disabled=true;
    document.getElementById('resultBox').innerHTML='';
  });

  document.getElementById('predictBtn')?.addEventListener('click',()=>{
    if(drawer.isEmpty()) return;
    const pixels=getPixels(drawer.canvas);
    const res=state.knn.predict(pixels);
    showResult(res);
  });

  document.getElementById('trickToggle')?.addEventListener('click',()=>{
    state.trickMode=!state.trickMode;
    render();
  });
}

function showResult(res){
  const ci=state.classes.findIndex(c=>c.name===res.label);
  const safeCi=Math.max(0,ci);
  const conf=Math.round(res.confidence*100);
  const isTrick=state.trickMode;
  const isTricked=conf<=34;

  if(!isTrick) {
    // ask user if correct
    const box=document.getElementById('resultBox');
    box.innerHTML=`
      <div class="result-card rc-${safeCi}">
        <div class="result-label">${res.label}</div>
        <div class="conf-text">Уверенность: ${conf}%</div>
        <div class="conf-bar-wrap"><div class="conf-bar cb-${safeCi}" style="width:${conf}%"></div></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn--ghost" onclick="markResult(true)" style="flex:1">✓ Угадал</button>
        <button class="btn btn--ghost" onclick="markResult(false)" style="flex:1;color:#FF6B6B">✗ Ошибся</button>
      </div>
    `;
  } else {
    const box=document.getElementById('resultBox');
    if(isTricked) state.score.tricks++;
    box.innerHTML=`
      <div class="result-card rc-${safeCi}">
        <div class="result-label">${res.label}</div>
        <div class="conf-text">Уверенность: ${conf}%</div>
        <div class="conf-bar-wrap"><div class="conf-bar cb-${safeCi}" style="width:${conf}%"></div></div>
        <span class="verdict ${isTricked?'verdict-trick':'verdict-wrong'}">
          ${isTricked?`⚡ Ты запутал ИИ! (${conf}% — почти случайно)`:`🤖 ИИ не запутался (${conf}% уверен)`}
        </span>
      </div>
    `;
    updateScoreChip();
  }
}

window.markResult=function(correct){
  if(correct) state.score.right++; else state.score.wrong++;
  updateScoreChip();
  const box=document.getElementById('resultBox');
  const verdict=box.querySelector('.result-card');
  if(verdict){
    const v=document.createElement('span');
    v.className=`verdict ${correct?'verdict-right':'verdict-wrong'}`;
    v.textContent=correct?'✓ Правильно!':'✗ Ошибся';
    verdict.appendChild(v);
  }
  // remove buttons
  const btns=box.querySelector('div[style]');
  if(btns) btns.remove();
};

function updateScoreChip(){
  const sc=state.score;
  const chip=document.getElementById('scoreChip');
  if(chip){chip.textContent=`✓ ${sc.right} / ✗ ${sc.wrong}`;
    chip.className=`score-chip${sc.right>sc.wrong?' ok':''}`;chip.hidden=false}
}

function goState(s){state.phase=s;render()}
function trainAgain(){
  state.phase='intro';state.classes=[];state.currentClass=0;
  state.knn=new KNN();state.score={right:0,wrong:0,tricks:0};state.trickMode=false;
  document.getElementById('scoreChip').hidden=true;render();
}

render();
</script>
</body>
</html>
