<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1536"/>
      <stop offset="55%" stop-color="#110C24"/>
      <stop offset="100%" stop-color="#090613"/>
    </linearGradient>
    <linearGradient id="panelE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,.02)"/>
    </linearGradient>
    <linearGradient id="filmE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1A2C"/>
      <stop offset="100%" stop-color="#07101D"/>
    </linearGradient>
    <pattern id="gridE" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#fff" stroke-width=".6" opacity=".05"/>
    </pattern>
    <filter id="glowE" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="barE" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3E7CFF" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#7FD8FF" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" fill="url(#bgE)"/>
  <rect width="500" height="400" fill="url(#gridE)"/>

  <!-- ── снимок: ИИ нашёл, подпись за человеком ── -->
  <g>
    <rect x="24" y="28" width="262" height="344" rx="20" fill="url(#panelE)"
          stroke="rgba(127,216,255,.22)" stroke-width="1.4"/>
    <rect x="40" y="44" width="230" height="272" rx="12" fill="url(#filmE)" stroke="rgba(127,216,255,.14)"/>

    <!-- кость -->
    <g stroke="#B9DDF7" stroke-width="2.2" stroke-linejoin="round" fill="rgba(185,221,247,.13)">
      <g opacity=".26" filter="url(#glowE)" stroke-width="10" fill="none">
        <path d="M128 110 L182 262"/>
      </g>
      <path d="M122 100 l56 160" stroke-width="30" stroke-linecap="round" fill="none" opacity=".5"/>
      <circle cx="114" cy="92" r="15"/>
      <circle cx="136" cy="85" r="14"/>
      <circle cx="190" cy="270" r="15"/>
      <circle cx="168" cy="277" r="14"/>
      <path d="M122 100 l56 160" stroke-width="28" stroke-linecap="round" fill="none"
            stroke="rgba(185,221,247,.15)"/>
      <path d="M112 106 l56 160" stroke-width="2" fill="none" opacity=".4"/>
      <path d="M138 96 l56 160" stroke-width="2" fill="none" opacity=".4"/>
    </g>

    <!-- находка ИИ -->
    <g>
      <rect x="120" y="152" width="74" height="66" rx="7" fill="none" stroke="#FFD84D" stroke-width="2"/>
      <path d="M120 152 h15 M179 152 h15 M120 218 h15 M179 218 h15"
            stroke="#FFD84D" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M140 168 l14 10 l-11 12 l16 12" fill="none" stroke="#FFD84D" stroke-width="3.4" stroke-linecap="round"/>
      <text x="200" y="164" fill="#FFE9A3" style="font:800 15px Nunito,system-ui,sans-serif">0.86</text>
    </g>

    <!-- подпись ставит человек: строка пустая -->
    <g>
      <text x="40" y="344" fill="#7FD8FF" style="font:800 12px Nunito,system-ui,sans-serif;letter-spacing:.18em">ВРАЧ</text>
      <path d="M118 340 h34" stroke="#6EDD9A" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M160 340 H270" stroke="rgba(255,255,255,.18)" stroke-width="1.6" stroke-dasharray="4 5"/>
    </g>
  </g>

  <!-- ── звук: половину сыграл человек, половину продолжил ИИ ── -->
  <g>
    <rect x="298" y="28" width="178" height="168" rx="20" fill="url(#panelE)"
          stroke="rgba(255,143,212,.22)" stroke-width="1.4"/>
    <g stroke="#FF8FD4" stroke-width="3.4" stroke-linecap="round" fill="none">
      <path d="M318 132 L318 108 M328 132 L328 84 M338 132 L338 62 M348 132 L348 96 M358 132 L358 74"/>
    </g>
    <path d="M370 52 L370 146" stroke="rgba(255,255,255,.22)" stroke-width="1" stroke-dasharray="3 4"/>
    <g stroke="#FFD84D" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="1 7" fill="none">
      <path d="M382 132 L382 78 M392 132 L392 60 M402 132 L402 102 M412 132 L412 70 M422 132 L422 90 M432 132 L432 118"/>
    </g>
    <path d="M312 150 H460" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
    <text x="314" y="176" fill="#FF8FD4" style="font:800 12px Nunito,system-ui,sans-serif;letter-spacing:.18em">ДИДЖЕЙ</text>
  </g>

  <!-- ── прогноз: 80 из 100, а не «будет дождь» ── -->
  <g>
    <rect x="298" y="208" width="178" height="164" rx="20" fill="url(#panelE)"
          stroke="rgba(110,221,154,.22)" stroke-width="1.4"/>
    <g>
      <rect x="316" y="300" width="16" height="32" rx="5" fill="url(#barE)" opacity=".5"/>
      <rect x="340" y="288" width="16" height="44" rx="5" fill="url(#barE)" opacity=".5"/>
      <rect x="364" y="276" width="16" height="56" rx="5" fill="url(#barE)" opacity=".5"/>
      <rect x="388" y="270" width="16" height="62" rx="5" fill="#FFD84D"/>
      <rect x="412" y="292" width="16" height="40" rx="5" fill="url(#barE)" opacity=".5"/>
      <rect x="436" y="308" width="16" height="24" rx="5" fill="url(#barE)" opacity=".5"/>
      <path d="M310 340 H464" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
      <text x="314" y="360" fill="#6EDD9A" style="font:800 12px Nunito,system-ui,sans-serif;letter-spacing:.18em">СИНОПТИК</text>
    </g>
    <text x="388" y="248" text-anchor="middle" fill="#FFE9A3" style="font:800 20px Nunito,system-ui,sans-serif">80%</text>
  </g>
</svg>
