<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF4E4">
<title>Арифмагия — Nooka</title>
<meta name="robots" content="noindex">
<link href="../fonts/nooka-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<link rel="stylesheet" href="nooka-mq.css?v=13">
<link rel="preload" as="image" href="mq/town.webp">
</head>
<body class="mq-body">

<div class="mq" id="app">

  <!-- 1. ЗАСТАВКА -->
  <section class="mq-sc mq-sc--intro" id="sc-intro" data-screen="intro">
    <img class="mq-intro__bg" src="mq/town.webp" alt="">
    <div class="mq-intro__in">
      <h1 class="mq-intro__title">Арифмагия</h1>
      <p class="mq-intro__sub">Счётные Земли стоят на числах.<br>Безмер их стирает — и вещи исчезают.<br><b>Заклинание слушается того, кто назовёт верное число.</b></p>
    </div>
    <div class="mq-foot">
      <button class="mq-btn mq-btn--big" id="go-start" type="button">Начать</button>
      <button class="mq-btn mq-btn--ghost" id="go-reset" type="button" hidden>Начать заново</button>
    </div>
  </section>

  <!-- 2. ВЫБОР ГЕРОЯ -->
  <section class="mq-sc" id="sc-hero" data-screen="hero" hidden>
    <header class="mq-head">
      <button class="mq-back" data-back="intro" type="button" aria-label="Назад">←</button>
      <h2>Кто пойдёт в Палату?</h2>
    </header>
    <p class="mq-note">Выбери ученика и дай ему имя.</p>
    <div class="mq-picks" id="heroes"></div>
    <div class="mq-tune" id="hero-tune"></div>
    <div class="mq-foot">
      <label class="mq-field">
        <span>Имя</span>
        <input id="hero-name" type="text" maxlength="14" placeholder="Напиши имя" autocomplete="off" spellcheck="false">
      </label>
      <button class="mq-btn mq-btn--big" id="hero-done" type="button">Дальше</button>
    </div>
  </section>

  <!-- 3. КЛАСС -->
  <section class="mq-sc" id="sc-grade" data-screen="grade" hidden>
    <header class="mq-head">
      <button class="mq-back" data-back="hero" type="button" aria-label="Назад">←</button>
      <h2>В каком ты классе?</h2>
    </header>
    <p class="mq-note">От этого зависят задачи. Потом можно поменять в Палате.</p>
    <div class="mq-grades" id="grades"></div>
  </section>

  <!-- 3.5 ВСТУПЛЕНИЕ -->
  <section class="mq-sc mq-sc--tale" id="sc-tale" data-screen="tale" hidden>
    <img class="mq-tale__bg" id="tale-bg" src="" alt="">
    <div class="mq-tale__in">
      <span class="mq-tale__dots" id="tale-dots"></span>
      <h2 id="tale-title"></h2>
      <p id="tale-text"></p>
    </div>
    <div class="mq-foot">
      <button class="mq-btn mq-btn--big" id="tale-go" type="button">Дальше</button>
      <button class="mq-btn mq-btn--ghost" id="tale-skip" type="button">Пропустить</button>
    </div>
  </section>

  <!-- 4. ЧИСЛОГРАД -->
  <section class="mq-sc mq-sc--town" id="sc-town" data-screen="town" hidden>
    <img class="mq-town__bg" src="mq/town.webp" alt="">
    <header class="mq-head mq-head--over">
      <div class="mq-me" id="town-me"></div>
    </header>
    <div class="mq-town__map" id="town-spots"></div>
    <div class="mq-town__foot">
      <div class="mq-speech" id="town-say"></div>
    </div>
  </section>

  <!-- 5. ЗЕМЛИ -->
  <section class="mq-sc mq-sc--land" id="sc-land" data-screen="land" hidden>

    <div class="mq-land__list" id="land-list">
      <header class="mq-head">
        <button class="mq-back" data-back="town" type="button" aria-label="В город">←</button>
        <h2>Счётные Земли</h2>
      </header>
      <div class="mq-lands" id="lands"></div>
    </div>

    <div class="mq-land__place" id="land-place" hidden>
      <img class="mq-place__bg" id="land-bg" src="" alt="">
      <header class="mq-head mq-head--over">
        <button class="mq-back" data-back="town" type="button" aria-label="В город">←</button>
        <h2 id="land-title"></h2>
      </header>
      <div class="mq-actors" id="land-actors"></div>
      <div class="mq-stagewrap" id="land-stage"></div>
      <div class="mq-place__body">
        <p class="mq-hint" id="land-hint"></p>
        <div class="mq-speech" id="land-speech"></div>
        <div class="mq-gos" id="land-fights"></div>
      </div>
    </div>

  </section>

  <!-- 6. БОЙ -->
  <section class="mq-sc mq-sc--fight" id="sc-fight" data-screen="fight" hidden>
    <img class="mq-place__bg" id="fight-bg" src="" alt="">
    <div class="mq-fight__foes" id="foes"></div>
    <div class="mq-fight__fx" id="fx" aria-hidden="true"></div>
    <div class="mq-fight__mine" id="mine"></div>
    <div class="mq-fight__panel" id="panel">
      <div class="mq-spells" id="spells"></div>
      <div class="mq-task" id="task" hidden>
        <div class="mq-task__head">
          <span class="mq-task__spell" id="task-spell"></span>
          <button class="mq-task__drop" id="task-drop" type="button">Другое заклинание</button>
        </div>
        <div class="mq-task__q" id="task-q"></div>
        <div class="mq-task__opts" id="task-opts"></div>
      </div>
      <div class="mq-tip" id="tip"></div>
    </div>
  </section>

  <!-- 7. ИТОГ -->
  <section class="mq-sc mq-sc--win" id="sc-win" data-screen="win" hidden>
    <div class="mq-win__art" id="win-art"></div>
    <h2 id="win-title"></h2>
    <p id="win-sub" class="mq-note"></p>
    <div class="mq-win__rows" id="win-rows"></div>
    <div class="mq-foot">
      <button class="mq-btn mq-btn--big" id="win-go" type="button">Дальше</button>
    </div>
  </section>

  <!-- ЛИСТ: Палата Счёта -->
  <div class="mq-sheet" id="sheet" hidden>
    <div class="mq-sheet__card">
      <header class="mq-head">
        <h2>Палата Счёта</h2>
        <button class="mq-icobtn" id="sheet-close" type="button" aria-label="Закрыть">✕</button>
      </header>
      <div class="mq-sheet__body" id="sheet-body"></div>
      <div class="mq-foot">
        <button class="mq-btn mq-btn--ghost" id="sheet-grade" type="button">Поменять класс</button>
      </div>
    </div>
  </div>

</div>

<script src="nooka-mq-fx.js?v=13"></script>
<script src="nooka-mq-world.js?v=13"></script>
<script src="nooka-mq.js?v=13"></script>
</body>
</html>
