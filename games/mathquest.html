<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF4E4">
<title>Арифмагия — Nooka</title>
<meta name="robots" content="noindex">
<link href="../fonts/nooka-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<link rel="stylesheet" href="nooka-mq.css">
<link rel="preload" as="image" href="math/arena-bg.webp">
</head>
<body class="mq-body">

<div class="mq" id="app">

  <!-- ЭКРАН 1: заставка -->
  <section class="mq-sc mq-sc--intro" id="sc-intro" data-screen="intro">
    <div class="mq-intro__art" aria-hidden="true">
      <span class="mq-glyph mq-glyph--a">+</span>
      <span class="mq-glyph mq-glyph--b">×</span>
      <span class="mq-glyph mq-glyph--c">−</span>
      <span class="mq-glyph mq-glyph--d">÷</span>
      <img src="../mascot/hello.webp" alt="" class="mq-intro__neuro">
    </div>
    <h1 class="mq-intro__title">Арифмагия</h1>
    <p class="mq-intro__sub">Магия работает на числах.<br>Чтобы заклинание сорвалось с посоха — назови верное число.</p>
    <div class="mq-foot">
      <button class="mq-btn mq-btn--big" id="go-start" type="button">Начать</button>
      <button class="mq-btn mq-btn--ghost" id="go-reset" type="button" hidden>Начать заново</button>
    </div>
  </section>

  <!-- ЭКРАН 2: класс -->
  <section class="mq-sc" id="sc-grade" data-screen="grade" hidden>
    <header class="mq-head">
      <button class="mq-back" data-back="intro" type="button" aria-label="Назад">←</button>
      <h2>В каком ты классе?</h2>
    </header>
    <p class="mq-note">От этого зависят задачи. Потом можно поменять.</p>
    <div class="mq-grades" id="grades"></div>
  </section>

  <!-- ЭКРАН 3: герой -->
  <section class="mq-sc" id="sc-hero" data-screen="hero" hidden>
    <header class="mq-head">
      <button class="mq-back" data-back="grade" type="button" aria-label="Назад">←</button>
      <h2>Кто ты, счетомаг?</h2>
    </header>

    <div class="mq-forge">
      <div class="mq-forge__stage">
        <div class="mq-avatar mq-avatar--xl" id="hero-preview"></div>
      </div>
      <div class="mq-forge__ctrl" id="hero-ctrl"></div>
      <label class="mq-field">
        <span>Имя</span>
        <input id="hero-name" type="text" maxlength="14" placeholder="Напиши имя" autocomplete="off" spellcheck="false">
      </label>
    </div>

    <div class="mq-foot">
      <button class="mq-btn mq-btn--big" id="hero-done" type="button">В Палату Счёта</button>
    </div>
  </section>

  <!-- ЭКРАН 4: карта -->
  <section class="mq-sc mq-sc--map" id="sc-map" data-screen="map" hidden>
    <header class="mq-head mq-head--map">
      <div class="mq-me" id="me-chip"></div>
      <button class="mq-icobtn" id="open-book" type="button" aria-label="Посох и заклинания">✦</button>
    </header>
    <div class="mq-map" id="map"></div>
    <p class="mq-note mq-note--map" id="map-hint"></p>
  </section>

  <!-- ЭКРАН 5: локация -->
  <section class="mq-sc mq-sc--place" id="sc-place" data-screen="place" hidden>
    <img class="mq-place__bg" id="place-bg" src="" alt="">
    <header class="mq-head mq-head--over">
      <button class="mq-back" data-back="map" type="button" aria-label="На карту">←</button>
      <h2 id="place-title"></h2>
    </header>
    <div class="mq-place__body">
      <div class="mq-speech" id="place-speech"></div>
      <div class="mq-spots" id="place-spots"></div>
    </div>
  </section>

  <!-- ЭКРАН 6: бой -->
  <section class="mq-sc mq-sc--fight" id="sc-fight" data-screen="fight" hidden>
    <img class="mq-place__bg" id="fight-bg" src="math/arena-bg.webp" alt="">

    <div class="mq-fight__foes" id="foes"></div>

    <div class="mq-fight__fx" id="fx" aria-hidden="true"></div>

    <div class="mq-fight__mine" id="mine"></div>

    <div class="mq-fight__panel" id="panel">
      <!-- выбор заклинания -->
      <div class="mq-spells" id="spells"></div>
      <!-- задача -->
      <div class="mq-task" id="task" hidden>
        <div class="mq-task__head">
          <span class="mq-task__spell" id="task-spell"></span>
          <button class="mq-task__drop" id="task-drop" type="button">Другое заклинание</button>
        </div>
        <div class="mq-task__q" id="task-q"></div>
        <div class="mq-task__opts" id="task-opts"></div>
      </div>
      <!-- лог/подсказка -->
      <div class="mq-tip" id="tip"></div>
    </div>
  </section>

  <!-- ЭКРАН 7: итог боя -->
  <section class="mq-sc mq-sc--win" id="sc-win" data-screen="win" hidden>
    <div class="mq-win__art" id="win-art"></div>
    <h2 id="win-title"></h2>
    <p id="win-sub" class="mq-note"></p>
    <div class="mq-win__rows" id="win-rows"></div>
    <div class="mq-foot">
      <button class="mq-btn mq-btn--big" id="win-go" type="button">Дальше</button>
    </div>
  </section>

  <!-- ЛИСТ: посох и заклинания -->
  <div class="mq-sheet" id="sheet" hidden>
    <div class="mq-sheet__card">
      <header class="mq-head">
        <h2>Твой посох</h2>
        <button class="mq-icobtn" id="sheet-close" type="button" aria-label="Закрыть">✕</button>
      </header>
      <div class="mq-sheet__body" id="sheet-body"></div>
      <div class="mq-foot">
        <button class="mq-btn mq-btn--ghost" id="sheet-grade" type="button">Поменять класс</button>
      </div>
    </div>
  </div>

</div>

<script src="nooka-mq.js"></script>
</body>
</html>
