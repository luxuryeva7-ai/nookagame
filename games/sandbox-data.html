<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">

<title>Своя школа — Nooka</title>
<meta property="og:title" content="Своя школа для Нейро — Nooka">
<meta property="og:description" content="Научи Нейро узнавать что захочешь: придумай свои названия, нарисуй примеры и проверь, чему он научился.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nookagame.ru/games/sandbox-data.html">
<meta property="og:image" content="https://nookagame.ru/screenshots/og.jpg">

<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>
/* ============ СВОЯ ШКОЛА: песочница про данные ============
   Не уровень: правильного ответа нет, задачу ставит сам ребёнок. */
/* padding не должен раздувать карточки: с content-box две карточки по 50%
   не вставали в ряд и классы уходили в столбик на весь экран */
.sb *,.sb *::before,.sb *::after{box-sizing:border-box;}
.sbroot{min-height:100vh;max-width:520px;margin:0 auto;position:relative;
  background:linear-gradient(180deg,#161226 0%,#0F0B1E 62%,#090711 100%);}
.sb{display:flex;flex-direction:column;padding-bottom:26px;}

/* шапка */
.sbtop{display:flex;align-items:center;gap:10px;padding:14px 14px 0;}
.sbtop__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:17px;color:#F4EEFF;}
.sbtop__t span{display:block;margin-top:2px;font-family:var(--nk-body);font-weight:700;
  font-size:11.5px;color:#8B7BAE;}
.sbtop__x{margin-left:auto;width:38px;height:38px;flex-shrink:0;border:none;cursor:pointer;
  border-radius:12px;color:#B9A8D8;font-size:17px;font-weight:900;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}

/* переключатель режимов */
.sbmode{display:flex;gap:6px;margin:12px 14px 0;padding:5px;border-radius:16px;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.sbmode button{flex:1;border:none;cursor:pointer;border-radius:12px;padding:9px 4px;
  font-family:var(--nk-body);font-weight:800;font-size:12.5px;color:#9A8ABA;background:transparent;
  transition:color .15s,background .15s;}
.sbmode button.on{color:#0E0719;background:#FFD84D;}
.sbmode button:disabled{opacity:.35;cursor:default;}

/* подсказка режима */
.sbhow{margin:11px 14px 0;padding:11px 14px;border-radius:15px;text-align:center;
  font-weight:800;font-size:12.5px;line-height:1.45;color:#CBB8FF;
  background:rgba(169,139,255,.13);box-shadow:inset 0 0 0 1px rgba(169,139,255,.3);}
.sbhow b{color:#FFD84D;}

/* доска */
.sbboard{margin:12px 14px 0;border-radius:22px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#1A1430,#0D0A18);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);}
.sbboard canvas{width:100%;display:block;touch-action:none;cursor:crosshair;}
.sbboard__ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-weight:800;font-size:13px;color:#4A3E66;text-align:center;padding:0 30px;
  line-height:1.5;}

/* строка действий под доской */
.sbact{display:flex;gap:8px;margin:10px 14px 0;}
.sbact button{flex:1;border:none;cursor:pointer;border-radius:15px;padding:13px 8px;
  font-family:var(--nk-body);font-weight:900;font-size:13.5px;}
/* специфичность вместо !important: с ним inline-стиль не мог растянуть
   кнопку там, где она остаётся единственной в строке */
.sbact button.sbact__clr{flex:0 0 92px;color:#B9A8D8;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.sbact button.sbact__clr--wide{flex:1 1 auto;}
.sbact__add{color:#0E0719;background:#7FE7FF;box-shadow:0 3px 0 #2E9EBC;}
.sbact__add:disabled{opacity:.4;box-shadow:none;cursor:default;}

/* классы */
.sbcls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 14px 0;}
.sbcl{flex:1 1 calc(50% - 4px);min-width:0;padding:11px 12px;border-radius:18px;position:relative;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09);
  transition:box-shadow .15s,background .15s;}
.sbcl.pick{background:rgba(255,216,77,.12);box-shadow:inset 0 0 0 2px #FFD84D;}
.sbcl__h{display:flex;align-items:center;gap:7px;}
.sbcl__dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
/* width:0 + flex:1 — иначе input тянет свою ширину «по 20 символов»,
   карточка не влезает в половину экрана и классы уходят в столбик */
.sbcl__n{flex:1 1 0;width:0;min-width:0;border:none;background:transparent;padding:0;
  font-family:var(--nk-body);font-weight:900;font-size:13.5px;color:#F4EEFF;
  overflow:hidden;text-overflow:ellipsis;}
.sbcl__n:focus{outline:none;color:#FFD84D;}
.sbcl__del{width:22px;height:22px;flex-shrink:0;border:none;cursor:pointer;border-radius:7px;
  color:#8B7BAE;font-size:12px;font-weight:900;background:rgba(255,255,255,.07);padding:0;}
/* миниатюры 30px, а не 34: при 34 карточка не влезала в половину
   экрана телефона, и классы вставали в столбик на весь экран */
.sbcl__thumbs{display:flex;gap:4px;margin-top:9px;min-height:30px;align-items:center;
  overflow:hidden;}
.sbcl__thumbs img{width:30px;height:30px;border-radius:8px;flex-shrink:0;background:#100C1C;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.sbcl__more{font-weight:900;font-size:11px;color:#8B7BAE;align-self:center;}
.sbcl__none{font-weight:700;font-size:11.5px;color:#5E5080;}
/* счётчик стоит в строке заголовка, а не в углу: в углу он налезал
   на крестик удаления и читался как «✕3» */
.sbcl__cnt{flex-shrink:0;font-weight:900;font-size:11px;color:#8B7BAE;min-width:10px;
  text-align:right;}

.sbadd{flex:1 1 100%;border:none;cursor:pointer;border-radius:16px;padding:12px;
  font-family:var(--nk-body);font-weight:800;font-size:12.5px;color:#9A8ABA;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09);}

/* полоса состояния модели */
.sbstat{margin:14px 14px 0;padding:13px 15px;border-radius:18px;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.sbstat__r{display:flex;align-items:baseline;gap:8px;}
.sbstat__r b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:24px;color:#7FE7FF;}
.sbstat__r span{font-weight:800;font-size:12.5px;color:#9A8ABA;}
.sbstat__bar{height:8px;border-radius:99px;margin-top:9px;overflow:hidden;background:rgba(255,255,255,.07);}
.sbstat__bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7FE7FF,#A98BFF);
  transition:width .45s cubic-bezier(.2,.8,.3,1);}
.sbstat__n{margin-top:9px;font-weight:700;font-size:12px;line-height:1.45;color:#8B7BAE;}
.sbstat__n b{color:#DDD2F2;font-weight:900;}

/* живой ответ в режиме проверки */
.sblive{margin:12px 14px 0;padding:15px;border-radius:20px;
  background:rgba(127,231,255,.09);box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.28);}
.sblive--none{background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.sblive__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:19px;color:#F4EEFF;}
.sblive__t em{font-style:normal;color:#7FE7FF;}
.sblive__s{margin-top:3px;font-weight:700;font-size:12px;color:#8B7BAE;}
.sbshare{margin-top:12px;display:grid;gap:7px;}
.sbshare__r{display:flex;align-items:center;gap:9px;}
.sbshare__r i{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.sbshare__r b{flex:0 0 86px;font-weight:800;font-size:12px;color:#DDD2F2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sbshare__b{flex:1;height:9px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.07);}
.sbshare__b i{display:block;height:100%;width:0;border-radius:99px;
  transition:width .3s cubic-bezier(.2,.8,.3,1);}
.sbshare__p{flex:0 0 38px;text-align:right;font-weight:900;font-size:12px;color:#9A8ABA;}

/* «по какому примеру решил» */
.sbwhy{margin-top:12px;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;
  background:rgba(255,255,255,.05);}
.sbwhy img{width:44px;height:44px;border-radius:11px;flex-shrink:0;background:#100C1C;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.sbwhy span{font-weight:700;font-size:12px;line-height:1.45;color:#9A8ABA;}
.sbwhy span b{color:#DDD2F2;font-weight:900;}

/* счётчик поломок */
.sbbreak{margin:12px 14px 0;padding:14px 15px;border-radius:20px;text-align:center;
  background:rgba(255,107,107,.1);box-shadow:inset 0 0 0 1.5px rgba(255,107,107,.28);}
.sbbreak b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:26px;color:#FF9E9E;}
.sbbreak span{display:block;margin-top:3px;font-weight:800;font-size:12px;color:#C99;}

/* нижние кнопки */
.sbtools{display:flex;gap:8px;margin:14px 14px 0;}
.sbtools button{flex:1;border:none;cursor:pointer;border-radius:15px;padding:13px 8px;
  font-family:var(--nk-body);font-weight:800;font-size:12.5px;color:#B9A8D8;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.sbtools button:disabled{opacity:.4;cursor:default;}
.sbtools .sbtools__save{color:#0E0719;background:#FFD84D;box-shadow:0 3px 0 #C9A21E;}

/* полка сохранённых школ */
.sbshelf{margin:18px 14px 0;}
.sbshelf__h{font-weight:900;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  color:#6E5F92;margin-bottom:9px;}
.sbsaved{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:16px;
  margin-bottom:7px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.sbsaved__n{flex:1;min-width:0;}
.sbsaved__n b{display:block;font-weight:900;font-size:13px;color:#F4EEFF;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sbsaved__n span{display:block;margin-top:2px;font-weight:700;font-size:11.5px;color:#8B7BAE;}
.sbsaved button{flex-shrink:0;border:none;cursor:pointer;border-radius:11px;padding:9px 12px;
  font-family:var(--nk-body);font-weight:800;font-size:12px;color:#0E0719;background:#7FE7FF;}
.sbsaved button.sbsaved__del{color:#8B7BAE;background:rgba(255,255,255,.07);padding:9px 11px;}

/* модалка «что путается» */
.sbsheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(9,7,17,.72);backdrop-filter:blur(3px);animation:sbFade .2s ease-out;}
.sbsheet__c{width:100%;max-width:520px;max-height:82vh;overflow-y:auto;padding:20px 16px 26px;
  border-radius:26px 26px 0 0;background:#171128;
  box-shadow:0 -8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09);
  animation:sbUp .26s cubic-bezier(.2,.9,.3,1);}
.sbsheet__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:18px;color:#F4EEFF;
  margin-bottom:4px;}
.sbsheet__s{font-weight:700;font-size:12.5px;line-height:1.5;color:#9A8ABA;margin-bottom:14px;}
.sbmix{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:15px;margin-bottom:8px;
  background:rgba(255,255,255,.05);}
.sbmix img{width:42px;height:42px;border-radius:11px;flex-shrink:0;background:#100C1C;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.sbmix__t{flex:1;font-weight:700;font-size:12.5px;line-height:1.45;color:#9A8ABA;}
.sbmix__t b{color:#FFD84D;font-weight:900;}
.sbmix__t em{font-style:normal;color:#DDD2F2;font-weight:900;}
.sbsheet__ok{width:100%;margin-top:12px;border:none;cursor:pointer;border-radius:16px;padding:14px;
  font-family:var(--nk-body);font-weight:900;font-size:14px;color:#0E0719;background:#FFD84D;}
@keyframes sbFade{from{opacity:0}to{opacity:1}}
@keyframes sbUp{from{transform:translateY(40px)}to{transform:translateY(0)}}

/* быстрые имена классов */
.sbnames{display:flex;flex-wrap:wrap;gap:6px;margin:11px 14px 0;}
.sbnames button{border:none;cursor:pointer;border-radius:11px;padding:8px 11px;
  font-family:var(--nk-body);font-weight:800;font-size:12px;color:#B9A8D8;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}

/* на компьютере: слева доска и цифры, справа классы или ответ Нейро.
   Правая колонка не пустует ни в одном режиме — в этом весь смысл. */
@media(min-width:900px){
  /* ядро зажимает уровни в 408px (fitWide), чтобы они не растягивались
     на весь монитор. Песочнице нужна ширина: перебиваем по специфичности */
  #root>.sbroot{max-width:940px;}
  .sbroot{max-width:940px;}
  .sb{display:grid;grid-template-columns:420px 1fr;gap:0 20px;align-items:start;
    grid-template-areas:
      'top top' 'mode mode' 'how how'
      'board right' 'act right' 'stat right' 'tools right'
      'shelf shelf';}
  .sbtop{grid-area:top}.sbmode{grid-area:mode}.sbhow{grid-area:how}
  .sbboard{grid-area:board}.sbact{grid-area:act}
  .sbstat{grid-area:stat}.sbtools{grid-area:tools}.sbshelf{grid-area:shelf}
  .sbside{grid-area:right;margin-right:14px;}
  .sbside .sbcls,.sbside .sblive,.sbside .sbbreak,.sbside .sbnames{margin-left:0;margin-right:0;}
  .sbcls{align-content:start;}
  .sbcl__thumbs img{width:38px;height:38px;border-radius:10px;}
  .sbcl__thumbs{min-height:38px;}
  /* объяснение «по какому рисунку решил» в широкой колонке уже не жмётся */
  .sbwhy img{width:54px;height:54px;}
  .sbwhy span{font-size:12.5px;}
}
</style>

<body>
<div id="root"></div>

<script src="react-bundle.js"></script>
<script src="nooka-core.js"></script>
<script src="nooka-brain.js"></script>
<script src="nooka-gallery.js"></script>
<script>
/* ============================================================
   СВОЯ ШКОЛА — песочница к игре «Откуда ИИ знает».

   Отличие от уровня: задачу ставит ребёнок. Он сам придумывает,
   чему учить Нейро, сам называет классы своими словами и сам
   решает, когда получилось. Правильного ответа нет — есть его
   собственная модель и честная точность на его же примерах.

   Мозг — общий, в nooka-brain.js: тот же классификатор, что в
   уровнях. Если примеров мало или они похожи, Нейро промахнётся
   по-настоящему.
   ============================================================ */

const { useState, useRef, useEffect, useCallback } = React;
const B = window.nookaBrain;

const SIZE = 300;           // внутренний размер холста
const PEN = 9;
const MAX_CLASSES = 4;
const MAX_PER_CLASS = 12;
const MAX_SAVED = 6;
const KEY = 'nooka_sandbox_data';

const COLORS = ['#7FE7FF', '#FFD84D', '#A98BFF', '#7CE8B0'];
const QUICK = ['кот', 'собака', 'дом', 'дерево', 'машина', 'цветок',
  'рыба', 'звезда', 'человек', 'солнце', 'дракон', 'робот'];

function plural(n, a, b, c) { return window.nooka.plural(n, a, b, c); }

/* ── хранилище песочницы ── */
function loadSaved() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
}
function storeSaved(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list.slice(-MAX_SAVED))); } catch (e) {}
}

/* XP даём один раз за первую обученную школу — и своим ключом, чтобы
   не попасть в счётчики курса: песочница не уровень и «пройденной»
   миссией считаться не должна. */
function xpOnce() {
  try {
    if (localStorage.getItem('nooka_sbx_data_xp')) return false;
    localStorage.setItem('nooka_sbx_data_xp', '1');
    if (window.nooka && window.nooka.addXP) window.nooka.addXP(90);
    return true;
  } catch (e) { return false; }
}

/* ── доска ── */
function Board({ onStroke, tick }) {
  const cvRef = useRef(null);
  const st = useRef({ drawing: false, dirty: false });

  useEffect(() => {
    const cv = cvRef.current;
    const ctx = cv.getContext('2d');
    ctx.lineWidth = PEN;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#7FE7FF';

    const pos = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * SIZE, (e.clientY - r.top) / r.height * SIZE];
    };
    const down = e => {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      st.current.drawing = true;
      st.current.dirty = true;
      const [x, y] = pos(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
      /* точка под пальцем: без неё одиночный тап не оставляет следа */
      ctx.lineTo(x + 0.01, y);
      ctx.stroke();
    };
    const move = e => {
      if (!st.current.drawing) return;
      const [x, y] = pos(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    };
    const up = () => {
      if (!st.current.drawing) return;
      st.current.drawing = false;
      onStroke(cv);
    };

    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', up);
    return () => {
      cv.removeEventListener('pointerdown', down);
      cv.removeEventListener('pointermove', move);
      cv.removeEventListener('pointerup', up);
      cv.removeEventListener('pointercancel', up);
      cv.removeEventListener('pointerleave', up);
    };
  }, [onStroke]);

  /* очистка приходит снаружи сменой tick */
  useEffect(() => {
    const cv = cvRef.current;
    cv.getContext('2d').clearRect(0, 0, SIZE, SIZE);
    st.current.dirty = false;
  }, [tick]);

  return React.createElement('canvas', { ref: cvRef, width: SIZE, height: SIZE });
}

/* уменьшенная картинка рисунка — для карточек классов и объяснений */
function thumbOf(cv) {
  const t = document.createElement('canvas');
  t.width = 64; t.height = 64;
  const c = t.getContext('2d');
  c.fillStyle = '#140F24';
  c.fillRect(0, 0, 64, 64);
  c.drawImage(cv, 0, 0, 64, 64);
  try { return t.toDataURL('image/png'); } catch (e) { return ''; }
}

/* ── карточка школы для галереи ── */
function cardSVG(classes, model, acc) {
  const names = classes.filter(c => model.some(m => m.label === c.id)).map(c => c.name);
  const esc = s => String(s).replace(/[<>&]/g, m => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m]));
  const line = names.join(' · ');
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#1A1430"/><stop offset="1" stop-color="#0D0A18"/>' +
    '</linearGradient></defs>' +
    '<rect width="320" height="200" rx="22" fill="url(#g)"/>' +
    '<text x="24" y="44" fill="#8B7BAE" font-family="Nunito,sans-serif" font-size="12" ' +
    'font-weight="800" letter-spacing="1.4">МОЯ ШКОЛА ДЛЯ НЕЙРО</text>' +
    '<text x="24" y="82" fill="#F4EEFF" font-family="Unbounded,Nunito,sans-serif" font-size="19" ' +
    'font-weight="700">Узнаёт:</text>' +
    '<text x="24" y="110" fill="#7FE7FF" font-family="Nunito,sans-serif" font-size="16" ' +
    'font-weight="900">' + esc(line.length > 32 ? line.slice(0, 31) + '…' : line) + '</text>' +
    '<text x="24" y="152" fill="#DDD2F2" font-family="Nunito,sans-serif" font-size="14" ' +
    'font-weight="800">' + model.length + ' ' + plural(model.length, 'пример', 'примера', 'примеров') +
    ' · точность ' + acc + '%</text>' +
    '<text x="24" y="176" fill="#6E5F92" font-family="Nunito,sans-serif" font-size="11" ' +
    'font-weight="700">Nooka · nookagame.ru</text>' +
    '</svg>';
}

/* ============================================================ */
function Sandbox() {
  const [classes, setClasses] = useState([
    { id: 'c1', name: '', color: COLORS[0] },
    { id: 'c2', name: '', color: COLORS[1] },
  ]);
  const [model, setModel] = useState([]);
  const [mode, setMode] = useState('learn');      // learn | test | break
  const [pick, setPick] = useState('c1');
  const [tick, setTick] = useState(0);            // смена = очистить доску
  const [ready, setReady] = useState(false);      // на доске есть рисунок
  const [live, setLive] = useState(null);         // ответ в режиме проверки
  const [breaks, setBreaks] = useState(0);
  const [tries, setTries] = useState(0);
  const [target, setTarget] = useState(null);     // что загадано «сломать»
  const [verdict, setVerdict] = useState(null);   // итог последней попытки
  const [sheet, setSheet] = useState(false);
  const [saved, setSaved] = useState(loadSaved);
  const [toast, setToast] = useState('');
  const lastCv = useRef(null);

  const check = B.selfCheck(model);
  const filled = classes.filter(c => model.some(m => m.label === c.id));
  const canTest = filled.length >= 2 && model.length >= 4;

  useEffect(() => {
    if (!canTest && mode !== 'learn') setMode('learn');
  }, [canTest, mode]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(''), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const nameOf = id => {
    const c = classes.find(x => x.id === id);
    if (!c) return '?';
    return c.name.trim() || 'Без имени';
  };
  const colorOf = id => (classes.find(x => x.id === id) || {}).color || '#7FE7FF';

  /* ── рисунок закончен ── */
  const onStroke = useCallback(cv => {
    lastCv.current = cv;
    const got = B.features(cv);
    setReady(!!got);
    if (!got) { setLive(null); return; }
    if (mode === 'learn') return;
    setLive(B.predict(model, got.f));
  }, [mode, model]);

  const clear = () => { setTick(t => t + 1); setReady(false); setLive(null); };

  /* ── добавить пример в класс ── */
  const addExample = () => {
    const cv = lastCv.current;
    if (!cv) return;
    const got = B.features(cv);
    if (!got) return;
    const mine = model.filter(m => m.label === pick).length;
    if (mine >= MAX_PER_CLASS) {
      setToast('В этом классе уже ' + MAX_PER_CLASS + ' примеров — хватит');
      return;
    }
    setModel(m => m.concat([{ f: got.f, label: pick, thumb: thumbOf(cv) }]));
    clear();
  };

  /* ── режим «Ломаю»: задание даёт игра, засчитывает тоже она ──
     Раньше ребёнок сам жал «сломал», и счётчик можно было накрутить,
     ничего не сломав. Теперь загадан конкретный класс: нарисуй его так,
     чтобы Нейро назвал другой. Проверка честная — по ответу модели. */
  const newTarget = (from) => {
    const pool = (from || filled).map(c => c.id);
    if (!pool.length) { setTarget(null); return; }
    const next = pool[Math.floor(Math.random() * pool.length)];
    setTarget(pool.length > 1 && next === target
      ? pool[(pool.indexOf(next) + 1) % pool.length]
      : next);
  };

  const judge = () => {
    if (!live || !target) return;
    setTries(t => t + 1);
    if (live.label !== target) {
      setBreaks(b => b + 1);
      setVerdict({ ok: true, said: live.label, was: target });
      setTimeout(() => { clear(); setVerdict(null); newTarget(); }, 1700);
    } else {
      setVerdict({ ok: false, said: live.label, was: target });
      setTimeout(() => setVerdict(null), 1700);
    }
  };

  /* ── классы ── */
  const rename = (id, v) => setClasses(cs => cs.map(c => (c.id === id ? { ...c, name: v.slice(0, 16) } : c)));
  const addClass = () => {
    if (classes.length >= MAX_CLASSES) return;
    const id = 'c' + (Date.now() % 100000);
    setClasses(cs => cs.concat([{ id: id, name: '', color: COLORS[cs.length % COLORS.length] }]));
    setPick(id);
  };
  const delClass = id => {
    if (classes.length <= 2) { setToast('Меньше двух не бывает — сравнивать не с чем'); return; }
    setClasses(cs => cs.filter(c => c.id !== id));
    setModel(m => m.filter(x => x.label !== id));
    if (pick === id) setPick(classes.filter(c => c.id !== id)[0].id);
  };

  /* ── сохранить школу ── */
  const save = () => {
    if (!canTest) return;
    /* «солнце, домик и ёлка», а не «солнце и домик и ёлка» */
    const ns = filled.map(c => c.name.trim() || 'без имени');
    const nm = ns.length > 1
      ? ns.slice(0, -1).join(', ') + ' и ' + ns[ns.length - 1]
      : ns.join('');
    const item = {
      id: 's' + Date.now().toString(36),
      name: nm.length > 30 ? nm.slice(0, 29) + '…' : nm,
      at: Date.now(), acc: check.acc,
      classes: classes, model: model,
    };
    const list = loadSaved().concat([item]).slice(-MAX_SAVED);
    storeSaved(list);
    setSaved(list);
    const fresh = xpOnce();
    try {
      if (window.nookaGallery) {
        window.nookaGallery.add({
          kind: 'pet', game: 'Своя школа',
          title: 'Школа: ' + item.name,
          note: 'Нейро научен на ' + model.length + ' ' +
            plural(model.length, 'примере', 'примерах', 'примерах') +
            '. Точность ' + check.acc + '%',
          svg: cardSVG(classes, model, check.acc),
        });
      }
    } catch (e) {}
    setToast(fresh ? 'Сохранено! +90 очков за первую школу' : 'Школа сохранена в коллекцию');
  };

  const open = item => {
    setClasses(item.classes);
    setModel(item.model);
    setPick(item.classes[0].id);
    setMode('learn');
    clear();
    setToast('Открыл школу «' + item.name + '» — можно доучивать');
  };
  const removeSaved = id => {
    const list = loadSaved().filter(x => x.id !== id);
    storeSaved(list); setSaved(list);
  };

  /* ── тексты подсказок ── */
  const how = {
    learn: filled.length < 2
      ? 'Придумай <b>два разных</b> слова и нарисуй к каждому примеры. Чему учить — решаешь ты'
      : 'Рисуй ещё примеры. Чем больше и чем разнее — тем лучше Нейро узнаёт',
    test: 'Нарисуй что-нибудь <b>новое</b> и смотри, что скажет Нейро',
    break: target
      ? 'Нарисуй <b>' + nameOf(target) + '</b> так, чтобы Нейро назвал это по-другому'
      : 'Сначала научи Нейро хотя бы двум словам',
  }[mode];

  const ghost = {
    learn: 'Рисуй пальцем или мышкой',
    test: 'Нарисуй — Нейро угадает',
    break: target ? 'Нарисуй «' + nameOf(target) + '» похоже на другое' : 'Обмани Нейро',
  }[mode];

  return React.createElement('div', { className: 'sbroot' },
    React.createElement('div', { className: 'sb' },

      /* шапка */
      React.createElement('div', { className: 'sbtop' },
        React.createElement('div', { className: 'sbtop__t' }, 'Своя школа',
          React.createElement('span', null, 'Учи Нейро чему хочешь')),
        React.createElement('button', {
          className: 'sbtop__x', onClick: () => { window.location.href = 'game.html?g=data'; },
          'aria-label': 'Закрыть',
        }, '✕')),

      /* режимы */
      React.createElement('div', { className: 'sbmode' },
        React.createElement('button', {
          className: mode === 'learn' ? 'on' : '', onClick: () => { setMode('learn'); clear(); },
        }, 'Учу'),
        React.createElement('button', {
          className: mode === 'test' ? 'on' : '', disabled: !canTest,
          onClick: () => { setMode('test'); clear(); },
        }, 'Проверяю'),
        React.createElement('button', {
          className: mode === 'break' ? 'on' : '', disabled: !canTest,
          onClick: () => { setMode('break'); clear(); setVerdict(null); newTarget(); },
        }, 'Ломаю')),

      React.createElement('div', { className: 'sbhow', dangerouslySetInnerHTML: { __html: how } }),

      /* доска */
      React.createElement('div', { className: 'sbboard' },
        React.createElement(Board, { onStroke: onStroke, tick: tick }),
        !ready && React.createElement('div', { className: 'sbboard__ghost' }, ghost)),

      /* действия под доской */
      React.createElement('div', { className: 'sbact' },
        React.createElement('button', {
          /* в проверке стирать — единственное действие, поэтому кнопка во всю
             ширину: вторая («Ещё раз») делала ровно то же самое */
          className: 'sbact__clr' + (mode === 'test' ? ' sbact__clr--wide' : ''),
          onClick: clear,
        }, mode === 'test' ? 'Стереть и нарисовать другое' : 'Стереть'),
        mode === 'learn' && React.createElement('button', {
          className: 'sbact__add', disabled: !ready, onClick: addExample,
        }, ready ? 'В класс «' + nameOf(pick) + '»' : 'Сначала нарисуй'),
        mode === 'break' && React.createElement('button', {
          className: 'sbact__add', disabled: !ready || !!verdict,
          style: { background: '#FF9E9E', boxShadow: '0 3px 0 #B55' },
          onClick: judge,
        }, 'Проверить')),

      /* правая колонка на компьютере: либо классы, либо ответ Нейро */
      React.createElement('div', { className: 'sbside' },

      /* классы */
      mode === 'learn' && React.createElement('div', { className: 'sbcls' },
        classes.map(c => {
          const mine = model.filter(m => m.label === c.id);
          return React.createElement('div', {
            key: c.id, className: 'sbcl' + (pick === c.id ? ' pick' : ''),
            onClick: () => setPick(c.id),
          },
            React.createElement('div', { className: 'sbcl__h' },
              React.createElement('i', { className: 'sbcl__dot', style: { background: c.color } }),
              React.createElement('input', {
                className: 'sbcl__n', value: c.name, placeholder: 'Напиши слово',
                maxLength: 16,
                onClick: e => e.stopPropagation(),
                onChange: e => rename(c.id, e.target.value),
              }),
              React.createElement('div', { className: 'sbcl__cnt' }, mine.length || ''),
              classes.length > 2 && React.createElement('button', {
                className: 'sbcl__del',
                onClick: e => { e.stopPropagation(); delClass(c.id); },
                'aria-label': 'Убрать класс',
              }, '✕')),
            React.createElement('div', { className: 'sbcl__thumbs' },
              mine.length
                ? mine.slice(-4).map((m, k) => React.createElement('img', { key: k, src: m.thumb, alt: '' }))
                  .concat(mine.length > 4
                    ? [React.createElement('span', { key: 'm', className: 'sbcl__more' }, '+' + (mine.length - 4))]
                    : [])
                : React.createElement('span', { className: 'sbcl__none' }, 'пока пусто')));
        }),
        classes.length < MAX_CLASSES && React.createElement('button', {
          className: 'sbadd', onClick: addClass,
        }, '+ Ещё одно слово')),

      /* быстрые имена — чтобы начать, не придумывая */
      mode === 'learn' && !classes.every(c => c.name.trim()) &&
        React.createElement('div', { className: 'sbnames' },
          window.nooka.shuffled(QUICK.slice()).slice(0, 6).map(w =>
            React.createElement('button', {
              key: w,
              onClick: () => {
                const empty = classes.find(c => !c.name.trim());
                if (empty) rename(empty.id, w);
              },
            }, w))),

      /* живой ответ */
      mode === 'test' && React.createElement('div', {
        className: 'sblive' + (live ? '' : ' sblive--none'),
      },
        live
          ? React.createElement(React.Fragment, null,
            React.createElement('div', { className: 'sblive__t' },
              live.unsure ? 'Похоже на ' : 'Это ',
              React.createElement('em', null, nameOf(live.label)),
              live.unsure ? '… но я не уверен' : ''),
            React.createElement('div', { className: 'sblive__s' },
              live.unsure
                ? 'Ничего похожего в твоих примерах нет — я взял самое близкое'
                : 'Уверенность ' + live.conf + '%'),
            React.createElement('div', { className: 'sbshare' },
              live.shares.map(s => React.createElement('div', { key: s.label, className: 'sbshare__r' },
                React.createElement('i', { style: { background: colorOf(s.label) } }),
                React.createElement('b', null, nameOf(s.label)),
                React.createElement('div', { className: 'sbshare__b' },
                  React.createElement('i', {
                    style: { width: s.share + '%', background: colorOf(s.label) },
                  })),
                React.createElement('div', { className: 'sbshare__p' }, s.share + '%')))),
            live.near && model[live.near.i] && React.createElement('div', { className: 'sbwhy' },
              React.createElement('img', { src: model[live.near.i].thumb, alt: '' }),
              React.createElement('span', null,
                'Больше всего похоже вот на этот ',
                React.createElement('b', null, 'твой рисунок'),
                ' из класса «' + nameOf(model[live.near.i].label) + '»')))
          : React.createElement('div', { className: 'sblive__s' },
            'Нарисуй что-нибудь — покажу, что я про это думаю')),

      /* счётчик поломок */
      mode === 'break' && React.createElement('div', { className: 'sbbreak' },
        verdict
          ? React.createElement(React.Fragment, null,
            React.createElement('b', {
              style: { color: verdict.ok ? '#7CE8B0' : '#FFD84D', fontSize: 19 },
            }, verdict.ok ? 'Сломал!' : 'Не вышло'),
            React.createElement('span', null, verdict.ok
              ? 'Ты рисовал «' + nameOf(verdict.was) + '», а Нейро сказал «' +
                nameOf(verdict.said) + '»'
              : 'Нейро всё-таки узнал «' + nameOf(verdict.was) + '». Попробуй хитрее'))
          : React.createElement(React.Fragment, null,
            React.createElement('b', null, breaks),
            React.createElement('span', null, breaks
              ? plural(breaks, 'раз обманул', 'раза обманул', 'раз обманул') + ' Нейро' +
                (tries ? ' из ' + tries : '')
              : 'Пока ни разу не обманул'),
            live && React.createElement('div', { className: 'sblive__s', style: { marginTop: 9 } },
              'Сейчас он говорит: ', React.createElement('b', {
                style: { color: colorOf(live.label) },
              }, nameOf(live.label)), ' — ' + live.conf + '%')))),

      /* состояние модели */
      React.createElement('div', { className: 'sbstat' },
        React.createElement('div', { className: 'sbstat__r' },
          React.createElement('b', null, check.enough ? check.acc + '%' : '—'),
          React.createElement('span', null, check.enough
            ? 'узнаёт свои примеры'
            : 'нужно хотя бы три примера')),
        React.createElement('div', { className: 'sbstat__bar' },
          React.createElement('i', { style: { width: (check.enough ? check.acc : 0) + '%' } })),
        React.createElement('div', { className: 'sbstat__n' },
          React.createElement('b', null, model.length),
          ' ' + plural(model.length, 'пример', 'примера', 'примеров'),
          ' в ' + filled.length + ' ' + plural(filled.length, 'классе', 'классах', 'классах'),
          check.enough && check.wrong.length
            ? ' · путается в ' + check.wrong.length
            : '')),

      /* нижние кнопки */
      React.createElement('div', { className: 'sbtools' },
        React.createElement('button', {
          disabled: !check.enough || !check.wrong.length, onClick: () => setSheet(true),
        }, 'Что путается'),
        React.createElement('button', {
          className: 'sbtools__save', disabled: !canTest, onClick: save,
        }, 'Сохранить школу')),

      /* полка */
      saved.length > 0 && React.createElement('div', { className: 'sbshelf' },
        React.createElement('div', { className: 'sbshelf__h' }, 'Мои школы'),
        saved.slice().reverse().map(s => React.createElement('div', { key: s.id, className: 'sbsaved' },
          React.createElement('div', { className: 'sbsaved__n' },
            React.createElement('b', null, s.name),
            React.createElement('span', null, s.model.length + ' ' +
              plural(s.model.length, 'пример', 'примера', 'примеров') + ' · ' + s.acc + '%')),
          React.createElement('button', { onClick: () => open(s) }, 'Открыть'),
          React.createElement('button', {
            className: 'sbsaved__del', onClick: () => removeSaved(s.id), 'aria-label': 'Удалить',
          }, '✕'))))),

    /* «что путается» */
    sheet && React.createElement('div', { className: 'sbsheet', onClick: () => setSheet(false) },
      React.createElement('div', { className: 'sbsheet__c', onClick: e => e.stopPropagation() },
        React.createElement('div', { className: 'sbsheet__t' }, 'Вот что я путаю'),
        React.createElement('div', { className: 'sbsheet__s' },
          'Я проверил каждый твой рисунок по всем остальным. На этих я ошибся — ' +
          'значит, они слишком похожи на чужой класс. Дорисуй к ним побольше ' +
          'разных примеров, и я перестану путаться.'),
        check.wrong.map((w, k) => model[w.i] && React.createElement('div', { key: k, className: 'sbmix' },
          React.createElement('img', { src: model[w.i].thumb, alt: '' }),
          React.createElement('div', { className: 'sbmix__t' },
            'Ты сказал ', React.createElement('em', null, nameOf(w.was)),
            ', а я решил, что это ', React.createElement('b', null, nameOf(w.said))))),
        React.createElement('button', {
          className: 'sbsheet__ok', onClick: () => setSheet(false),
        }, 'Понятно, доучу'))),

    /* всплывашка */
    toast && React.createElement('div', {
      style: {
        position: 'fixed', left: '50%', bottom: 22, transform: 'translateX(-50%)', zIndex: 70,
        maxWidth: 'calc(100% - 28px)', padding: '12px 18px', borderRadius: 16,
        background: '#221838', color: '#F4EEFF', fontWeight: 800, fontSize: 13,
        boxShadow: '0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12)',
        textAlign: 'center',
      },
    }, toast));
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Sandbox, null));
</script>
