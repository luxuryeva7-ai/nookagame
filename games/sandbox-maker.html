<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>Мастерская — Nooka</title>
<meta property="og:title" content="Мастерская существ — Nooka">
<meta property="og:description" content="Напиши словами, кого хочешь, — и машина сделает ровно это. Чего не сказал, того не будет.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nookagame.ru/games/sandbox-maker.html">
<meta property="og:image" content="https://nookagame.ru/screenshots/og.jpg">
<meta property="og:site_name" content="Nooka">
<meta name="twitter:card" content="summary_large_image">

<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>
/* ============ МАСТЕРСКАЯ: песочница про запрос ============
   Единственное место курса, где ребёнок пишет словами, а не выбирает
   из карточек. Машина делает ровно написанное — и это видно. */
.mk *,.mk *::before,.mk *::after{box-sizing:border-box;}
.mkroot{min-height:100vh;max-width:520px;margin:0 auto;position:relative;
  background:linear-gradient(180deg,#1A1030 0%,#120B22 60%,#0A0614 100%);}
.mk{display:flex;flex-direction:column;min-height:100vh;padding-bottom:20px;}

/* шапка */
.mktop{display:flex;align-items:center;gap:10px;padding:13px 14px 0;}
.mktop__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:16px;color:#F4EEFF;}
.mktop__t span{display:block;margin-top:2px;font-family:var(--nk-body);font-weight:800;
  font-size:11px;color:#A794C9;}
.mktop__c{margin-left:auto;display:flex;gap:7px;}
.mktop__b{width:34px;height:34px;flex-shrink:0;border:none;cursor:pointer;border-radius:11px;padding:0;
  color:#CFC0EA;font-size:15px;font-weight:900;background:rgba(255,255,255,.07);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}

/* сцена с существом */
.mkstage{margin:12px 14px 0;border-radius:26px;position:relative;overflow:hidden;
  background:radial-gradient(90% 62% at 50% 6%,#3A2769 0%,#231747 42%,#140D26 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1),
    inset 0 -40px 60px -30px rgba(0,0,0,.6);}
.mkstage svg{width:100%;display:block;position:relative;z-index:2;}
/* свет лампы сверху и верстак снизу: существо стоит в мастерской,
   а не висит в пустом прямоугольнике */
.mkstage::before{content:'';position:absolute;left:50%;top:-56px;width:210px;height:210px;
  transform:translateX(-50%);border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(255,216,77,.22) 0%,rgba(255,216,77,0) 68%);}
.mkstage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34%;z-index:1;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(90,60,150,0) 0%,rgba(52,34,92,.55) 55%,rgba(30,19,56,.9) 100%);}
.mkstage__empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:0 34px;text-align:center;font-weight:800;font-size:13.5px;line-height:1.5;
  color:#5B4C80;pointer-events:none;}
.mkpop{animation:mkPop .5s cubic-bezier(.2,1.4,.4,1);}
@keyframes mkPop{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:scale(1);opacity:1}}

/* что машина поняла */
.mkread{margin:11px 14px 0;padding:12px 14px;border-radius:18px;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.mkread__h{font-weight:900;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:#7E6EA6;margin-bottom:8px;}
.mkchips{display:flex;flex-wrap:wrap;gap:6px;}
.mkchip{padding:6px 10px;border-radius:10px;font-weight:800;font-size:12px;
  color:#0E0719;background:#7CE8B0;}
.mkchip--miss{color:#FFC9C9;background:rgba(255,107,107,.18);
  box-shadow:inset 0 0 0 1px rgba(255,107,107,.35);}
.mkread__note{margin-top:9px;font-weight:700;font-size:12px;line-height:1.45;color:#9A8ABA;}
.mkread__note b{color:#FFD84D;font-weight:900;}

/* поле заказа */
.mkask{margin:12px 14px 0;}
.mkask textarea{width:100%;min-height:74px;resize:none;border:none;border-radius:18px;
  padding:14px 15px;font-family:var(--nk-body);font-weight:700;font-size:15px;line-height:1.45;
  color:#F4EEFF;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);}
.mkask textarea:focus{outline:none;box-shadow:inset 0 0 0 2px #FFD84D;}
.mkask textarea::placeholder{color:#6B5C90;font-weight:700;}

.mkgo{width:100%;margin-top:9px;border:none;cursor:pointer;border-radius:18px;padding:16px;
  font-family:var(--nk-body);font-weight:900;font-size:16px;color:#0E0719;
  background:#FFD84D;box-shadow:0 4px 0 #C9A21E;}
.mkgo:active{transform:translateY(2px);box-shadow:0 2px 0 #C9A21E;}
.mkgo:disabled{opacity:.45;box-shadow:none;cursor:default;}

/* подсказки-слова */
.mkhints{display:flex;flex-wrap:wrap;gap:6px;margin:10px 14px 0;}
.mkhints button{border:none;cursor:pointer;border-radius:11px;padding:8px 11px;
  font-family:var(--nk-body);font-weight:800;font-size:12px;color:#BFAFE0;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}

/* было и стало */
.mkdiff{margin:12px 14px 0;padding:12px;border-radius:18px;
  background:rgba(127,231,255,.08);box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.25);}
.mkdiff__h{font-weight:900;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:#6FB6CC;margin-bottom:9px;text-align:center;}
.mkdiff__r{display:flex;align-items:center;gap:10px;}
.mkdiff__c{flex:1;min-width:0;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.25);}
.mkdiff__c svg{width:100%;display:block;}
.mkdiff__c span{display:block;padding:5px;text-align:center;font-weight:800;font-size:10.5px;
  color:#8B7BAE;}
.mkdiff__a{flex-shrink:0;font-weight:900;font-size:17px;color:#7FE7FF;}

/* нижние действия */
.mkbar{display:flex;gap:8px;margin:12px 14px 0;}
.mkbar button{flex:1;border:none;cursor:pointer;border-radius:16px;padding:14px 8px;
  font-family:var(--nk-body);font-weight:900;font-size:13.5px;}
.mkkeep{color:#0E0719;background:#7CE8B0;box-shadow:0 3px 0 #3E9E6E;}
.mkkeep:disabled{opacity:.4;box-shadow:none;cursor:default;}
.mkagain{color:#B9A8D8;background:rgba(255,255,255,.07);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.11);}

/* полка */
.mkshelf{margin:18px 14px 0;}
.mkshelf__h{font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:#6E5F92;margin-bottom:9px;}
.mkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mkcell{border-radius:16px;overflow:hidden;cursor:pointer;position:relative;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.mkcell svg{width:100%;display:block;}
.mkcell b{display:block;padding:6px 7px 8px;font-weight:800;font-size:10.5px;line-height:1.3;
  color:#BFAFE0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mkcell__x{position:absolute;top:5px;right:5px;width:21px;height:21px;border:none;cursor:pointer;
  border-radius:7px;padding:0;color:#CBB;font-size:11px;font-weight:900;background:rgba(10,6,20,.75);}

/* инструкция */
.mkhelp{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(10,6,20,.9);backdrop-filter:blur(5px);}
.mkhelp__c{width:100%;max-width:400px;padding:24px 22px;border-radius:28px;
  background:linear-gradient(180deg,#221743,#150E28);
  box-shadow:0 20px 60px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.1);}
.mkhelp__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:21px;color:#F4EEFF;
  text-align:center;}
.mkstep{display:flex;align-items:center;gap:14px;margin-top:16px;}
.mkstep__i{width:50px;height:50px;flex-shrink:0;border-radius:16px;display:flex;
  align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.mkstep__t{font-weight:800;font-size:13.5px;line-height:1.45;color:#DDD2F2;}
.mkstep__t b{color:#FFD84D;font-weight:900;}
.mkhelp__go{width:100%;margin-top:22px;border:none;cursor:pointer;border-radius:17px;padding:16px;
  font-family:var(--nk-body);font-weight:900;font-size:15.5px;color:#0E0719;
  background:#FFD84D;box-shadow:0 4px 0 #C9A21E;}

@media(min-width:900px){
  #root>.mkroot{max-width:560px;}
  .mkroot{max-width:560px;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="react-bundle.js"></script>
<script src="nooka-core.js"></script>
<script src="nooka-levels.js"></script>
<script src="nooka-access.js"></script>
<script src="nooka-gallery.js"></script>
<script>
/* ============================================================
   МАСТЕРСКАЯ — песочница к игре «Как управлять ИИ».

   Единственное место курса, где ребёнок пишет словами, а не
   выбирает из карточек: во всех уровнях жест был «ткни вариант».

   Машина собирает существо ровно из того, что написано, и честно
   показывает три вещи: что поняла, чего ты не сказал и каких слов
   она не знает. Урок игры — «что не сказал, то и не появится» —
   виден руками, а не в тексте.
   ============================================================ */

const { useState, useRef, useEffect } = React;

const KEY = 'nooka_maker';
const SEEN = 'nooka_maker_seen';
const MAX_KEEP = 9;

/* ── словарь: что машина умеет понимать ──────────────────────
   Нарочно небольшой. Ребёнок быстро нащупывает границу «это она
   знает, а это нет» — и это само по себе половина урока. */
const COLORS = {
  'красн': '#FF6B6B', 'алый': '#FF5252', 'син': '#5AA9FF', 'голуб': '#7FE7FF',
  'зелён': '#6EDD9A', 'зелен': '#6EDD9A', 'жёлт': '#FFD84D', 'желт': '#FFD84D',
  'оранж': '#FFA94D', 'фиолет': '#A98BFF', 'сирен': '#C4A8FF', 'розов': '#FF8FD4',
  'чёрн': '#4A4560', 'черн': '#4A4560', 'бел': '#EFE9FF', 'сер': '#9A93B5',
  'золот': '#FFC94D', 'серебр': '#C9D4E8', 'коричн': '#B07A4E', 'бирюз': '#5BE3D0',
};
const COLOR_NAMES = {
  '#FF6B6B': 'красный', '#FF5252': 'алый', '#5AA9FF': 'синий', '#7FE7FF': 'голубой',
  '#6EDD9A': 'зелёный', '#FFD84D': 'жёлтый', '#FFA94D': 'оранжевый', '#A98BFF': 'фиолетовый',
  '#C4A8FF': 'сиреневый', '#FF8FD4': 'розовый', '#4A4560': 'чёрный', '#EFE9FF': 'белый',
  '#9A93B5': 'серый', '#FFC94D': 'золотой', '#C9D4E8': 'серебряный', '#B07A4E': 'коричневый',
  '#5BE3D0': 'бирюзовый',
};
const PARTS = {
  wings: ['крыл'], horns: ['рог'], tail: ['хвост'], ears: ['уш', 'ух'],
  spikes: ['шип', 'колюч'], legs: ['лап', 'ног'], arms: ['рук'],
  whisk: ['ус'], fangs: ['клык', 'зуб'],
};
const MOODS = { happy: ['весёл', 'весел', 'добр', 'счастлив', 'рад'],
  angry: ['зл', 'сердит', 'страшн', 'грозн'], sad: ['грустн', 'печальн'],
  sleepy: ['сонн', 'спит', 'уставш'], surprised: ['удивл', 'испуган'] };
const SKINS = { stripes: ['полоск', 'полосат'], dots: ['горош', 'пятн', 'крапин'],
  fur: ['пушист', 'мохнат', 'шерст'] };
const SIZES = { big: ['больш', 'огромн', 'гигантск'], small: ['маленьк', 'крошечн', 'мелк'] };
const SHAPES = { round: ['кругл', 'толст'], long: ['длинн', 'тонк', 'худ'],
  square: ['квадратн', 'прямоугольн'] };
/* числительные склоняются: ребёнок пишет «с тремя глазами», а не «три глаз».
   Первая версия знала только именительный падеж и делала два глаза вместо трёх. */
const NUMS = [
  [1, ['один', 'одним', 'одного', 'одна', 'одной', 'одну', 'одно', '1']],
  [2, ['два', 'две', 'двумя', 'двух', 'двое', '2']],
  [3, ['три', 'тремя', 'трёх', 'трех', 'трое', '3']],
  [4, ['четыре', 'четырьмя', 'четырёх', 'четырех', 'четверо', '4']],
  [5, ['пять', 'пятью', 'пяти', 'пятеро', '5']],
  [5, ['много', 'кучу', 'кучей']],
];

/* слова, которые машина знает, но которые ничего не задают —
   чтобы не ругаться на «дракон» и «пожалуйста» */
const NEUTRAL = ['дракон', 'зверь', 'зверя', 'монстр', 'существо', 'кот', 'кота', 'котик',
  'пёс', 'собака', 'птица', 'рыба', 'робот', 'сделай', 'нарисуй', 'хочу', 'пожалуйста',
  'мне', 'его', 'её', 'и', 'с', 'на', 'в', 'а', 'но', 'очень', 'чтобы', 'который'];

function hit(word, list) {
  return list.some(function (root) { return word.indexOf(root) === 0; });
}

/* ── разбор заказа ── */
function parse(text) {
  const words = (text || '').toLowerCase().replace(/[.,!?;:()"'—-]/g, ' ').split(/\s+/)
    .filter(Boolean);
  const spec = {
    color: null, size: 'normal', shape: 'round', mood: 'happy', skin: null,
    eyes: null, wings: false, horns: false, tail: false, ears: false,
    spikes: false, legs: null, arms: false, whisk: false, fangs: false,
  };
  const got = [];        // что поняла
  const unknown = [];    // каких слов не знает
  let pendingNum = null;

  words.forEach(function (w) {
    /* число запоминаем: «три глаза», «с четырьмя лапами» */
    let num = null;
    NUMS.forEach(function (pair) {
      if (num === null && pair[1].indexOf(w) > -1) num = pair[0];
    });
    if (num !== null) { pendingNum = num; return; }

    let used = false;

    Object.keys(COLORS).forEach(function (root) {
      if (!used && w.indexOf(root) === 0) {
        spec.color = COLORS[root];
        got.push(COLOR_NAMES[spec.color] || 'цвет');
        used = true;
      }
    });
    if (used) { pendingNum = null; return; }

    Object.keys(SIZES).forEach(function (k) {
      if (!used && hit(w, SIZES[k])) { spec.size = k; got.push(k === 'big' ? 'большой' : 'маленький'); used = true; }
    });
    Object.keys(SHAPES).forEach(function (k) {
      if (!used && hit(w, SHAPES[k])) { spec.shape = k; got.push(k === 'round' ? 'круглый' : k === 'long' ? 'длинный' : 'квадратный'); used = true; }
    });
    Object.keys(MOODS).forEach(function (k) {
      if (!used && hit(w, MOODS[k])) {
        spec.mood = k;
        got.push({ happy: 'весёлый', angry: 'злой', sad: 'грустный', sleepy: 'сонный', surprised: 'удивлённый' }[k]);
        used = true;
      }
    });
    Object.keys(SKINS).forEach(function (k) {
      if (!used && hit(w, SKINS[k])) {
        spec.skin = k;
        got.push({ stripes: 'в полоску', dots: 'в пятнышки', fur: 'пушистый' }[k]);
        used = true;
      }
    });
    if (!used && (w.indexOf('глаз') === 0 || w.indexOf('очей') === 0)) {
      spec.eyes = pendingNum || 2;
      got.push(spec.eyes + ' ' + window.nooka.plural(spec.eyes, 'глаз', 'глаза', 'глаз'));
      used = true;
    }
    if (!used) {
      Object.keys(PARTS).forEach(function (k) {
        if (used || !hit(w, PARTS[k])) return;
        if (k === 'legs') { spec.legs = pendingNum || 2; got.push(spec.legs + ' ' + window.nooka.plural(spec.legs, 'лапа', 'лапы', 'лап')); }
        else {
          spec[k] = true;
          got.push({ wings: 'крылья', horns: 'рога', tail: 'хвост', ears: 'уши',
            spikes: 'шипы', arms: 'руки', whisk: 'усы', fangs: 'клыки' }[k]);
        }
        used = true;
      });
    }
    if (!used && NEUTRAL.indexOf(w) > -1) used = true;
    if (!used && w.length > 2) unknown.push(w);
    pendingNum = null;
  });

  /* чего не сказал — машина решает сама, и об этом честно сообщает */
  const guessed = [];
  if (!spec.color) { spec.color = '#A98BFF'; guessed.push('цвет'); }
  if (spec.eyes === null) { spec.eyes = 2; guessed.push('сколько глаз'); }
  if (spec.legs === null) { spec.legs = 2; guessed.push('сколько лап'); }

  return { spec: spec, got: got, unknown: unknown.slice(0, 4), guessed: guessed };
}

/* ── рисуем существо по разбору ───────────────────────────────
   Всё из примитивов: любая комбинация слов должна дать картинку,
   а не пустое место. */
/* осветлить/затемнить цвет — для объёма: плоская заливка читается
   как схема, а не как персонаж */
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
    return Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))));
  });
  return '#' + c.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
}

let crSeq = 0;

function Creature({ spec, size, still }) {
  const s = spec;
  const W = 300, H = 266;   // кадр плотнее: сверху было много пустоты
  const uid = useRef(null);
  if (uid.current === null) uid.current = 'cr' + (++crSeq);
  const gid = uid.current;

  /* моргание: веки закрываются коротко и не по расписанию — с ровным
     интервалом это читается как мигающая лампочка, а не как живое */
  const [blink, setBlink] = useState(false);
  useEffect(() => {
    if (still) return;
    let t1, t2;
    const loop = () => {
      t1 = setTimeout(() => {
        setBlink(true);
        t2 = setTimeout(() => { setBlink(false); loop(); }, 130);
      }, 2200 + Math.random() * 3200);
    };
    loop();
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [still]);

  const bodyW = s.size === 'big' ? 132 : s.size === 'small' ? 78 : 106;
  const bodyH = s.shape === 'long' ? bodyW * 1.42 : s.shape === 'square' ? bodyW : bodyW * 1.06;
  const cx = W / 2, cy = H / 2 + 12;
  const top = cy - bodyH / 2;
  const kids = [];
  const push = (el) => kids.push(el);

  /* хвост */
  if (s.tail) push(React.createElement('path', {
    key: 'tail', className: 'cr-tail',
    /* вправо и вниз: вверх он уходил ровно туда же, где крыло, и пропадал */
    d: 'M' + (cx + bodyW / 2 - 10) + ' ' + (cy + 4) +
       ' q58 10 62 56 q-22 -2 -30 -32 q-8 -14 -34 -12 Z',
    /* темнее тела: тем же цветом хвост за спиной просто исчезал */
    fill: shade(s.color, -0.28),
  }));
  /* крылья */
  if (s.wings) {
    [-1, 1].forEach(function (k) {
      push(React.createElement('path', {
        key: 'w' + k, className: 'cr-wing',
        d: 'M' + (cx + k * (bodyW / 2 - 6)) + ' ' + (cy - 10) +
           ' q' + (k * 62) + ' -46 ' + (k * 74) + ' 6' +
           ' q' + (k * -26) + ' 4 ' + (k * -46) + ' 22 Z',
        fill: shade(s.color, -0.18), opacity: 0.78,
      }));
    });
  }
  /* лапы */
  for (let i = 0; i < Math.min(s.legs, 5); i++) {
    const step = s.legs > 1 ? (i - (s.legs - 1) / 2) * (bodyW / (s.legs + 0.4)) : 0;
    push(React.createElement('rect', {
      key: 'l' + i, x: cx + step - 8, y: cy + bodyH / 2 - 12, width: 16, height: 34, rx: 8,
      fill: shade(s.color, -0.22),
    }));
    /* ступня: без неё лапа выглядит обрубком палки */
    push(React.createElement('ellipse', {
      key: 'lf' + i, cx: cx + step, cy: cy + bodyH / 2 + 20, rx: 11, ry: 6.5,
      fill: shade(s.color, -0.3),
    }));
  }
  /* руки */
  if (s.arms) [-1, 1].forEach(function (k) {
    push(React.createElement('rect', {
      key: 'a' + k, x: cx + k * (bodyW / 2) - 5, y: cy - 8, width: 10, height: 34, rx: 5,
      fill: s.color, transform: 'rotate(' + (k * 22) + ' ' + cx + ' ' + cy + ')',
    }));
  });
  /* тело */
  push(s.shape === 'square'
    ? React.createElement('rect', {
      key: 'b', className: 'cr-body', x: cx - bodyW / 2, y: top,
      width: bodyW, height: bodyH, rx: 22, fill: 'url(#' + gid + 'g)',
    })
    : React.createElement('ellipse', {
      key: 'b', className: 'cr-body', cx: cx, cy: cy,
      rx: bodyW / 2, ry: bodyH / 2, fill: 'url(#' + gid + 'g)',
    }));
  /* блик сверху слева — от лампы мастерской */
  push(React.createElement('ellipse', {
    key: 'gloss', cx: cx - bodyW * 0.17, cy: cy - bodyH * 0.27,
    rx: bodyW * 0.2, ry: bodyH * 0.13, fill: '#fff', opacity: 0.16,
    transform: 'rotate(-18 ' + (cx - bodyW * 0.17) + ' ' + (cy - bodyH * 0.27) + ')',
  }));
  /* узор */
  if (s.skin === 'stripes') {
    for (let i = 0; i < 4; i++) push(React.createElement('rect', {
      key: 'st' + i, x: cx - bodyW / 2 + 8 + i * (bodyW / 4.6), y: top + 10,
      width: 7, height: bodyH - 20, rx: 3.5, fill: '#000', opacity: 0.16,
    }));
  }
  if (s.skin === 'dots') {
    [[-0.26, -0.2], [0.24, -0.1], [-0.1, 0.22], [0.3, 0.26], [-0.3, 0.1]].forEach(function (p, i) {
      push(React.createElement('circle', {
        key: 'dt' + i, cx: cx + p[0] * bodyW, cy: cy + p[1] * bodyH, r: 8,
        fill: '#000', opacity: 0.15,
      }));
    });
  }
  if (s.skin === 'fur') {
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      push(React.createElement('path', {
        key: 'fr' + i,
        d: 'M' + (cx + Math.cos(a) * bodyW / 2 * 0.96) + ' ' + (cy + Math.sin(a) * bodyH / 2 * 0.96) +
           ' l' + (Math.cos(a) * 12) + ' ' + (Math.sin(a) * 12),
        stroke: s.color, strokeWidth: 6, strokeLinecap: 'round',
      }));
    }
  }
  /* уши */
  if (s.ears) [-1, 1].forEach(function (k) {
    push(React.createElement('path', {
      key: 'e' + k,
      d: 'M' + (cx + k * bodyW * 0.26) + ' ' + (top + 8) +
         ' l' + (k * 6) + ' -30 l' + (k * 20) + ' 22 Z',
      fill: s.color,
    }));
  });
  /* рога */
  if (s.horns) [-1, 1].forEach(function (k) {
    push(React.createElement('path', {
      key: 'h' + k,
      d: 'M' + (cx + k * bodyW * 0.22) + ' ' + (top + 6) +
         ' q' + (k * 4) + ' -30 ' + (k * 22) + ' -34 q' + (k * -10) + ' 16 ' + (k * -8) + ' 34 Z',
      fill: '#EFE9FF', opacity: 0.85,
    }));
  });
  /* шипы по спине */
  if (s.spikes) {
    /* гребнем по дуге спины, а не по макушке: на макушке шипы совпадали
       с рогами и их было не видно */
    for (let i = 0; i < 5; i++) {
      const a = (-0.84 + i * 0.17) * Math.PI;   // гребень по верху спины
      const px = cx + Math.cos(a) * bodyW * 0.5, py = cy + Math.sin(a) * bodyH * 0.5;
      const len = 20;
      push(React.createElement('path', {
        key: 'sp' + i,
        d: 'M' + (px + Math.cos(a + 1.2) * 8) + ' ' + (py + Math.sin(a + 1.2) * 8) +
           ' L' + (px + Math.cos(a) * len) + ' ' + (py + Math.sin(a) * len) +
           ' L' + (px + Math.cos(a - 1.2) * 8) + ' ' + (py + Math.sin(a - 1.2) * 8) + ' Z',
        fill: '#EFE9FF', opacity: 0.8,
      }));
    }
  }
  /* глаза */
  const eyes = Math.max(1, Math.min(s.eyes, 5));
  for (let i = 0; i < eyes; i++) {
    const step = eyes > 1 ? (i - (eyes - 1) / 2) * Math.min(30, bodyW / (eyes + 0.6)) : 0;
    const ex = cx + step, ey = cy - bodyH * 0.16;
    const r = eyes > 3 ? 9 : 12;
    push(React.createElement('circle', { key: 'ew' + i, cx: ex, cy: ey, r: r, fill: '#fff' }));
    const look = s.mood === 'sleepy' ? 0 : s.mood === 'angry' ? 2 : 0;
    push(React.createElement('circle', {
      key: 'ep' + i, cx: ex, cy: ey + look, r: r * (s.mood === 'surprised' ? 0.62 : 0.45),
      fill: '#22183A',
    }));
    if (s.mood === 'sleepy') push(React.createElement('rect', {
      key: 'el' + i, x: ex - r, y: ey - r, width: r * 2, height: r, rx: 2, fill: shade(s.color, -0.12),
    }));
    /* веко: при моргании накрывает глаз целиком */
    if (!still && s.mood !== 'sleepy') push(React.createElement('rect', {
      key: 'bl' + i, className: 'cr-lid', x: ex - r - 1, y: ey - r - 1,
      width: r * 2 + 2, height: r * 2 + 2, rx: r, fill: shade(s.color, -0.1),
      style: { transform: 'scaleY(' + (blink ? 1 : 0) + ')' },
    }));
    if (s.mood === 'angry') push(React.createElement('path', {
      key: 'eb' + i, d: 'M' + (ex - r) + ' ' + (ey - r - 4) + ' l' + (r * 2) + ' 7',
      stroke: '#22183A', strokeWidth: 4, strokeLinecap: 'round',
    }));
  }
  /* рот */
  const my = cy + bodyH * 0.16;
  const mouth = s.mood === 'sad' || s.mood === 'angry'
    /* злой улыбался: брови хмурые, а рот добрый — и весь характер пропадал */
    ? 'M' + (cx - 17) + ' ' + (my + 7) + ' q17 -15 34 0'
    : s.mood === 'surprised'
      ? 'M' + (cx - 9) + ' ' + my + ' a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0'
      : s.mood === 'sleepy'
        ? 'M' + (cx - 12) + ' ' + my + ' l24 0'
        : 'M' + (cx - 18) + ' ' + my + ' q18 16 36 0';
  push(React.createElement('path', {
    key: 'm', d: mouth,
    fill: s.mood === 'surprised' ? '#22183A' : 'none',
    stroke: '#22183A', strokeWidth: 4, strokeLinecap: 'round',
  }));
  /* клыки */
  if (s.fangs) [-1, 1].forEach(function (k) {
    push(React.createElement('path', {
      key: 'f' + k, d: 'M' + (cx + k * 11) + ' ' + (my + 2) + ' l5 12 l5 -12 Z', fill: '#fff',
    }));
  });
  /* усы */
  if (s.whisk) [-1, 1].forEach(function (k) {
    [0, 7].forEach(function (dy, j) {
      push(React.createElement('path', {
        key: 'wh' + k + j,
        d: 'M' + (cx + k * 22) + ' ' + (my - 4 + dy) + ' l' + (k * 34) + ' ' + (dy ? 6 : -6),
        stroke: '#EFE9FF', strokeWidth: 3, strokeLinecap: 'round', opacity: 0.8,
      }));
    });
  });

  const defs = React.createElement('defs', { key: 'defs' },
    React.createElement('radialGradient', { id: gid + 'g', cx: '35%', cy: '28%', r: '78%' },
      React.createElement('stop', { offset: '0', stopColor: shade(s.color, 0.26) }),
      React.createElement('stop', { offset: '0.58', stopColor: s.color }),
      React.createElement('stop', { offset: '1', stopColor: shade(s.color, -0.3) })),
    React.createElement('radialGradient', { id: gid + 's', cx: '50%', cy: '50%', r: '50%' },
      React.createElement('stop', { offset: '0', stopColor: '#000', stopOpacity: 0.45 }),
      React.createElement('stop', { offset: '1', stopColor: '#000', stopOpacity: 0 })));

  /* тень на верстаке: без неё существо висит в воздухе */
  const shadow = React.createElement('ellipse', {
    key: 'sh', cx: cx, cy: cy + bodyH / 2 + 30, rx: bodyW * 0.52, ry: 11,
    fill: 'url(#' + gid + 's)',
  });

  return React.createElement('svg', {
    viewBox: '0 0 ' + W + ' ' + H, width: size || '100%',
    style: { display: 'block', overflow: 'visible' },
  },
    defs,
    !still && React.createElement('style', { key: 'st' }, LIFE_CSS),
    shadow,
    React.createElement('g', { key: 'all', className: still ? '' : 'cr-all' }, kids));
}

/* Существо должно казаться живым: статичная фигура читается как схема.
   Дыхание и покачивание — CSS, моргание — по таймеру, чтобы веки
   закрывались не в такт и это не выглядело механикой. */
const LIFE_CSS = `
.cr-body{transform-box:fill-box;transform-origin:center;animation:crBreath 3.4s ease-in-out infinite}
.cr-all{transform-box:fill-box;transform-origin:50% 90%;animation:crSway 5.2s ease-in-out infinite}
.cr-tail{transform-box:fill-box;transform-origin:0% 50%;animation:crTail 2.6s ease-in-out infinite}
.cr-wing{transform-box:fill-box;transform-origin:50% 90%;animation:crWing 1.9s ease-in-out infinite}
.cr-lid{transition:transform .12s ease-out;transform-box:fill-box;transform-origin:50% 0%}
@keyframes crBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.978)}}
@keyframes crSway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
@keyframes crTail{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes crWing{0%,100%{transform:rotate(-6deg) scaleY(1)}50%{transform:rotate(7deg) scaleY(.92)}}
@media(prefers-reduced-motion:reduce){
  .cr-body,.cr-all,.cr-tail,.cr-wing{animation:none}
}`;

/* ── хранилище полки ── */
function loadShelf() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
}
function storeShelf(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list.slice(-MAX_KEEP))); } catch (e) {}
}

const HINTS = ['синий', 'с крыльями', 'три глаза', 'в полоску', 'злой', 'большой',
  'с рогами', 'пушистый', 'четыре лапы', 'с хвостом'];

/* ── инструкция ── */
function Help({ onClose }) {
  const step = (ic, text) => React.createElement('div', { className: 'mkstep' },
    React.createElement('div', { className: 'mkstep__i' }, ic),
    React.createElement('div', { className: 'mkstep__t', dangerouslySetInnerHTML: { __html: text } }));
  return React.createElement('div', { className: 'mkhelp mk', onClick: onClose },
    React.createElement('div', { className: 'mkhelp__c', onClick: e => e.stopPropagation() },
      React.createElement('div', { className: 'mkhelp__t' }, 'Мастерская'),
      step('✍️', 'Напиши словами, <b>кого сделать</b>. Хоть «синий злой дракон с тремя глазами»'),
      step('🤖', 'Машина сделает <b>ровно то, что написано</b>. Чего не сказал — придумает сама'),
      step('🔁', 'Не то получилось — <b>допиши и сделай снова</b>. Увидишь, что изменилось'),
      React.createElement('button', { className: 'mkhelp__go', onClick: onClose }, 'Понятно, пишу')));
}

/* ============================================================ */
function Maker() {
  const [text, setText] = useState('');
  const [cur, setCur] = useState(null);      // текущий разбор
  const [prev, setPrev] = useState(null);    // предыдущий — для «было и стало»
  const [shelf, setShelf] = useState(loadShelf);
  const [kept, setKept] = useState(false);
  const [help, setHelp] = useState(() => {
    try { return !localStorage.getItem(SEEN); } catch (e) { return true; }
  });
  const taRef = useRef(null);

  useEffect(() => { storeShelf(shelf); }, [shelf]);

  const closeHelp = () => {
    setHelp(false);
    try { localStorage.setItem(SEEN, '1'); } catch (e) {}
  };

  const make = () => {
    const t = text.trim();
    if (!t) return;
    const r = parse(t);
    setPrev(cur);
    setCur({ ...r, text: t, at: Date.now() });
    setKept(false);
    /* мастерская засчитывается со второго заказа: первый — знакомство,
       второй означает, что ребёнок уже уточняет, а не просто пробует */
    try {
      const p = JSON.parse(localStorage.getItem('nooka_profile') || '{}');
      const done = p.missions && p.missions.maker1;
      /* тихо, без экрана победы: мастерская не заканчивается */
      if (!done && cur && window.nooka.completeMission) window.nooka.completeMission('maker1', 130);
    } catch (e) {}
  };

  const addWord = (w) => {
    const t = text.trim();
    setText(t ? t + ' ' + w : w);
    if (taRef.current) taRef.current.focus();
  };

  const keep = () => {
    if (!cur || kept) return;
    setShelf(list => list.concat([{ id: 'k' + Date.now().toString(36), spec: cur.spec, text: cur.text }]).slice(-MAX_KEEP));
    setKept(true);
    try {
      window.nookaGallery.add({
        kind: 'item', game: 'Мастерская',
        title: cur.text.length > 34 ? cur.text.slice(0, 33) + '…' : cur.text,
        note: 'Сделано по заказу словами. Машина поняла: ' +
          (cur.got.length ? cur.got.join(', ') : 'ничего — и придумала всё сама'),
        svg: svgOf(),
      });
    } catch (e) {}
  };

  /* Существо строкой — для галереи. Берём то, что уже нарисовано на сцене:
     отрисовать копию через createRoot нельзя — рендер асинхронный, и в
     галерею уходила пустая картинка. */
  function svgOf() {
    const el = document.querySelector('.mkstage svg');
    if (!el) return '';
    const copy = el.cloneNode(true);
    copy.setAttribute('style', 'width:100%;display:block');
    return copy.outerHTML;
  }

  const drop = (id) => setShelf(list => list.filter(x => x.id !== id));

  return React.createElement('div', { className: 'mkroot' },
    React.createElement('div', { className: 'mk' },

      React.createElement('div', { className: 'mktop' },
        React.createElement('div', { className: 'mktop__t' }, 'Мастерская',
          React.createElement('span', null, 'Напиши словами — машина сделает')),
        React.createElement('div', { className: 'mktop__c' },
          React.createElement('button', {
            className: 'mktop__b', onClick: () => setHelp(true), 'aria-label': 'Как играть',
          }, '?'),
          React.createElement('button', {
            className: 'mktop__b', 'aria-label': 'Закрыть',
            onClick: () => { window.location.href = 'game.html?g=control'; },
          }, '✕'))),

      React.createElement('div', { className: 'mkstage' },
        cur
          ? React.createElement('div', { className: 'mkpop', key: cur.at },
            React.createElement(Creature, { spec: cur.spec }))
          : React.createElement('div', { style: { paddingTop: '62%' } }),
        !cur && React.createElement('div', { className: 'mkstage__empty' },
          'Напиши внизу, кого сделать,\nи нажми кнопку')),

      /* что машина поняла */
      cur && React.createElement('div', { className: 'mkread' },
        React.createElement('div', { className: 'mkread__h' }, 'Что я понял'),
        React.createElement('div', { className: 'mkchips' },
          cur.got.length
            ? cur.got.map((g, i) => React.createElement('span', { key: i, className: 'mkchip' }, g))
            : React.createElement('span', { className: 'mkchip mkchip--miss' }, 'ничего не понял'),
          cur.unknown.map((u, i) => React.createElement('span', {
            key: 'u' + i, className: 'mkchip mkchip--miss',
          }, u + ' — не знаю'))),
        cur.guessed.length > 0 && React.createElement('div', { className: 'mkread__note' },
          'Ты не сказал, ', React.createElement('b', null, cur.guessed.join(' и ')),
          ' — я выбрал сам')),

      /* было и стало */
      prev && cur && React.createElement('div', { className: 'mkdiff' },
        React.createElement('div', { className: 'mkdiff__h' }, 'Что изменилось'),
        React.createElement('div', { className: 'mkdiff__r' },
          React.createElement('div', { className: 'mkdiff__c' },
            React.createElement(Creature, { spec: prev.spec, still: true }),
            React.createElement('span', null, 'было')),
          React.createElement('div', { className: 'mkdiff__a' }, '→'),
          React.createElement('div', { className: 'mkdiff__c' },
            React.createElement(Creature, { spec: cur.spec, still: true }),
            React.createElement('span', null, 'стало')))),

      React.createElement('div', { className: 'mkask' },
        React.createElement('textarea', {
          ref: taRef, value: text, maxLength: 160,
          placeholder: 'например: большой синий дракон с крыльями и тремя глазами',
          onChange: e => setText(e.target.value),
        }),
        React.createElement('button', {
          className: 'mkgo', disabled: !text.trim(), onClick: make,
        }, cur ? 'Сделать снова' : 'Сделать')),

      React.createElement('div', { className: 'mkhints' },
        window.nooka.shuffled(HINTS.slice()).slice(0, 5).map(w =>
          React.createElement('button', { key: w, onClick: () => addWord(w) }, '+ ' + w))),

      cur && React.createElement('div', { className: 'mkbar' },
        React.createElement('button', {
          className: 'mkagain', onClick: () => { setText(''); setCur(null); setPrev(null); },
        }, 'Начать заново'),
        React.createElement('button', {
          className: 'mkkeep', disabled: kept, onClick: keep,
        }, kept ? 'Уже на полке' : 'Оставить себе')),

      shelf.length > 0 && React.createElement('div', { className: 'mkshelf' },
        React.createElement('div', { className: 'mkshelf__h' }, 'Моя полка'),
        React.createElement('div', { className: 'mkgrid' },
          shelf.slice().reverse().map(it => React.createElement('div', {
            key: it.id, className: 'mkcell',
            onClick: () => { setText(it.text); setPrev(cur); setCur({ ...parse(it.text), text: it.text, at: Date.now() }); setKept(false); },
          },
            React.createElement(Creature, { spec: it.spec, still: true }),
            React.createElement('b', null, it.text),
            React.createElement('button', {
              className: 'mkcell__x', 'aria-label': 'Убрать',
              onClick: e => { e.stopPropagation(); drop(it.id); },
            }, '✕'))))) ),

    help && React.createElement(Help, { onClose: closeHelp }));
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Maker, null));
</script>
</body>
