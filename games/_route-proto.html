<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тропа — прототип</title>
<link rel="icon" href="../logo.svg">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{
  --ink:#F3EEFF;--ink-2:#A896C9;--ink-3:#6E5C90;
  --pri:#A98BFF;--pri-d:#7B4FF2;--ok:#4ED99B;--sun:#FFD84D;
  --brand:'Unbounded','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
  --tint:#4ED99B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0A0714}
body{font-family:var(--body);color:var(--ink);min-height:100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%,rgba(123,79,242,.28),transparent 62%),
    radial-gradient(700px 420px at 88% 18%,rgba(78,217,155,.10),transparent 60%),
    linear-gradient(180deg,#141026 0%,#0D0A1A 46%,#08060F 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.4px 1.4px at 12% 14%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 74% 8%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 33% 42%,#E9DFFF,transparent),
    radial-gradient(1.1px 1.1px at 88% 55%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 58% 76%,#FFE9B8,transparent),
    radial-gradient(1px 1px at 22% 88%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 95% 88%,#D9CCFF,transparent);}

.wrap{position:relative;max-width:460px;margin:0 auto;
  padding:16px 18px calc(40px + env(safe-area-inset-bottom))}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-weight:800;font-size:13.5px;color:var(--ink-2)}
.top .brand{font-family:var(--brand);font-weight:900;font-size:16px}
.top .brand em{font-style:normal;color:var(--pri)}

h1{font-family:var(--brand);font-weight:900;font-size:27px;line-height:1.1;letter-spacing:-.01em}
.h-sub{margin-top:6px;font-weight:800;font-size:13.5px;color:var(--tint)}

/* ── лента прогресса: липнет к верху, всегда видно, где ты ── */
.bar{position:sticky;top:0;z-index:9;margin:16px -18px 0;padding:11px 18px;
  display:flex;align-items:center;gap:12px;
  background:rgba(12,9,22,.82);backdrop-filter:blur(12px);
  box-shadow:0 1px 0 rgba(255,255,255,.07)}
.bar__n{font-family:var(--brand);font-weight:700;font-size:15px;white-space:nowrap}
.bar__n s{text-decoration:none;color:var(--ink-3)}
.bar__b{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.bar__b i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--tint),#fff8);box-shadow:0 0 12px var(--tint)}
.bar__xp{font-family:var(--brand);font-weight:700;font-size:14px;color:var(--sun);white-space:nowrap}

/* ── тропа ── */
.path{position:relative;margin-top:26px}
.path svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail-done{fill:none;stroke:var(--tint);stroke-width:5;stroke-linecap:round;opacity:.55;
  filter:drop-shadow(0 0 7px var(--tint))}
.trail-todo{fill:none;stroke:rgba(255,255,255,.16);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:2 13}

.node{position:absolute;transform:translateX(-50%);width:158px;
  display:flex;flex-direction:column;align-items:center;gap:9px}
.dot{position:relative;width:68px;height:68px;border-radius:26px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.13),0 8px 18px -8px #000;
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .2s}
.dot:hover{transform:translateY(-3px)}
.dot svg.g{width:31px;height:31px;color:#D6C8FF}
.dot i{position:absolute;right:-6px;bottom:-6px;min-width:23px;height:23px;padding:0 6px;
  border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-family:var(--brand);font-weight:700;font-size:11.5px;font-style:normal;
  color:#1B0F30;background:#CBB8FF;box-shadow:0 3px 8px -2px rgba(0,0,0,.7)}

/* пройденный — заливка цветом игры и печать */
.node.done .dot{background:linear-gradient(180deg,var(--tint),color-mix(in srgb,var(--tint) 62%,#0A0714));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3),0 10px 22px -10px var(--tint)}
.node.done .dot svg.g{color:#0A2A1C;opacity:.92}
.node.done .dot i{background:#0A2A1C;color:var(--tint);padding:0 4px;min-width:22px}
.node.done .dot i svg{width:13px;height:13px}
.node.done .cap{color:var(--ink-2)}

/* текущий — крупнее, дышит, с подписью-кнопкой */
.node.now .dot{width:88px;height:88px;border-radius:32px;
  background:linear-gradient(180deg,#B79BFF,#7B4FF2);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 14px 34px -12px #7B4FF2}
.node.now .dot svg.g{width:40px;height:40px;color:#fff}
.node.now .dot::after{content:'';position:absolute;inset:-9px;border-radius:40px;
  box-shadow:0 0 0 2.5px rgba(169,139,255,.55);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:.25;transform:scale(1.09)}}
.node.now .cap b{font-size:16px;color:#fff}
.go{margin-top:2px;padding:9px 22px;border-radius:999px;border:none;cursor:pointer;
  font-family:var(--brand);font-weight:700;font-size:13.5px;color:#33240A;
  background:linear-gradient(180deg,#FFF1B4,#FFD84D);box-shadow:0 4px 0 #C79412}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #C79412}

/* закрытый — приглушён */
.node.lock .dot{opacity:.5}
.node.lock .cap{opacity:.55}

.cap{text-align:center;line-height:1.25}
.cap b{display:block;font-weight:900;font-size:13.5px;color:var(--ink)}
.cap span{display:block;margin-top:4px;font-weight:600;font-size:12px;line-height:1.35;color:var(--ink-2)}

/* бонус — звезда в стороне от тропы */
.node.bonus .dot{border-radius:50%;
  background:linear-gradient(180deg,rgba(255,216,77,.22),rgba(255,216,77,.06));
  box-shadow:inset 0 0 0 1.5px rgba(255,216,77,.45)}
.node.bonus .dot svg.g{color:var(--sun)}

/* маскот сидит на текущем узле */
.pin{position:absolute;left:50%;top:-16px;transform:translate(-50%,-100%);pointer-events:none;
  font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:#0A0714;background:var(--sun);padding:4px 10px;border-radius:999px;
  box-shadow:0 6px 14px -6px #000;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="#">← Моя база</a>
    <span class="brand">Noo<em>ka</em></span>
  </div>
  <h1>Откуда ИИ знает</h1>
  <div class="h-sub">Данные и обучение</div>

  <div class="bar">
    <span class="bar__n">4 <s>из 10</s></span>
    <span class="bar__b"><i style="width:40%"></i></span>
    <span class="bar__xp">300 XP</span>
  </div>

  <div class="path" id="path"></div>
</div>

<svg style="display:none">
<symbol id="g-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></symbol>
<symbol id="g-brush" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3.5l5 5-8 8-5-5z"/><path d="M7.5 11.5l-3 6.5 6.5-3"/><path d="M4.5 18l-1.5 3 3-1.5"/></symbol>
<symbol id="g-ghost" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10a7 7 0 0114 0v10l-2.3-2-2.4 2-2.3-2-2.4 2z"/><circle cx="9.6" cy="10.5" r="1"/><circle cx="14.4" cy="10.5" r="1"/></symbol>
<symbol id="g-broom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3l7 7"/><path d="M12.5 6.5l5 5-8 8H4v-5z"/><path d="M8 11l5 5"/></symbol>
<symbol id="g-cat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9L5.5 3.5 10 7h4l4.5-3.5L20 9v5a8 8 0 01-16 0z"/><circle cx="9.5" cy="12" r=".9"/><circle cx="14.5" cy="12" r=".9"/><path d="M12 15v1.5M9.5 17h5"/></symbol>
<symbol id="g-loop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 3.5V7h-3.5"/></symbol>
<symbol id="g-stack" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5L12 21l9-4.5"/></symbol>
<symbol id="g-tags" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 3H20a1 1 0 011 1v7.5L11 21.5 2.5 13z"/><circle cx="16.8" cy="7.2" r="1.5"/></symbol>
<symbol id="g-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17a9 9 0 1117 0"/><path d="M12 17l4.5-5"/><circle cx="12" cy="17" r="1.6"/></symbol>
<symbol id="g-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9L12 4.5 21.5 9 12 13.5z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></symbol>
<symbol id="g-star" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.7 1.2 6.6L12 17.6l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"/></symbol>
<symbol id="g-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></symbol>
</svg>

<script src="nooka-levels.js"></script>
<script>
(function () {
  var g = window.nookaLevels.games[0];
  var DONE = 4;                       /* прототип: четыре уровня пройдены */
  var AMP  = 22;                      /* размах змейки, % ширины */
  var PHASE = 2.1;                    /* виток за три узла — зигзаг, а не диагональ */

  var host = document.getElementById('path');
  var items = g.levels.map(function (lv, i) {
    return { t: lv.t, sub: lv.goal || lv.s, g: lv.g,
             kind: i < DONE ? 'done' : (i === DONE ? 'now' : 'lock') };
  });
  var bonus = g.extras && g.extras[0];
  if (bonus) items.push({ t: bonus.t, sub: bonus.goal, g: 'star', kind: 'bonus' });

  /* Шаг разный: под текущим узлом живут цель и кнопка, ему нужно больше воздуха. */
  var pts = [], y = 50;
  items.forEach(function (it, i) {
    if (it.kind === 'now') y += 38;   /* над текущим узлом висит метка «ты здесь» */
    pts.push({ x: 50 + AMP * Math.sin(i * PHASE), y: y });
    y += (it.kind === 'now' ? 246 : 142);
  });
  var H = pts[pts.length - 1].y + 130;
  host.style.height = H + 'px';

  function d(from, to) {
    var s = '';
    for (var i = from; i <= to; i++) {
      var p = pts[i];
      if (i === from) { s += 'M' + p.x + ' ' + p.y; continue; }
      var q = pts[i - 1], my = (q.y + p.y) / 2;
      s += ' C' + q.x + ' ' + my + ' ' + p.x + ' ' + my + ' ' + p.x + ' ' + p.y;
    }
    return s;
  }
  var svg = '<svg viewBox="0 0 100 ' + H + '" preserveAspectRatio="none">' +
    '<path class="trail-todo" d="' + d(DONE, pts.length - 1) + '" vector-effect="non-scaling-stroke"/>' +
    '<path class="trail-done" d="' + d(0, DONE) + '" vector-effect="non-scaling-stroke"/>' +
    '</svg>';

  var html = items.map(function (it, i) {
    var p = pts[i];
    /* Цель уровня — только у текущего: иначе тропа тонет в тексте. */
    var sub = it.kind === 'now' ? '<span>' + it.sub + '</span>' : '';
    var badge = it.kind === 'done'
      ? '<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></i>'
      : '<i>' + (it.kind === 'bonus' ? '\u2605' : (i + 1)) + '</i>';
    return '<div class="node ' + it.kind + '" style="left:' + p.x + '%;top:' + (p.y - 34) + 'px">' +
      (it.kind === 'now' ? '<span class="pin">ты здесь</span>' : '') +
      '<button class="dot"><svg class="g"><use href="#g-' + it.g + '"></use></svg>' + badge + '</button>' +
      '<span class="cap"><b>' + it.t + '</b>' + sub + '</span>' +
      (it.kind === 'now' ? '<button class="go">Играть</button>' : '') +
      '</div>';
  }).join('');

  host.innerHTML = svg + html;
})();
</script>
</body>
</html>
