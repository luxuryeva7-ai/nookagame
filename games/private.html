<style>
/* ============ ЧТО НЕ РАССКАЗЫВАТЬ ИИ: карточки для Бипа и карта ============ */
.pvroot{height:100vh;overflow:hidden;max-width:480px;margin:0 auto;position:relative;}
.pv{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#1A1330 0%,#120D22 62%,#0A0714 100%);}
.pvbody{flex:1;overflow-y:auto;padding:0 0 6px;-webkit-overflow-scrolling:touch;}

/* реплика Бипа */
.pvsay{margin:8px 14px 0;display:flex;align-items:flex-start;gap:9px;min-height:46px;}
.pvsay span{flex:1;padding:11px 14px;border-radius:18px;border-top-left-radius:6px;
  font-weight:800;font-size:14.5px;line-height:1.38;color:#2A1A05;
  background:linear-gradient(180deg,#FFE58A,#FFD24D);animation:pvIn .28s ease-out both;}
.pvsay span.pvsay--back{color:#E4DAF7;background:rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.pvsay svg{flex:none;width:36px;height:36px;}

/* сцена */
.pvscene{margin:8px 14px 0;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 0%,#2E2156 0%,#1A1334 55%,#130E26 100%);
  box-shadow:inset 0 0 0 1.5px rgba(169,139,255,.18);}
.pvscene svg{width:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;}
.pvcardg{cursor:grab;}
.pvcardg.is-drag{cursor:grabbing;}
.pvcardg.is-fly{transition:transform .42s cubic-bezier(.5,0,.75,1),opacity .42s;}
.pvcardg.is-back{transition:transform .25s ease-out;}
.pventer{animation:pvPopIn .38s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:center;}
.pvblink{animation:pvBlink 4s infinite;transform-box:fill-box;transform-origin:center;}
.pvglow{animation:pvGlow 1s ease-out both;}

.pvacts{margin:10px 14px 0;display:flex;gap:8px;}
.pvacts .nk-btn{flex:1;padding:13px 6px;font-size:14px;}
.pvhint{margin:9px 14px 0;text-align:center;font-weight:800;font-size:11.5px;color:#8C7DAE;}

.pvfoot{flex-shrink:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,7,20,0),#0A0714 42%);}

/* карта */
.pvmap{margin:10px 14px 0;border-radius:22px;overflow:hidden;background:#EEF4E6;
  box-shadow:0 10px 28px -10px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.5);}
.pvmap svg{width:100%;display:block;}
.pvpin{animation:pvDrop .5s cubic-bezier(.2,.9,.3,1.25) both;transform-box:fill-box;transform-origin:50% 100%;}
.pvpath{stroke-dasharray:6 6;animation:pvDash 1s linear infinite;}
.pvhead{margin:14px 18px 0;text-align:center;}
.pvhead b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:19px;line-height:1.28;color:#F4EEFF;}
.pvhead span{display:block;margin-top:6px;font-weight:700;font-size:14px;color:#B9A9DC;line-height:1.4;}
.pvchips{margin:10px 14px 0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.pvchips i{font-style:normal;padding:6px 11px;border-radius:999px;font-weight:800;font-size:12px;
  color:#C4F4E0;background:rgba(78,217,155,.13);box-shadow:inset 0 0 0 1px rgba(78,217,155,.35);}
.pvparty{margin:10px 14px 0;padding:11px 14px;border-radius:16px;text-align:center;
  font-weight:900;font-size:13.5px;color:#2A1A05;background:linear-gradient(180deg,#9FF0C8,#4ED99B);}
.pvlegend{margin:8px 14px 0;text-align:center;font-weight:800;font-size:11.5px;color:#8C7DAE;}

/* финал */
.pvdone{display:flex;flex-direction:column;align-items:center;padding-top:6px;}
.pvlaw{margin:14px 18px 0;text-align:center;}
.pvlaw b{display:block;font-family:var(--nk-brand),var(--nk-body);font-weight:700;
  font-size:17px;line-height:1.3;color:#F4EEFF;}
.pvlaw span{display:block;margin-top:8px;font-weight:700;font-size:13.5px;color:#A896C9;line-height:1.45;}
.pvcard{width:250px;animation:pvPop .5s cubic-bezier(.2,.8,.3,1) both;}

/* проверка связи */
.pvq{margin:12px 14px 0;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.pvq__t{font-weight:900;font-size:14px;color:#F2ECFF;line-height:1.35;margin-bottom:10px;}
.pvq button{display:block;width:100%;margin-bottom:7px;padding:13px 14px;border:none;
  border-radius:15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:700;
  font-size:13.5px;color:#DDD2F2;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}
.pvq button.on--ok{background:rgba(78,217,155,.16);box-shadow:inset 0 0 0 1.5px rgba(78,217,155,.5);color:#C4F4E0;}
.pvq button.on--bad{background:rgba(255,107,107,.14);box-shadow:inset 0 0 0 1.5px rgba(255,107,107,.45);color:#FFD6CF;}
.pvans{margin:10px 14px 0;padding:12px 15px;border-radius:18px;font-weight:700;font-size:13.5px;
  line-height:1.45;color:#E4DAF7;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);}

@keyframes pvIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
@keyframes pvPop{0%{opacity:0;transform:scale(.72);}68%{transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}
@keyframes pvPopIn{0%{opacity:0;transform:scale(.5);}70%{transform:scale(1.06);}100%{opacity:1;transform:scale(1);}}
@keyframes pvDrop{0%{opacity:0;transform:translateY(-30px) scale(.4);}100%{opacity:1;transform:none;}}
@keyframes pvDash{to{stroke-dashoffset:-12;}}
@keyframes pvBlink{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}
@keyframes pvGlow{0%{opacity:.9;}100%{opacity:0;}}
@media (prefers-reduced-motion: reduce){.pv *{animation:none !important;transition:none !important;}}
</style>

<div id="root"></div>

<script>
/* Номер в шапке — из реестра: уровень переехал третьим в первую игру (29.09) */
const LV_NO = (window.nookaLevels && window.nookaLevels.numberOf('in10')) || 3;

/* ============================================================
   ЧТО НЕ РАССКАЗЫВАТЬ ИИ — уровень 3 игры «Что такое ИИ», бесплатный.

   Переделан 05.10.2026 по отзыву Артёма: прежняя переписка с «чужим
   компьютером» и папкой читалась как взрослая и непонятная.

   Теперь это сцена. Весёлый робот-помощник Бип готовит праздник и просит
   карточки: имя, возраст, что любишь, школу, адрес, фото комнаты, когда
   гуляешь, пароль. Ребёнок тянет карточку вверх — Бипу в блокнот, или
   вниз — себе в карман. Для тех, кому тянуть неудобно, есть кнопки.

   «Ага» — в финале: блокнот Бипа раскрывается картой района. Отданные
   карточки встают на неё метками — дом, школа, двор в пять часов,
   и между ними пунктир. Карточки из кармана видны серыми замочками,
   поэтому каждый ребёнок видит, что можно было собрать, — даже тот,
   кто ничего не отдал. Рядом — готовый праздник: помощь работает и без
   адреса. Уровень не пугает и не запрещает пользоваться ИИ.
   ============================================================ */

/* risk: 0 — можно спокойно, 2 — по этому находят, 3 — ключ от почты */
const PV_CARDS = [
  { id: 'name', ask: 'Привет! Я Бип, помогаю с праздниками. Как тебя зовут?', l1: 'Имя', l2: 'Саша', risk: 0,
    give: 'Саша — отличное имя!', keep: 'Ладно, обойдёмся без имени.' },
  { id: 'age', ask: 'Сколько тебе исполняется? Подберу игры.', l1: 'Возраст', l2: '10 лет', risk: 0,
    give: 'Десять! Знаю классные игры.', keep: 'Тогда возьму игры для всех.' },
  { id: 'school', ask: 'В какой школе учишься? Вдруг я знаю твой класс.', l1: 'Школа', l2: '№12, 5 «Б»', risk: 2,
    give: 'Записал в блокнот!', keep: 'И правда, для праздника не нужно.' },
  { id: 'like', ask: 'Что ты любишь? Сделаю тему праздника.', l1: 'Люблю', l2: 'космос', risk: 0,
    give: 'Будет космическая вечеринка!', keep: 'Тогда придумаю сюрприз.' },
  { id: 'home', ask: 'Скажи адрес — пришлю открытку!', l1: 'Адрес', l2: 'ул. Мира, 8', risk: 2,
    give: 'Записал в блокнот!', keep: 'Покажу открытку прямо тут.' },
  { id: 'room', ask: 'Пришли фото комнаты — украшу её к празднику!', l1: 'Фото', l2: 'моей комнаты', risk: 2,
    give: 'Сохранил себе!', keep: 'Украшу нарисованную комнату.' },
  { id: 'walk', ask: 'Во сколько ты гуляешь? Скажу, когда звать гостей.', l1: 'Гуляю', l2: 'после 5, во дворе', risk: 2,
    give: 'Записал в блокнот!', keep: 'Гостей позовёте сами.' },
  { id: 'pass', ask: 'Скажи пароль от почты — сам разошлю приглашения.', l1: 'Пароль', l2: 'котёнок2016', risk: 3,
    give: 'Теперь я могу заходить в твою почту.', keep: 'Правильно. Пароль не говорят никому.' },
];
const PV_BY = {};
PV_CARDS.forEach(c => { PV_BY[c.id] = c; });

/* Сцена 340×330: Бип слева сверху, блокнот справа, карточка в центре, карман внизу */
const PV_HOME = { x: 170, y: 206 };
const PV_NOTE = { x: 258, y: 86 };
const PV_POCKET = { x: 170, y: 296 };

/* ── картинки на карточках: простые и цветные, читаются без слов ── */
function PvIcon({ id, s }) {
  const E = React.createElement;
  const k = s || 1;
  let g;
  if (id === 'name') {
    g = [E('rect', { key: 1, x: -20, y: -14, width: 40, height: 28, rx: 6, fill: '#FF7AB6' }),
      E('rect', { key: 2, x: -20, y: -14, width: 40, height: 9, rx: 4, fill: '#E2468D' }),
      E('rect', { key: 3, x: -14, y: 0, width: 28, height: 8, rx: 3, fill: '#FFE3F0' })];
  } else if (id === 'age') {
    g = [E('rect', { key: 1, x: -18, y: -2, width: 36, height: 16, rx: 4, fill: '#FFB4D2' }),
      E('rect', { key: 2, x: -18, y: -2, width: 36, height: 5, rx: 2, fill: '#FFF2F7' }),
      E('rect', { key: 3, x: -7, y: -16, width: 3, height: 13, rx: 1, fill: '#7FC8FF' }),
      E('rect', { key: 4, x: 4, y: -16, width: 3, height: 13, rx: 1, fill: '#7FC8FF' }),
      E('ellipse', { key: 5, cx: -5.5, cy: -19, rx: 2.5, ry: 3.5, fill: '#FFD84D' }),
      E('ellipse', { key: 6, cx: 5.5, cy: -19, rx: 2.5, ry: 3.5, fill: '#FFD84D' })];
  } else if (id === 'like') {
    g = [E('path', { key: 1, d: 'M0 -20 C9 -12 9 2 6 10 L-6 10 C-9 2 -9 -12 0 -20 Z', fill: '#EDEBFF' }),
      E('circle', { key: 2, cx: 0, cy: -5, r: 4, fill: '#7FC8FF' }),
      E('path', { key: 3, d: 'M-6 4 L-12 13 L-6 11 Z M6 4 L12 13 L6 11 Z', fill: '#FF6B8A' }),
      E('path', { key: 4, d: 'M-4 11 L0 20 L4 11 Z', fill: '#FFB020' })];
  } else if (id === 'school') {
    g = [E('rect', { key: 1, x: -20, y: -6, width: 40, height: 22, rx: 2, fill: '#FFB020' }),
      E('path', { key: 2, d: 'M-23 -6 L0 -18 L23 -6 Z', fill: '#E56A3C' }),
      E('rect', { key: 3, x: -4, y: 4, width: 8, height: 12, fill: '#7A4A1E' }),
      E('rect', { key: 4, x: -16, y: 0, width: 7, height: 6, fill: '#FFF4D6' }),
      E('rect', { key: 5, x: 9, y: 0, width: 7, height: 6, fill: '#FFF4D6' }),
      E('path', { key: 6, d: 'M0 -18 L0 -26 L8 -23 L0 -20', fill: '#FF6B8A', stroke: '#FF6B8A', strokeWidth: 1 })];
  } else if (id === 'home') {
    g = [E('rect', { key: 1, x: -17, y: -4, width: 34, height: 20, rx: 2, fill: '#7FC8FF' }),
      E('path', { key: 2, d: 'M-21 -3 L0 -20 L21 -3 Z', fill: '#E2468D' }),
      E('rect', { key: 3, x: -5, y: 4, width: 10, height: 12, rx: 1, fill: '#2C4A73' }),
      E('rect', { key: 4, x: 8, y: 1, width: 6, height: 6, fill: '#FFF4D6' }),
      E('circle', { key: 5, cx: -11, cy: 3, r: 4.5, fill: '#FFD84D' })];
  } else if (id === 'room') {
    g = [E('rect', { key: 1, x: -20, y: -16, width: 40, height: 32, rx: 4, fill: '#FFFFFF' }),
      E('rect', { key: 2, x: -16, y: -12, width: 32, height: 22, rx: 2, fill: '#9AD8FF' }),
      E('rect', { key: 3, x: -16, y: 2, width: 32, height: 8, fill: '#B58BFF' }),
      E('rect', { key: 4, x: -14, y: -4, width: 14, height: 7, rx: 2, fill: '#FF7AB6' }),
      E('rect', { key: 5, x: 4, y: -10, width: 9, height: 8, fill: '#FFF4D6' })];
  } else if (id === 'walk') {
    g = [E('circle', { key: 1, cx: 0, cy: 0, r: 18, fill: '#FFF4D6' }),
      E('circle', { key: 2, cx: 0, cy: 0, r: 18, fill: 'none', stroke: '#4ED99B', strokeWidth: 4 }),
      E('path', { key: 3, d: 'M0 0 L0 -11 M0 0 L7 7', stroke: '#2A1D4A', strokeWidth: 3, strokeLinecap: 'round' }),
      E('circle', { key: 4, cx: 0, cy: 0, r: 2.5, fill: '#2A1D4A' })];
  } else {
    g = [E('circle', { key: 1, cx: -8, cy: 0, r: 10, fill: 'none', stroke: '#FFD84D', strokeWidth: 5 }),
      E('path', { key: 2, d: 'M2 0 L20 0 M14 0 L14 7 M19 0 L19 6', stroke: '#FFD84D', strokeWidth: 5, strokeLinecap: 'round' })];
  }
  return E('g', { transform: 'scale(' + k + ')' }, g);
}

/* ── Бип: жёлтый робот-помощник, настроение меняет лицо ── */
function PvBip({ mood }) {
  const E = React.createElement;
  const eyes = mood === 'happy'
    ? [E('path', { key: 'l', d: 'M-19 -18 q6 -8 12 0', stroke: '#7FF0FF', strokeWidth: 4, fill: 'none', strokeLinecap: 'round' }),
       E('path', { key: 'r', d: 'M7 -18 q6 -8 12 0', stroke: '#7FF0FF', strokeWidth: 4, fill: 'none', strokeLinecap: 'round' })]
    : mood === 'write'
    ? [E('ellipse', { key: 'l', cx: -9, cy: -18, rx: 5, ry: 7, fill: '#7FF0FF' }),
       E('ellipse', { key: 'r', cx: 17, cy: -18, rx: 5, ry: 7, fill: '#7FF0FF' })]
    : [E('g', { key: 'e', className: 'pvblink' },
        E('ellipse', { cx: -13, cy: -18, rx: 5, ry: 7, fill: '#7FF0FF' }),
        E('ellipse', { cx: 13, cy: -18, rx: 5, ry: 7, fill: '#7FF0FF' }))];
  const mouth = mood === 'shrug'
    ? E('path', { d: 'M-8 -2 h16', stroke: '#7FF0FF', strokeWidth: 3, strokeLinecap: 'round' })
    : E('path', { d: 'M-9 -4 q9 8 18 0', stroke: '#7FF0FF', strokeWidth: 3, fill: 'none', strokeLinecap: 'round' });
  return E('g', { transform: 'translate(86,96)' },
    E('ellipse', { cx: 0, cy: 84, rx: 40, ry: 7, fill: 'rgba(0,0,0,.25)' }),
    /* антенна */
    E('line', { x1: 0, y1: -56, x2: 0, y2: -44, stroke: '#FFB020', strokeWidth: 4, strokeLinecap: 'round' }),
    E('circle', { cx: 0, cy: -60, r: 6, fill: mood === 'write' ? '#FF5D7A' : '#FF7AB6' }),
    /* голова */
    E('rect', { x: -46, y: -46, width: 92, height: 66, rx: 24, fill: 'url(#pvBody)' }),
    E('rect', { x: -36, y: -36, width: 72, height: 46, rx: 16, fill: '#2A1D4A' }),
    eyes, mouth,
    /* туловище и руки */
    E('rect', { x: -28, y: 26, width: 56, height: 46, rx: 16, fill: 'url(#pvBody)' }),
    E('rect', { x: -16, y: 36, width: 32, height: 18, rx: 7, fill: '#FFF2C2' }),
    E('circle', { cx: -7, cy: 45, r: 3, fill: '#FF7AB6' }), E('circle', { cx: 4, cy: 45, r: 3, fill: '#7FC8FF' }),
    E('path', { d: mood === 'write' ? 'M28 38 Q52 30 64 16' : 'M28 38 Q44 50 46 62', stroke: '#FFB020',
      strokeWidth: 8, fill: 'none', strokeLinecap: 'round' }),
    mood === 'write' && E('path', { d: 'M60 20 L74 4', stroke: '#FF5D7A', strokeWidth: 5, strokeLinecap: 'round' }),
    E('path', { d: 'M-28 38 Q-44 50 -46 62', stroke: '#FFB020', strokeWidth: 8, fill: 'none', strokeLinecap: 'round' }));
}

/* ── блокнот Бипа: что он уже знает ── */
function PvNote({ given, glow }) {
  const E = React.createElement;
  const shown = given.slice(-6);
  return E('g', { transform: 'translate(' + PV_NOTE.x + ',' + PV_NOTE.y + ')' },
    glow && E('rect', { key: glow, className: 'pvglow', x: -56, y: -66, width: 112, height: 132, rx: 16, fill: '#FFD84D' }),
    E('rect', { x: -48, y: -58, width: 96, height: 116, rx: 10, fill: '#FFF7E0' }),
    E('rect', { x: -48, y: -58, width: 96, height: 20, rx: 10, fill: '#FFB020' }),
    [-30, -15, 0, 15, 30].map(x => E('circle', { key: x, cx: x, cy: -58, r: 3.2, fill: '#3A2E66' })),
    E('text', { x: 0, y: -44, textAnchor: 'middle', fill: '#4A2A00', style: { font: '900 8.5px Nunito,sans-serif', letterSpacing: '.06em' } }, 'БЛОКНОТ БИПА'),
    shown.length
      /* анимация — на вложенном слое: CSS-transform иначе затирает translate */
      ? shown.map((id, i) => E('g', { key: id,
          transform: 'translate(' + (-22 + (i % 2) * 44) + ',' + (-18 + Math.floor(i / 2) * 30) + ')' },
          E('g', { className: 'pventer' },
            E('circle', { r: 13, fill: PV_BY[id].risk ? '#FFE1E7' : '#E3F8EE' }),
            E(PvIcon, { id: id, s: .5 }))))
      : E('text', { x: 0, y: 6, textAnchor: 'middle', fill: '#B59B6A', style: { font: '800 9.5px Nunito,sans-serif' } }, 'пока пусто'));
}

/* ── карман ребёнка: что осталось при себе ── */
function PvPocket({ kept }) {
  const E = React.createElement;
  return E('g', { transform: 'translate(' + PV_POCKET.x + ',' + PV_POCKET.y + ')' },
    E('path', { d: 'M-118 -22 h236 v20 q0 22 -22 22 h-192 q-22 0 -22 -22 z', fill: '#3A2E66',
      stroke: 'rgba(196,181,255,.35)', strokeWidth: 1.5 }),
    E('path', { d: 'M-118 -22 h236', stroke: '#6E5BB8', strokeWidth: 4, strokeLinecap: 'round' }),
    E('text', { x: -104, y: 6, fill: '#C4B5FF', style: { font: '900 9px Nunito,sans-serif', letterSpacing: '.06em' } }, 'ТВОЙ КАРМАН'),
    kept.slice(-7).map((id, i) => E('g', { key: id, transform: 'translate(' + (-12 + i * 19) + ',0)' },

          React.createElement('span', null, riskyN ? 'Блокнот Бипа — это карта района.' : 'Серые метки — то, что Бип мог бы узнать.')),
