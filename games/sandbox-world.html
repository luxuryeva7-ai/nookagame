<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0719">
<title>Мой мир — Nooka</title>
<meta property="og:title" content="Мой мир — Nooka">
<meta property="og:description" content="Нарисуй зверя — и он побежит жить в твой мир. Нейро сам решит, где его дом, а ты поправишь.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nookagame.ru/games/sandbox-world.html">
<meta property="og:image" content="https://nookagame.ru/screenshots/og.jpg">
<meta property="og:site_name" content="Nooka">
<meta name="twitter:card" content="summary_large_image">

<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="nooka-ui.css">
<style>
/* ============ МОЙ МИР: песочница про данные ============
   Ребёнок не обучает модель — он заселяет мир. Обучение происходит
   само: каждый поселённый зверь становится примером. */
.wd *,.wd *::before,.wd *::after{box-sizing:border-box;}
.wdroot{position:fixed;inset:0;overflow:hidden;background:#090711;}
.wd{position:absolute;inset:0;display:flex;flex-direction:column;}

/* ── мир: три пояса ── */
.wdworld{position:relative;flex:1;overflow:hidden;}
.wdzone{position:absolute;left:0;right:0;transition:box-shadow .2s,filter .2s;}
.wdzone--sky{top:0;height:30%;background:linear-gradient(180deg,#241B45 0%,#1B1536 100%);}
.wdzone--sky .wdzone__n{top:46px;}   /* под шапкой, иначе наезжает на название */
.wdzone--land{top:30%;height:40%;background:linear-gradient(180deg,#17251E 0%,#101A16 100%);}
.wdzone--water{top:70%;height:30%;background:linear-gradient(180deg,#122B3D 0%,#0B1B28 100%);}
.wdzone__n{position:absolute;left:14px;top:9px;z-index:1;font-weight:900;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.17);pointer-events:none;}

/* когда Нейро спрашивает — пояса становятся кнопками */
.wdzone--ask{cursor:pointer;}
.wdzone--ask::after{content:'';position:absolute;inset:5px;border-radius:18px;
  box-shadow:inset 0 0 0 2px rgba(255,216,77,.5);animation:wdPulse 1.4s ease-in-out infinite;}
.wdzone--ask:hover{filter:brightness(1.25);}
@keyframes wdPulse{0%,100%{opacity:.45}50%{opacity:1}}

/* горизонт и вода — чтобы пояса читались как места, а не как полосы */
.wdline{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.07);}

/* ── зверь ── */
.wdbeast{position:absolute;cursor:grab;touch-action:none;will-change:transform;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.45));}
.wdbeast img{display:block;width:100%;height:100%;pointer-events:none;}
.wdbeast--drag{cursor:grabbing;z-index:30;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6));}
.wdbeast--new{animation:wdPop .5s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes wdPop{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:scale(1);opacity:1}}

/* ── реплика Нейро: одна строка внизу мира ── */
.wdsay{position:absolute;left:12px;right:12px;bottom:92px;z-index:20;
  display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:19px;
  background:rgba(20,14,36,.92);backdrop-filter:blur(6px);
  box-shadow:0 8px 26px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.11);
  animation:wdUp .3s ease-out both;}
.wdsay b{font-family:var(--nk-body);font-weight:800;font-size:14px;line-height:1.4;color:#F4EEFF;}
.wdsay b em{font-style:normal;color:#FFD84D;}
.wdsay i{flex-shrink:0;line-height:0;}
@keyframes wdUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── низ: единственная кнопка ── */
.wdbar{position:relative;z-index:25;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(9,7,17,0),#090711 26%);}
.wddraw{width:100%;border:none;cursor:pointer;border-radius:19px;padding:17px;
  font-family:var(--nk-body);font-weight:900;font-size:16px;color:#0E0719;
  background:#FFD84D;box-shadow:0 4px 0 #C9A21E;}
.wddraw:active{transform:translateY(2px);box-shadow:0 2px 0 #C9A21E;}

/* шапка поверх мира */
.wdtop{position:absolute;top:0;left:0;right:0;z-index:22;display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:linear-gradient(180deg,rgba(9,7,17,.75),rgba(9,7,17,0));}
.wdtop__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:15px;color:#F4EEFF;
  text-shadow:0 2px 8px rgba(0,0,0,.5);}
.wdtop__c{margin-left:auto;display:flex;gap:7px;}
.wdtop__b{width:34px;height:34px;border:none;cursor:pointer;border-radius:11px;padding:0;
  color:#CFC0EA;font-size:15px;font-weight:900;background:rgba(20,14,36,.8);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);}

/* ── доска: во весь экран, ничего лишнего ── */
.wdpad{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:#0C0918;animation:wdFade .18s ease-out;}
@keyframes wdFade{from{opacity:0}to{opacity:1}}
.wdpad__h{padding:16px 16px 0;text-align:center;}
.wdpad__h b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:19px;color:#F4EEFF;}
.wdpad__h span{display:block;margin-top:4px;font-weight:700;font-size:12.5px;color:#8B7BAE;}
.wdpad__c{flex:1;margin:14px;border-radius:24px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#1A1430,#0D0A18);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);}
.wdpad__c canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
.wdpad__ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-weight:800;font-size:14px;color:#463A63;}
.wdpad__b{display:flex;gap:9px;padding:0 14px calc(16px + env(safe-area-inset-bottom));}
.wdpad__b button{border:none;cursor:pointer;border-radius:17px;padding:16px 10px;
  font-family:var(--nk-body);font-weight:900;font-size:14.5px;}
.wdpad__x{flex:0 0 106px;color:#B9A8D8;background:rgba(255,255,255,.07);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.11);}
.wdpad__ok{flex:1;color:#0E0719;background:#7FE7FF;box-shadow:0 4px 0 #2E9EBC;}
.wdpad__ok:disabled{opacity:.35;box-shadow:none;cursor:default;}

/* пусто */
.wdempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:0 40px;text-align:center;font-weight:800;font-size:14px;line-height:1.5;
  color:rgba(255,255,255,.28);pointer-events:none;}

/* на компьютере мир не растягиваем во всю ширину — держим вертикальным */
@media(min-width:900px){
  #root>.wdroot{max-width:none;}
  .wd{max-width:560px;margin:0 auto;box-shadow:0 0 90px rgba(0,0,0,.6);}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="react-bundle.js"></script>
<script src="nooka-core.js"></script>
<script src="nooka-brain.js"></script>
<script>
/* ============================================================
   МОЙ МИР — песочница к игре «Откуда ИИ знает».

   Первая версия была доской с классами и режимами: ребёнок
   «обучал модель», а рисунок превращался в проценты. Скучно и
   похоже на пять уровней до этого.

   Здесь рисунок остаётся жить. Ребёнок населяет мир, а обучение
   идёт само: каждый поселённый зверь — пример с меткой пояса.
   Нейро честно не знает первого и честно ошибается на похожем.

   На экране одна кнопка. Всё остальное — мир.
   ============================================================ */

const { useState, useRef, useEffect, useCallback } = React;
const B = window.nookaBrain;

const PAD = 300;              // холст доски
const PEN = 10;
const MAX_BEASTS = 14;
const KEY = 'nooka_world';

const ZONES = [
  { id: 'sky',   n: 'В НЕБЕ',   say: 'в небе',    top: 0.00, bot: 0.30 },
  { id: 'land',  n: 'НА ЗЕМЛЕ', say: 'на земле',  top: 0.30, bot: 0.70 },
  { id: 'water', n: 'В ВОДЕ',   say: 'в воде',    top: 0.70, bot: 1.00 },
];
const zoneOf = id => ZONES.find(z => z.id === id) || ZONES[1];

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    return raw && Array.isArray(raw.beasts) ? raw.beasts : [];
  } catch (e) { return []; }
}
function store(beasts) {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      beasts: beasts.map(b => ({ img: b.img, f: b.f, zone: b.zone, w: b.w, h: b.h })),
    }));
  } catch (e) {}
}

/* ── рисунок → картинка зверя: обрезаем по рамке, чтобы зверь был
   ростом с рисунок, а не с холст ── */
function cutOut(cv) {
  const ctx = cv.getContext('2d');
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let minX = cv.width, minY = cv.height, maxX = -1, maxY = -1;
  for (let y = 0; y < cv.height; y++) {
    for (let x = 0; x < cv.width; x++) {
      if (d[(y * cv.width + x) * 4 + 3] > 40) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  const pad = 6;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(cv.width - 1, maxX + pad); maxY = Math.min(cv.height - 1, maxY + pad);
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const out = document.createElement('canvas');
  /* 84, а не 150: зверь ростом с пояс закрывал полмира и лез за края */
  const k = Math.min(1, 84 / Math.max(w, h));
  out.width = Math.max(8, Math.round(w * k));
  out.height = Math.max(8, Math.round(h * k));
  out.getContext('2d').drawImage(cv, minX, minY, w, h, 0, 0, out.width, out.height);
  try { return { url: out.toDataURL('image/png'), w: out.width, h: out.height }; }
  catch (e) { return null; }
}

/* ── доска ── */
function Pad({ onDone, onCancel }) {
  const cvRef = useRef(null);
  const [has, setHas] = useState(false);
  const st = useRef({ drawing: false });

  useEffect(() => {
    const cv = cvRef.current;
    const box = cv.parentElement.getBoundingClientRect();
    cv.width = PAD;
    cv.height = Math.round(PAD * box.height / box.width);
    const ctx = cv.getContext('2d');
    ctx.lineWidth = PEN;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#8FE9FF';

    const pos = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height];
    };
    const down = e => {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      st.current.drawing = true;
      const [x, y] = pos(e);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.01, y); ctx.stroke();
      setHas(true);
    };
    const move = e => {
      if (!st.current.drawing) return;
      const [x, y] = pos(e);
      ctx.lineTo(x, y); ctx.stroke();
    };
    const up = () => { st.current.drawing = false; };
    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', up);
    return () => {
      cv.removeEventListener('pointerdown', down);
      cv.removeEventListener('pointermove', move);
      cv.removeEventListener('pointerup', up);
      cv.removeEventListener('pointercancel', up);
      cv.removeEventListener('pointerleave', up);
    };
  }, []);

  const wipe = () => {
    const cv = cvRef.current;
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    setHas(false);
  };

  return React.createElement('div', { className: 'wdpad wd' },
    React.createElement('div', { className: 'wdpad__h' },
      React.createElement('b', null, 'Нарисуй кого хочешь'),
      React.createElement('span', null, 'Он оживёт и останется жить в твоём мире')),
    React.createElement('div', { className: 'wdpad__c' },
      React.createElement('canvas', { ref: cvRef }),
      !has && React.createElement('div', { className: 'wdpad__ghost' }, 'Рисуй пальцем')),
    React.createElement('div', { className: 'wdpad__b' },
      React.createElement('button', {
        className: 'wdpad__x', onClick: () => (has ? wipe() : onCancel()),
      }, has ? 'Стереть' : 'Назад'),
      React.createElement('button', {
        className: 'wdpad__ok', disabled: !has,
        onClick: () => onDone(cvRef.current),
      }, 'Оживить')));
}

/* ============================================================ */
function World() {
  const [beasts, setBeasts] = useState(() => load().map((b, i) => ({
    ...b, id: 'b' + i + Date.now().toString(36),
    x: 0.1 + Math.random() * 0.7, y: 0.5,
    vx: (Math.random() < 0.5 ? -1 : 1) * (0.018 + Math.random() * 0.02),
    ph: Math.random() * 6.28, fresh: false,
  })));
  const [pad, setPad] = useState(false);
  const [ask, setAsk] = useState(null);       // зверь ждёт, где ему жить
  const [say, setSay] = useState('');
  const worldRef = useRef(null);
  const raf = useRef(0);
  const drag = useRef(null);
  const [, force] = useState(0);

  /* модель: каждый поселённый зверь — пример с меткой пояса */
  const model = beasts.filter(b => b.f && b.zone).map(b => ({ f: b.f, label: b.zone }));

  useEffect(() => { store(beasts); }, [beasts]);

  useEffect(() => {
    if (!beasts.length) setSay('');
  }, [beasts.length]);

  /* реплика — подсказка на пару секунд, а не постоянная панель:
     висела поверх мира и закрывала зверей */
  useEffect(() => {
    if (!say || ask) return;
    const t = setTimeout(() => setSay(''), 3600);
    return () => clearTimeout(t);
  }, [say, ask]);

  /* ── жизнь: звери ходят сами ── */
  useEffect(() => {
    let last = performance.now();
    /* ширину мира держим в переменной и обновляем на resize: мерить её
       каждому зверю каждый кадр — лишний пересчёт разметки */
    let W = worldRef.current ? worldRef.current.getBoundingClientRect().width : 360;
    const onResize = () => {
      if (worldRef.current) W = worldRef.current.getBoundingClientRect().width;
    };
    window.addEventListener('resize', onResize);
    const tick = now => {
      const dt = Math.min(50, now - last) / 1000;
      last = now;
      let moved = false;
      beasts.forEach(b => {
        if (drag.current && drag.current.id === b.id) return;
        if (b === ask) return;
        b.x += b.vx * dt;
        /* разворот считаем от края самого зверя, а не от его центра —
           иначе широкий зверь наполовину уезжает за границу экрана */
        const edge = (b.w / 2 + 6) / W;
        if (b.x < edge) { b.x = edge; b.vx = Math.abs(b.vx); }
        if (b.x > 1 - edge) { b.x = 1 - edge; b.vx = -Math.abs(b.vx); }
        b.ph += dt * (b.zone === 'sky' ? 2.1 : b.zone === 'water' ? 1.5 : 3.4);
        moved = true;
      });
      if (moved) force(v => v + 1);
      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf.current);
      window.removeEventListener('resize', onResize);
    };
  }, [beasts, ask]);

  /* ── куда ставить зверя внутри пояса ── */
  const place = (b) => {
    const z = zoneOf(b.zone);
    const box = worldRef.current ? worldRef.current.getBoundingClientRect() : { width: 360, height: 600 };
    const wob = Math.sin(b.ph) * (b.zone === 'land' ? 0 : 7);
    const hop = b.zone === 'land' ? Math.abs(Math.sin(b.ph)) * 6 : 0;
    /* земля — по нижней кромке пояса, небо и вода — по середине */
    const base = b.zone === 'land'
      ? z.bot - 0.02 - (b.h / box.height)
      : (z.top + z.bot) / 2 - (b.h / box.height) / 2;
    return {
      left: b.x * box.width - b.w / 2,
      top: base * box.height + wob - hop,
    };
  };

  /* ── новый зверь ── */
  const born = (cv) => {
    const cut = cutOut(cv);
    const got = B.features(cv);
    setPad(false);
    if (!cut || !got) { setSay('Слишком мало нарисовано — попробуй ещё раз'); return; }

    const b = {
      id: 'b' + Date.now().toString(36), img: cut.url, w: cut.w, h: cut.h, f: got.f,
      x: 0.2 + Math.random() * 0.6, vx: (Math.random() < 0.5 ? -1 : 1) * (0.018 + Math.random() * 0.02),
      ph: Math.random() * 6.28, zone: null, fresh: true,
    };
    const p = model.length ? B.predict(model, got.f) : null;

    if (!p || p.unsure) {
      /* честно: такого он не видел — пусть покажет ребёнок */
      setAsk(b);
      setSay(model.length
        ? 'Такого я ещё не видел. Где он живёт?'
        : 'Я пока никого не знаю. Покажи, где он живёт');
      return;
    }
    b.zone = p.label;
    setBeasts(list => list.concat([b]).slice(-MAX_BEASTS));
    setSay('Похож на тех, кто живёт <em>' + zoneOf(p.label).say + '</em>. Не туда — перетащи');
    setTimeout(() => { b.fresh = false; }, 600);
  };

  /* ребёнок показал пояс — зверь поселён, пример запомнен */
  const put = (zoneId) => {
    if (!ask) return;
    const b = ask;
    b.zone = zoneId;
    setAsk(null);
    setBeasts(list => list.concat([b]).slice(-MAX_BEASTS));
    setSay('Понял. Теперь буду знать');
    setTimeout(() => { b.fresh = false; }, 600);
  };

  /* ── перетаскивание: это и есть исправление ошибки ── */
  const grab = (e, b) => {
    if (ask) return;
    e.preventDefault();
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
    drag.current = { id: b.id, b: b };
    force(v => v + 1);
  };
  const moveDrag = (e) => {
    if (!drag.current) return;
    const box = worldRef.current.getBoundingClientRect();
    const b = drag.current.b;
    b.x = Math.max(0.04, Math.min(0.96, (e.clientX - box.left) / box.width));
    drag.current.y = (e.clientY - box.top) / box.height;
    force(v => v + 1);
  };
  const drop = () => {
    if (!drag.current) return;
    const b = drag.current.b;
    const y = drag.current.y;
    const z = ZONES.find(zz => y >= zz.top && y < zz.bot) || zoneOf(b.zone);
    const changed = z.id !== b.zone;
    b.zone = z.id;
    drag.current = null;
    setBeasts(list => list.slice());
    if (changed) setSay('Понял, он живёт <em>' + z.say + '</em>. Запомнил');
  };

  const wipeAll = () => {
    setBeasts([]); setAsk(null); setSay('');
    try { localStorage.removeItem(KEY); } catch (e) {}
  };

  const box = worldRef.current ? worldRef.current.getBoundingClientRect() : null;

  return React.createElement('div', { className: 'wdroot' },
    React.createElement('div', { className: 'wd' },

      React.createElement('div', {
        className: 'wdworld', ref: worldRef,
        onPointerMove: moveDrag, onPointerUp: drop, onPointerLeave: drop,
      },
        ZONES.map(z => React.createElement('div', {
          key: z.id,
          className: 'wdzone wdzone--' + z.id + (ask ? ' wdzone--ask' : ''),
          onClick: ask ? () => put(z.id) : undefined,
        }, React.createElement('span', { className: 'wdzone__n' }, z.n))),
        React.createElement('div', { className: 'wdline', style: { top: '30%' } }),
        React.createElement('div', { className: 'wdline', style: { top: '70%' } }),

        /* шапка */
        React.createElement('div', { className: 'wdtop' },
          React.createElement('div', { className: 'wdtop__t' }, 'Мой мир'),
          React.createElement('div', { className: 'wdtop__c' },
            beasts.length > 0 && React.createElement('button', {
              className: 'wdtop__b', onClick: wipeAll, title: 'Начать заново',
            }, '↺'),
            React.createElement('button', {
              className: 'wdtop__b',
              onClick: () => { window.location.href = 'game.html?g=data'; },
            }, '✕'))),

        !beasts.length && !ask && React.createElement('div', { className: 'wdempty' },
          'Тут пока никто не живёт.\nНарисуй кого-нибудь'),

        /* звери */
        beasts.map(b => {
          const p = place(b);
          const d = drag.current && drag.current.id === b.id;
          return React.createElement('div', {
            key: b.id,
            className: 'wdbeast' + (d ? ' wdbeast--drag' : '') + (b.fresh ? ' wdbeast--new' : ''),
