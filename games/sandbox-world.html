<style>
/* ============ МОЙ МИР: песочница про данные ============
   Ребёнок не обучает модель — он населяет нарисованный мир тем,
   что нарисовал сам. Обучение идёт само: каждая поселённая вещь
   становится примером с меткой места. */
.wd *,.wd *::before,.wd *::after{box-sizing:border-box;}
.wdroot{position:fixed;inset:0;overflow:hidden;background:#070510;}
.wd{position:absolute;inset:0;display:flex;flex-direction:column;}

/* ── мир ── */
.wdworld{position:relative;flex:1;overflow:hidden;}
.wdzone{position:absolute;left:0;right:0;overflow:hidden;}
.wdzone--sky{top:0;height:30%;}
.wdzone--sky .wdzone__n{top:auto;bottom:9px;}  /* сверху её закрывают кнопки */
.wdzone--land{top:30%;height:40%;}
.wdzone--water{top:70%;height:30%;}
.wdart{position:absolute;inset:0;pointer-events:none;}
.wdart svg{position:absolute;left:0;width:100%;display:block;}

.wdzone__n{position:absolute;right:13px;top:10px;z-index:3;font-weight:900;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.26);pointer-events:none;}
/* днём белым по светлому не видно — переключаем на тёмное */
.wd--day .wdzone__n{color:rgba(10,20,30,.32);}

/* когда Нейро спрашивает — места становятся кнопками */
.wdzone--ask{cursor:pointer;}
.wdzone--ask::after{content:'';position:absolute;inset:6px;border-radius:20px;z-index:4;
  box-shadow:inset 0 0 0 2.5px rgba(255,216,77,.55);animation:wdPulse 1.3s ease-in-out infinite;}
.wdzone--ask:hover::after{box-shadow:inset 0 0 0 3px rgba(255,216,77,.95);}
@keyframes wdPulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ── житель мира ── */
.wdthing{position:absolute;z-index:5;cursor:grab;touch-action:none;will-change:transform;
  filter:drop-shadow(0 4px 9px rgba(0,0,0,.55));}
.wdthing img{display:block;width:100%;height:100%;pointer-events:none;}
.wdthing--drag{cursor:grabbing;z-index:30;filter:drop-shadow(0 12px 22px rgba(0,0,0,.7));}
.wdthing--new{animation:wdPop .55s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes wdPop{0%{transform:scale(0) rotate(-22deg);opacity:0}100%{transform:scale(1);opacity:1}}

/* ── реплика Нейро ── */
.wdsay{position:absolute;left:12px;right:12px;bottom:14px;z-index:20;
  display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:19px;
  background:rgba(18,12,33,.93);backdrop-filter:blur(7px);
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12);
  animation:wdUp .3s ease-out both;}
.wdsay b{font-family:var(--nk-body);font-weight:800;font-size:14px;line-height:1.4;color:#F4EEFF;}
.wdsay b em{font-style:normal;color:#FFD84D;}
.wdsay i{flex-shrink:0;line-height:0;}
@keyframes wdUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── низ ── */
.wdbar{position:relative;z-index:25;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(7,5,16,0),#070510 30%);}
.wddraw{width:100%;border:none;cursor:pointer;border-radius:19px;padding:17px;
  font-family:var(--nk-body);font-weight:900;font-size:16px;color:#0E0719;
  background:#FFD84D;box-shadow:0 4px 0 #C9A21E;}
.wddraw:active{transform:translateY(2px);box-shadow:0 2px 0 #C9A21E;}
.wddraw:disabled{opacity:.55;box-shadow:none;cursor:default;}

/* шапка */
.wdtop{position:absolute;top:0;left:0;right:0;z-index:22;display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:linear-gradient(180deg,rgba(7,5,16,.82),rgba(7,5,16,0));}
.wdtop__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:15px;color:#F4EEFF;
  text-shadow:0 2px 8px rgba(0,0,0,.6);}
.wdtop__t span{display:block;margin-top:2px;font-family:var(--nk-body);font-weight:800;
  font-size:11px;color:#B3A2D4;text-shadow:0 1px 6px rgba(0,0,0,.8);}
.wdtop__c{margin-left:auto;display:flex;gap:7px;}
.wdtop__b{width:34px;height:34px;flex-shrink:0;border:none;cursor:pointer;border-radius:11px;padding:0;
  color:#CFC0EA;font-size:15px;font-weight:900;background:rgba(18,12,33,.85);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}

/* имя мира: правится прямо в шапке, отдельной кнопки не заводим */
.wdname{border:none;background:transparent;padding:0;max-width:190px;
  font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:15px;color:#F4EEFF;
  text-shadow:0 2px 8px rgba(0,0,0,.6);}
.wdname:focus{outline:none;color:#FFD84D;}

/* выбранный житель: что о нём думает Нейро и кнопка убрать */
.wdsel{position:absolute;z-index:31;left:12px;right:12px;bottom:14px;
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:19px;
  background:rgba(18,12,33,.95);backdrop-filter:blur(7px);
  box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.13);
  animation:wdUp .25s ease-out both;}
.wdsel img{width:40px;height:40px;object-fit:contain;flex-shrink:0;}
.wdsel__t{flex:1;min-width:0;font-weight:800;font-size:13px;line-height:1.4;color:#DDD2F2;}
.wdsel__t b{color:#FFD84D;font-weight:900;}
.wdsel button{flex-shrink:0;border:none;cursor:pointer;border-radius:13px;padding:11px 13px;
  font-family:var(--nk-body);font-weight:800;font-size:12.5px;color:#FFB4B4;
  background:rgba(255,107,107,.16);box-shadow:inset 0 0 0 1px rgba(255,107,107,.32);}

/* житель подпрыгивает от тапа */
.wdthing--poke{animation:wdPoke .5s ease-out;}
@keyframes wdPoke{0%{transform:translateY(0) scale(1)}
  35%{transform:translateY(-16px) scale(1.08)}100%{transform:translateY(0) scale(1)}}
.wdthing--sel img{filter:drop-shadow(0 0 0 #FFD84D) drop-shadow(0 0 7px rgba(255,216,77,.9));}

/* низ: рисовать + показать */
.wdbar{display:flex;gap:9px;}
.wdshow{flex:0 0 58px;border:none;cursor:pointer;border-radius:19px;
  color:#0E0719;background:#7FE7FF;box-shadow:0 4px 0 #2E9EBC;
  display:flex;align-items:center;justify-content:center;}
.wdshow:disabled{opacity:.4;box-shadow:none;cursor:default;}
.wddraw{flex:1;}

/* ── открытка ── */
.wdcard{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;
  background:rgba(7,5,16,.93);backdrop-filter:blur(6px);animation:wdFade .2s ease-out;}
.wdcard__h{padding:16px 16px 0;text-align:center;}
.wdcard__h b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:18px;color:#F4EEFF;}
.wdcard__h span{display:block;margin-top:3px;font-weight:700;font-size:12px;color:#9A8ABA;}
.wdcard__p{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;}
.wdcard__p img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);}
.wdcard__b{display:flex;gap:9px;padding:0 14px calc(16px + env(safe-area-inset-bottom));
  flex-wrap:wrap;}
.wdcard__b button{flex:1 1 130px;border:none;cursor:pointer;border-radius:17px;padding:15px 10px;
  font-family:var(--nk-body);font-weight:900;font-size:14px;}
.wdcard__x{color:#B9A8D8;background:rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.wdcard__go{color:#0E0719;background:#FFD84D;box-shadow:0 4px 0 #C9A21E;}
.wdcard__keep{color:#0E0719;background:#7CE8B0;box-shadow:0 4px 0 #3E9E6E;}
.wdcard__wait{display:flex;align-items:center;justify-content:center;height:100%;
  font-weight:800;font-size:13px;color:#8B7BAE;}

/* ── доска ── */
.wdpad{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:#0B0817;animation:wdFade .18s ease-out;}
@keyframes wdFade{from{opacity:0}to{opacity:1}}
.wdpad__h{padding:15px 16px 0;text-align:center;}
.wdpad__h b{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:18px;color:#F4EEFF;}
.wdpad__h span{display:block;margin-top:3px;font-weight:700;font-size:12px;color:#8B7BAE;}
.wdpad__c{flex:1;margin:12px 14px;border-radius:24px;overflow:hidden;position:relative;
  background:radial-gradient(125% 90% at 50% 0%,#241C42 0%,#100C1F 72%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09);}
.wdpad__c canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
.wdpad__ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-weight:800;font-size:14px;color:#4A3D69;}

/* палитра */
.wdink{display:flex;align-items:center;gap:7px;padding:0 12px;justify-content:center;}
.wdink__c{width:33px;height:33px;border:none;cursor:pointer;border-radius:50%;padding:0;
  position:relative;transition:transform .13s;}
.wdink__c:active{transform:scale(.88);}
.wdink__c.on::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  box-shadow:0 0 0 2.5px #fff;}
.wdsize{display:flex;align-items:center;gap:7px;margin-left:5px;padding-left:10px;
  box-shadow:inset 1px 0 0 rgba(255,255,255,.15);}
.wdsize button{width:33px;height:33px;border:none;cursor:pointer;border-radius:12px;padding:0;
  background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;}
.wdsize button.on{background:rgba(255,255,255,.22);}
.wdsize i{display:block;border-radius:50%;background:#EFE6FF;}

.wdpad__b{display:flex;gap:9px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));}
.wdpad__b button{border:none;cursor:pointer;border-radius:17px;padding:16px 10px;
  font-family:var(--nk-body);font-weight:900;font-size:14.5px;}
.wdpad__x{flex:0 0 104px;color:#B9A8D8;background:rgba(255,255,255,.07);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.11);}
.wdpad__ok{flex:1;color:#0E0719;background:#7FE7FF;box-shadow:0 4px 0 #2E9EBC;}
.wdpad__ok:disabled{opacity:.35;box-shadow:none;cursor:default;}

/* ── инструкция ── */
.wdhelp{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(7,5,16,.88);backdrop-filter:blur(5px);animation:wdFade .2s ease-out;}
.wdhelp__c{width:100%;max-width:400px;padding:24px 22px;border-radius:28px;
  background:linear-gradient(180deg,#1E1738,#140F26);
  box-shadow:0 20px 60px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.1);}
.wdhelp__t{font-family:var(--nk-brand),var(--nk-body);font-weight:700;font-size:21px;color:#F4EEFF;
  text-align:center;}
.wdstep{display:flex;align-items:center;gap:14px;margin-top:16px;}
.wdstep__i{width:52px;height:52px;flex-shrink:0;border-radius:16px;display:flex;
  align-items:center;justify-content:center;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.wdstep__t{font-weight:800;font-size:13.5px;line-height:1.45;color:#DDD2F2;}
.wdstep__t b{color:#FFD84D;font-weight:900;}
.wdhelp__go{width:100%;margin-top:22px;border:none;cursor:pointer;border-radius:17px;padding:16px;
  font-family:var(--nk-body);font-weight:900;font-size:15.5px;color:#0E0719;
  background:#FFD84D;box-shadow:0 4px 0 #C9A21E;}

/* пусто */
.wdempty{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
  padding:0 40px;text-align:center;font-weight:800;font-size:14px;line-height:1.55;
  color:rgba(255,255,255,.38);pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.85);
  white-space:pre-line;}

@media(min-width:900px){
  #root>.wdroot{max-width:none;}
  .wd{max-width:560px;margin:0 auto;box-shadow:0 0 100px rgba(0,0,0,.7);}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="react-bundle.js"></script>

<script>

   МОЙ МИР — песочница к игре «Откуда ИИ знает».

   Ребёнок рисует что хочет — любым цветом, любой толщиной — и это
   оживает в нарисованном мире. Нейро угадывает, где этому место:
   в небе, на земле или в воде. Ошибся — ребёнок перетаскивает, и
   Нейро запоминает. Обучение на примерах без слова «модель».

   Инструкция показывается сразу: без неё не видно, что Нейро
   учится, — он выглядит просто угадывающим.
   ============================================================ */

const { useState, useRef, useEffect } = React;
const B = window.nookaBrain;

const PAD = 320;
const MAX_THINGS = 16;
const KEY = 'nooka_world';
const SEEN = 'nooka_world_seen';
const NAME_KEY = 'nooka_world_name';
const NIGHT_KEY = 'nooka_world_time';

/* палитра: рисовать одним синим скучно — цвет тут половина дела */
const INKS = ['#FF6B6B', '#FFA94D', '#FFD84D', '#7CE8B0', '#7FE7FF', '#A98BFF', '#FF8FD4', '#FFFFFF'];
const SIZES = [5, 10, 18];

const ZONES = [
  { id: 'sky',   n: 'НЕБО',  say: 'в небе',   top: 0.00, bot: 0.30 },
  { id: 'land',  n: 'ЗЕМЛЯ', say: 'на земле', top: 0.30, bot: 0.70 },
  { id: 'water', n: 'ВОДА',  say: 'в воде',   top: 0.70, bot: 1.00 },
];
const zoneOf = id => ZONES.find(z => z.id === id) || ZONES[1];

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    return raw && Array.isArray(raw.things) ? raw.things : [];
  } catch (e) { return []; }
}
function store(things) {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      things: things.map(t => ({ img: t.img, f: t.f, zone: t.zone, w: t.w, h: t.h, kind: t.kind })),
    }));
  } catch (e) {}
}

   Мир должен быть нарисованным местом, а не тремя полосами: ребёнок
   дорисовывает своё поверх готовой картинки. */

   Ребёнку это даёт «мир живёт», а нам — второй вид бесплатно. */
const PAL = {
  night: {
    sky: ['#2B1F55', '#201842', '#271D4A'], cloud: '#342659', cloudOp: 0.5,
    lamp: '#FFEFC4', lampGlow: '#FFE9A8', spot: '#E6D3A0', stars: 1,
    land: ['#1D3529', '#101D17'], hill: ['#28472F', '#203A28'], grass: '#2A4B34',

function Sky({ p }) {
  const stars = [];
  /* звёзды по решётке со сдвигом: случайные пересчитывались бы
     на каждом кадре и мигали */

    const x = (i * 37) % 100, y = ((i * 53) % 72) + 5;
    const r = i % 5 === 0 ? 1.6 : i % 3 === 0 ? 1.1 : 0.7;
    stars.push(React.createElement('circle', {
      key: i, cx: x + '%', cy: y + '%', r: r, fill: '#fff',

  return React.createElement('div', { className: 'wdart' },
    React.createElement('svg', {
      style: { top: 0, height: '100%' }, preserveAspectRatio: 'none', viewBox: '0 0 100 100',
    },
      React.createElement('defs', null,
        React.createElement('linearGradient', { id: 'wdSky', x1: '0', y1: '0', x2: '0', y2: '1' },
          React.createElement('stop', { offset: '0', stopColor: p.sky[0] }),
          React.createElement('stop', { offset: '0.55', stopColor: p.sky[1] }),
          React.createElement('stop', { offset: '1', stopColor: p.sky[2] }))),
      React.createElement('rect', { width: 100, height: 100, fill: 'url(#wdSky)' })),
    React.createElement('svg', { style: { top: 0, height: '100%' } }, stars),
    React.createElement('svg', {
      style: { top: '13%', left: 'auto', right: '12%', width: 58, height: 58 }, viewBox: '0 0 58 58',
    },
      React.createElement('circle', { cx: 29, cy: 29, r: 19, fill: p.lampGlow, opacity: 0.16 }),
      React.createElement('circle', { cx: 29, cy: 29, r: 13, fill: p.lamp }),
      /* днём это пятнышки на солнце не нужны — рисуем только ночью */
      p.stars ? React.createElement('circle', {
        key: 'a', cx: 24, cy: 25, r: 2.6, fill: p.spot, opacity: 0.65,
      }) : null,
      p.stars ? React.createElement('circle', {
        key: 'b', cx: 33, cy: 32, r: 1.8, fill: p.spot, opacity: 0.55,
      }) : null),
    React.createElement('svg', {
      style: { bottom: 0, height: '48%' }, preserveAspectRatio: 'none', viewBox: '0 0 100 30',
    },
      React.createElement('path', {
        d: 'M-4 27 Q10 15 24 23 Q34 11 48 21 Q60 13 72 23 Q86 16 104 26 L104 34 L-4 34 Z',
        fill: p.cloud, opacity: p.cloudOp,
      })));
}

function Land({ p }) {
  return React.createElement('div', { className: 'wdart' },
    React.createElement('svg', {
      style: { top: 0, height: '100%' }, preserveAspectRatio: 'none', viewBox: '0 0 100 100',
    },
      React.createElement('defs', null,
        React.createElement('linearGradient', { id: 'wdLand', x1: '0', y1: '0', x2: '0', y2: '1' },
          React.createElement('stop', { offset: '0', stopColor: p.land[0] }),
          React.createElement('stop', { offset: '1', stopColor: p.land[1] }))),
      React.createElement('rect', { width: 100, height: 100, fill: 'url(#wdLand)' })),
    React.createElement('svg', {
      style: { top: 0, height: '44%' }, preserveAspectRatio: 'none', viewBox: '0 0 100 24',
    },
      React.createElement('path', {
        d: 'M0 24 L0 15 Q14 4 27 13 Q40 20 52 9 Q66 -1 78 11 Q90 20 100 12 L100 24 Z',
        fill: p.hill[0], opacity: 0.85,
      }),
      React.createElement('path', {
        d: 'M0 24 L0 20 Q18 12 33 19 Q48 25 62 17 Q78 9 100 19 L100 24 Z',
        fill: p.hill[1],
      })),
    React.createElement('svg', {
      style: { bottom: 0, height: '13%' }, preserveAspectRatio: 'none', viewBox: '0 0 100 8',
    },
      React.createElement('path', {
        d: 'M0 8 L0 5 Q6 1 12 5 Q18 1 24 5 Q30 1 36 5 Q42 1 48 5 Q54 1 60 5 Q66 1 72 5 ' +
           'Q78 1 84 5 Q90 1 96 5 Q99 3 100 5 L100 8 Z',
        fill: p.grass, opacity: 0.9,
      })));
}

function Water({ p }) {
  return React.createElement('div', { className: 'wdart' },
    React.createElement('svg', {
      style: { top: 0, height: '100%' }, preserveAspectRatio: 'none', viewBox: '0 0 100 100',
    },
      React.createElement('defs', null,
        React.createElement('linearGradient', { id: 'wdWat', x1: '0', y1: '0', x2: '0', y2: '1' },
          React.createElement('stop', { offset: '0', stopColor: p.water[0] }),

/* ── рисунок → житель мира: обрезаем по рамке ── */
function cutOut(cv) {
  const ctx = cv.getContext('2d');
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let minX = cv.width, minY = cv.height, maxX = -1, maxY = -1;
  for (let y = 0; y < cv.height; y++) {
    for (let x = 0; x < cv.width; x++) {
      if (d[(y * cv.width + x) * 4 + 3] > 40) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  const pad = 6;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(cv.width - 1, maxX + pad); maxY = Math.min(cv.height - 1, maxY + pad);
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const out = document.createElement('canvas');
  /* 88 по большей стороне: рисунок ростом с целый пояс закрывал полмира */
  const k = Math.min(1, 88 / Math.max(w, h));
  out.width = Math.max(8, Math.round(w * k));
  out.height = Math.max(8, Math.round(h * k));
  out.getContext('2d').drawImage(cv, minX, minY, w, h, 0, 0, out.width, out.height);
  try {
    return { url: out.toDataURL('image/png'), w: out.width, h: out.height, ratio: w / h };
  } catch (e) { return null; }
}

/* ── открытка: мир целиком в одну картинку ──────────────────
   То, ради чего всё и делается: это можно сохранить, показать
   родителям и отправить. Сцену собираем в SVG (пути уже есть),
   рисуем её на холсте, а подписи кладём поверх средствами холста —
   так шрифты берутся браузерные, а не гадаем, что подхватится. */
const CARD_W = 1080, CARD_H = 1500, SCENE_Y = 168;

/* Сцену собираем вложенными <svg> с теми же viewBox, что в живом мире, —
   тогда пути копируются один в один и картинка совпадает с тем, что
   ребёнок видел на экране. Пересчитывать координаты руками бессмысленно:
   первый заход разошёлся с миром, и холмы вышли полосками. */
function sceneSVG(things, p, W) {
  const S = CARD_W;
  const skyH = S * 0.30, landH = S * 0.40, waterH = S * 0.30;
  const landY = skyH, waterY = skyH + landH;

  const box = (x, y, w, h, vb, inner) =>
    '<svg x="' + x + '" y="' + y.toFixed(1) + '" width="' + w + '" height="' + h.toFixed(1) +
    '" viewBox="' + vb + '" preserveAspectRatio="none">' + inner + '</svg>';

  let stars = '';
  for (let i = 0; i < 28; i++) {
    const x = ((i * 37) % 100) / 100 * S, y = ((((i * 53) % 72) + 5) / 100) * skyH;
    const r = (i % 5 === 0 ? 1.6 : i % 3 === 0 ? 1.1 : 0.7) * 2.6;
    stars += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) +
      '" fill="#fff" opacity="' + ((0.16 + (i % 7) * 0.085) * p.stars).toFixed(2) + '"/>';
  }

  const lampX = S * 0.80, lampY = skyH * 0.32, k = S / 375;
  const lamp = '<g transform="translate(' + lampX.toFixed(1) + ',' + lampY.toFixed(1) +
    ') scale(' + (k * 1.5).toFixed(2) + ')">' +
    '<circle r="19" fill="' + p.lampGlow + '" opacity="0.16"/>' +
    '<circle r="13" fill="' + p.lamp + '"/>' +
    (p.stars
      ? '<circle cx="-5" cy="-4" r="2.6" fill="' + p.spot + '" opacity="0.65"/>' +
        '<circle cx="4" cy="3" r="1.8" fill="' + p.spot + '" opacity="0.55"/>'
      : '') + '</g>';

  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + S + '" height="' + S + '">' +
    '<defs>' +
      '<linearGradient id="a" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + p.sky[0] + '"/>' +
        '<stop offset="0.55" stop-color="' + p.sky[1] + '"/>' +
        '<stop offset="1" stop-color="' + p.sky[2] + '"/></linearGradient>' +
      '<linearGradient id="b" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + p.land[0] + '"/>' +
        '<stop offset="1" stop-color="' + p.land[1] + '"/></linearGradient>' +
      '<linearGradient id="c" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + p.water[0] + '"/>' +
        '<stop offset="1" stop-color="' + p.water[1] + '"/></linearGradient>' +
    '</defs>' +

    '<rect width="' + S + '" height="' + skyH + '" fill="url(#a)"/>' + stars + lamp +
    box(0, skyH * 0.52, S, skyH * 0.48, '0 0 100 30',
      '<path d="M-4 27 Q10 15 24 23 Q34 11 48 21 Q60 13 72 23 Q86 16 104 26 L104 34 L-4 34 Z" ' +
      'fill="' + p.cloud + '" opacity="' + p.cloudOp + '"/>') +

    '<rect y="' + landY + '" width="' + S + '" height="' + landH + '" fill="url(#b)"/>' +
    box(0, landY, S, landH * 0.44, '0 0 100 24',
      '<path d="M0 24 L0 15 Q14 4 27 13 Q40 20 52 9 Q66 -1 78 11 Q90 20 100 12 L100 24 Z" ' +
      'fill="' + p.hill[0] + '" opacity="0.85"/>' +
      '<path d="M0 24 L0 20 Q18 12 33 19 Q48 25 62 17 Q78 9 100 19 L100 24 Z" fill="' + p.hill[1] + '"/>') +
    box(0, waterY - landH * 0.13, S, landH * 0.13, '0 0 100 8',
      '<path d="M0 8 L0 5 Q6 1 12 5 Q18 1 24 5 Q30 1 36 5 Q42 1 48 5 Q54 1 60 5 Q66 1 72 5 ' +
      'Q78 1 84 5 Q90 1 96 5 Q99 3 100 5 L100 8 Z" fill="' + p.grass + '" opacity="0.9"/>') +

    '<rect y="' + waterY + '" width="' + S + '" height="' + waterH + '" fill="url(#c)"/>' +
    box(0, waterY, S, waterH * 0.18, '0 0 100 10',
      '<path d="M0 0 L100 0 L100 5 Q88 9 76 5 Q64 1 52 5 Q40 9 28 5 Q16 1 0 5 Z" ' +
      'fill="' + p.edge + '" opacity="0.5"/>') +
    [[0.16, 0.36, 28], [0.60, 0.54, 36], [0.36, 0.76, 22], [0.76, 0.88, 30]].map(g =>
      '<rect x="' + (g[0] * S).toFixed(0) + '" y="' + (waterY + g[1] * waterH).toFixed(0) +
      '" width="' + (g[2] * 2.6).toFixed(0) + '" height="7" rx="3.5" fill="' + p.glare +
      '" opacity="' + p.glareOp + '"/>').join('') +

    '</svg>';
}

/* Где на картинке стоит каждый житель. Считаем отдельно от сцены: рисовать
   их будем поверх, средствами холста. */
function layout(things, W) {
  const S = CARD_W, m = S / W;
  return things.filter(t => t.zone).map(t => {
    const w = t.w * m, h = t.h * m;
    const y = t.zone === 'land'
      ? (0.70 - 0.012) * S - h
      : (t.zone === 'sky' ? 0.15 : 0.85) * S - h / 2;
    /* житель не должен торчать за край: в мире он мог гулять у самой
       границы, а тут кадр фиксированный */
    const x = Math.max(8, Math.min(S - w - 8, t.x * S - w / 2));
    return { img: t.img, x: x, y: y, w: w, h: h };
  });
}

function loadImg(src) {
  return new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error('img'));
    i.src = src;
  });
}

function shrink(url, w) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = Math.round(w * img.height / img.width);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/png'));
      } catch (e) { reject(e); }
    };
    img.onerror = reject;
    img.src = url;
  });
}

function makeCard({ things, name, pal, W }) {
  /* Жителей не вкладываем в svg картинками: Safari отдаёт отрисованный svg
     до того, как вложенные data-картинки загрузятся, и мир на открытке
     выходит пустым. Поэтому фон — svg, а жители рисуются на холст по одному,
     каждый после своего onload. */
  const items = layout(things, W);
  /* ждём шрифты: если открытку собрать сразу после загрузки страницы,
     заголовок нарисуется системным шрифтом вместо фирменного */
  const fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  return Promise.all([
    loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sceneSVG(things, pal, W))),
    Promise.all(items.map(it => loadImg(it.img).catch(() => null))),
    fonts.catch(() => null),
  ]).then(([bg, imgs]) => {
    const cv = document.createElement('canvas');
    cv.width = CARD_W; cv.height = CARD_H;
    const c = cv.getContext('2d');
    c.fillStyle = '#0E0A1C';
    c.fillRect(0, 0, CARD_W, CARD_H);
    c.drawImage(bg, 0, SCENE_Y, CARD_W, CARD_W);

    imgs.forEach((im, k) => {
      if (!im) return;
      const it = items[k];
      c.drawImage(im, it.x, SCENE_Y + it.y, it.w, it.h);
    });

    const brand = "'Unbounded','Nunito',system-ui,sans-serif";
    const body = "'Nunito',system-ui,sans-serif";
    c.textAlign = 'center';

    c.fillStyle = '#F4EEFF';
    c.font = '700 62px ' + brand;
    c.fillText(name || 'Мой мир', CARD_W / 2, 104, CARD_W - 90);

    const live = items.length;
    c.fillStyle = '#B3A2D4';
    c.font = '800 36px ' + body;
    c.fillText('Тут ' + window.nooka.plural(live, 'живёт', 'живут', 'живут') + ' ' + live + ' ' +
      window.nooka.plural(live, 'житель', 'жителя', 'жителей') + ' — все нарисованы от руки',
      CARD_W / 2, CARD_H - 150, CARD_W - 80);

    c.fillStyle = '#7FE7FF';
    c.font = '900 32px ' + body;
    c.fillText('А Нейро научился угадывать, где чей дом', CARD_W / 2, CARD_H - 96, CARD_W - 80);

    c.fillStyle = '#6E5F92';
    c.font = '800 27px ' + body;
    c.fillText('Nooka · nookagame.ru', CARD_W / 2, CARD_H - 38);

    return cv.toDataURL('image/png');
  });
}

/* ── доска с палитрой ── */
function Pad({ onDone, onCancel }) {
  const cvRef = useRef(null);
  const [has, setHas] = useState(false);
  const [ink, setInk] = useState(INKS[4]);
  const [size, setSize] = useState(SIZES[1]);
  /* цвет и толщину держим ещё и в ref: обработчики указателя ставятся
     один раз, замыкание на состоянии в них устареет */
  const st = useRef({ drawing: false, ink: INKS[4], size: SIZES[1] });
  useEffect(() => { st.current.ink = ink; st.current.size = size; }, [ink, size]);

  useEffect(() => {
    const cv = cvRef.current;
    const box = cv.parentElement.getBoundingClientRect();
    cv.width = PAD;
    cv.height = Math.round(PAD * box.height / box.width);
    const ctx = cv.getContext('2d');
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const pos = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height];
    };
    const down = e => {
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      st.current.drawing = true;
      ctx.strokeStyle = st.current.ink;
      ctx.lineWidth = st.current.size;
      const [x, y] = pos(e);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.01, y); ctx.stroke();
      setHas(true);
    };
    const move = e => {
      if (!st.current.drawing) return;
      const [x, y] = pos(e);
      ctx.lineTo(x, y); ctx.stroke();
    };
    const up = () => { st.current.drawing = false; };
    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', up);
    return () => {
      cv.removeEventListener('pointerdown', down);
      cv.removeEventListener('pointermove', move);
      cv.removeEventListener('pointerup', up);
      cv.removeEventListener('pointercancel', up);
      cv.removeEventListener('pointerleave', up);
    };
  }, []);

  const wipe = () => {
    const cv = cvRef.current;
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    setHas(false);
  };

  return React.createElement('div', { className: 'wdpad wd' },
    React.createElement('div', { className: 'wdpad__h' },
      React.createElement('b', null, 'Рисуй что хочешь'),
      React.createElement('span', null, 'Зверя, дерево, облако, рыбу — что угодно')),

    React.createElement('div', { className: 'wdpad__c' },
      React.createElement('canvas', { ref: cvRef }),
      !has && React.createElement('div', { className: 'wdpad__ghost' }, 'Рисуй пальцем')),

    React.createElement('div', { className: 'wdink' },
      INKS.map(c => React.createElement('button', {
        key: c, className: 'wdink__c' + (ink === c ? ' on' : ''),
        style: { background: c }, 'aria-label': 'цвет', onClick: () => setInk(c),
      })),
      React.createElement('div', { className: 'wdsize' },
        SIZES.map(s => React.createElement('button', {
          key: s, className: size === s ? 'on' : '', 'aria-label': 'толщина линии',
          onClick: () => setSize(s),
        }, React.createElement('i', { style: { width: s + 2, height: s + 2 } }))))),

    React.createElement('div', { className: 'wdpad__b' },
      React.createElement('button', {
        className: 'wdpad__x', onClick: () => (has ? wipe() : onCancel()),
      }, has ? 'Стереть' : 'Назад'),
      React.createElement('button', {
        className: 'wdpad__ok', disabled: !has, onClick: () => onDone(cvRef.current),
      }, 'Оживить')));
}

/* ── экран открытки ── */
function Card({ url, name, onClose, onKeep, kept }) {
  const [busy, setBusy] = useState(false);

  /* Поделиться картинкой умеет не всякий браузер: на телефоне это
     родное меню «отправить», на компьютере обычно только скачивание. */
  const canShare = !!(navigator.share && navigator.canShare);

  const share = async () => {
    if (busy) return;
    setBusy(true);
    try {
      const blob = await (await fetch(url)).blob();
      const file = new File([blob], 'moy-mir.png', { type: 'image/png' });
      if (canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name || 'Мой мир' });
      } else {
        const a = document.createElement('a');
        a.href = url; a.download = 'moy-mir.png';
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) { /* отменили — это не ошибка */ }
    setBusy(false);
  };

  return React.createElement('div', { className: 'wdcard wd' },
    React.createElement('div', { className: 'wdcard__h' },
      React.createElement('b', null, 'Готовая картинка'),
      React.createElement('span', null, 'Можно сохранить, отправить или показать')),
    React.createElement('div', { className: 'wdcard__p' },
      url
        ? React.createElement('img', { src: url, alt: 'Мой мир' })
        : React.createElement('div', { className: 'wdcard__wait' }, 'Собираю картинку…')),
    React.createElement('div', { className: 'wdcard__b' },
      React.createElement('button', { className: 'wdcard__x', onClick: onClose }, 'Назад'),
      React.createElement('button', {
        className: 'wdcard__keep', onClick: onKeep, disabled: !url || kept,
      }, kept ? 'Уже в коллекции' : 'В коллекцию'),
      React.createElement('button', {
        className: 'wdcard__go', onClick: share, disabled: !url || busy,
      }, canShare ? 'Отправить' : 'Сохранить')));
}

function World() {
  const [things, setThings] = useState(() => load().map((t, i) => ({
    ...t, id: 't' + i + Date.now().toString(36),
    x: 0.12 + ((i * 0.17) % 0.72),
    vx: (i % 2 ? -1 : 1) * (0.014 + (i % 4) * 0.007),
    ph: i * 1.7,
  })));
  const [pad, setPad] = useState(false);
  const [ask, setAsk] = useState(null);
  const [say, setSay] = useState('');
  const [name, setName] = useState(() => {
    try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
  });
  const [night, setNight] = useState(() => {
    try { return localStorage.getItem(NIGHT_KEY) !== 'day'; } catch (e) { return true; }
  });
  const [sel, setSel] = useState(null);        // житель, по которому ткнули
  const [poke, setPoke] = useState(null);
  const [card, setCard] = useState(false);
  const [cardUrl, setCardUrl] = useState('');
  const [kept, setKept] = useState(false);
  const [help, setHelp] = useState(() => {
    try { return !localStorage.getItem(SEEN); } catch (e) { return true; }
  });
  const worldRef = useRef(null);
  const raf = useRef(0);
  const drag = useRef(null);
  const [, force] = useState(0);

  const model = things.filter(t => t.f && t.zone).map(t => ({ f: t.f, label: t.zone }));

  useEffect(() => { store(things); }, [things]);
  useEffect(() => { if (!things.length) setSay(''); }, [things.length]);
  useEffect(() => {
    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
  }, [name]);
  useEffect(() => {
    try { localStorage.setItem(NIGHT_KEY, night ? 'night' : 'day'); } catch (e) {}
  }, [night]);
  /* мир изменился — прежняя картинка устарела */
  useEffect(() => { setCardUrl(''); setKept(false); }, [things, night, name]);

  /* реплика — подсказка на пару секунд, а не панель поверх мира */
  useEffect(() => {
    if (!say || ask) return;
    const t = setTimeout(() => setSay(''), 4000);
    return () => clearTimeout(t);
  }, [say, ask]);

  /* Мастерская засчитывается, когда в мире поселились трое: это первый
     момент, когда Нейро уже на чём-то учится, а мир перестаёт быть пустым.
     Отмечаем один раз — дальше missionWin сам не начислит повторно. */
  useEffect(() => {
    if (things.filter(t => t.zone).length < 3) return;
    try {
      const p = JSON.parse(localStorage.getItem('nooka_profile') || '{}');
      if (p.missions && p.missions.world1) return;
      if (window.nooka && window.nooka.missionWin) window.nooka.missionWin('world1', 140);
    } catch (e) {}
  }, [things]);

  const closeHelp = () => {
    setHelp(false);
    try { localStorage.setItem(SEEN, '1'); } catch (e) {}
  };

  /* ── жизнь ── */
  useEffect(() => {
    let last = performance.now();
    /* ширину мира держим в переменной и обновляем на resize: мерить её
       каждому жителю каждый кадр — лишний пересчёт разметки */
    let W = worldRef.current ? worldRef.current.getBoundingClientRect().width : 360;
    const onResize = () => {
      if (worldRef.current) W = worldRef.current.getBoundingClientRect().width;
    };
    window.addEventListener('resize', onResize);
    const tick = now => {
      const dt = Math.min(50, now - last) / 1000;
      last = now;
      let moved = false;
      things.forEach(t => {
        if (drag.current && drag.current.id === t.id) return;
        /* высокое и узкое — дерево, столб, цветок: стоит, а не бегает */
        if (t.kind !== 'still') {
          t.x += t.vx * dt;
          /* разворот считаем от края рисунка, а не от центра, иначе
             широкий житель наполовину уезжает за границу экрана */
          const edge = (t.w / 2 + 6) / W;
          if (t.x < edge) { t.x = edge; t.vx = Math.abs(t.vx); }
          if (t.x > 1 - edge) { t.x = 1 - edge; t.vx = -Math.abs(t.vx); }
        }
        t.ph += dt * (t.zone === 'sky' ? 1.9 : t.zone === 'water' ? 1.4 : 3.2);
        moved = true;
      });
      if (moved) force(v => v + 1);
      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf.current);
      window.removeEventListener('resize', onResize);
    };
  }, [things]);

  const place = (t) => {
    const z = zoneOf(t.zone);
    const box = worldRef.current ? worldRef.current.getBoundingClientRect() : { width: 360, height: 600 };
    const wob = t.kind === 'still'
      ? Math.sin(t.ph) * 1.5                                  // деревце покачивается
      : Math.sin(t.ph) * (t.zone === 'land' ? 0 : 7);
    const hop = t.zone === 'land' && t.kind !== 'still' ? Math.abs(Math.sin(t.ph)) * 5 : 0;
    /* на земле стоим на траве, в небе и в воде висим по центру пояса */
    const base = t.zone === 'land'
      ? z.bot - 0.012 - (t.h / box.height)
      : (z.top + z.bot) / 2 - (t.h / box.height) / 2;
    return { left: t.x * box.width - t.w / 2, top: base * box.height + wob - hop };
  };

  const born = (cv) => {
    const cut = cutOut(cv);
    const got = B.features(cv);
    setPad(false);
    if (!cut || !got) { setSay('Тут слишком мало нарисовано — попробуй ещё раз'); return; }

    const t = {
      id: 't' + Date.now().toString(36), img: cut.url, w: cut.w, h: cut.h, f: got.f,
      kind: cut.ratio < 0.62 ? 'still' : 'walk',
      /* слева от луны: она висит справа вверху, и новый житель садился прямо на неё */
      x: 0.16 + Math.random() * 0.48,
      vx: (Math.random() < 0.5 ? -1 : 1) * (0.014 + Math.random() * 0.016),
      ph: Math.random() * 6.28, zone: null,
    };
    const p = model.length ? B.predict(model, got.f) : null;

    if (!p || p.unsure) {
      setAsk(t);
      setSay(model.length
        ? 'Такого я ещё не видел. Покажи, где его дом'
        : 'Я пока никого не знаю. Покажи, где его дом');
      return;
    }
    t.zone = p.label;
    setThings(list => list.concat([t]).slice(-MAX_THINGS));
    setSay('Похоже на то, что живёт <em>' + zoneOf(p.label).say + '</em>. Не туда — перетащи');
  };

  const put = (zoneId) => {
    if (!ask) return;
    const t = ask;
    t.zone = zoneId;
    setAsk(null);
    setThings(list => list.concat([t]).slice(-MAX_THINGS));
    setSay('Запомнил: такое живёт <em>' + zoneOf(zoneId).say + '</em>');
  };

  /* перетаскивание — это и есть исправление ошибки Нейро */
  const grab = (e, t) => {
    if (ask) return;
    e.preventDefault();
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
    /* запоминаем точку и время: короткое касание без сдвига — это тап
       по жителю, а не попытка его перетащить */
    drag.current = { id: t.id, t: t, y: 0, x0: e.clientX, y0: e.clientY, at: Date.now(), moved: false };
    force(v => v + 1);
  };
  const moveDrag = (e) => {
    if (!drag.current) return;
    const d = drag.current;
    if (!d.moved && Math.abs(e.clientX - d.x0) + Math.abs(e.clientY - d.y0) > 7) d.moved = true;
    if (!d.moved) return;                       // ещё не решили: тап это или перенос
    const box = worldRef.current.getBoundingClientRect();
    d.t.x = Math.max(0.04, Math.min(0.96, (e.clientX - box.left) / box.width));
    d.y = (e.clientY - box.top) / box.height;
    force(v => v + 1);
  };
  const drop = () => {
    if (!drag.current) return;
    const d = drag.current;
    const t = d.t;

    /* короткое касание на месте — тап: житель подпрыгивает, и видно,
       кем его считает Нейро */
    if (!d.moved && Date.now() - d.at < 400) {
      drag.current = null;
      setSel(t);
      setSay('');
      setPoke(t.id);
      setTimeout(() => setPoke(null), 520);
      force(v => v + 1);
      return;
    }

    const z = ZONES.find(zz => d.y >= zz.top && d.y < zz.bot) || zoneOf(t.zone);
    const changed = z.id !== t.zone;
    t.zone = z.id;
    drag.current = null;
    setThings(list => list.slice());
    if (changed) setSay('Понял, такое живёт <em>' + z.say + '</em>. Запомнил');
  };

  /* убрать одного жителя — раньше можно было стереть только весь мир */
  const removeOne = (id) => {
    setThings(list => list.filter(t => t.id !== id));
    setSel(null);
    setSay('Убрал. Пример тоже забыл');
  };

  /* что Нейро думает про этого жителя: считаем по остальным примерам,
     иначе он просто узнаёт сам себя и всегда прав */
  const opinionOf = (t) => {
    const rest = things.filter(x => x.id !== t.id && x.f && x.zone)
      .map(x => ({ f: x.f, label: x.zone }));
    if (!rest.length) return null;
    return B.predict(rest, t.f);
  };

  const openCard = () => {
    setSel(null); setSay(''); setCard(true);
    if (cardUrl) return;
    const b = worldRef.current ? worldRef.current.getBoundingClientRect() : { width: 360, height: 600 };
    makeCard({
      things: things, name: name, pal: night ? PAL.night : PAL.day, W: b.width,
    }).then(setCardUrl).catch(() => {
      setCard(false);
      setSay('Не получилось собрать картинку');
    });
  };

  const keepCard = () => {
    if (!cardUrl || kept) return;
    const live = things.filter(t => t.zone).length;
    /* галерея вставляет поле svg как разметку — обычная картинка туда ложится */
    shrink(cardUrl, 460).then(small => {
      window.nookaGallery.add({
        kind: 'poster', game: 'Мой мир',
        title: name || 'Мой мир',
        note: 'Мир из ' + live + ' ' +
          window.nooka.plural(live, 'жителя', 'жителей', 'жителей') + ', нарисованных от руки',
        svg: '<img src="' + small + '" alt="" style="width:100%;display:block;border-radius:14px">',
      });
      setKept(true);
    }).catch(() => {});
  };

  const wipeAll = () => {
    setThings([]); setAsk(null); setSay('');
    try { localStorage.removeItem(KEY); } catch (e) {}
  };

  const box = worldRef.current ? worldRef.current.getBoundingClientRect() : null;
  const known = model.length;
  const pal = night ? PAL.night : PAL.day;
  const live = things.filter(t => t.zone).length;

  return React.createElement('div', { className: 'wdroot' },
    React.createElement('div', { className: 'wd' },

      React.createElement('div', {
        className: 'wdworld' + (night ? '' : ' wd--day'), ref: worldRef,
        onPointerMove: moveDrag, onPointerUp: drop, onPointerLeave: drop,
      },
        ZONES.map(z => React.createElement('div', {
          key: z.id,
          className: 'wdzone wdzone--' + z.id + (ask ? ' wdzone--ask' : ''),
          onClick: ask ? () => put(z.id) : undefined,
        },
          z.id === 'sky' ? React.createElement(Sky, { p: pal })
            : z.id === 'land' ? React.createElement(Land, { p: pal })
              : React.createElement(Water, { p: pal }),
          React.createElement('span', { className: 'wdzone__n' }, z.n))),

        React.createElement('div', { className: 'wdtop' },
          React.createElement('div', { className: 'wdtop__t' },
            React.createElement('input', {
              className: 'wdname', value: name, placeholder: 'Мой мир', maxLength: 22,
              'aria-label': 'Название мира',
              onChange: e => setName(e.target.value),
            }),
            React.createElement('span', null, known
              ? 'Нейро запомнил ' + known + ' ' +
                window.nooka.plural(known, 'пример', 'примера', 'примеров')
              : 'Нейро пока никого не знает')),
          React.createElement('div', { className: 'wdtop__c' },
            React.createElement('button', {
              className: 'wdtop__b', onClick: () => { setNight(v => !v); setSel(null); },
              'aria-label': night ? 'Сделать день' : 'Сделать ночь',
            }, night ? '☀' : '☾'),
            React.createElement('button', {
              className: 'wdtop__b', onClick: () => setHelp(true), 'aria-label': 'Как играть',
            }, '?'),
            things.length > 0 && React.createElement('button', {
              className: 'wdtop__b', onClick: wipeAll, 'aria-label': 'Начать заново',
            }, '↺'),
            React.createElement('button', {
              className: 'wdtop__b', 'aria-label': 'Закрыть',
              onClick: () => { window.location.href = 'game.html?g=data'; },
            }, '✕'))),

        !things.length && !ask && React.createElement('div', { className: 'wdempty' },
          'Тут пока пусто.\nНарисуй кого-нибудь — и он будет тут жить'),

        things.map(t => {
          const p = place(t);
          const d = drag.current && drag.current.id === t.id;
          return React.createElement('div', {
            key: t.id,
            className: 'wdthing' + (d ? ' wdthing--drag' : '') +
              (poke === t.id ? ' wdthing--poke' : '') +
              (sel && sel.id === t.id ? ' wdthing--sel' : ''),
            style: {
              width: t.w, height: t.h, left: p.left,
              top: d && box ? drag.current.y * box.height - t.h / 2 : p.top,
              transform: t.kind === 'still' ? 'none' : 'scaleX(' + (t.vx < 0 ? -1 : 1) + ')',
            },
            onPointerDown: e => grab(e, t),
          }, React.createElement('img', { src: t.img, alt: '', draggable: false }));
        }),

        ask && React.createElement('div', {
          className: 'wdthing wdthing--new',
          style: {
            width: ask.w, height: ask.h,
            left: 'calc(50% - ' + ask.w / 2 + 'px)', top: '36%', zIndex: 21,
          },
        }, React.createElement('img', { src: ask.img, alt: '', draggable: false })),

        sel && React.createElement('div', { className: 'wdsel' },
          React.createElement('img', { src: sel.img, alt: '' }),
          React.createElement('div', { className: 'wdsel__t' }, (() => {
            const o = opinionOf(sel);
            if (!o) return 'Пока не с кем сравнить — нарисуй ещё кого-нибудь';
            if (o.unsure) return 'Такого больше ни у кого нет. Он у тебя один такой';
            return ['Похож на тех, кто живёт ',
              React.createElement('b', { key: 'z' }, zoneOf(o.label).say),
              o.label === sel.zone ? ' — тут он и живёт' : ' — а живёт не там'];
          })()),
          React.createElement('button', { onClick: () => removeOne(sel.id) }, 'Убрать')),

        say && !sel && React.createElement('div', { className: 'wdsay' },
          React.createElement('i', null,
            window.nooka && window.nooka.icon ? window.nooka.icon('neuro', 28) : null),
          React.createElement('b', { dangerouslySetInnerHTML: { __html: say } }))),

      React.createElement('div', { className: 'wdbar' },
        React.createElement('button', {
          className: 'wddraw', disabled: !!ask,
          onClick: () => { setPad(true); setSay(''); setSel(null); },
        }, ask ? 'Покажи, где его дом' : 'Нарисовать'),
        React.createElement('button', {
          className: 'wdshow', disabled: !!ask || !live, onClick: openCard,
          'aria-label': 'Показать картинкой',
        }, React.createElement('svg', { width: 22, height: 22, viewBox: '0 0 22 22', fill: 'none' },
          React.createElement('rect', {
            x: 2.2, y: 4, width: 17.6, height: 14, rx: 3, stroke: 'currentColor', strokeWidth: 2,
          }),
          React.createElement('circle', { cx: 8, cy: 9.5, r: 1.6, fill: 'currentColor' }),
          React.createElement('path', {
            d: 'M3 16 L8.5 11 L12 14 L15 12 L19 15.5', stroke: 'currentColor', strokeWidth: 2,
            strokeLinecap: 'round', strokeLinejoin: 'round',
          }))))),

    pad && React.createElement(Pad, { onDone: born, onCancel: () => setPad(false) }),
    help && React.createElement(Help, { onClose: closeHelp }),
    card && React.createElement(Card, {
      url: cardUrl, name: name, kept: kept,
      onClose: () => setCard(false), onKeep: keepCard,
    }));
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(World, null));
</script>
</body>
</html>
