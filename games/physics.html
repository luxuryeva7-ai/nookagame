<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>КвантУм — Физика</title>
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
/* Светлый стиль наук (КодБот, КвантУм, Хемо Лаб) — решение Артёма 03.10.2026.
   --ak-acc-* — цвет игры. */
:root{
  --ak-bg:#FFF3E2;--ak-bg-2:#FFE8CC;--ak-surface:#FFFDF7;
  --ak-ink:#2D1B45;--ak-ink-2:#6B5680;--ak-ink-3:#A797B8;
  --ak-acc-1:#E5DCFF;--ak-acc-2:#B5A1FF;--ak-acc-3:#7C5FE0;
  --ak-cta-1:#FFEDA8;--ak-cta-2:#FFD262;--ak-cta-3:#D4A22B;
  --ak-ok-1:#C8F2DD;--ak-ok-2:#5DD9A0;--ak-ok-3:#2BA873;
  --ak-warn-1:#FFD2C8;--ak-warn-2:#FF8B7A;--ak-warn-3:#D9523F;
  --ak-display:'Fredoka One','Nunito',system-ui,sans-serif;
  --ak-body:'Nunito',system-ui,sans-serif;
}
html,body{background:var(--ak-bg);margin:0;overflow:hidden;}
#root{height:100vh;overflow:hidden;}
body{margin:0;font-family:var(--ak-body);color:var(--ak-ink);}
.ak{font-family:var(--ak-body);color:var(--ak-ink);-webkit-font-smoothing:antialiased;}
.ak-clay{background:var(--ak-surface);border-radius:28px;box-shadow:0 10px 22px -8px rgba(45,27,69,.22),0 4px 10px -4px rgba(45,27,69,.10),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(45,27,69,.06);}
.ak-btn{font-family:var(--ak-display);font-size:17px;border:none;cursor:pointer;transition:transform .08s,box-shadow .08s;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;padding:15px 26px;border-radius:999px;color:var(--ak-ink);}
.ak-btn:disabled{opacity:.55;cursor:default;}
.ak-btn--acc{color:#fff;background:linear-gradient(180deg,var(--ak-acc-2),var(--ak-acc-2) 55%,var(--ak-acc-3));box-shadow:0 6px 0 var(--ak-acc-3),0 12px 24px -6px rgba(45,27,69,.3),inset 0 2px 0 rgba(255,255,255,.45);}
.ak-btn--acc:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ak-acc-3);}
.ak-btn--cta{color:var(--ak-ink);background:linear-gradient(180deg,#FFEDA8,#FFD262 55%,#FFC03A);box-shadow:0 6px 0 var(--ak-cta-3),0 12px 24px -6px rgba(212,162,43,.55),inset 0 2px 0 rgba(255,255,255,.85);}
.ak-btn--cta:active{transform:translateY(4px);}
.ak-btn--soft{color:var(--ak-ink);background:linear-gradient(180deg,#fff,#FFF7E8);box-shadow:0 4px 0 rgba(45,27,69,.10),0 8px 18px -6px rgba(45,27,69,.12),inset 0 2px 0 #fff,inset 0 0 0 1px rgba(45,27,69,.06);}
.ak-btn--soft:active{transform:translateY(3px);}
.ak-btn--sm{padding:10px 18px;font-size:14px;}
.ak-btn--ok{color:#fff;background:linear-gradient(180deg,#7CECB5,#5DD9A0 55%,#3FC685);box-shadow:0 6px 0 var(--ak-ok-3),0 12px 24px -6px rgba(43,168,115,.5),inset 0 2px 0 rgba(255,255,255,.5);}
.ak-btn--ok:active{transform:translateY(4px);}
.ak-btn--go{color:#fff;background:linear-gradient(180deg,#FFA48F,#FF7A64 55%,#F25D45);box-shadow:0 6px 0 var(--ak-warn-3),0 12px 24px -6px rgba(217,82,63,.5),inset 0 2px 0 rgba(255,255,255,.45);}
.ak-btn--go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ak-warn-3);}
@keyframes ak-bob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-5px) rotate(1deg);}}
@keyframes ak-pop{0%{transform:scale(.65);opacity:0;}65%{transform:scale(1.07);}100%{transform:scale(1);opacity:1;}}
@keyframes ak-pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
@keyframes ak-shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
@keyframes lb-hint{0%,100%{transform:translate(0,0);opacity:.95;}50%{transform:translate(-14px,-10px);opacity:.6;}}
@keyframes lb-spin{to{transform:rotate(360deg);}}
@keyframes lb-blink{0%,100%{opacity:1;}50%{opacity:.25;}}
@keyframes lb-flow{to{stroke-dashoffset:-20;}}
.lb-flow{stroke-dasharray:4 6;animation:lb-flow .5s linear infinite;}
.lb-body>*{flex-shrink:0;}
.ak-bob{animation:ak-bob 3s ease-in-out infinite;}
.ak-pop{animation:ak-pop .38s cubic-bezier(.2,.8,.3,1) both;}
.ak-pulse{animation:ak-pulse 1.4s ease-in-out infinite;}
.ak-shake{animation:ak-shake .4s ease-in-out;}
.lb-hint{animation:lb-hint 1.6s ease-in-out infinite;}
.lb-spin{transform-box:fill-box;transform-origin:50% 50%;animation:lb-spin 1s linear infinite;}
.lb-blink{animation:lb-blink .8s ease-in-out infinite;}
input[type=range]{-webkit-appearance:none;width:100%;height:20px;border-radius:999px;background:transparent;cursor:pointer;outline:none;}
input[type=range]::-webkit-slider-runnable-track{height:20px;border-radius:999px;background:linear-gradient(180deg,var(--ak-acc-1),var(--ak-acc-2));}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;margin-top:-9px;cursor:pointer;background:linear-gradient(180deg,#fff,#FFF7E8);box-shadow:0 4px 0 rgba(45,27,69,.15),0 8px 16px -6px rgba(45,27,69,.2);}
</style>
<script src="/metrika.js" defer></script>

<script>
/* ============================================================
   Общее ядро светлых игр Nooka (РобоЛаб, БиоМир) — 03.10.2026.
   Устроено как КосмоПорт (games/space.html), но в светлом стиле
   наук. Игра задаёт перед запуском:
     LAB       — ключ, название, предмет, бесплатные уровни, тексты;
     LB_LEVELS — уровни: компонент, название, подпись, «ага»;
     LB_QUIZ   — по два вопроса проверки связи на уровень.
   У уровня может быть ставка: bet: { q, opts: [три ответа], ok: индекс }.
   Тогда заставка не пускает в уровень без ставки, а экран победы
   сверяет её с тем, что вышло на деле (КвантУм, 03.10.2026).
   ============================================================ */
const { useState, useEffect, useRef, useMemo } = React;
const h = React.createElement;

/* ── мелочи ─────────────────────────────────────────────── */
const lbClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lbNorm = d => ((d % 360) + 540) % 360 - 180;
const lbRad = d => d * Math.PI / 180;
function lbPt(svg, e) {
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  return { x: (e.clientX - r.left) * vb.width / r.width, y: (e.clientY - r.top) * vb.height / r.height };
}
function useLoop(fn, on) {
  const f = useRef(fn);
  f.current = fn;
  useEffect(() => {
    if (!on) return;
    let id, last = performance.now();
    const tick = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; f.current(dt, now); id = requestAnimationFrame(tick); };
    id = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(id);
  }, [on]);
}
const lbWord = (n, a, b, c) => window.nooka ? window.nooka.plural(n, a, b, c) : c;

/* ── звук: синтез в браузере, без файлов ─────────────────── */
const SFX = (() => {
  let ctx = null, eng = null, mute = false;
  try { mute = localStorage.getItem('nooka_lab_mute') === '1'; } catch (e) {}
  const ac = () => {
    if (mute) return null;
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(f, d, type, vol, f2) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d);
  }
  function noise(d, vol, lp) {
    const c = ac(); if (!c) return;
    const n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = lp || 600;
    g.gain.setValueAtTime(vol || 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  }
  return {
    get mute() { return mute; },
    setMute(v) { mute = v; try { localStorage.setItem('nooka_lab_mute', v ? '1' : '0'); } catch (e) {} },
    tick: () => tone(880, 0.1, 'square', 0.04),
    pop: () => tone(620, 0.09, 'triangle', 0.08, 940),
    no: () => tone(220, 0.18, 'triangle', 0.08, 160),
    bump: () => { noise(0.15, 0.25, 500); tone(140, 0.15, 'sine', 0.1, 70); },
    whir: () => tone(300, 0.25, 'sawtooth', 0.03, 520),
    beep: () => tone(1500, 0.06, 'sine', 0.05),
    note: (f, d, vol) => tone(f, d || 0.5, 'triangle', vol || 0.09),
    /* щипок струны: шум бежит по кольцу и гаснет (алгоритм Карплуса — Стронга) */
    pluck: (f, vol, dur) => {
      const c = ac(); if (!c) return;
      const sr = c.sampleRate, n = Math.floor(sr * (dur || 1.8)), b = c.createBuffer(1, n, sr), a = b.getChannelData(0);
      const N = Math.max(2, Math.round(sr / f - 0.5)), ring = new Float32Array(N);
      for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
      for (let i = 0, k = 0; i < n; i++) { const v = ring[k], w = ring[(k + 1) % N]; a[i] = v; ring[k] = 0.4985 * (v + w); k = (k + 1) % N; }
      const s = c.createBufferSource(), g = c.createGain(), lp = c.createBiquadFilter(), t = c.currentTime;
      s.buffer = b; lp.type = 'lowpass'; lp.frequency.value = Math.min(9000, f * 9);
      g.gain.setValueAtTime(vol || 0.3, t);
      s.connect(lp); lp.connect(g); g.connect(c.destination); s.start(t);
    },
    ok: () => { tone(660, 0.12, 'triangle', 0.09); setTimeout(() => tone(880, 0.12, 'triangle', 0.09), 110); setTimeout(() => tone(1320, 0.26, 'triangle', 0.09), 220); }
  };
})();

/* ── ставка до опыта ─────────────────────────────────────── */
let LB_CUR = 0;                                   // какой уровень открыт
const LB_BET = {};                                // номер уровня → индекс ставки
const lbBetOf = n => { const L = LB_LEVELS[n - 1]; return L && L.bet; };
function lbBetSave(n, i) {
  LB_BET[n] = i;
  try { localStorage.setItem(`nooka_bet_${LAB.key}_${n}`, String(i)); } catch (e) {}
}
function lbBetGet(n) {
  if (LB_BET[n] != null) return LB_BET[n];
  try { const v = localStorage.getItem(`nooka_bet_${LAB.key}_${n}`); return v == null ? null : +v; } catch (e) { return null; }
}
function BetReveal() {
  const B = lbBetOf(LB_CUR), i = lbBetGet(LB_CUR);
  if (!B || i == null || !B.opts[i]) return null;
  const hit = i === B.ok;
  return h('div', { style: { background: hit ? 'var(--ak-ok-1)' : '#fff', border: '2px dashed ' + (hit ? 'var(--ak-ok-2)' : 'var(--ak-acc-2)'), borderRadius: 16, padding: '10px 14px', marginBottom: 12, textAlign: 'left', fontSize: 13.5, lineHeight: 1.45, color: 'var(--ak-ink)' } },
    h('div', { style: { fontFamily: 'var(--ak-display)', color: hit ? 'var(--ak-ok-3)' : 'var(--ak-acc-3)', marginBottom: 2 } }, hit ? '🎯 Ставка сыграла!' : '🤔 Ставка и опыт'),
    'Твоя ставка: «', B.opts[i], '».', hit ? ' Так и есть.' : h('span', null, ' На деле: «', h('b', null, B.opts[B.ok]), '».'));
}

/* ── общие окна, светлый стиль наук ──────────────────────── */
function TopBar({ n, title, onHome, step, total }) {
  const [mute, setMute] = useState(SFX.mute);
  return h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px 6px', flexShrink: 0 } },
    h('button', { className: 'ak-btn ak-btn--soft ak-btn--sm', onClick: onHome }, '← Назад'),
    h('div', { style: { flex: 1, minWidth: 0 } },
      h('div', { style: { fontFamily: 'var(--ak-display)', fontSize: 11, color: 'var(--ak-ink-3)', textTransform: 'uppercase', letterSpacing: 1 } }, 'Уровень ', n),
      h('div', { style: { fontFamily: 'var(--ak-display)', fontSize: 15.5, lineHeight: 1.15, color: 'var(--ak-ink)' } }, title)),
    total > 1 && h('div', { style: { display: 'flex', gap: 5 } }, Array.from({ length: total }, (_, i) => h('div', {
      key: i,
      style: {
        width: 22, height: 22, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontFamily: 'var(--ak-display)',
        background: i < step ? 'var(--ak-ok-2)' : i === step ? 'var(--ak-acc-2)' : 'rgba(45,27,69,.1)', color: i <= step ? '#fff' : 'var(--ak-ink-3)'
      }
    }, i + 1))),
    h('button', {
      'aria-label': mute ? 'Включить звук' : 'Выключить звук', onClick: () => { SFX.setMute(!mute); setMute(!mute); },
      style: { border: 'none', background: 'transparent', fontSize: 17, cursor: 'pointer', padding: 4, opacity: 0.6 }
    }, mute ? '🔇' : '🔊'));
}
function TaskBadge({ children }) {
  return h('div', {
    style: {
      display: 'inline-flex', alignItems: 'center', gap: 10, padding: '10px 16px 10px 13px', borderRadius: 999, background: '#fff', maxWidth: 360, boxSizing: 'border-box', flexShrink: 0,
      fontFamily: 'var(--ak-display)', fontSize: 14, color: 'var(--ak-ink)', lineHeight: 1.3, boxShadow: '0 4px 0 rgba(45,27,69,.08),0 10px 22px -6px rgba(45,27,69,.14)'
    }
  }, h('div', { className: 'ak-pulse', style: { width: 10, height: 10, borderRadius: '50%', background: 'var(--ak-acc-2)', flexShrink: 0, boxShadow: '0 0 0 4px var(--ak-acc-1)' } }),
  h('span', null, children));
}
function LbMascot({ kind, size }) {
  return h('img', { src: `../mascot/${kind || 'hello'}.webp`, alt: 'Нейро', width: size, style: { width: size, height: 'auto', display: 'block', filter: 'drop-shadow(0 8px 14px rgba(45,27,69,.18))' } });
}
function WinModal({ title, law, fact, onNext, onHome }) {
  return h('div', {
    style: { position: 'absolute', inset: 0, background: 'rgba(45,27,69,.5)', backdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200 }
  }, h('div', { className: 'ak-clay ak-pop', style: { margin: 18, padding: '20px 22px 24px', textAlign: 'center', maxWidth: 330 } },
    h('div', { style: { display: 'flex', justifyContent: 'center', marginBottom: 2 } }, h(LbMascot, { kind: 'win', size: 120 })),
    h('div', { style: { fontFamily: 'var(--ak-display)', fontSize: 22, color: 'var(--ak-ink)', marginBottom: 12 } }, title),
    h(BetReveal),
    h('div', { style: { background: 'var(--ak-acc-1)', borderRadius: 18, padding: '13px 16px', marginBottom: 18, textAlign: 'left' } },
      h('div', { style: { fontFamily: 'var(--ak-display)', fontSize: 13.5, color: 'var(--ak-acc-3)', marginBottom: 6, lineHeight: 1.4 } }, '💡 ', law),
      h('div', { style: { fontSize: 13, color: 'var(--ak-ink)', lineHeight: 1.55 } }, fact)),
    h('div', { style: { display: 'flex', gap: 10, justifyContent: 'center' } },
      h('button', { className: 'ak-btn ak-btn--soft ak-btn--sm', onClick: onHome }, '🏠'),
      h('button', { className: 'ak-btn ak-btn--cta', onClick: onNext }, 'Дальше →'))));
}
function IntroModal({ emoji, title, ask, task, tip, onStart }) {
  const B = lbBetOf(LB_CUR);
  const [pick, setPick] = useState(null);
  const ready = !B || pick != null;
  return h('div', {
    style: {
      position: 'absolute', inset: 0, zIndex: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '24px 22px 26px', overflowY: 'auto', boxSizing: 'border-box',
      background: 'linear-gradient(160deg,var(--ak-acc-1) 0%,var(--ak-bg) 55%)'
    }
  }, h('div', { className: 'ak-bob', style: { marginBottom: 4 } }, emoji ? h('div', { style: { fontSize: 58 } }, emoji) : h(LbMascot, { kind: 'hello', size: B ? 84 : 100 })),
  h('div', { style: { fontFamily: 'var(--ak-display)', fontSize: 26, color: 'var(--ak-ink)', marginBottom: 4, textAlign: 'center' } }, title),
  B ? h('div', { style: { width: '100%', maxWidth: 320, marginBottom: 12 } },
    h('div', { style: { fontFamily: 'var(--ak-display)', fontSize: 16, color: 'var(--ak-acc-3)', marginBottom: 8, textAlign: 'center', lineHeight: 1.35 } }, '🤔 Спорим? ', B.q),
    B.opts.map((o, i) => h('button', {
      key: i, onClick: () => { SFX.tick(); setPick(i); },
      style: {
        display: 'block', width: '100%', marginBottom: 7, padding: '11px 14px', borderRadius: 14, cursor: 'pointer', textAlign: 'left', fontFamily: 'var(--ak-body)', fontWeight: 800, fontSize: 14,
        color: 'var(--ak-ink)', border: 'none', background: pick === i ? 'var(--ak-acc-1)' : 'rgba(255,255,255,.92)',
        boxShadow: pick === i ? 'inset 0 0 0 3px var(--ak-acc-3)' : '0 3px 0 rgba(45,27,69,.07)'
      }
    }, pick === i ? '👉 ' : '', o)))
    : ask && h('div', { style: { fontFamily: 'var(--ak-display)', fontSize: 16, color: 'var(--ak-acc-3)', marginBottom: 16, textAlign: 'center' } }, ask),
  h('div', { style: { width: '100%', maxWidth: 320, background: 'rgba(255,255,255,.85)', borderRadius: 20, padding: '12px 18px', marginBottom: 10, boxSizing: 'border-box', boxShadow: 'inset 0 1px 0 #fff, 0 4px 12px -6px rgba(45,27,69,.1)' } },
    h('div', { style: { fontFamily: 'var(--ak-display)', fontSize: 13, color: 'var(--ak-acc-3)', marginBottom: 4 } }, B ? '🎯 Проверь опытом' : '🎯 Задача'),
    h('div', { style: { fontSize: 14.5, color: 'var(--ak-ink)', lineHeight: 1.5, fontWeight: 700 } }, task)),
  h('div', { style: { width: '100%', maxWidth: 320, background: 'rgba(255,210,98,.2)', borderRadius: 14, padding: '9px 16px', marginBottom: 18, fontSize: 13.5, color: 'var(--ak-ink-2)', lineHeight: 1.5, boxSizing: 'border-box' } }, '👆 ', tip),
  h('button', {
    className: 'ak-btn ak-btn--acc', style: { minWidth: 200, fontSize: 18 }, disabled: !ready,
    onClick: () => { SFX.pop(); if (B) lbBetSave(LB_CUR, pick); onStart(); }
  }, ready ? 'Начать!' : 'Сначала ставка'));
}
function LbShell({ n, title, step, total, onHome, children }) {
  return h('div', {
    className: 'ak',
    style: {
      height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative',
      background: 'radial-gradient(120% 60% at 50% -10%,var(--ak-acc-1) 0%,transparent 60%),linear-gradient(180deg,var(--ak-bg-2),var(--ak-bg))'
    }
  }, h(TopBar, { n, title, onHome, step: step || 0, total: total || 1 }), children);
}
function LbBody({ children }) {
  /* lb-body: дети не сжимаются — длинная подсказка не наезжает на кнопку, экран просто прокручивается */
  return h('div', { className: 'lb-body', style: { flex: 1, display: 'flex', flexDirection: 'column', gap: 10, padding: '6px 16px 22px', alignItems: 'center', overflowY: 'auto' } }, children);
}
/* Сцена: светлая карточка. bg — фон игры (чертёж у РобоЛаба, зелень у БиоМира). */
function LbScene({ H, children, svgRef, bg, shake, ...ev }) {
  return h('div', { className: shake ? 'ak-shake' : null, style: { width: '100%', maxWidth: 360, flexShrink: 0, position: 'relative' } },
    h('svg', {
      ref: svgRef, viewBox: `0 0 340 ${H}`, ...ev,
      style: { width: '100%', display: 'block', borderRadius: 22, touchAction: 'none', userSelect: 'none', WebkitUserSelect: 'none', background: bg || LAB.sceneBg, boxShadow: '0 6px 0 rgba(45,27,69,.08)' }
    }, LAB.sceneDeco ? LAB.sceneDeco(H) : null, children));
}
function LbNote({ children, ok }) {
  return h('div', {
    style: { fontSize: 14.5, textAlign: 'center', maxWidth: 330, lineHeight: 1.45, minHeight: 21, fontFamily: 'var(--ak-display)', color: ok ? 'var(--ak-ok-3)' : 'var(--ak-ink-2)' }
  }, children);
}
function LbChoice({ items, value, onPick, disabled, cols }) {
  return h('div', { style: { display: 'grid', gridTemplateColumns: `repeat(${cols || items.length},1fr)`, gap: 8, width: '100%', maxWidth: 360 } },
    items.map(it => h('button', {
      key: it.id, disabled: disabled || it.off, onClick: () => { SFX.pop(); onPick(it.id); },
      style: {
        border: value === it.id ? '3px solid var(--ak-acc-3)' : '3px solid transparent', cursor: 'pointer', borderRadius: 16, padding: '7px 3px',
        fontFamily: 'var(--ak-body)', background: value === it.id ? 'var(--ak-acc-1)' : 'rgba(255,255,255,.94)', boxShadow: '0 4px 0 rgba(45,27,69,.08)',
        opacity: (disabled || it.off) && value !== it.id ? 0.55 : 1
      }
    }, it.emoji && h('div', { style: { fontSize: 22 } }, it.emoji), h('div', { style: { fontSize: 12.5, fontWeight: 800, color: 'var(--ak-ink)', marginTop: 2, lineHeight: 1.2 } }, it.name))));
}
function LbNext({ last, onClick }) {
  return h('button', { className: 'ak-btn ak-btn--ok ak-pop', style: { width: '100%', maxWidth: 360, flexShrink: 0 }, onClick: () => { SFX.pop(); onClick(); } },
    last ? 'Уровень пройден →' : 'Следующая задача →');

/* Уровень → (победа) → проверка связи → миссия. ?n=4 открывает уровень сразу.
   Уровни после LAB.free — по доступу (ответ сервера через nooka-access). */
function LbApp() {
  const first = +new URLSearchParams(location.search).get('n');
  const [s, setS] = useState('home');
  const [paid, setPaid] = useState(null);
  useEffect(() => {
    const A = window.nookaAccess;
    if (A) A.ready.then(st => setPaid(!!st.paid));
    if (first >= 1 && first <= LB_LEVELS.length) open(first);
  }, []);
  function open(k) {
    if (!LB_LEVELS[k - 1] || !LB_LEVELS[k - 1].C) return setS('home');
    if (k <= LAB.free) return setS('l' + k);
    const A = window.nookaAccess;
    if (!A) return setS('home');
    A.ready.then(st => {
      setPaid(!!st.paid);
      if (st.paid) return setS('l' + k);
      setS('home');
      if (st.offline) return setS('off');
      A.paywall({ title: `Уровни ${LAB.free + 1}–${LB_LEVELS.length} — в платной части`, sub: LAB.wall });
    });
  }
  const n = +s.slice(1), L = LB_LEVELS[n - 1], home = () => setS('home');
  if (n) LB_CUR = n;
  return h('div', { style: { width: '100%', height: '100vh', maxWidth: 480, margin: '0 auto', position: 'relative', overflow: 'hidden' } },
    s === 'home' && h(LbHome, { onSelect: open, paid }),
    s === 'off' && h(LbOffline, { onHome: home }),
    s[0] === 'l' && L && h(L.C, { key: s, onWin: () => setS('q' + n), onHome: home }),
    s[0] === 'q' && L && h(LbQuiz, {
      key: s, n, title: L.t, onHome: home,
      onDone: () => {
        const last = n >= LB_LEVELS.length || !LB_LEVELS[n].C;
        setS('home');
        if (window.nooka) window.nooka.missionWin(LAB.key + n, 80, { nextLabel: last ? 'К уровням →' : 'Следующий уровень →', onNext: () => { if (!last) open(n + 1); } });
      }
    }));
}
