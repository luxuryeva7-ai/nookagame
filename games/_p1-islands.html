<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прототип 1 — Острова</title>
<link rel="icon" href="../logo.svg">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{
  --ink:#F3EEFF;--ink-2:#A896C9;--ink-3:#6E5C90;
  --pri:#A98BFF;--pri-d:#7B4FF2;--sun:#FFD84D;--tint:#4ED99B;
  --brand:'Unbounded','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#07050F}
body{font-family:var(--body);color:var(--ink);min-height:100vh;
  background:
    radial-gradient(900px 520px at 20% 4%,rgba(78,217,155,.16),transparent 60%),
    radial-gradient(900px 620px at 85% 38%,rgba(123,79,242,.24),transparent 62%),
    radial-gradient(700px 520px at 12% 76%,rgba(255,216,77,.10),transparent 60%),
    linear-gradient(180deg,#120E22 0%,#0B0818 50%,#06040D 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 14%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 74% 8%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 33% 42%,#E9DFFF,transparent),
    radial-gradient(1.1px 1.1px at 88% 55%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 58% 76%,#FFE9B8,transparent),
    radial-gradient(1px 1px at 22% 88%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 95% 88%,#D9CCFF,transparent)}

.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;
  padding:16px 16px calc(44px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top a{text-decoration:none;font-weight:800;font-size:13.5px;color:var(--ink-2)}
.top .brand{font-family:var(--brand);font-weight:900;font-size:16px}
.top .brand em{font-style:normal;color:var(--pri)}
h1{font-family:var(--brand);font-weight:900;font-size:26px;line-height:1.1}
.h-sub{margin-top:6px;font-weight:800;font-size:13px;color:var(--tint)}

.bar{position:sticky;top:0;z-index:20;margin:14px -16px 0;padding:10px 16px;
  display:flex;align-items:center;gap:11px;
  background:rgba(9,7,18,.85);backdrop-filter:blur(12px);
  box-shadow:0 1px 0 rgba(255,255,255,.07)}
.bar__n{font-family:var(--brand);font-weight:700;font-size:14px;white-space:nowrap}
.bar__n s{text-decoration:none;color:var(--ink-3)}
.bar__b{flex:1;height:7px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.bar__b i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--tint),#fff8);
  box-shadow:0 0 10px var(--tint)}
.bar__xp{font-family:var(--brand);font-weight:700;font-size:13px;color:var(--sun)}

/* ── остров ── */
.isle{position:relative;margin-top:26px;padding:16px 14px 18px;border-radius:34px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09),0 26px 60px -34px #000}
.isle::before{content:'';position:absolute;inset:-1px;border-radius:34px;pointer-events:none;
  background:radial-gradient(160px 90px at 22% 0%,var(--zone,rgba(169,139,255,.22)),transparent 70%)}
.isle__hd{position:relative;display:flex;align-items:baseline;justify-content:space-between;
  margin:0 6px 6px}
.isle__t{font-family:var(--brand);font-weight:700;font-size:16px}
.isle__n{font-weight:800;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.isle__d{position:relative;margin:0 6px 12px;font-weight:600;font-size:12.5px;line-height:1.4;color:var(--ink-2)}

.field{position:relative}
.field svg.link{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.link path{fill:none;stroke-width:3;stroke-linecap:round}
.link .on{stroke:var(--tint);opacity:.5}
.link .off{stroke:rgba(255,255,255,.16);stroke-dasharray:2 10}

.node{position:absolute;transform:translateX(-50%);width:120px;
  display:flex;flex-direction:column;align-items:center;gap:7px}
.dot{position:relative;width:60px;height:60px;border-radius:22px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 8px 18px -9px #000;
  transition:transform .16s cubic-bezier(.2,.8,.3,1)}
.dot:hover{transform:translateY(-3px)}
.dot svg.g{width:28px;height:28px;color:#D6C8FF}
.dot i{position:absolute;right:-5px;bottom:-5px;min-width:21px;height:21px;padding:0 5px;
  border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-family:var(--brand);font-weight:700;font-size:11px;font-style:normal;
  color:#1B0F30;background:#CBB8FF;box-shadow:0 3px 8px -3px #000}
.cap{text-align:center;font-weight:900;font-size:12px;line-height:1.25;color:var(--ink)}

.node.done .dot{background:linear-gradient(180deg,var(--tint),#1E7A55);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28),0 10px 22px -12px var(--tint)}
.node.done .dot svg.g{color:#07301F}
.node.done .dot i{background:#07301F;color:var(--tint)}
.node.done .dot i svg{width:12px;height:12px}
.node.done .cap{color:var(--ink-2)}
.node.now .dot{width:74px;height:74px;border-radius:27px;
  background:linear-gradient(180deg,#B79BFF,#7B4FF2);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 14px 30px -14px #7B4FF2}
.node.now .dot svg.g{width:34px;height:34px;color:#fff}
.node.now .dot::after{content:'';position:absolute;inset:-8px;border-radius:34px;
  box-shadow:0 0 0 2.5px rgba(169,139,255,.5);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:.2;transform:scale(1.1)}}
.node.now .cap{display:none}   /* название уже стоит в карточке под полем */
.node.lock{opacity:.48}

/* текущий остров: подпись цели и кнопка под полем */
.isle__go{position:relative;margin:14px 6px 0;padding:13px 15px;border-radius:22px;
  background:rgba(123,79,242,.16);box-shadow:inset 0 0 0 1.5px rgba(169,139,255,.32)}
.isle__go b{display:block;font-family:var(--brand);font-weight:700;font-size:14.5px}
.isle__go p{margin:5px 0 11px;font-weight:600;font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.go{padding:11px 26px;border-radius:999px;border:none;cursor:pointer;
  font-family:var(--brand);font-weight:700;font-size:14px;color:#33240A;
  background:linear-gradient(180deg,#FFF1B4,#FFD84D);box-shadow:0 4px 0 #C79412}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #C79412}

.hop{display:flex;justify-content:center;padding:6px 0 0}
.hop span{font-size:20px;line-height:1;opacity:.4;letter-spacing:6px}

.bonus{margin-top:26px;padding:15px 16px;border-radius:26px;display:flex;align-items:center;gap:13px;
  background:linear-gradient(180deg,rgba(255,216,77,.14),rgba(255,216,77,.04));
  box-shadow:inset 0 0 0 1.5px rgba(255,216,77,.3)}
.bonus .st{flex-shrink:0;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,216,77,.16);box-shadow:inset 0 0 0 1.5px rgba(255,216,77,.4)}
.bonus .st svg{width:24px;height:24px;color:var(--sun)}
.bonus b{display:block;font-family:var(--brand);font-weight:700;font-size:14px;color:#FFE9A8}
.bonus span{display:block;margin-top:3px;font-weight:600;font-size:12px;line-height:1.35;color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="#">← Моя база</a><span class="brand">Noo<em>ka</em></span></div>
  <h1>Откуда ИИ знает</h1>
  <div class="h-sub">Данные и обучение</div>
  <div class="bar">
    <span class="bar__n">4 <s>из 10</s></span>
    <span class="bar__b"><i style="width:40%"></i></span>
    <span class="bar__xp">300 XP</span>
  </div>
  <div id="isles"></div>
</div>

<script src="_proto-sprite.js"></script>
<script src="nooka-levels.js"></script>
<script>
(function () {
  var g = window.nookaLevels.games[0], DONE = 4;

  /* Три привала вместо десяти шагов: ребёнок видит не длину, а куски пути. */
  var ZONES = [
    { t: 'Знакомство', d: 'Где живёт ИИ и откуда у него знания', from: 0, to: 3,
      tint: 'rgba(78,217,155,.22)',
      pos: [[28, 8], [67, 56], [74, 140]] },
    { t: 'Учим ИИ', d: 'Ты даёшь примеры — он учится ровно на них', from: 3, to: 7,
      tint: 'rgba(169,139,255,.24)',
      pos: [[25, 8], [63, 54], [76, 140], [33, 196]] },
    { t: 'Проверка', d: 'Что он знает на самом деле — и где врёт', from: 7, to: 10,
      tint: 'rgba(255,216,77,.2)',
      pos: [[27, 8], [68, 54], [47, 140]] }
  ];

  function nodeHtml(lv, i, x, y) {
    var kind = i < DONE ? 'done' : (i === DONE ? 'now' : 'lock');
    var badge = kind === 'done'
      ? '<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></i>'
      : '<i>' + (i + 1) + '</i>';
    return '<div class="node ' + kind + '" style="left:' + x + '%;top:' + y + 'px">' +
      '<button class="dot"><svg class="g"><use href="#g-' + lv.g + '"></use></svg>' + badge + '</button>' +
      '<span class="cap">' + lv.t + '</span></div>';
  }

  var out = ZONES.map(function (z, zi) {
    var lvs = g.levels.slice(z.from, z.to);
    var pts = z.pos.map(function (p) { return { x: p[0], y: p[1] + 34 }; });
    /* поле кончается там, где кончается нижняя подпись */
    var h = Math.max.apply(null, pts.map(function (p) { return p.y; })) + 108;
    var seg = '';
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], my = (a.y + b.y) / 2;
      var cls = (z.from + i) <= DONE ? 'on' : 'off';
      seg += '<path class="' + cls + '" vector-effect="non-scaling-stroke" d="M' + a.x + ' ' + a.y +
             ' C' + a.x + ' ' + my + ' ' + b.x + ' ' + my + ' ' + b.x + ' ' + b.y + '"/>';
    }
    var nodes = lvs.map(function (lv, i) {
      return nodeHtml(lv, z.from + i, pts[i].x, pts[i].y);
    }).join('');

    var hasNow = DONE >= z.from && DONE < z.to;
    var cur = g.levels[DONE];
    var goBox = hasNow ? '<div class="isle__go"><b>' + cur.t + '</b><p>' + (cur.goal || cur.s) +
      '</p><button class="go">Играть</button></div>' : '';

    return '<div class="isle" style="--zone:' + z.tint + '">' +
      '<div class="isle__hd"><span class="isle__t">' + z.t + '</span>' +
      '<span class="isle__n">' + (z.to - z.from) + ' уровня</span></div>' +
      '<div class="isle__d">' + z.d + '</div>' +
      '<div class="field" style="height:' + h + 'px">' +
      '<svg class="link" viewBox="0 0 100 ' + h + '" preserveAspectRatio="none">' + seg + '</svg>' +
      nodes + '</div>' + goBox + '</div>' +
      (zi < 2 ? '<div class="hop"><span>· · ·</span></div>' : '');
  }).join('');

  var b = g.extras[0];
  out += '<div class="bonus"><span class="st"><svg viewBox="0 0 24 24" fill="currentColor">' +
    '<path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.7 1.2 6.6L12 17.6l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"/></svg></span>' +
    '<span><b>' + b.t + '</b><span>' + b.goal + '</span></span></div>';

  document.getElementById('isles').innerHTML = out;
})();
</script>
</body>
</html>
