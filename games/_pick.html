<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Выбор карты уровней — Nooka</title>
<link rel="icon" href="../logo.svg">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{--bg:#FFF3E4;--card:#FFFDFA;--ink:#2D1B45;--ink-2:#6B5A87;--ink-3:#9C8CB5;
  --pri:#7B2FFF;--sun:#FFD84D;
  --brand:'Unbounded','Nunito',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.hd{max-width:1180px;margin:0 auto;padding:26px 22px 0}
h1{font-family:var(--brand);font-weight:900;font-size:26px;letter-spacing:-.01em}
.sub{margin-top:8px;font-weight:700;font-size:14px;color:var(--ink-2);max-width:640px;line-height:1.5}

.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.tab{padding:11px 17px;border-radius:999px;border:none;cursor:pointer;font-family:var(--body);
  font-weight:800;font-size:13.5px;color:var(--ink-2);background:#fff;
  box-shadow:0 2px 0 rgba(45,27,69,.06);transition:transform .14s,color .14s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:var(--pri);color:#fff;box-shadow:0 3px 0 #4713A8}

.stage{max-width:1180px;margin:22px auto 0;padding:0 22px 40px;display:grid;
  grid-template-columns:392px 1fr;gap:28px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
.phone{width:392px;height:800px;border-radius:38px;padding:9px;background:#1B1030;
  box-shadow:0 30px 70px -34px rgba(45,27,69,.8)}
.phone iframe{width:100%;height:100%;border:none;border-radius:30px;display:block;background:#0A0714}

.note{padding:22px 24px;border-radius:26px;background:var(--card);
  box-shadow:0 2px 0 rgba(45,27,69,.05),0 18px 40px -30px rgba(45,27,69,.6)}
.note h2{font-family:var(--brand);font-weight:700;font-size:20px}
.note .idea{margin-top:12px;font-weight:800;font-size:14.5px;line-height:1.5;color:var(--pri)}
.note p{margin-top:12px;font-weight:600;font-size:14px;line-height:1.6;color:var(--ink-2)}
.note dl{margin-top:16px;display:grid;gap:10px}
.note dt{font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.note dd{margin-top:3px;font-weight:700;font-size:13.5px;line-height:1.5}
.plus dd{color:#12A66B}.minus dd{color:#C2410C}
</style>
</head>
<body>
<div class="hd">
  <h1>Карта уровней: пять вариантов</h1>
  <div class="sub">Один и тот же экран — первая игра, четыре уровня пройдено. Переключай и смотри
    на телефоне: именно так его видит ребёнок.</div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="stage">
  <div class="phone"><iframe id="fr" src="_route-proto.html"></iframe></div>
  <div class="note" id="note"></div>
</div>

<script>
var V = [
  { id: 'route', f: '_route-proto.html', t: 'Тропа',
    idea: 'Путь, по которому идёшь. Как в Duolingo.',
    p: 'Уровни стоят змейкой, пройденное светится, впереди пунктир. Один взгляд отвечает: где я, сколько позади, сколько осталось.',
    plus: 'Понятно без слов даже тем, кто читает плохо. Виден конец пути.',
    minus: 'Длинно скроллить. Названия уровней мелкие, цель видна только у текущего.' },
  { id: 'isl', f: '_p1-islands.html', t: 'Острова',
    idea: 'Не десять шагов, а три привала.',
    p: 'Курс разбит на три части со своими названиями: Знакомство, Учим ИИ, Проверка. Внутри каждой — свои уровни, между ними перелёт.',
    plus: 'Видно смысл кусков, а не только счёт. Десять уровней перестают пугать длиной.',
    minus: 'Сложнее устроено. Ребёнку надо разобраться, что такое зоны.' },
  { id: 'crd', f: '_p2-cards.html', t: 'Карточки',
    idea: 'Витрина: у каждого уровня своя обложка.',
    p: 'Пройденное свёрнуто в строчки, впереди — крупные карточки с картинкой. Место отдано тому, что ещё не сыграно.',
    plus: 'Ярко, тянет листать дальше. Хорошо смотрится на скриншотах.',
    minus: 'Картинки пока условные. Чтобы было честно красиво, каждому уровню нужна своя настоящая сцена — это работа на несколько дней.' },
  { id: 'bld', f: '_p3-build.html', t: 'Сборка Нейро',
    idea: 'Уровни собирают самого Нейро.',
    p: 'Сверху стенд: робот, у которого не хватает деталей. Каждый пройденный уровень ставит деталь на место — и это видно.',
    plus: 'Единственный вариант, где прогресс — это вещь, а не полоска. Прямо ложится на «Выпускной питомца» в конце игры.',
    minus: 'Связь «уровень → деталь» пока условная: почему пятый уровень даёт руку, объяснить нечем.' },
  { id: 'ssn', f: '_p4-season.html', t: 'Сезон (светлый)',
    idea: 'А что если внутри игр будет светло, как на сайте?',
    p: 'Тот же список, но в цветах лендинга: кремовый фон, белые карточки, крупные номера серий. Проверка гипотезы, что дело не в структуре, а в темноте.',
    plus: 'Сайт и игра перестают быть разными продуктами. Читается легче всего.',
    minus: 'Игры теряют «космос». Внутри уровней фон тёмный — понадобится сводить одно с другим.' }
];

var tabs = document.getElementById('tabs'), fr = document.getElementById('fr'), note = document.getElementById('note');
tabs.innerHTML = V.map(function (v, i) {
  return '<button class="tab' + (i ? '' : ' on') + '" data-i="' + i + '">' + v.t + '</button>';
}).join('');

function show(i) {
  var v = V[i];
  fr.src = v.f;
  note.innerHTML = '<h2>' + v.t + '</h2>' +
    '<div class="idea">' + v.idea + '</div>' +
    '<p>' + v.p + '</p>' +
    '<dl class="plus"><dt>Сильное</dt><dd>' + v.plus + '</dd></dl>' +
    '<dl class="minus"><dt>Слабое</dt><dd>' + v.minus + '</dd></dl>';
  [].forEach.call(tabs.children, function (b, k) { b.classList.toggle('on', k === i); });
}
tabs.addEventListener('click', function (e) {
  var b = e.target.closest('.tab'); if (b) show(+b.dataset.i);
});
show(0);
</script>
</body>
</html>
