<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>КосмоПорт — Астрономия</title>
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
/* Тёмная палитра Нейро Академии (nooka-ui.css, «NOOKA DARK») — та же,
   что у ИИ-курса, чтобы КосмоПорт выглядел частью одной платформы.
   Копия, а не ссылка: игра — самодостаточный файл. */
:root{
  --ak-bg:#080C18;--ak-bg-2:#0D1427;--ak-surface:#101C32;--ak-line:#1A2D48;
  --ak-ink:#F0F4FF;--ak-ink-2:#C4D4EE;--ak-ink-3:#738AAA;
  --ak-pri-1:#A98BFF;--ak-pri-2:#7B4FF2;--ak-pri-3:#3D2688;--ak-violet:#C44DFF;--ak-cyan:#00E5FF;
  --ak-ok-2:#06D6A0;--ak-ok-3:#04725A;--ak-sun:#FFD84D;--ak-sun-3:#8F7A06;--ak-warn-2:#FF6B6B;
  --ak-display:'Nunito',system-ui,sans-serif;--ak-body:'Nunito',system-ui,sans-serif;
  --ak-brand:'Unbounded','Nunito',system-ui,sans-serif;
}
html,body{background:var(--ak-bg);margin:0;overflow:hidden;}
#root{height:100vh;overflow:hidden;}
body{margin:0;font-family:var(--ak-body);color:var(--ak-ink);}
.ak{font-family:var(--ak-body);color:var(--ak-ink);-webkit-font-smoothing:antialiased;}
.nk-btn{font-family:var(--ak-display);font-weight:900;font-size:17px;letter-spacing:.01em;border:none;cursor:pointer;user-select:none;-webkit-user-select:none;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 28px;border-radius:999px;transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;}
.nk-btn:disabled{cursor:default;filter:saturate(.3);opacity:.55;transform:none;}
.nk-btn--pri{color:#fff;background:linear-gradient(180deg,#9B78FF,#7B4FF2 60%,#6E41E4);box-shadow:0 6px 0 #3D2688,0 0 26px rgba(123,79,242,.4),inset 0 2px 0 rgba(255,255,255,.25);}
.nk-btn--pri:active{transform:translateY(4px);box-shadow:0 2px 0 #3D2688;}
.nk-btn--ok{color:#04281F;background:linear-gradient(180deg,#5FF0C6,#06D6A0 60%,#05BF8F);box-shadow:0 6px 0 #04725A,0 0 26px rgba(6,214,160,.35),inset 0 2px 0 rgba(255,255,255,.35);}
.nk-btn--ok:active{transform:translateY(4px);box-shadow:0 2px 0 #04725A;}
.nk-btn--cta{color:#2A2108;background:linear-gradient(180deg,#FFF1B4,#FFD84D 60%,#FFC53A);box-shadow:0 6px 0 #8F7A06,0 0 26px rgba(255,214,10,.3),inset 0 2px 0 rgba(255,255,255,.5);}
.nk-btn--cta:active{transform:translateY(4px);box-shadow:0 2px 0 #8F7A06;}
.nk-btn--go{color:#fff;background:linear-gradient(180deg,#FF9A85,#FF6B6B 60%,#F25555);box-shadow:0 6px 0 #A83636,0 0 26px rgba(255,107,107,.35),inset 0 2px 0 rgba(255,255,255,.3);}
.nk-btn--go:active{transform:translateY(4px);box-shadow:0 2px 0 #A83636;}
.nk-btn--sm{padding:11px 18px;font-size:14px;}
/* стеклянная «Назад», как на тёмных уровнях ИИ-курса */
.nk-back{color:#D8E3F6;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.17);}
.nk-back:active{transform:translateY(1px);}
.nk-card{background:var(--ak-surface);border-radius:20px;box-shadow:0 0 0 1.5px var(--ak-line),0 10px 24px -12px rgba(0,0,0,.8);}
.nk-choice{font-family:var(--ak-display);font-weight:900;color:var(--ak-ink);background:#101C32;border:none;cursor:pointer;box-shadow:0 0 0 1.5px #1A2D48;transition:transform .08s;}
.nk-choice:active{transform:translateY(2px);}
.nk-choice--sel{color:#fff;background:linear-gradient(180deg,#9B78FF,#7B4FF2 60%,#6E41E4);box-shadow:0 0 18px rgba(123,79,242,.5),0 4px 0 #3D2688;}
.nk-level{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#101C32;border:none;cursor:pointer;border-radius:22px;padding:13px 16px;color:var(--ak-ink);font-family:var(--ak-display);box-shadow:0 0 0 1.5px #1A2D48,0 10px 24px -12px rgba(0,0,0,.8);transition:transform .12s,box-shadow .12s;}
.nk-level:active{transform:translateY(2px);}
.nk-level--next{box-shadow:0 0 0 1.5px #7B4FF2,0 0 22px rgba(123,79,242,.28);background:linear-gradient(180deg,#171A3E,#121634);}
.nk-level--done{background:linear-gradient(180deg,#0F2430,#0E2A24);}
@keyframes ak-bob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-6px) rotate(1deg);}}
@keyframes ak-pop{0%{transform:scale(.65);opacity:0;}65%{transform:scale(1.07);}100%{transform:scale(1);opacity:1;}}
@keyframes ak-pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
.ak-bob{animation:ak-bob 3s ease-in-out infinite;}
.ak-pop{animation:ak-pop .38s cubic-bezier(.2,.8,.3,1) both;}
.ak-pulse{animation:ak-pulse 1.4s ease-in-out infinite;}
/* космос: мерцание звёзд, тряска на старте, огонь двигателя, подсказка-рука, медленное вращение */
@keyframes sp-tw{0%,100%{opacity:.9;}50%{opacity:.2;}}
@keyframes sp-shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-4px,2px);}40%{transform:translate(4px,-2px);}60%{transform:translate(-3px,-1px);}80%{transform:translate(3px,1px);}}
@keyframes sp-flame{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.72);}}
@keyframes sp-hint{0%,100%{transform:translate(0,0);opacity:.95;}50%{transform:translate(-16px,-12px);opacity:.6;}}
@keyframes sp-count{0%{transform:scale(1.8);opacity:0;}30%{transform:scale(1);opacity:1;}100%{transform:scale(.9);opacity:0;}}
@keyframes sp-spin{to{transform:rotate(360deg);}}
@keyframes sp-glow{0%,100%{opacity:.75;}50%{opacity:1;}}
.sp-tw{animation:sp-tw 2.6s ease-in-out infinite;}
.sp-shake{animation:sp-shake .12s linear infinite;}
.sp-flame{transform-box:fill-box;transform-origin:50% 0;animation:sp-flame .12s ease-in-out infinite;}
.sp-hint{animation:sp-hint 1.6s ease-in-out infinite;}
.sp-count{animation:sp-count .5s ease-out both;}
.sp-spin{transform-box:fill-box;transform-origin:50% 50%;animation:sp-spin 60s linear infinite;}
.sp-glow{animation:sp-glow 3s ease-in-out infinite;}
input[type=range]{-webkit-appearance:none;width:100%;height:20px;border-radius:999px;background:transparent;cursor:pointer;outline:none;}
input[type=range]::-webkit-slider-runnable-track{height:20px;border-radius:999px;background:linear-gradient(90deg,#1A2D48,#7B4FF2);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;margin-top:-9px;cursor:pointer;background:linear-gradient(180deg,#fff,#E4DCFF);box-shadow:0 4px 0 #3D2688,0 0 16px rgba(123,79,242,.5);}
</style>
<script src="/metrika.js" defer></script>
</head>

<script>
/* ============================================================
   КосмоПорт — астрономия для 8–12. Nooka.

   Путь от Земли до Марса: сутки, Луна, притяжение, своя ракета,
   ступени, орбита, планеты, звёзды, марсоход, посадка. У каждого
   уровня свой жест, после победы — проверка связи из двух вопросов
   (GAME_SYSTEM_METHOD, п. 7). Уровни бьют в детские заблуждения:
   «Солнце уходит за горы», «Луну закрывает тень Земли».

   Своя ракета (имя и цвет) собирается в уровне 4 и дальше летает
   во всех миссиях — как питомец. Хранится отдельно от прогресса:
   это украшение, оно ничего не открывает.

   Платная игра: бесплатны первые SP_FREE уровней, остальное —
   по доступу аккаунта (nooka-access.js, ответ сервера).
   ============================================================ */
const { useState, useEffect, useRef, useMemo } = React;
const h = React.createElement;
const SP_FREE = 2;

/* ── мелочи ─────────────────────────────────────────────── */
const spClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const spNorm = d => ((d % 360) + 540) % 360 - 180;          // угол в −180…180
const spRad = d => d * Math.PI / 180;
function spPt(svg, e) {
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  return { x: (e.clientX - r.left) * vb.width / r.width, y: (e.clientY - r.top) * vb.height / r.height };
}
/* Кадр анимации, пока on. dt — секунды, не больше 0,05: вкладка
   в фоне не должна выстреливать одним огромным шагом. */
function useLoop(fn, on) {
  const f = useRef(fn);
  f.current = fn;
  useEffect(() => {
    if (!on) return;
    let id, last = performance.now();
    const tick = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; f.current(dt, now); id = requestAnimationFrame(tick); };
    id = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(id);
  }, [on]);
}

/* Звёзды фона — одни и те же при каждой перерисовке */
const SP_STARS = (() => {
  let s = 7;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 80 }, () => ({ x: r() * 340, y: r() * 440, r: 0.4 + r() * 1.2, o: 0.35 + r() * 0.6, tw: r() < 0.25 }));
})();
/* Цвета звёзд — как в звёздном небе ИИ-курса: белые, голубые, сиреневые, жёлтые */
const SP_STAR_COL = ['#F0F4FF', '#F0F4FF', '#F0F4FF', '#9FEFFF', '#D9A8FF', '#FFE58A'];
function SpStars({ H, dim }) {
  return h('g', null, SP_STARS.filter(s => s.y < H).map((s, i) => h('circle', {
    key: i, cx: s.x, cy: s.y, r: s.r, fill: SP_STAR_COL[i % SP_STAR_COL.length], opacity: s.o * (dim || 1),
    className: s.tw ? 'sp-tw' : null, style: s.tw ? { animationDelay: (i % 7) * 0.4 + 's' } : null
  })));
}
/* Туманность: мягкие пятна света в глубине сцены */
function SpNebula({ H, id }) {
  return h('g', { pointerEvents: 'none' },
    h('defs', null,
      h('radialGradient', { id: id + 'a' }, h('stop', { offset: 0, stopColor: '#7B4FF2', stopOpacity: 0.32 }), h('stop', { offset: 1, stopColor: '#7B4FF2', stopOpacity: 0 })),
      h('radialGradient', { id: id + 'b' }, h('stop', { offset: 0, stopColor: '#00B8D9', stopOpacity: 0.2 }), h('stop', { offset: 1, stopColor: '#00B8D9', stopOpacity: 0 }))),
    h('ellipse', { cx: 250, cy: H * 0.22, rx: 170, ry: 90, fill: `url(#${id}a)` }),
    h('ellipse', { cx: 70, cy: H * 0.85, rx: 150, ry: 80, fill: `url(#${id}b)` }));
}

/* ── звук: синтез в браузере, без файлов ─────────────────── */
const SFX = (() => {
  let ctx = null, eng = null, mute = false;
  try { mute = localStorage.getItem('nooka_space_mute') === '1'; } catch (e) {}
  const ac = () => {
    if (mute) return null;
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(f, d, type, vol, f2) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d);
  }
  function noiseBuf(c, sec) {
    const n = Math.floor(c.sampleRate * sec), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
    return b;
  }
  function noise(d, vol, lp) {
    const c = ac(); if (!c) return;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
    s.buffer = noiseBuf(c, d); f.type = 'lowpass'; f.frequency.value = lp || 600;
    g.gain.setValueAtTime(vol || 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  }
  return {
    get mute() { return mute; },
    setMute(v) { mute = v; try { localStorage.setItem('nooka_space_mute', v ? '1' : '0'); } catch (e) {} if (v) this.engine(false); },
    tick: () => tone(880, 0.12, 'square', 0.05),
    go: () => { tone(1320, 0.3, 'square', 0.05); noise(2.4, 0.3, 450); },
    boom: () => { noise(0.9, 0.45, 900); tone(130, 0.5, 'sawtooth', 0.1, 40); },
    pop: () => tone(620, 0.09, 'triangle', 0.08, 940),
    no: () => tone(220, 0.18, 'triangle', 0.08, 160),
    ok: () => { tone(660, 0.12, 'triangle', 0.09); setTimeout(() => tone(880, 0.12, 'triangle', 0.09), 110); setTimeout(() => tone(1320, 0.26, 'triangle', 0.09), 220); },
    /* Ровный гул двигателя, пока держат кнопку */
    engine(on) {
      if (on && !eng) {
        const c = ac(); if (!c) return;
        const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
        s.buffer = noiseBuf(c, 1); s.loop = true; f.type = 'lowpass'; f.frequency.value = 380; g.gain.value = 0.16;
        s.connect(f); f.connect(g); g.connect(c.destination); s.start();
        eng = { s, g, c };
      } else if (!on && eng) {
        const { s, g, c } = eng;
        g.gain.setTargetAtTime(0, c.currentTime, 0.04); s.stop(c.currentTime + 0.2); eng = null;
      }
    }
  };
})();

/* ── своя ракета: имя и цвет (уровень 4) ─────────────────── */
const SP_COLORS = [
  { id: 'red', body: '#FF7A64', dark: '#D9523F' }, { id: 'blue', body: '#7C9BFF', dark: '#4B5BD6' },
  { id: 'green', body: '#5DD9A0', dark: '#2BA873' }, { id: 'purple', body: '#B48CFF', dark: '#7C5FE0' },
  { id: 'yellow', body: '#FFD262', dark: '#D4A22B' }
];
function spRocketLoad() {
  try { const r = JSON.parse(localStorage.getItem('nooka_space_rocket')); if (r && r.name) return r; } catch (e) {}
  return null;
}
function spRocketSave(r) { try { localStorage.setItem('nooka_space_rocket', JSON.stringify(r)); } catch (e) {} }
function spColor(id) { return SP_COLORS.find(c => c.id === id) || SP_COLORS[0]; }

/* Ракета в SVG: нос вверх, точка (0,0) — низ корпуса по центру.
   tanks — сколько баков, engines — 1 или 2, flame — горит ли огонь. */
function SpRocket({ color, tanks, engines, flame, sat, name, scale }) {
  const c = spColor(color), n = tanks == null ? 2 : tanks, E = engines || 1, k = scale || 1;
  const tankH = 16, bodyW = 22, top = -n * tankH;
  const parts = [];
  /* двигатели */
  const ex = E === 2 ? [-7, 7] : [0];
  ex.forEach((x, i) => {
    parts.push(h('path', { key: 'e' + i, d: `M${x - 5} 0 L${x + 5} 0 L${x + 7} 10 L${x - 7} 10 Z`, fill: '#5B5470' }));
    if (flame) parts.push(h('g', { key: 'f' + i, transform: `translate(${x} 10)` },
      h('path', { className: 'sp-flame', d: 'M-6 0 Q0 30 6 0 Z', fill: '#FFB347' }),
      h('path', { className: 'sp-flame', d: 'M-3 0 Q0 18 3 0 Z', fill: '#FFF3B0' })));
  });
  /* баки */
  for (let i = 0; i < n; i++) {
    const y = -(i + 1) * tankH;
    parts.push(h('rect', { key: 't' + i, x: -bodyW / 2, y, width: bodyW, height: tankH - 1, rx: 4, fill: i % 2 ? '#F4F1FF' : '#FFFFFF', stroke: c.dark, strokeWidth: 1.5 }));
    parts.push(h('rect', { key: 'tb' + i, x: -bodyW / 2 + 3, y: y + 5, width: bodyW - 6, height: 4, rx: 2, fill: c.body, opacity: 0.85 }));
  }
  /* стабилизаторы */
  parts.push(h('path', { key: 'fl', d: `M${-bodyW / 2} -2 L${-bodyW / 2 - 9} 6 L${-bodyW / 2 - 9} -10 L${-bodyW / 2} -18 Z`, fill: c.body }));
  parts.push(h('path', { key: 'fr', d: `M${bodyW / 2} -2 L${bodyW / 2 + 9} 6 L${bodyW / 2 + 9} -10 L${bodyW / 2} -18 Z`, fill: c.body }));
  /* кабина с окошком и нос */
  parts.push(h('rect', { key: 'cab', x: -bodyW / 2, y: top - 18, width: bodyW, height: 18, rx: 4, fill: '#fff', stroke: c.dark, strokeWidth: 1.5 }));
  parts.push(h('circle', { key: 'win', cx: 0, cy: top - 9, r: 5, fill: '#9FD8FF', stroke: c.dark, strokeWidth: 1.5 }));
  if (sat) parts.push(h('g', { key: 'sat', transform: `translate(0 ${top - 18})` },
    h('rect', { x: -9, y: -14, width: 18, height: 14, rx: 2, fill: '#FFD262', stroke: '#D4A22B', strokeWidth: 1.5 }),
    h('rect', { x: -21, y: -10, width: 10, height: 6, fill: '#7C9BFF' }), h('rect', { x: 11, y: -10, width: 10, height: 6, fill: '#7C9BFF' })));
  const noseY = top - 18 - (sat ? 14 : 0);
  parts.push(h('path', { key: 'nose', d: `M${-bodyW / 2} ${noseY} Q0 ${noseY - 30} ${bodyW / 2} ${noseY} Z`, fill: c.body, stroke: c.dark, strokeWidth: 1.5 }));
  if (name) parts.push(h('text', { key: 'nm', x: 0, y: 24, textAnchor: 'middle', fontSize: 10, fontWeight: 800, fill: '#fff', fontFamily: 'var(--ak-body)' }, name));
  return h('g', { transform: k !== 1 ? `scale(${k})` : null }, parts);
}

/* Обломки «Бабах!»: t от 0 до 1 */
function SpBoom({ x, y, t }) {
  const bits = [];
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2 + 0.3, d = 8 + t * (40 + (i % 3) * 18);
    bits.push(h('rect', { key: i, x: x + Math.cos(a) * d - 3, y: y + Math.sin(a) * d - 3 + t * t * 30, width: 6, height: 6, rx: 1.5,
      fill: ['#FF7A64', '#FFD262', '#fff', '#8EA2FF'][i % 4], opacity: 1 - t * 0.7, transform: `rotate(${t * 360 + i * 30} ${x + Math.cos(a) * d} ${y + Math.sin(a) * d})` }));
  }
  return h('g', null,
    h('circle', { cx: x, cy: y, r: 10 + t * 34, fill: '#FFB347', opacity: Math.max(0, 0.75 - t) }),
    h('circle', { cx: x, cy: y, r: 6 + t * 18, fill: '#FFF3B0', opacity: Math.max(0, 0.8 - t * 1.2) }),
    bits,
    t < 0.9 && h('text', { x, y: y - 30 - t * 10, textAnchor: 'middle', fontSize: 20, fontWeight: 900, fill: '#FFD262', fontFamily: 'var(--ak-display)', opacity: 1 - t }, 'Бабах!'));
}

/* Обратный отсчёт перед стартом: 3-2-1 и «Поехали!» */
function SpCountdown({ onDone }) {
  const [k, setK] = useState(3);
  useEffect(() => {
    if (k > 0) { SFX.tick(); const t = setTimeout(() => setK(k - 1), 420); return () => clearTimeout(t); }
    SFX.go();
    const t = setTimeout(onDone, 260);
    return () => clearTimeout(t);
  }, [k]);
  return h('div', {
    style: { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', pointerEvents: 'none', zIndex: 5 }
  }, h('div', {
    key: k, className: 'sp-count',
    style: { fontFamily: 'var(--ak-display)', fontSize: k ? 72 : 40, color: '#FFD262', textShadow: '0 4px 0 #2D1B45' }
  }, k || 'Поехали!'));
}

/* ── значки миссий: свои линии вместо эмодзи ─────────────── */
const SP_ICON = {
  earth: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18 M3.6 9h16.8 M3.6 15h16.8 M12 3c-3 3.2-3 14.8 0 18 M12 3c3 3.2 3 14.8 0 18',
  moon: 'M16.5 3.5A8.5 8.5 0 1 0 20.5 16 A7 7 0 0 1 16.5 3.5Z',
  jump: 'M12 4a2.2 2.2 0 1 0 0.01 0 M8 21l2-6-2-3 4-3 4 3-2 3 2 6 M6 10l2-1 M18 10l-2-1',
  rocket: 'M12 2c3 2.5 4.5 6 4.5 10v4h-9v-4c0-4 1.5-7.5 4.5-10Z M12 8.5a1.6 1.6 0 1 0 .01 0 M7.5 13l-3 3v3l3-1.5 M16.5 13l3 3v3l-3-1.5 M10 19.5l2 2.5 2-2.5',
  stages: 'M12 2c2 1.8 3 4 3 6.5V11H9V8.5C9 6 10 3.8 12 2Z M9 13h6v4H9z M10 19h4 M8 22l1-3 M16 22l-1-3',
  orbit: 'M12 9a3 3 0 1 0 .01 0 M3 12c0-2.5 4-4.5 9-4.5s9 2 9 4.5-4 4.5-9 4.5-9-2-9-4.5Z M19 6.5a1.5 1.5 0 1 0 .01 0',
  drop: 'M12 3c3.5 4.2 6 7.6 6 10.6A6 6 0 0 1 6 13.6C6 10.6 8.5 7.2 12 3Z M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5',
  stars: 'M4 7l3.5 1.5L11 6l3.5 3 3.5-1 2 5 M4 7l.01 0 M7.5 8.5l.01 0 M11 6l.01 0 M14.5 9l.01 0 M18 8l.01 0 M20 13l.01 0 M15 17l5-4',
  rover: 'M4 15h16v-4H4z M7 11V8h7l2 3 M12 8V5 M10.5 5h3 M6 18.5a1.8 1.8 0 1 0 .01 0 M12 18.5a1.8 1.8 0 1 0 .01 0 M18 18.5a1.8 1.8 0 1 0 .01 0',
  land: 'M12 3c2 1.6 3 3.6 3 6v3H9V9c0-2.4 1-4.4 3-6Z M9 12l-3 5 M15 12l3 5 M4.5 17h3 M16.5 17h3 M3 21h18'
};
function SpIcon({ name, size, color }) {
  return h('svg', { viewBox: '0 0 24 24', width: size || 24, height: size || 24, style: { display: 'block' } },
    h('path', { d: SP_ICON[name], fill: 'none', stroke: color || '#fff', strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round' }));
}
/* Нейро — тот же робот, что ведёт ИИ-курс, здесь в скафандре (mascot/space-*.webp,
   Higgsfield по образцу mascot/hello.png). Высота по картинке — иначе робот сплющится. */
function SpMascot({ kind, size }) {

    }));
}

/* ── полёт вверх: небо темнеет с высотой, видны облака и линия космоса ──
   Высота в «условных километрах»: облака — 30, космос — 100 (настоящая
   граница космоса тоже на высоте 100 км). На экране 2 точки на единицу. */
const SP_PAD = 300, SP_K = 2;
const spMix = (a, b, t) => {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), A = p(a), B = p(b);

    h('defs', null, h('linearGradient', { id: id + 'sky', x1: 0, y1: 0, x2: 0, y2: 1 },
      h('stop', { offset: 0, stopColor: spMix('#2E5BC4', '#070A18', t1) }), h('stop', { offset: 1, stopColor: spMix('#8FCBFF', '#121A3A', t2) }))),
    h('rect', { x: 0, y: 0, width: 340, height: H, fill: `url(#${id}sky)` }),
    h('g', { opacity: spClamp((cam + 20) / 70, 0.15, 1) }, h(SpStars, { H })),
    /* облака на высоте 30 */
    [[40, 0], [120, 6], [230, -4], [300, 4]].map(([x, o], i) => h('g', { key: i, transform: `translate(${x} ${spY(30, cam) + o})`, opacity: 0.85 },
      h('ellipse', { cx: 0, cy: 0, rx: 30, ry: 9, fill: '#fff' }), h('ellipse', { cx: -12, cy: -6, rx: 14, ry: 8, fill: '#fff' }), h('ellipse', { cx: 10, cy: -7, rx: 16, ry: 9, fill: '#fff' }))),
    (lines || []).map(l => h('g', { key: l.alt },
      h('line', { x1: 0, y1: spY(l.alt, cam), x2: 340, y2: spY(l.alt, cam), stroke: l.col, strokeWidth: 2, strokeDasharray: '8 6', opacity: 0.85 }),
      h('rect', { x: 4, y: spY(l.alt, cam) - 21, width: l.name.length * 7.4 + 12, height: 17, rx: 8, fill: 'rgba(8,12,24,.7)' }),
      h('text', { x: 10, y: spY(l.alt, cam) - 8, fontSize: 12, fontWeight: 900, fill: l.col, fontFamily: 'var(--ak-body)' }, l.name))),
    /* стартовый стол и земля */
    h('rect', { x: 0, y: spY(0, cam), width: 340, height: 60, fill: '#2F6B4A' }),
    h('rect', { x: 0, y: spY(0, cam), width: 340, height: 5, fill: '#4CC27A' }),
    h('rect', { x: 100, y: spY(0, cam) - 6, width: 80, height: 8, rx: 2, fill: '#5B6585' }),
    h('rect', { x: 176, y: spY(0, cam) - 120, width: 6, height: 116, fill: '#5B6585' }));
}
/* Дым у стола на старте */
function SpSmoke({ x, y, t }) {
  return h('g', { pointerEvents: 'none', opacity: Math.max(0, 1 - t * 0.6) }, [-1, 1].map(s => [0, 1, 2].map(i => h('circle', {
    key: s + '' + i, cx: x + s * (10 + i * 12 + t * 30), cy: y - 4 - i * 2, r: 8 + i * 3 + t * 10, fill: '#D8DCE8', opacity: 0.7 - i * 0.15
  }))));
}

/* ══════════════════════════════════════════════════════════════
   МИССИЯ 4 — Собери ракету
   Своя ракета: имя и цвет. Ребёнок перетаскивает баки и двигатели,
   жмёт «Поехали!». Модель честная в главном: топливо весит, тяга
   постоянная. 1 двигатель: 1 бак — до облаков, 2–4 — до космоса,
   5 баков — не взлетает. Спутник везут только два двигателя с 4–5 баками.
   Числа подобраны скриптом (tune2.js в истории сессии).
   ══════════════════════════════════════════════════════════════ */
const L4_T = 21, L4_B = 0.8, L4_SPEED = 3.2, L4_X = 140;
const L4_ROUNDS = [
  { t: 'Долети до облаков', target: 30, name: 'облака', start: { tanks: 0, engines: 1 }, eng: false, sat: 0, yes: 'Выше облаков! Одного бака хватило.' },

const SP_NAMES = ['Искра', 'Комета', 'Ласточка', 'Восход', 'Звёздочка', 'Буран'];
function L4Name({ onDone }) {
  const [name, setName] = useState(SP_NAMES[0]);

      h('svg', { viewBox: '-70 -130 140 160', style: { width: 170, height: 194 } },
        h('circle', { cx: 0, cy: -40, r: 66, fill: 'rgba(123,79,242,.12)' }),
        h(SpRocket, { color, tanks: 3, engines: 1, flame: false, scale: 1 }),
        h('text', { x: 0, y: 24, textAnchor: 'middle', fontSize: 14, fontWeight: 900, fill: '#fff', fontFamily: 'var(--ak-body)' }, name))),
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 8, width: '100%', maxWidth: 360 } }, SP_NAMES.map(n => h('button', {
      key: n, onClick: () => { SFX.pop(); setName(n); }, className: 'nk-choice' + (name === n ? ' nk-choice--sel' : ''), style: { borderRadius: 14, padding: '11px 4px', fontSize: 14 }

      key: c.id, 'aria-label': 'Цвет', onClick: () => { SFX.pop(); setColor(c.id); },
      style: { width: 42, height: 42, borderRadius: '50%', border: 'none', cursor: 'pointer', background: c.body, boxShadow: color === c.id ? '0 0 0 3px #080C18,0 0 0 6px #fff' : `0 4px 0 ${c.dark}` }
    }))),

}
function Level4Build({ onWin, onHome }) {
  const [phase, setPhase] = useState('intro');
  const [rocket, setRocket] = useState(spRocketLoad());
  const [rd, setRd] = useState(0);
  const R = L4_ROUNDS[rd];
  const [cfg, setCfg] = useState(R.start);
  const [st, setSt] = useState('build');               // build | count | fly | stuck | done
  const [fl, setFl] = useState({ alt: 0, cam: 0, burn: false, apex: null, t: 0 });
  const [note, setNote] = useState('');
  const [solved, setSolved] = useState(false);
  const [ghost, setGhost] = useState(null);
  const svg = useRef(null), drag = useRef(null), F = useRef(null);
  const color = rocket ? rocket.color : 'blue';

  /* перетаскивание: с лотка на ракету — добавить, с ракеты прочь — снять */
  const top = SP_PAD - 10 - cfg.tanks * 16 - 18 - 30 - (R.sat ? 14 : 0);
  const onRocket = p => Math.abs(p.x - L4_X) < 36 && p.y > top - 10 && p.y < SP_PAD + 12;
  const tray = R.eng ? [{ kind: 'tank', x: 285, y: 120, label: 'Бак' }, { kind: 'engine', x: 285, y: 215, label: 'Двигатель' }] : [{ kind: 'tank', x: 285, y: 160, label: 'Бак' }];
  const down = e => {
    if (st !== 'build') return;
    const p = spPt(svg.current, e), it = tray.find(t => Math.hypot(p.x - t.x, p.y - t.y) < 34);
    if (it) drag.current = { kind: it.kind, from: 'tray', x0: p.x, y0: p.y };
    else if (onRocket(p)) drag.current = { kind: p.y > SP_PAD - 10 && cfg.engines > 1 ? 'engine' : 'tank', from: 'rocket', x0: p.x, y0: p.y };

    const d = drag.current; drag.current = null; setGhost(null);

    const p = spPt(svg.current, e), tap = Math.hypot(p.x - d.x0, p.y - d.y0) < 8;
    const c = { ...cfg };

    } else if (d.from === 'rocket' && (tap || Math.abs(p.x - L4_X) > 50)) {

    }
    if (f.v < 0 && f.fuel <= 0) {
      F.current = null;
      const ok = f.apex >= R.target;
      setFl({ alt: f.apex, cam: Math.max(0, f.apex - 90), burn: false, apex: f.apex, t: f.t });

    }

          h(SpAscentSky, { cam: fl.cam, H: 340, lines, id: 'l4' }),

            h('text', { x: 222, y: spY(fl.apex, fl.cam) + 4, fontSize: 11, fontWeight: 900, fill: solved ? '#06D6A0' : '#FF9A85', fontFamily: 'var(--ak-body)' }, 'долетели сюда')),
          (st === 'stuck' || (st === 'fly' && fl.t < 2)) && h(SpSmoke, { x: L4_X, y: spY(0, fl.cam), t: st === 'stuck' ? 0.4 : fl.t / 2 }),

          rocket && st === 'build' && h('text', { x: L4_X, y: SP_PAD + 24, textAnchor: 'middle', fontSize: 12, fontWeight: 900, fill: '#fff', fontFamily: 'var(--ak-body)' }, rocket.name),

            h('rect', { x: -32, y: -30, width: 64, height: 66, rx: 14, fill: 'rgba(16,28,50,.85)', stroke: '#A98BFF', strokeWidth: 1.5, strokeDasharray: '4 4' }),
            t.kind === 'tank'
              ? h('g', null, h('rect', { x: -11, y: -18, width: 22, height: 28, rx: 4, fill: '#fff', stroke: spColor(color).dark, strokeWidth: 1.5 }), h('rect', { x: -8, y: -8, width: 16, height: 5, rx: 2, fill: spColor(color).body }))
              : h('path', { d: 'M-8 -14 L8 -14 L12 6 L-12 6 Z', fill: '#5B5470', stroke: '#8296B4', strokeWidth: 1.5 }),

}

/* ══════════════════════════════════════════════════════════════
   МИССИЯ 5 — Ступени
   Ракета из ступеней. Опустевшая ступень мигает красным, ребёнок
   жмёт «Отцепить» — она падает, загорается следующая. Рано — топливо
   улетает вместе со ступенью; поздно — пустой бак тянет вниз; не
   отцепить — следующая ступень так и не загорится.
   Подбор (tune3.js): 2 ступени — вовремя 137, на секунду позже 125,
   на две 113, рано 86, без отцепки 28; цель 115. 3 ступени — вовремя 160,

   ══════════════════════════════════════════════════════════════ */

          h('circle', { cx: 0, cy: -20, r: 4, fill: solved ? '#06D6A0' : '#FFD84D', className: 'ak-pulse' })),
        /* сигналы в пути */
        s.sig.map((q, i) => {
          const k = spClamp((s.t - q.t0) / R.D, 0, 1), x = ant.x + (s.x - ant.x) * k, y = ant.y + (L9_GROUND - 40 - ant.y) * k;
          return h('g', { key: i },
            h('line', { x1: ant.x, y1: ant.y, x2: x, y2: y, stroke: q.kind === 'go' ? '#06D6A0' : '#FF6B6B', strokeWidth: 1.5, strokeDasharray: '3 5', opacity: 0.5 }),
            h('circle', { cx: x, cy: y, r: 6, fill: q.kind === 'go' ? '#06D6A0' : '#FF6B6B', stroke: '#fff', strokeWidth: 1.5 }),
            h('text', { x: x + 10, y: y + 4, fontSize: 10, fontWeight: 900, fill: '#fff', fontFamily: 'var(--ak-body)' }, `${Math.max(0, R.D - (s.t - q.t0)).toFixed(1)} с`));
        }),
        h(SpRover, { x: s.x, y: L9_GROUND + s.fell * 14, tilt: s.fell * 28 })),
      h(SpNote, { ok: solved }, note),
      solved ? h(SpNext, { last: rd + 1 === L9_ROUNDS.length, onClick: next })

        : h('div', { style: { display: 'flex', gap: 10, width: '100%', maxWidth: 360 } },
          h('button', { className: 'nk-btn nk-btn--ok', style: { flex: 1 }, onClick: () => send('go') }, 'Вперёд ▶'),
          h('button', { className: 'nk-btn nk-btn--go', style: { flex: 1 }, onClick: () => send('stop') }, 'Стоп ■'))),
    phase === 'win' && h(WinModal, {
      title: 'Марсоход на месте!',
      law: 'Сигнал летит быстрее всего на свете, но до Марса и ему нужно от 3 до 22 минут',
      fact: 'Поэтому марсоходы умеют сами объезжать камни: ждать команды с Земли слишком долго.',
      onNext: onWin, onHome
    }));
}

/* ══════════════════════════════════════════════════════════════
   МИССИЯ 10 — Посадка на Марс (финал)
   Своя ракета садится. Держишь кнопку — двигатель тормозит, отпустил —
   падаешь. Топливо кончается. На Луне воздуха нет: парашют висит
   тряпочкой (секрет). На Марсе воздух есть, но топлива мало: без
   парашюта у земли будет 100, а топлива хватит сбросить только до 40; с парашютом —
   падение не быстрее 30, остаётся чуть притормозить. Мягко — быстрее 20 нельзя.
   Подбор: на Луне начинать тормозить не ниже ~100 точек.
   ══════════════════════════════════════════════════════════════ */
const L10_GROUND = 300, L10_TOP = 50, L10_SAFE = 20;
const L10_ROUNDS = [
  { t: 'Посади ракету на Луну мягко', world: 'moon', g: 12, thrust: 30, fuel: 6, air: false, v0: 22 },
  { t: 'Финал: посади ракету на Марс. Там есть воздух', world: 'mars', g: 20, thrust: 30, fuel: 6, air: true, v0: 22, vt: 30 }
];
function Level10Land({ onWin, onHome }) {
  const [phase, setPhase] = useState('intro');
  const [rd, setRd] = useState(0);
  const R = L10_ROUNDS[rd];
  const rocket = spRocketLoad(), color = rocket ? rocket.color : 'blue';
  const init = () => ({ alt: L10_GROUND - L10_TOP, v: R.v0, fuel: R.fuel, burn: false, chute: false, st: 'ready', boom: 0, t: 0 });
  const [s, setS] = useState(init);
  const [note, setNote] = useState('');
  const [solved, setSolved] = useState(false);
  const S = useRef(null), hold = useRef(false);
  const reset = () => { S.current = null; hold.current = false; SFX.engine(false); setS(init()); setNote(''); };
  useEffect(() => { reset(); }, [rd]);
  useEffect(() => () => SFX.engine(false), []);
  const start = () => { S.current = { ...init(), st: 'fly' }; setS({ ...S.current }); setNote(''); };
  const engine = on => {
    hold.current = on;
    const g = S.current;
    SFX.engine(on && !!g && g.st === 'fly' && g.fuel > 0);
  };
  const chute = () => {
    const g = S.current; if (!g || g.st !== 'fly' || g.chute) return;
    if (!R.air) { SFX.no(); setNote('Парашют повис тряпочкой: на Луне нет воздуха, ему не за что зацепиться!'); return; }
    g.chute = true; SFX.pop(); setNote('Парашют раскрылся — воздух тормозит!');
  };
  useLoop(dt => {
    const g = S.current; if (!g) return;
    g.t += dt;
    if (g.st === 'fly') {
      let a = R.g;
      g.burn = hold.current && g.fuel > 0;
      if (g.burn) { a -= R.thrust; g.fuel = Math.max(0, g.fuel - dt); if (!g.fuel) { SFX.engine(false); setNote('Топливо кончилось!'); } }
      if (g.chute && R.air) a -= R.g * (g.v * Math.abs(g.v)) / (R.vt * R.vt);   // с парашютом скорость не выше vt
      g.v += a * dt; g.alt -= g.v * dt;
      if (g.alt > L10_GROUND - 20) { g.alt = L10_GROUND - 20; g.v = Math.max(0, g.v); }
      if (g.alt <= 0) {
        g.alt = 0; SFX.engine(false);
        if (g.v <= L10_SAFE) { g.st = 'landed'; SFX.ok(); setSolved(true); setNote(rd === 0 ? 'Мягкая посадка! Без воздуха тормозит только двигатель.' : (rocket ? `«${rocket.name}» на Марсе!` : 'Ракета на Марсе!') + ' Сначала парашют, потом двигатель.'); }
        else { g.st = 'crash'; SFX.boom(); setNote(g.v > 60 ? 'Бабах! Слишком быстро. Тормози раньше — держи кнопку заранее.' : 'Жёстко! Чуть-чуть не хватило — притормози у самой земли.'); }
      }
    } else if (g.st === 'crash') g.boom = Math.min(1, g.boom + dt * 1.2);
    setS({ ...g });
    if (g.st !== 'fly' && (g.st === 'landed' || g.boom >= 1)) S.current = null;
  }, phase === 'play' && !!S.current);
  const next = () => { if (rd + 1 < L10_ROUNDS.length) { setRd(rd + 1); setSolved(false); } else setPhase('win'); };
  const y = L10_GROUND - s.alt, mars = R.world === 'mars';
  const spd = Math.max(0, s.v), danger = spd > L10_SAFE;
  return h(SpShell, { n: 10, title: 'Посадка на Марс', step: rd, total: L10_ROUNDS.length, onHome },
    phase === 'intro' && h(IntroModal, {
      title: 'Посадка', ask: rocket ? `«${rocket.name}» идёт на посадку` : 'Своя ракета садится',
      task: 'Держи кнопку, чтобы тормозить двигателем. Сядь мягко!', tip: 'Держишь — тормозишь, отпустил — падаешь', onStart: () => setPhase('play')
    }),
    phase === 'play' && h(SpBody, null,
      h(TaskBadge, null, R.t),
      h(SpScene, { H: 340, sky: mars ? '#C97A58' : '#070A18' },
        mars && h('defs', null, h('linearGradient', { id: 'l10sky', x1: 0, y1: 0, x2: 0, y2: 1 }, h('stop', { offset: 0, stopColor: '#3A2240' }), h('stop', { offset: 1, stopColor: '#E39A72' }))),
        mars ? h('rect', { width: 340, height: 340, fill: 'url(#l10sky)' }) : h(SpStars, { H: 300 }),
        !mars && h(SpEarth, { x: 286, y: 54, R: 16, rot: 0, id: 'l10e', lights: false }),
        h('rect', { x: 0, y: L10_GROUND, width: 340, height: 40, fill: mars ? '#A04A2E' : '#8E89A6' }),
        !mars && [[60, 318, 20], [250, 324, 28]].map(([cx, cy, r], i) => h('ellipse', { key: i, cx, cy, rx: r, ry: r / 4, fill: '#6E6987' })),
        h('rect', { x: 130, y: L10_GROUND - 3, width: 80, height: 5, rx: 2, fill: '#FFD84D' }),
        /* ракета: нос вверх, огонь вниз — тормозит */
        s.st !== 'crash' && h('g', { transform: `translate(170 ${y - 12})` },
          s.chute && R.air && h('g', null,
            h('path', { d: 'M-34 -118 Q0 -158 34 -118 Z', fill: '#FF6B6B', stroke: '#fff', strokeWidth: 1.5 }),
            h('line', { x1: -32, y1: -118, x2: -8, y2: -70, stroke: '#fff', strokeWidth: 1 }), h('line', { x1: 32, y1: -118, x2: 8, y2: -70, stroke: '#fff', strokeWidth: 1 })),
          h('path', { d: 'M-12 -4 L-22 10 M12 -4 L22 10', stroke: '#C4D4EE', strokeWidth: 2.5, strokeLinecap: 'round' }),
          h(SpRocket, { color, tanks: 1, engines: 1, flame: s.burn })),
        s.st === 'crash' && h(SpBoom, { x: 170, y: L10_GROUND - 20, t: s.boom }),
        /* скорость и топливо */
        h('g', { transform: 'translate(14 20)' },
          h('text', { x: 0, y: 0, fontSize: 11, fontWeight: 900, fill: '#C4D4EE', fontFamily: 'var(--ak-body)' }, 'скорость'),
          h('rect', { x: 0, y: 6, width: 100, height: 10, rx: 5, fill: 'rgba(255,255,255,.12)' }),
          h('rect', { x: 0, y: 6, width: spClamp(spd, 0, 100), height: 10, rx: 5, fill: danger ? '#FF6B6B' : '#06D6A0' }),
          h('line', { x1: L10_SAFE, y1: 3, x2: L10_SAFE, y2: 19, stroke: '#fff', strokeWidth: 2 }),
          h('text', { x: 0, y: 36, fontSize: 11, fontWeight: 900, fill: '#C4D4EE', fontFamily: 'var(--ak-body)' }, 'топливо'),
          h('rect', { x: 0, y: 42, width: 100, height: 10, rx: 5, fill: 'rgba(255,255,255,.12)' }),
          h('rect', { x: 0, y: 42, width: 100 * s.fuel / R.fuel, height: 10, rx: 5, fill: '#FFB347' }))),
      h(SpNote, { ok: solved }, note),
      solved ? h(SpNext, { last: rd + 1 === L10_ROUNDS.length, onClick: next })
        : s.st === 'ready' ? h('button', { className: 'nk-btn nk-btn--pri', style: { width: '100%', maxWidth: 360 }, onClick: () => { SFX.pop(); start(); } }, 'Начать спуск ▼')
        : s.st === 'crash' || s.st === 'landed' ? h('button', { className: 'nk-btn nk-btn--pri', style: { width: '100%', maxWidth: 360 }, onClick: () => { SFX.pop(); reset(); } }, 'Ещё раз')
        : h('div', { style: { display: 'flex', gap: 10, width: '100%', maxWidth: 360 } },
          h('button', {
            className: 'nk-btn nk-btn--go', style: { flex: 2, touchAction: 'none' },
            onPointerDown: e => { e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId); engine(true); },
            onPointerUp: () => engine(false), onPointerCancel: () => engine(false), onContextMenu: e => e.preventDefault()
          }, s.burn ? '🔥 Тормозим…' : 'Держи: двигатель'),
          h('button', { className: 'nk-btn nk-btn--sm nk-back', style: { flex: 1 }, onClick: chute, disabled: s.chute && R.air }, 'Парашют'))),
    phase === 'win' && h(WinModal, {
      title: rocket ? `«${rocket.name}» на Марсе!` : 'Мягкая посадка!',
      law: 'На Луну люди сели в 1969 году: «Аполлон-11» тормозил двигателем — воздуха там нет',
      fact: 'Марсоход «Персеверанс» в 2021 году сел сам: парашют, потом двигатели, а в конце его опустили на тросах, как подъёмным краном.',
      onNext: onWin, onHome
    }));
}

    yes: 'Верно. Корабль быстро разгоняется — тормозить надо загодя.',
    no: 'У самой земли уже не успеть: скорость большая. Тормозить надо заранее.' }]
};
function SpQuiz({ n, title, onDone, onHome }) {
  const qs = useMemo(() => SP_QUIZ[n].map(q => ({ ...q, opts: window.nooka && window.nooka.shuffled ? window.nooka.shuffled(q.opts) : q.opts })), [n]);
  const [pick, setPick] = useState([null, null]);
  const both = qs.every((q, i) => pick[i] != null && q.opts[pick[i]].ok);
  return h(SpShell, { n, title, onHome },
    h(SpBody, null,
      h(TaskBadge, null, 'Проверка связи: два вопроса'),
      qs.map((q, qi) => h('div', { key: qi, className: 'nk-card', style: { width: '100%', maxWidth: 360, padding: '15px 14px 10px', flexShrink: 0, boxSizing: 'border-box' } },
        h('div', { style: { fontWeight: 900, fontSize: 16, color: 'var(--ak-ink)', lineHeight: 1.35, marginBottom: 11 } }, q.q),
        q.opts.map((o, oi) => {
          const on = pick[qi] === oi;
          return h('button', {
            key: oi, onClick: () => { (o.ok ? SFX.pop : SFX.no)(); setPick(p => { const c = p.slice(); c[qi] = oi; return c; }); },
            style: {
              display: 'block', width: '100%', marginBottom: 8, padding: '12px 14px', border: 'none', borderRadius: 14, cursor: 'pointer',
              textAlign: 'left', fontFamily: 'var(--ak-body)', fontWeight: 800, fontSize: 14, color: 'var(--ak-ink)',
              background: on ? (o.ok ? 'rgba(6,214,160,.16)' : 'rgba(255,107,107,.14)') : 'rgba(255,255,255,.04)',
              boxShadow: on ? `inset 0 0 0 2px ${o.ok ? '#06D6A0' : '#FF6B6B'}` : 'inset 0 0 0 1.5px #1A2D48'
            }
          }, o.t);
        }), pick[qi] != null && h('div', { style: { fontSize: 13.5, lineHeight: 1.45, color: 'var(--ak-ink-2)', padding: '2px 4px 6px' } }, q.opts[pick[qi]].ok ? q.yes : q.no))),
      h('button', { className: 'nk-btn nk-btn--ok', style: { width: '100%', maxWidth: 360, flexShrink: 0 }, disabled: !both, onClick: () => { SFX.ok(); onDone(); } },
        both ? 'Записать в журнал ✓' : 'Ответь на оба')));
}

/* ── миссии игры: компонент, название, подпись и «ага» для журнала ── */

  { C: Level2Moon, t: 'Луна меняет форму', icon: 'moon', emoji: '🌙', sub: 'Кто откусывает Луну', aga: 'Солнце всегда освещает половину Луны — мы видим её с разных сторон.',
    bet: { q: 'Почему Луна бывает тонкой, как долька?', opts: ['Её закрывает тень Земли', 'Солнце светит на неё сбоку — мы видим кусочек светлой стороны', 'Её закрывают облака'], ok: 1 } },
  { C: Level3Jump, t: 'Прыжок на планетах', icon: 'jump', emoji: '🧑‍🚀', sub: 'Где прыгнешь выше дома', aga: 'Маленькая планета тянет слабее: на Луне прыжок в 6 раз выше.',
    bet: { q: 'Где получится прыгнуть выше всего?', opts: ['На Юпитере — он самый большой', 'На Луне — она маленькая и тянет слабо', 'Везде одинаково'], ok: 1 } },
  { C: typeof Level4Build !== 'undefined' ? Level4Build : null, t: 'Собери ракету', icon: 'rocket', emoji: '🚀', sub: 'Своя ракета — имя и цвет', aga: 'Топливо тоже тяжёлое: лишний бак не даст ракете взлететь.',
    bet: { q: 'Чтобы улететь дальше, надо взять как можно больше топлива?', opts: ['Да: больше топлива — дальше', 'Нет: лишнее топливо — тоже тяжесть', 'Топливо ничего не весит'], ok: 1 } },
  { C: typeof Level5Stages !== 'undefined' ? Level5Stages : null, t: 'Ступени', icon: 'stages', emoji: '🔥', sub: 'Как полетел Гагарин', aga: 'Пустой бак — лишний груз: ракета бросает его и летит легче.',
    bet: { q: 'Зачем ракета бросает части по дороге?', opts: ['Они ломаются от тряски', 'Пустые баки — лишний груз', 'Чтобы было красиво'], ok: 1 } },
  { C: typeof Level6Orbit !== 'undefined' ? Level6Orbit : null, t: 'Пушка на горе', icon: 'orbit', emoji: '🛰️', sub: 'Почему спутник не падает', aga: 'Спутник всё время падает, но летит вбок так быстро, что промахивается мимо Земли.',
    bet: { q: 'Почему спутник не падает на Землю?', opts: ['Там, наверху, нет притяжения', 'Он падает, но летит вбок так быстро, что промахивается', 'Его держит воздух'], ok: 1 } },
  { C: typeof Level7Water !== 'undefined' ? Level7Water : null, t: 'Где искать жизнь', icon: 'drop', emoji: '💧', sub: 'Есть ли инопланетяне', aga: 'Жизнь возможна там, где вода не кипит и не мёрзнет. Дальше от Солнца — холоднее и длиннее год.',
    bet: { q: 'Где у планеты могут быть моря?', opts: ['Как можно ближе к Солнцу — там тепло', 'Не слишком близко и не слишком далеко', 'Как можно дальше — там спокойно'], ok: 1 } },
  { C: typeof Level8Stars !== 'undefined' ? Level8Stars : null, t: 'Ковш', icon: 'stars', emoji: '✨', sub: 'Можно ли дотронуться до звезды', aga: 'Звёзды созвездия далеко друг от друга, а мы видим их такими, какими они были давно.',

/* ── путь своей ракеты: Земля → Луна → Марс. Где ракета — по самой
   дальней пройденной миссии с 4-й (собрана) до 10-й (села на Марс) ── */
const SP_ROUTE = { 4: [0.07, 'На стартовом столе'], 5: [0.17, 'Вышла на орбиту'], 6: [0.24, 'Кружит вокруг Земли'], 7: [0.47, 'Летит мимо Луны к Марсу'],
  8: [0.64, 'В пути: сверяет курс по звёздам'], 9: [0.83, 'Подлетает к Марсу'], 10: [0.96, 'Села на Марс!'] };
function SpRoute({ done, color }) {
  const far = [10, 9, 8, 7, 6, 5, 4].find(n => done.has(n));
  const [f, label] = far ? SP_ROUTE[far] : [0.07, 'Ракета ещё в чертежах'];
  const X = 14 + f * 292, Y = 34 - Math.sin(f * Math.PI) * 18;
  return h('div', { style: { marginTop: 12 } },
    h('svg', { viewBox: '0 -10 320 64', style: { width: '100%', display: 'block' } },
      h('path', { d: 'M14 34 Q160 -2 306 34', fill: 'none', stroke: '#2A3A5C', strokeWidth: 2, strokeDasharray: '4 5' }),
      far && h('path', { d: `M14 34 Q160 -2 306 34`, fill: 'none', stroke: '#A98BFF', strokeWidth: 2.5, strokeDasharray: `${f * 330} 400` }),
      h('circle', { cx: 14, cy: 36, r: 11, fill: '#3B7BE0' }), h('path', { d: 'M8 32 q4 -5 9 -1 q-1 5 -6 4 Z', fill: '#5DC27A' }),
      h('circle', { cx: 132, cy: 18, r: 6, fill: '#D9D5E6' }),
      h('circle', { cx: 306, cy: 36, r: 10, fill: '#D9703F' }),
      [['Земля', 14], ['Луна', 132], ['Марс', 306]].map(([t, x], i) => h('text', { key: i, x, y: 51, textAnchor: 'middle', fontSize: 8.5, fontWeight: 800, fill: '#8FA2C2' }, t)),
      far && h('g', { transform: `translate(${X} ${Y}) rotate(${far >= 10 ? 0 : 70}) scale(0.26)` }, h(SpRocket, { color, tanks: 1, flame: far > 4 && far < 10 }))),
    h('div', { style: { fontSize: 12.5, fontWeight: 800, color: far ? '#C9B6FF' : 'var(--ak-ink-3)', marginTop: 2 } }, label));
}

/* ── главный экран игры: как хаб ИИ-курса ──────────────── */
function SpHome({ onSelect, paid }) {
  const done = new Set(window.nooka ? window.nooka.getCompleted('space') : []);
  const rocket = spRocketLoad();
  const [log, setLog] = useState(false);
  const word = (n, a, b, c) => window.nooka ? window.nooka.plural(n, a, b, c) : c;
  const nextUp = SP_LEVELS.findIndex((l, i) => l.C && !done.has(i + 1)) + 1;
  return h('div', {
    className: 'ak',
    style: {
      height: '100vh', overflowY: 'auto', boxSizing: 'border-box', padding: '16px 18px 36px', position: 'relative',
      background: 'radial-gradient(120% 45% at 50% -8%,#22195A 0%,transparent 62%),linear-gradient(180deg,#0D1427,#080C18)'
    }
  },
  h('svg', { viewBox: '0 0 340 600', preserveAspectRatio: 'xMidYMin slice', style: { position: 'absolute', left: 0, top: 0, width: '100%', height: 600, pointerEvents: 'none' } }, h(SpStars, { H: 600, dim: 0.7 })),
  h('div', { style: { position: 'relative', maxWidth: 380, margin: '0 auto' } },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 } },
      h('a', { href: '../base/', style: { color: 'var(--ak-ink-2)', fontWeight: 800, fontSize: 14, textDecoration: 'none' } }, '← Все игры'),
      h('span', { style: { fontFamily: 'var(--ak-brand)', fontWeight: 700, fontSize: 15, color: '#fff' } }, 'Noo', h('span', { style: { color: '#A98BFF' } }, 'ka'))),
    h('div', {
      style: { display: 'inline-flex', alignItems: 'center', gap: 7, padding: '6px 12px', borderRadius: 999, background: 'rgba(255,255,255,.06)', boxShadow: 'inset 0 0 0 1px rgba(255,255,255,.12)', fontSize: 11.5, fontWeight: 900, letterSpacing: '.06em', color: 'var(--ak-ink-2)' }
    }, h('span', { style: { width: 7, height: 7, borderRadius: '50%', background: 'var(--ak-cyan)', boxShadow: '0 0 8px var(--ak-cyan)' } }), 'АСТРОНОМИЯ · 8–10 ЛЕТ'),
    h('div', { style: { fontFamily: 'var(--ak-brand)', fontWeight: 800, fontSize: 31, color: '#fff', margin: '12px 0 4px', letterSpacing: '-.01em' } }, 'КосмоПорт'),
    h('div', { style: { fontWeight: 900, fontSize: 15.5, color: 'var(--ak-ok-2)', marginBottom: 8 } }, 'От Земли до посадки на Марс'),
    h('div', { style: { fontSize: 14, fontWeight: 600, lineHeight: 1.5, color: 'var(--ak-ink-2)', marginBottom: 16 } },
      'Крутишь Землю, водишь Луну, собираешь свою ракету и сажаешь её на Марс. Каждая миссия — открытие в бортовой журнал.'),
    /* своя ракета со штампами за миссии */
    h('div', { className: 'nk-card', style: { display: 'flex', gap: 14, alignItems: 'center', padding: '14px 16px', marginBottom: 16, borderRadius: 22, background: 'linear-gradient(160deg,#171A3E,#101C32)' } },
      h('svg', { viewBox: '-40 -110 80 140', style: { width: 62, height: 108, flexShrink: 0 } },
        rocket ? h(SpRocket, { color: rocket.color, tanks: 2, flame: false }) : h('g', { opacity: 0.3 }, h(SpRocket, { color: 'blue', tanks: 2 }))),
      h('div', { style: { flex: 1, minWidth: 0 } },
        h('div', { style: { fontWeight: 900, fontSize: 17, color: '#fff' } }, rocket ? rocket.name : 'Своя ракета'),
        h('div', { style: { fontSize: 12.5, color: 'var(--ak-ink-2)', fontWeight: 700, margin: '3px 0 10px', lineHeight: 1.35 } },
          rocket ? `Штампы за миссии: ${done.size} из ${SP_LEVELS.length}` : 'Соберёшь её в миссии 4 — и она полетит до Марса'),
        h('div', { style: { height: 10, borderRadius: 999, background: '#141B33', overflow: 'hidden' } },
          h('div', { style: { height: '100%', width: `${done.size / SP_LEVELS.length * 100}%`, borderRadius: 999, background: 'linear-gradient(90deg,#A98BFF,#7B4FF2)' } })),
        rocket && h(SpRoute, { done, color: rocket.color }))),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } }, SP_LEVELS.map((l, i) => {
      const n = i + 1, lock = n > SP_FREE && paid === false, ready = !!l.C, ok = done.has(n), up = n === nextUp && !lock;
      const tile = ok ? 'linear-gradient(160deg,#2FE0AE,#04A57A)' : lock || !ready ? '#1A2440' : 'linear-gradient(160deg,#9B78FF,#6E41E4)';
      return h('button', {
        key: n, onClick: () => ready && onSelect(n), disabled: !ready,
        className: 'nk-level' + (ok ? ' nk-level--done' : up ? ' nk-level--next' : ''), style: { opacity: ready ? 1 : 0.5, cursor: ready ? 'pointer' : 'default' }
      }, h('div', { style: { position: 'relative', flexShrink: 0 } },
        h('div', { style: { width: 50, height: 50, borderRadius: 15, display: 'flex', alignItems: 'center', justifyContent: 'center', background: tile, boxShadow: up ? '0 0 16px rgba(123,79,242,.55)' : 'none' } },
          h(SpIcon, { name: l.icon, size: 26, color: lock || !ready ? '#738AAA' : '#fff' })),
        h('div', { style: { position: 'absolute', right: -5, bottom: -5, width: 20, height: 20, borderRadius: '50%', background: '#0D1427', boxShadow: 'inset 0 0 0 1.5px #2A3A5C', color: 'var(--ak-ink-2)', fontSize: 11, fontWeight: 900, display: 'flex', alignItems: 'center', justifyContent: 'center' } }, n)),
      h('div', { style: { minWidth: 0 } },
        h('div', { style: { fontWeight: 900, fontSize: 16.5, color: 'var(--ak-ink)' } }, l.t),
        h('div', { style: { fontSize: 13, fontWeight: 700, color: 'var(--ak-ink-3)', marginTop: 2 } }, ready ? l.sub : 'Скоро')),
      h('div', {
        style: { marginLeft: 'auto', width: 30, height: 30, borderRadius: '50%', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 900,
          background: ok ? 'rgba(6,214,160,.18)' : up ? '#7B4FF2' : 'rgba(255,255,255,.07)', color: ok ? 'var(--ak-ok-2)' : '#fff' }
      }, ok ? '✓' : lock ? '🔒' : '→'));
    })),
    /* бортовой журнал: «ага» пройденных миссий */
    h('button', {
      onClick: () => setLog(!log), className: 'nk-card',
      style: { marginTop: 16, width: '100%', border: 'none', cursor: 'pointer', textAlign: 'left', padding: '15px 16px', fontFamily: 'var(--ak-body)', fontWeight: 900, fontSize: 15, color: 'var(--ak-ink)', display: 'flex', justifyContent: 'space-between' }
    }, h('span', null, 'Бортовой журнал'), h('span', { style: { color: 'var(--ak-ink-3)' } }, done.size, ' из ', SP_LEVELS.length, ' ', word(SP_LEVELS.length, 'записи', 'записей', 'записей'), log ? ' ▲' : ' ▼')),
    log && h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, marginTop: 8 } },
      SP_LEVELS.map((l, i) => h('div', {
        key: i, style: { display: 'flex', gap: 10, alignItems: 'flex-start', background: done.has(i + 1) ? 'rgba(123,79,242,.12)' : 'rgba(255,255,255,.03)', borderRadius: 16, padding: '11px 14px', fontSize: 13.5, lineHeight: 1.45, color: done.has(i + 1) ? 'var(--ak-ink)' : 'var(--ak-ink-3)', fontWeight: 700 }
      }, h('div', { style: { flexShrink: 0, opacity: done.has(i + 1) ? 1 : 0.4, marginTop: 1 } }, h(SpIcon, { name: l.icon, size: 18, color: '#A98BFF' })),
      done.has(i + 1) ? l.aga : `Миссия ${i + 1}: запись появится после неё`)))));
}

/* Нет связи с сервером — так и говорим, а не «не оплачено» */
function SpOffline({ onHome }) {
  return h('div', { className: 'ak', style: { height: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, gap: 14, textAlign: 'center', background: 'linear-gradient(180deg,#0D1427,#080C18)' } },
    h('div', { style: { fontSize: 48 } }, '📡'),
    h('div', { style: { fontWeight: 900, fontSize: 21 } }, 'Нет связи с базой'),
    h('div', { style: { fontSize: 14, color: 'var(--ak-ink-2)', maxWidth: 300, lineHeight: 1.5 } }, 'Не получилось проверить доступ. Проверь интернет и обнови страницу — доступ на месте.'),
    h('button', { className: 'nk-btn nk-btn--pri', onClick: () => location.reload() }, 'Обновить'),
    h('button', { className: 'nk-btn nk-btn--sm nk-back', onClick: onHome }, 'К миссиям'));
}

/* Миссия → (победа) → проверка связи → штамп и следующая миссия.
   ?n=4 открывает миссию сразу. Миссии после SP_FREE — по доступу. */
function App() {
  const first = +new URLSearchParams(location.search).get('n');
  const [s, setS] = useState('home');
  const [paid, setPaid] = useState(null);             // null — сервер ещё не ответил
  useEffect(() => {
    const A = window.nookaAccess;
    if (A) A.ready.then(st => setPaid(!!st.paid));
    if (first >= 1 && first <= SP_LEVELS.length) open(first);
  }, []);
  function open(k) {
    if (!SP_LEVELS[k - 1] || !SP_LEVELS[k - 1].C) return setS('home');
    if (k <= SP_FREE) return setS('l' + k);
    const A = window.nookaAccess;
    if (!A) return setS('home');
    A.ready.then(st => {
      setPaid(!!st.paid);
      if (st.paid) return setS('l' + k);
      setS('home');
      if (st.offline) return setS('off');
      A.paywall({
        title: 'Миссии 3–10 — в платной части',
        sub: 'Бесплатно открыты первые две миссии КосмоПорта. Дальше — своя ракета, орбита и посадка на Марс.'
      });
    });
  }
  const n = +s.slice(1), L = SP_LEVELS[n - 1], home = () => setS('home');
  if (n) SP_CUR = n;
  return h('div', { style: { width: '100%', height: '100vh', maxWidth: 480, margin: '0 auto', position: 'relative', overflow: 'hidden' } },
    s === 'home' && h(SpHome, { onSelect: open, paid }),
    s === 'off' && h(SpOffline, { onHome: home }),
    s[0] === 'l' && L && h(L.C, { key: s, onWin: () => setS('q' + n), onHome: home }),
    s[0] === 'q' && L && h(SpQuiz, {
      key: s, n, title: L.t, onHome: home,
      onDone: () => {
        const last = n >= SP_LEVELS.length || !SP_LEVELS[n].C;
        setS('home');
        if (window.nooka) window.nooka.missionWin('space' + n, 80, {
          nextLabel: last ? 'К миссиям →' : 'Следующая миссия →',
          onNext: () => { if (!last) open(n + 1); }
        });
      }
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
