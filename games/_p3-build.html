<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прототип 3 — Сборка Нейро</title>
<link rel="icon" href="../logo.svg">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{
  --ink:#F3EEFF;--ink-2:#A896C9;--ink-3:#6E5C90;
  --pri:#A98BFF;--sun:#FFD84D;--tint:#4ED99B;
  --brand:'Unbounded','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#07050F}
body{font-family:var(--body);color:var(--ink);min-height:100vh;
  background:
    radial-gradient(760px 460px at 50% 6%,rgba(123,79,242,.3),transparent 62%),
    linear-gradient(180deg,#161029 0%,#0B0818 46%,#06040D 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}

.wrap{max-width:460px;margin:0 auto;padding:16px 16px calc(44px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top a{text-decoration:none;font-weight:800;font-size:13.5px;color:var(--ink-2)}
.top .brand{font-family:var(--brand);font-weight:900;font-size:16px}
.top .brand em{font-style:normal;color:var(--pri)}
h1{font-family:var(--brand);font-weight:900;font-size:26px;line-height:1.1}
.h-sub{margin-top:6px;font-weight:800;font-size:13px;color:var(--tint)}

/* ── стенд сборки ── */
.stage{position:relative;margin-top:18px;padding:20px 16px 18px;border-radius:32px;text-align:center;
  background:radial-gradient(180px 130px at 50% 26%,rgba(169,139,255,.22),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09)}
.stage__k{font-weight:800;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.robot{width:184px;height:184px;margin:8px auto 4px;display:block}
.robot .off{opacity:.34}
.robot .off *{stroke:#B9A7E0;fill:none;stroke-width:2.6;stroke-dasharray:6 6;stroke-linecap:round}
.robot .glow{filter:drop-shadow(0 0 10px rgba(169,139,255,.75))}
.stage__t{font-family:var(--brand);font-weight:700;font-size:17px}
.stage__p{margin-top:6px;font-weight:700;font-size:13px;color:var(--ink-2)}
.stage__b{margin:13px auto 0;max-width:250px;height:8px;border-radius:999px;
  background:rgba(255,255,255,.09);overflow:hidden}
.stage__b i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--pri),var(--sun));box-shadow:0 0 12px rgba(169,139,255,.7)}

/* ── деталь-уровень ── */
.sec{margin:24px 2px 11px;font-weight:800;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part{position:relative;padding:13px 13px 14px;border-radius:22px;border:none;cursor:pointer;
  text-align:left;font-family:inherit;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);
  transition:transform .16s cubic-bezier(.2,.8,.3,1)}
.part:hover{transform:translateY(-3px)}
.part__ic{position:relative;width:44px;height:44px;border-radius:15px;display:flex;
  align-items:center;justify-content:center;margin-bottom:9px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.part__ic svg{width:22px;height:22px;color:#D6C8FF}
.part__no{position:absolute;right:-5px;bottom:-5px;min-width:19px;height:19px;padding:0 5px;
  border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-family:var(--brand);font-weight:700;font-size:10px;color:#1B0F30;background:#CBB8FF}
.part b{display:block;font-weight:900;font-size:13.5px;line-height:1.25}
.part span{display:block;margin-top:5px;font-weight:700;font-size:11.5px;color:var(--ink-3)}
.part span em{font-style:normal;color:var(--pri)}

.part.done{background:rgba(78,217,155,.09);box-shadow:inset 0 0 0 1.5px rgba(78,217,155,.24)}
.part.done .part__ic{background:linear-gradient(180deg,var(--tint),#1E7A55)}
.part.done .part__ic svg{color:#07301F}
.part.done .part__no{background:#07301F;color:var(--tint)}
.part.done b{color:var(--ink-2)}
.part.done span em{color:var(--tint)}
.part.lock{opacity:.5}

/* текущая деталь — во всю ширину */
.now{grid-column:1 / -1;padding:16px 16px 17px;border-radius:24px;
  background:linear-gradient(180deg,rgba(123,79,242,.26),rgba(123,79,242,.1));
  box-shadow:inset 0 0 0 2px rgba(169,139,255,.5),0 22px 46px -26px #7B4FF2}
.now .k{font-weight:800;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#E5D8FF}
.now b{display:block;margin-top:6px;font-family:var(--brand);font-weight:700;font-size:17px}
.now p{margin-top:7px;font-weight:600;font-size:12.5px;line-height:1.4;color:#D9CCFF}
.now .add{display:inline-block;margin-top:10px;padding:6px 13px;border-radius:999px;
  font-weight:800;font-size:11.5px;color:#0A0714;background:var(--sun)}
.go{margin-top:13px;width:100%;padding:14px;border-radius:999px;border:none;cursor:pointer;
  font-family:var(--brand);font-weight:700;font-size:15px;color:#33240A;
  background:linear-gradient(180deg,#FFF1B4,#FFD84D);box-shadow:0 4px 0 #C79412}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #C79412}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="#">← Моя база</a><span class="brand">Noo<em>ka</em></span></div>
  <h1>Откуда ИИ знает</h1>
  <div class="h-sub">Данные и обучение</div>

  <div class="stage">
    <div class="stage__k">Стенд сборки</div>
    <svg class="robot" viewBox="0 0 200 200" id="robot">
      <!-- 1 корпус -->
      <g data-p="1"><rect x="46" y="52" width="108" height="104" rx="32" fill="#7B2FFF"/></g>
      <!-- 2 глаза -->
      <g data-p="2"><circle cx="78" cy="100" r="19" fill="#fff"/><circle cx="122" cy="100" r="19" fill="#fff"/>
        <circle cx="84" cy="94" r="8" fill="#151026"/><circle cx="128" cy="94" r="8" fill="#151026"/>
        <circle cx="87" cy="91" r="3" fill="#fff"/><circle cx="131" cy="91" r="3" fill="#fff"/></g>
      <!-- 3 рот-индикатор -->
      <g data-p="3"><rect x="84" y="128" width="32" height="9" rx="4.5" fill="#2D1B45"/>
        <rect x="86" y="130" width="12" height="5" rx="2.5" fill="#4ED99B"/></g>
      <!-- 4 антенна-фильтр -->
      <g data-p="4"><path d="M100 52V34" stroke="#CBB8FF" stroke-width="5" stroke-linecap="round"/>
        <circle cx="100" cy="29" r="8" fill="#FFD84D"/></g>
      <!-- 5 левая рука -->
      <g data-p="5"><path d="M46 92H28a8 8 0 00-8 8v18" stroke="#9A6BFF" stroke-width="9" stroke-linecap="round" fill="none"/>
        <circle cx="20" cy="124" r="7.5" fill="#CBB8FF"/></g>
      <!-- 6 правая рука -->
      <g data-p="6"><path d="M154 92h18a8 8 0 018 8v18" stroke="#9A6BFF" stroke-width="9" stroke-linecap="round" fill="none"/>
        <circle cx="180" cy="124" r="7.5" fill="#CBB8FF"/></g>
      <!-- 7 колёса -->
      <g data-p="7"><rect x="56" y="152" width="34" height="20" rx="10" fill="#3A2A5E"/>
        <rect x="110" y="152" width="34" height="20" rx="10" fill="#3A2A5E"/></g>
      <!-- 8 бирка -->
      <g data-p="8"><rect x="60" y="62" width="34" height="14" rx="7" fill="#151026" opacity=".55"/>
        <circle cx="68" cy="69" r="3" fill="#4ED99B"/><rect x="75" y="66" width="14" height="5" rx="2.5" fill="#8C7BB5"/></g>
      <!-- 9 шкала уверенности -->
      <g data-p="9"><rect x="108" y="62" width="38" height="14" rx="7" fill="#151026" opacity=".55"/>
        <rect x="112" y="66" width="20" height="6" rx="3" fill="#FFD84D"/></g>
      <!-- 10 шапка выпускника -->
      <g data-p="10"><path d="M100 14L142 30l-42 16-42-16z" fill="#FFD84D"/>
        <path d="M132 36v14c0 5-14 9-32 9s-32-4-32-9V36" stroke="#FFD84D" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    </svg>
    <div class="stage__t" id="rname">Нейро собран наполовину</div>
    <div class="stage__p" id="rsub">4 детали на месте · 6 ещё нет</div>
    <div class="stage__b"><i id="rbar" style="width:40%"></i></div>
  </div>

  <div class="sec">Детали</div>
  <div class="parts" id="parts"></div>
</div>

<script src="_proto-sprite.js"></script>
<script src="nooka-levels.js"></script>
<script>
(function () {
  var g = window.nookaLevels.games[0], DONE = 4;

  /* Каждый уровень достраивает Нейро — курс виден как одна собираемая вещь. */
  var PARTS = ['корпус', 'глаза', 'честный ответ', 'фильтр', 'левая рука',
               'правая рука', 'колёса', 'бирка', 'шкала уверенности', 'шапка выпускника'];

  var svg = document.getElementById('robot');
  for (var i = 1; i <= 10; i++) {
    var el = svg.querySelector('[data-p="' + i + '"]');
    if (i <= DONE) { if (i === DONE) el.classList.add('glow'); }
    else el.classList.add('off');
  }
  document.getElementById('rbar').style.width = (DONE * 10) + '%';
  document.getElementById('rsub').textContent =
    DONE + ' ' + nkPlural(DONE, ['деталь', 'детали', 'деталей']) + ' на месте · ' +
    (10 - DONE) + ' ещё нет';

  function nkPlural(n, f) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return f[2];
    if (b > 1 && b < 5) return f[1];
    if (b === 1) return f[0];
    return f[2];
  }

  var out = '';
  g.levels.forEach(function (lv, i) {
    if (i === DONE) {
      out += '<div class="now"><div class="k">Следующая деталь</div><b>' + lv.t + '</b>' +
        '<p>' + (lv.goal || lv.s) + '</p>' +
        '<span class="add">+ ' + PARTS[i] + '</span>' +
        '<button class="go">Собрать</button></div>';
      return;
    }
    var kind = i < DONE ? 'done' : 'lock';
    var badge = kind === 'done'
      ? '<span class="part__no"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></span>'
      : '<span class="part__no">' + (i + 1) + '</span>';
    out += '<button class="part ' + kind + '">' +
      '<span class="part__ic"><svg><use href="#g-' + lv.g + '"></use></svg>' + badge + '</span>' +
      '<b>' + lv.t + '</b>' +
      '<span>' + (kind === 'done' ? '<em>✓ ' + PARTS[i] + '</em>' : PARTS[i]) + '</span>' +
      '</button>';
  });
  document.getElementById('parts').innerHTML = out;
})();
</script>
</body>
</html>
