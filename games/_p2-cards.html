<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прототип 2 — Карточки</title>
<link rel="icon" href="../logo.svg">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<style>
:root{
  --ink:#F3EEFF;--ink-2:#A896C9;--ink-3:#6E5C90;
  --pri:#A98BFF;--sun:#FFD84D;--tint:#4ED99B;
  --brand:'Unbounded','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#07050F}
body{font-family:var(--body);color:var(--ink);min-height:100vh;
  background:linear-gradient(180deg,#151129 0%,#0B0818 42%,#06040D 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}

.wrap{max-width:460px;margin:0 auto;padding:16px 16px calc(44px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top a{text-decoration:none;font-weight:800;font-size:13.5px;color:var(--ink-2)}
.top .brand{font-family:var(--brand);font-weight:900;font-size:16px}
.top .brand em{font-style:normal;color:var(--pri)}
h1{font-family:var(--brand);font-weight:900;font-size:26px;line-height:1.1}
.h-sub{margin-top:6px;font-weight:800;font-size:13px;color:var(--tint)}

.bar{position:sticky;top:0;z-index:20;margin:14px -16px 18px;padding:10px 16px;
  display:flex;align-items:center;gap:11px;
  background:rgba(9,7,18,.85);backdrop-filter:blur(12px);
  box-shadow:0 1px 0 rgba(255,255,255,.07)}
.bar__n{font-family:var(--brand);font-weight:700;font-size:14px;white-space:nowrap}
.bar__n s{text-decoration:none;color:var(--ink-3)}
.bar__b{flex:1;height:7px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.bar__b i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--tint),#fff8)}
.bar__xp{font-family:var(--brand);font-weight:700;font-size:13px;color:var(--sun)}

.sec{margin:22px 2px 12px;font-weight:800;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}

/* ── карточка уровня ── */
.card{position:relative;margin-bottom:14px;border-radius:26px;overflow:hidden;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);
  transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.card:hover{transform:translateY(-3px)}
.card__m{position:relative;aspect-ratio:16/9;display:block}
.card__m svg{width:100%;height:100%;display:block}
.card__no{position:absolute;left:14px;top:12px;min-width:28px;height:28px;padding:0 9px;
  border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-family:var(--brand);font-weight:700;font-size:13px;color:#0A0714;background:rgba(255,255,255,.9)}
.card__b{padding:14px 16px 16px}
.card__b b{display:block;font-family:var(--brand);font-weight:700;font-size:16px;line-height:1.2}
.card__b p{margin-top:6px;font-weight:600;font-size:12.5px;line-height:1.4;color:var(--ink-2)}

/* пройденный — компактная строка, а не картинка: место отдано тому, что впереди */
.done-row{display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:9px;
  border-radius:18px;background:rgba(78,217,155,.07);
  box-shadow:inset 0 0 0 1px rgba(78,217,155,.2)}
.done-row .ic{flex-shrink:0;width:34px;height:34px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;background:rgba(78,217,155,.18)}
.done-row .ic svg{width:18px;height:18px;color:var(--tint)}
.done-row b{flex:1;font-weight:900;font-size:13.5px;color:var(--ink-2)}
.done-row s{text-decoration:none;font-family:var(--brand);font-weight:700;font-size:12px;color:var(--tint)}

/* текущая — с кнопкой */
.card.now{box-shadow:inset 0 0 0 2px rgba(169,139,255,.55),0 22px 50px -26px #7B4FF2}
.card.now .card__b{padding-bottom:18px}
.go{margin-top:13px;width:100%;padding:14px;border-radius:999px;border:none;cursor:pointer;
  font-family:var(--brand);font-weight:700;font-size:15px;color:#33240A;
  background:linear-gradient(180deg,#FFF1B4,#FFD84D);box-shadow:0 4px 0 #C79412}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #C79412}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  font-weight:800;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:#0A0714;background:var(--sun);position:absolute;right:12px;top:12px}

/* закрытая — превью притушено */
.card.lock .card__m{opacity:.42}
.card.lock .card__b b{color:var(--ink-2)}
.card.lock .card__b p{color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="#">← Моя база</a><span class="brand">Noo<em>ka</em></span></div>
  <h1>Откуда ИИ знает</h1>
  <div class="h-sub">Данные и обучение</div>
  <div class="bar">
    <span class="bar__n">4 <s>из 10</s></span>
    <span class="bar__b"><i style="width:40%"></i></span>
    <span class="bar__xp">300 XP</span>
  </div>
  <div id="list"></div>
</div>

<script src="_proto-sprite.js"></script>
<script src="nooka-levels.js"></script>
<script>
(function () {
  var g = window.nookaLevels.games[0], DONE = 4;

  /* Своя пара цветов на уровень — чтобы лента не выглядела одним полотном. */
  var PAL = [
    ['#1E3A8A', '#0EA5E9'], ['#4C1D95', '#A855F7'], ['#134E4A', '#2DD4BF'],
    ['#7C2D12', '#FB923C'], ['#831843', '#F472B6'], ['#1E1B4B', '#818CF8'],
    ['#064E3B', '#34D399'], ['#78350F', '#FBBF24'], ['#3B0764', '#C084FC'],
    ['#0C4A6E', '#38BDF8']
  ];

  /* Мини-сцена уровня: экран прибора, в нём глиф, под ним «ответ машины».
     Одна сборка на все уровни — но своя палитра и свой глиф у каждого. */
  function art(i, glyph) {
    var p = PAL[i % PAL.length], id = 'p' + i;
    var dots = '';
    for (var k = 0; k < 26; k++) {
      var dx = 14 + (k % 13) * 24, dy = 16 + Math.floor(k / 13) * 150;
      dots += '<circle cx="' + dx + '" cy="' + dy + '" r="1.6" fill="#fff" opacity=".22"/>';
    }
    return '<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + p[0] + '"/><stop offset="1" stop-color="' + p[1] + '"/>' +
      '</linearGradient>' +
      '<radialGradient id="' + id + 'g"><stop offset="0" stop-color="#fff" stop-opacity=".4"/>' +
      '<stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>' +
      '<rect width="320" height="180" fill="url(#' + id + ')"/>' +
      '<circle cx="262" cy="26" r="82" fill="url(#' + id + 'g)"/>' + dots +
      /* экран прибора */
      '<rect x="96" y="26" width="128" height="96" rx="22" fill="#0B0818" opacity=".42"/>' +
      '<rect x="96" y="26" width="128" height="96" rx="22" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>' +
      '<g transform="translate(160 72) scale(2.5) translate(-12 -12)">' +
      '<use href="#g-' + glyph + '" width="24" height="24" color="#fff"/></g>' +
      /* «ответ машины» — полоска под экраном */
      '<rect x="104" y="136" width="112" height="20" rx="10" fill="#0B0818" opacity=".5"/>' +
      '<circle cx="118" cy="146" r="5" fill="#4ED99B"/>' +
      '<rect x="130" y="142" width="52" height="8" rx="4" fill="#fff" opacity=".55"/>' +
      '<rect x="188" y="142" width="18" height="8" rx="4" fill="#fff" opacity=".25"/>' +
      '</svg>';
  }

  var out = '';

  /* пройденное — свёрнуто в строки */
  out += '<div class="sec">Пройдено</div>';
  g.levels.slice(0, DONE).forEach(function (lv, i) {
    out += '<div class="done-row"><span class="ic">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>' +
      '</span><b>' + lv.t + '</b><s>+' + lv.xp + '</s></div>';
  });

  /* текущий */
  var cur = g.levels[DONE];
  out += '<div class="sec">Сейчас</div>' +
    '<div class="card now"><div class="card__m">' + art(DONE, cur.g) +
    '<span class="card__no">' + (DONE + 1) + '</span><span class="tag">твой ход</span></div>' +
    '<div class="card__b"><b>' + cur.t + '</b><p>' + (cur.goal || cur.s) + '</p>' +
    '<button class="go">Играть</button></div></div>';

  /* впереди */
  out += '<div class="sec">Дальше</div>';
  g.levels.slice(DONE + 1).forEach(function (lv, k) {
    var i = DONE + 1 + k;
    out += '<div class="card lock"><div class="card__m">' + art(i, lv.g) +
      '<span class="card__no">' + (i + 1) + '</span></div>' +
      '<div class="card__b"><b>' + lv.t + '</b><p>' + (lv.goal || lv.s) + '</p></div></div>';
  });

  var b = g.extras[0];
  out += '<div class="sec">Бонус</div>' +
    '<div class="card lock"><div class="card__m">' + art(9, 'star') +
    '<span class="card__no">★</span></div>' +
    '<div class="card__b"><b>' + b.t + '</b><p>' + b.goal + '</p></div></div>';

  document.getElementById('list').innerHTML = out;
})();
</script>
</body>
</html>
