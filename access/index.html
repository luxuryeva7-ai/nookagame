<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой доступ — Nooka</title>
<meta name="description" content="Что открыто в аккаунте Nooka и до какого числа. Здесь же привязывается код доступа от прежней покупки.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link href="/fonts/nooka-fonts.css" rel="stylesheet">
<link href="/account/account.css" rel="stylesheet">
<!-- Доступ живёт в аккаунте, поэтому страница за входом: без него
     показывать нечего. Гостя nooka-account.js уводит на /login/. -->
<script src="../games/nooka-account.js" data-require-login></script>
<script src="../games/nooka-access.js"></script>
</head>
<body>
<div class="wrap wrap--wide">

  <div class="top">
    <a href="../"><img src="../logo.svg" alt="Nooka"></a>
    <a class="back" href="../base/">← В кабинет</a>
  </div>

  <h1>Мой доступ</h1>
  <p class="lede">Аккаунт <b data-nk-email hidden></b>. Доступ общий для всей семьи:
  он открыт на каждом устройстве, где выполнен вход.</p>

  <div class="state" id="state">
    <span class="state__dot"></span>
    <div><b id="stateH">Проверяем…</b><span id="stateS"></span></div>
  </div>

  <p id="payRow" hidden><a class="btn btn--pri btn--wide" href="../base/pay.html">Открыть доступ</a></p>

  <div class="card">
    <h3>Игры курса</h3>
    <div class="glist" id="games"></div>
  </div>

  <!-- Код от покупки до перехода на аккаунты. Привязывается один раз
       и больше не нужен: дальше всё держится на входе по почте. -->
  <div class="card" id="codeCard">
    <h3>Остался код доступа?</h3>
    <p class="lede">Код вида NOOKA-XXXX-XXXX выдавался до того, как появились
    аккаунты. Привяжите его — и он больше не понадобится.</p>
    <form id="codeForm" novalidate>
      <label class="field">
        <span>Код</span>
        <input id="code" type="text" placeholder="NOOKA-••••-••••" autocomplete="off"
               spellcheck="false" autocapitalize="characters" maxlength="20" required>
      </label>
      <button class="btn btn--pri btn--wide" id="codeBtn" type="submit">Привязать к аккаунту</button>
      <div class="msg" id="codeMsg" role="alert"></div>
    </form>
  </div>

  <p class="fine" id="foot"></p>
</div>

<script src="../games/nooka-levels.js"></script>
<script src="../legal/requisites.js"></script>
<script>
(function () {
  var A = window.nookaAccess, ACC = window.nookaAccount, L = window.nookaLevels, R = window.NOOKA_LEGAL;

  function plural(n, a, b, c) {
    var m = Math.abs(n) % 100; if (m > 10 && m < 20) return c;
    m = m % 10; return m === 1 ? a : (m >= 2 && m <= 4 ? b : c);
  }
  function dstr(iso) {
    /* без «г.» на конце: дата стоит в предложении, и точка уже есть у фразы */
    return new Date(iso).toLocaleDateString('ru-RU',
      { day: 'numeric', month: 'long', year: 'numeric' }).replace(' г.', '');
  }

  /* Откуда доступ. Родителю это важнее, чем нам: «демо» и «оплачено»
     заканчиваются по-разному, и узнать об этом лучше заранее. */
  var SOURCE = {
    purchase: 'Оплачено',
    code: 'По коду от прежней покупки',
    demo: 'Демо-доступ',
    owner: 'Служебный доступ'
  };

  function render(s) {
    var box = document.getElementById('state');
    var h = document.getElementById('stateH'), sub = document.getElementById('stateS');
    if (s.paid || A.openAll) {
      box.className = 'state state--on';
      h.textContent = A.openAll ? 'Открыто всё' : 'Доступ открыт до ' + dstr(s.until);
      sub.textContent = A.openAll
        ? 'Сейчас на сайте открыты все игры — идёт показ.'
        : (SOURCE[s.source] || 'Доступ') + ' · осталось ' + s.days + ' ' +
          plural(s.days, 'день', 'дня', 'дней') + '. Продлевать заранее не нужно.';
      document.getElementById('payRow').hidden = A.openAll;
      document.getElementById('payRow').querySelector('.btn').textContent = 'Продлить доступ';
      document.getElementById('codeCard').hidden = true;
    } else if (s.offline) {
      box.className = 'state';
      h.textContent = 'Не получилось связаться с сервером';
      sub.textContent = 'Проверьте интернет и обновите страницу — доступ никуда не делся.';
    } else {
      box.className = 'state';
      h.textContent = 'Платная часть закрыта';
      sub.textContent = 'Первая игра курса открыта целиком и без оплаты. Вторая и третья — по доступу.';
      document.getElementById('payRow').hidden = false;
    }

    /* Игры курса: что открыто, а что нет — из общего реестра */
    document.getElementById('games').innerHTML = L.games.map(function (g) {
      var free = (g.free || 0) >= g.levels.length;
      var open = free || s.paid || A.openAll;
      return '<div><b>' + g.name + '</b><span class="n">' + g.levels.length + ' уровней</span>' +
        '<span class="mark' + (open ? ' mark--on' : '') + '">' +
          (open ? 'открыта' : 'по доступу') + (free ? ' · бесплатно' : '') + '</span></div>';
    }).join('');
  }

  A.ready.then(render);

  /* ── привязка старого кода ─────────────────────────────── */
  var WHY = {
    bad_code: 'Такого кода нет. Проверьте буквы — их легко перепутать.',
    code_expired: 'Срок этого кода закончился.',
    code_unknown: 'Этот код мы не находим среди выданных. Напишите нам — разберёмся и откроем доступ.',
    code_used: 'Этот код уже привязан к другому аккаунту. Если это ваш второй аккаунт — напишите нам.',
    too_many: 'Слишком много попыток. Попробуйте через час.',
    not_logged_in: 'Сессия закончилась. Войдите ещё раз.'
  };
  var msg = document.getElementById('codeMsg'), btn = document.getElementById('codeBtn');
  document.getElementById('codeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = document.getElementById('code').value.trim();
    if (!code) return;
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Проверяем…';
    ACC.call('POST', '/access/redeem', { code: code }).then(function (r) {
      btn.disabled = false;
      if (r.ok) {
        msg.className = 'msg msg--ok';
        msg.textContent = 'Готово. Доступ открыт до ' + dstr(r.data.access.until) + '.';
        return A.refresh().then(render);
      }
      msg.className = 'msg msg--bad';
      msg.textContent = (r.data && WHY[r.data.error]) ||
        'Не получилось привязать код. Попробуйте ещё раз или напишите нам.';
    });
  });

  document.getElementById('foot').innerHTML =
    'Вопрос по оплате или доступу — <a href="https://t.me/NookaGame" target="_blank" rel="noopener">Telegram</a> ' +
    'или <a href="mailto:' + R.email + '">' + R.email + '</a>.<br>' +
    R.seller + ' · ИНН ' + R.inn + ' · ' + '<a href="../legal/oferta.html">оферта</a>';
})();
</script>
</body>
</html>
